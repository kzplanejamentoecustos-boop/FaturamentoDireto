function encontrarPedidoNF({ xPed, cnpj, nome }) {
  if (xPed) {
    const alvo = soDigitos(xPed) || normalizarTexto(xPed);
    const ped = pedidos.find((p) => (soDigitos(p.numero) && soDigitos(p.numero) === alvo) || normalizarTexto(p.numero) === normalizarTexto(xPed));
    if (ped) return { ped, como: `nº do pedido informado na NF (${xPed})` };
  }
  let ters = [];
  if (cnpj) ters = terceiros.filter((t) => soDigitos(t.cnpj) && soDigitos(t.cnpj) === soDigitos(cnpj));
  if (!ters.length && nome) ters = terceiros.filter((t) => normalizarTexto(nome).includes(normalizarTexto(t.nome)) || normalizarTexto(t.nome).includes(normalizarTexto(nome)));
  const candidatos = pedidos.filter((p) => ters.some((t) => t.id === p.terceiroId));
  if (!candidatos.length) return { ped: null, como: null };
  const ped = ordenar(candidatos.map((p) => ({ p, saldo: resumoPedido(p).saldo })), 'saldo', 'desc', 'numero')[0].p;
  return { ped, como: candidatos.length > 1 ? `emitente (há ${candidatos.length} pedidos deste terceiro: confira)` : 'emitente da NF' };
}

function vincularItensNF(ped, itensArquivo) {
  const itens = [];
  const semVinculo = [];
  const prods = ped ? produtosDoPedido(ped.id) : [];
  itensArquivo.forEach((it) => {
    const nomeIt = normalizarTexto(it.descricao);
    const nomes = (p) => [p.descricaoNF, p.descricao, p.detalhe].filter(Boolean).map(normalizarTexto);
    const prod = prods.find((p) => nomes(p).includes(nomeIt))
      || prods.find((p) => nomes(p).some((n) => nomeIt.includes(n) || n.includes(nomeIt)));
    if (prod) {
      const atual = itens.find((x) => x.produtoId === prod.id);
      if (atual) atual.quantidade += vn(it.quantidade);
      else itens.push({ produtoId: prod.id, quantidade: vn(it.quantidade), valorUnit: vn(it.valorUnit) });
    } else {
      semVinculo.push({ descricao: it.descricao, quantidade: vn(it.quantidade), valorTotal: vn(it.valorTotal) });
    }
  });
  return { itens, semVinculo };
}

function bmPelaData(data) {
  let mes = data ? formatarData(data, 'iso-mes') : null;
  if (mes && mesBM1() && mes < mesBM1()) mes = mesBM1();
  const op = opcoesBM().find((o) => mesDoBM(o.valor) === mes);
  return op ? op.valor : '';
}

function lerXmlNFe(texto) {
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('XML inválido.');
  const primeiro = (raiz, nome) => raiz.getElementsByTagName(nome)[0];
  const valor = (raiz, nome) => primeiro(raiz, nome)?.textContent?.trim() ?? '';
  const ide = primeiro(doc, 'ide');
  const emit = primeiro(doc, 'emit');
  const dest = primeiro(doc, 'dest');
  if (!ide || !emit) throw new Error('O XML não parece ser de uma NF-e (faltam ide/emit).');
  const dets = [...doc.getElementsByTagName('det')];
  const xPed = valor(doc, 'xPed');
  return {
    numero: valor(ide, 'nNF'),
    data: (valor(ide, 'dhEmi') || valor(ide, 'dEmi')).slice(0, 10),
    valor: paraNumero(valor(doc, 'vNF')) ?? 0,
    cnpj: valor(emit, 'CNPJ'),
    nome: valor(emit, 'xNome'),
    ufOrigem: valor(primeiro(emit, 'enderEmit') || emit, 'UF'),
    ufDestino: dest ? valor(primeiro(dest, 'enderDest') || dest, 'UF') : '',
    xPed,
    itens: dets.map((d) => ({
      descricao: valor(d, 'xProd'),
      quantidade: Number(valor(d, 'qCom')) || 0,
      valorUnit: Number(valor(d, 'vUnCom')) || 0,
      valorTotal: Number(valor(d, 'vProd')) || 0,
    })),
  };
}

/** Texto das primeiras paginas de um PDF (leitor carregado sob demanda). */
async function extrairTextoPdf(arquivo, paginas = 5) {
  let pdfjs;
  try {
    pdfjs = await import(URL_PDFJS);
    pdfjs.GlobalWorkerOptions.workerSrc = URL_PDFJS_WORKER;
  } catch (erro) {
    throw new Error('Não foi possível carregar o leitor de PDF (internet ou bloqueio de rede). Use Excel/CSV ou preencha manualmente.');
  }
  const pdf = await pdfjs.getDocument({ data: new Uint8Array(await arquivo.arrayBuffer()) }).promise;
  let texto = '';
  for (let p = 1; p <= Math.min(pdf.numPages, paginas); p += 1) {
    const pagina = await pdf.getPage(p);
    const conteudo = await pagina.getTextContent();
    texto += ` ${conteudo.items.map((i) => i.str).join(' ')}`;
  }
  return texto;
}

/** Linhas de texto de um PDF (itens agrupados pela altura na pagina). */
/** Itens de texto de cada pagina do PDF, com posicao (x, y) e largura. */
async function extrairItensPdf(arquivo, paginas = 10) {
  let pdfjs;
  try {
    pdfjs = await import(URL_PDFJS);
    pdfjs.GlobalWorkerOptions.workerSrc = URL_PDFJS_WORKER;
  } catch (erro) {
    throw new Error('Não foi possível carregar o leitor de PDF (internet ou bloqueio de rede). Use Excel/CSV ou preencha manualmente.');
  }
  const pdf = await pdfjs.getDocument({ data: new Uint8Array(await arquivo.arrayBuffer()) }).promise;
  const resultado = [];
  for (let p = 1; p <= Math.min(pdf.numPages, paginas); p += 1) {
    const pagina = await pdf.getPage(p);
    resultado.push((await pagina.getTextContent()).items
      .filter((i) => i.str && i.str.trim())
      .map((i) => ({ x: i.transform[4], y: i.transform[5], w: i.width || 0, t: i.str })));
  }
  return resultado;
}

/**
 * Tabela de produtos de um PDF de pedido, lida POR COLUNAS e por SIMILARIDADE de titulo:
 * acha a linha de cabecalho (Descricao + Un/Qtde...), junta titulos quebrados em 2 linhas,
 * define cada coluna pelo centro do titulo e classifica pelo nome:
 *   produto (Produto/proposta) · codigo (Material/Codigo) · descricao · unidade (Un/Unid/UM)
 *   quantidade (Qtd/Qtde/Quant) · SEM REIDI · COM REIDI · unitario (Unit/Preco/Pc.Unit) · total.
 * Cada linha com quantidade + valor numerico vira um produto; textos de descricao quebrados
 * em varias linhas sao ligados a linha de valores mais proxima. Le tambem, do topo:
 * numero do pedido, data e fornecedor (bloco "Dados do Fornecedor" ou "Fornecedor:").
 */
function interpretarTabelaProdutosPdf(paginas) {
  const norm = (t) => normalizarTexto(String(t || '')).replace(/\s+/g, ' ').trim();
  const centro = (i) => i.x + (i.w || 0) / 2;
  const itens = [];
  let numeroPedido = '';
  let fornecedor = '';
  let dataPedido = '';
  const numeroBr = (t) => paraNumero(String(t).replace(/[()]/g, '').replace(/^r\$/i, ''));
  const tipoColuna = (titulo) => {
    const t = norm(titulo).replace(/[.:]/g, ' ');
    if (/sem\s*reidi/.test(t)) return 'sem';
    if (/com\s*reidi/.test(t) && !/dif/.test(t)) return 'com';
    if (/dif|icms|ipi|iss|reidi\s*\(?%|aliq|classif|ncm|cfop|remessa|entrega|^item$|^it$|seq/.test(t)) return null;
    if (/produto|proposta/.test(t)) return 'produto';
    if (/material|codigo|cod\b|referencia/.test(t)) return 'codigo';
    if (/descri/.test(t)) return 'descricao';
    if (/^(un|und|unid|unidade|um|u m)\b/.test(t)) return 'unidade';
    if (/^(qt|qtd|qtde|quant)/.test(t)) return 'quantidade';
    if (/total/.test(t)) return 'total';
    if (/unit|preco|pc\s*unit|vl\s*unit|valor/.test(t)) return 'unit';
    return null;
  };
  paginas.forEach((pagina) => {
    /* topo do pedido */
    const texto = pagina.slice().sort((a, b) => (b.y - a.y) || (a.x - b.x)).map((i) => i.t).join(' ');
    if (!numeroPedido) {
      const m = texto.match(/(?:n[uú]mero\s+do\s+pedido|pedido\s+de\s+compras?|pedido\s*n[º°o.]*)\s*:?\s*(\d{6,})/i);
      if (m) [, numeroPedido] = m;
    }
    if (!dataPedido) { const m = texto.match(/data\s+do\s+pedido\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i); if (m) [, dataPedido] = m; }
    if (!fornecedor) {
      const rot = pagina.find((i) => /dados\s+do\s+fornecedor/i.test(i.t));
      if (rot) {
        const abaixo = pagina.filter((i) => i.y < rot.y - 2 && Math.abs(i.x - rot.x) < 30 && i.t.trim()).sort((a, b) => b.y - a.y)[0];
        if (abaixo) fornecedor = abaixo.t.trim();
      } else {
        const m = texto.match(/fornecedor\s*:?\s*(.+?)(?:\s+valor\b|\s+cnpj\b|\s+endere|$)/i);
        if (m) fornecedor = m[1].trim();
      }
    }
    /* linhas por altura */
    const grupos = new Map();
    pagina.forEach((i) => {
      const y = Math.round(i.y);
      if (!grupos.has(y)) grupos.set(y, []);
      grupos.get(y).push(i);
    });
    const linhas = [...grupos.entries()].sort((a, b) => b[0] - a[0]).map(([y, its]) => ({ y, its: its.sort((a, b) => a.x - b.x) }));
    const cab = linhas.find((l) => {
      const t = norm(l.its.map((i) => i.t).join(' '));
      return t.includes('descri') && /(\bun\b|\bun\.|unid|qtd|qtde|quant)/.test(t);
    });
    if (!cab) return;
    /* titulos: itens a ate 16pt do cabecalho; titulos com o mesmo centro (quebrados) sao unidos */
    const titulos = [];
    pagina.filter((i) => Math.abs(i.y - cab.y) <= 16 && i.t.trim()).sort((a, b) => b.y - a.y).forEach((i) => {
      const c = centro(i);
      /* so une titulos de LINHAS diferentes (titulo quebrado); na mesma linha sao colunas distintas */
      const mesmo = titulos.find((t) => Math.abs(t.c - c) < 18 && !t.ys.includes(Math.round(i.y)));
      if (mesmo) { mesmo.texto += ` ${i.t.trim()}`; mesmo.ys.push(Math.round(i.y)); } else titulos.push({ c, texto: i.t.trim(), ys: [Math.round(i.y)] });
    });
    titulos.sort((a, b) => a.c - b.c);
    titulos.forEach((t) => { t.tipo = tipoColuna(t.texto); });
    if (!titulos.some((t) => t.tipo === 'descricao' || t.tipo === 'produto') || !titulos.some((t) => t.tipo === 'quantidade')) return;
    const limites = titulos.map((t, k) => ({
      ...t, de: k ? (titulos[k - 1].c + t.c) / 2 : -Infinity, ate: k < titulos.length - 1 ? (t.c + titulos[k + 1].c) / 2 : Infinity,
    }));
    const colunaDe = (i) => limites.find((t) => centro(i) >= t.de && centro(i) < t.ate);
    const valoresDa = (l, tipo) => l.its.filter((i) => colunaDe(i)?.tipo === tipo).map((i) => i.t.trim()).filter(Boolean);
    /* linhas de valores (ancoras): quantidade numerica + algum valor */
    const ancoras = [];
    linhas.filter((l) => l.y < cab.y - 4).forEach((l) => {
      const qtdTxt = valoresDa(l, 'quantidade')[0];
      const quantidade = qtdTxt != null ? numeroBr(qtdTxt) : null;
      const pega = (tipo) => { const v = valoresDa(l, tipo).find((x) => numeroBr(x) != null); return v != null ? numeroBr(v) : null; };
      const sem = pega('sem'); const com = pega('com'); const unit = pega('unit'); const total = pega('total');
      if (quantidade == null || [sem, com, unit, total].every((v) => v == null)) return;
      ancoras.push({
        y: l.y, quantidade, unitSem: sem, unitCom: com, unit: unit ?? (sem == null && com == null && total != null && quantidade ? total / quantidade : null),
        unidade: valoresDa(l, 'unidade').join(' '), desc: [], prod: [], cod: [],
      });
    });
    if (!ancoras.length) return;
    pagina.filter((i) => i.y < cab.y - 4 && i.t.trim()).forEach((i) => {
      const col = colunaDe(i);
      if (!col || !['descricao', 'produto', 'codigo'].includes(col.tipo)) return;
      const alvo = ancoras.reduce((m, a) => (Math.abs(a.y - i.y) < Math.abs(m.y - i.y) ? a : m), ancoras[0]);
      if (Math.abs(alvo.y - i.y) > 40) return;
      ({ descricao: alvo.desc, produto: alvo.prod, codigo: alvo.cod })[col.tipo].push(i);
    });
    const juntar = (lista) => lista.sort((a, b) => (b.y - a.y) || (a.x - b.x)).map((i) => i.t).join(' ').replace(/\s+/g, ' ').trim();
    ancoras.forEach((a) => {
      const desc = juntar(a.desc); const prod = juntar(a.prod); const cod = juntar(a.cod);
      const nome = prod || desc || cod;
      if (!nome) return;
      itens.push({
        descricao: nome,
        detalhe: [prod && desc ? desc : '', cod ? `Material/código ${cod}` : ''].filter(Boolean).join(' · '),
        descricaoNF: '', unidade: a.unidade, quantidade: a.quantidade, unitSem: a.unitSem, unitCom: a.unitCom, unit: a.unit,
      });
    });
  });
  return { itens, numeroPedido, fornecedor, dataPedido };
}

async function extrairLinhasPdf(arquivo, paginas = 10) {
  const linhas = [];
  (await extrairItensPdf(arquivo, paginas)).forEach((itensPagina) => {
    const grupos = new Map();
    itensPagina.forEach((i) => {
      const y = Math.round(i.y);
      if (!grupos.has(y)) grupos.set(y, []);
      grupos.get(y).push({ x: i.x, t: i.t });
    });
    [...grupos.entries()].sort((a, b) => b[0] - a[0]).forEach(([, itens]) => {
      const texto = itens.sort((a, b) => a.x - b.x).map((i) => i.t).join(' ').replace(/\s+/g, ' ').trim();
      if (texto) linhas.push(texto);
    });
  });
  return linhas;
}

/** Terceiro a partir de PDF (ex.: cartao CNPJ, proposta) ou planilha (1a linha). */
async function lerTerceiroDeArquivo(arquivo) {
  if (/\.(xlsx|xls|csv)$/i.test(arquivo.name)) {
    const mapa = [['insumo', ['insumo']], ['nome', ['terceiro', 'fornecedor', 'nome', 'razaosocial']], ['cnpj', ['cnpj']], ['uf', ['uf', 'ufemissor', 'ufterceiro']]];
    const l = (await lerPlanilhaFD(arquivo)).map((b) => mapearPorApelidos(b, mapa)).find((x) => x.nome || x.cnpj);
    if (!l) throw new Error('Nenhuma linha de terceiro reconhecida (colunas Insumo, Terceiro, CNPJ, UF).');
    return { nome: l.nome ? String(l.nome) : '', cnpj: l.cnpj ? String(l.cnpj) : '', uf: String(l.uf || '').toUpperCase().slice(0, 2), insumoNome: l.insumo ? String(l.insumo) : '', aviso: 'Planilha: usada a primeira linha. Para vários, use Importar na aba Terceiros.' };
  }
  const linhas = await extrairLinhasPdf(arquivo, 3);
  const texto = linhas.join('\n');
  const cnpj = (texto.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/) || [])[0] || '';
  let nome = '';
  const iRazao = linhas.findIndex((l) => /NOME\s+EMPRESARIAL|RAZ[ÃA]O\s+SOCIAL/i.test(l));
  if (iRazao >= 0) nome = linhas[iRazao].replace(/.*(NOME\s+EMPRESARIAL|RAZ[ÃA]O\s+SOCIAL)\s*:?\s*/i, '').trim() || linhas[iRazao + 1] || '';
  if (!nome && cnpj) nome = (linhas.find((l) => l.includes(cnpj)) || '').replace(cnpj, '').replace(/CNPJ\s*:?/i, '').trim();
  const uf = ((texto.match(/\bUF\s*:?\s*\n?\s*([A-Z]{2})\b/) || [])[1] || '').toUpperCase();
  return { nome, cnpj, uf: UFS.includes(uf) ? uf : '', aviso: 'PDF: lidos razão social, CNPJ e UF (leitura parcial). Escolha o insumo e confira.' };
}

/** Insumos a partir de PDF: linhas "descricao ... R$ valor" viram linhas Insumo / Valor Total. */
async function linhasInsumosDePdf(arquivo) {
  const linhas = await extrairLinhasPdf(arquivo);
  const re = /^(.*?[A-Za-zÀ-ú].*?)\s+(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})$/;
  const achadas = linhas.map((l) => l.match(re)).filter(Boolean)
    .map((m) => ({ Insumo: m[1].replace(/^[\d.\s-]+/, '').trim(), 'Valor Total': m[2] }))
    .filter((l) => l.Insumo && !/^(TOTAL|SUBTOTAL|VALOR)/i.test(l.Insumo));
  if (!achadas.length) throw new Error('Nenhuma linha "descrição + valor" encontrada no PDF.');
  return achadas;
}

/** Informacoes da obra a partir de PDF (procura rotulos como Inicio, Termino, Cliente...). */
async function linhasObraDePdf(arquivo) {
  const texto = (await extrairLinhasPdf(arquivo, 5)).join('\n');
  const achar = (re) => ((texto.match(re) || [])[1] || '').trim();
  const data = '(\\d{2}\\/\\d{2}\\/\\d{4})';
  const pares = [
    ['Nome da Obra', achar(/(?:OBRA|EMPREENDIMENTO|OBJETO)\s*:\s*([^\n]{3,120})/i)],
    ['Início da Obra', achar(new RegExp(`(?:IN[ÍI]CIO|DATA\\s+DE\\s+IN[ÍI]CIO)[^\\d\\n]{0,30}${data}`, 'i'))],
    ['Fim da Obra', achar(new RegExp(`(?:T[ÉE]RMINO|FIM|CONCLUS[ÃA]O)[^\\d\\n]{0,30}${data}`, 'i'))],
    ['Duração do contrato (dias)', achar(/PRAZO[^\d\n]{0,40}(\d{2,4})\s*(?:\(|DIAS)/i)],
    ['Cliente', achar(/(?:CLIENTE|CONTRATANTE)\s*:\s*([^\n]{3,120})/i)],
    ['Consórcio', achar(/(?:CONS[ÓO]RCIO)\s*:?\s*([^\n]{3,120})/i)],
    ['UF da obra', achar(/\bUF\s*:\s*([A-Z]{2})\b/)],
  ].filter(([, v]) => v);
  if (!pares.length) throw new Error('Nenhuma informação da obra reconhecida no PDF.');
  return pares.map(([Campo, Valor]) => ({ Campo, Valor }));
}

async function lerPdfDanfe(arquivo) {

/** Le XML, PDF ou planilha (1a NF) e devolve um rascunho de NF para conferencia no cadastro. */
async function rascunhoNFDeArquivo(arquivo) {
  if (/\.(xlsx|xls|csv)$/i.test(arquivo.name)) {
    const plano = planejarImportacaoNotas(await lerPlanilhaFD(arquivo));
    if (!plano.quantidade) throw new Error('Nenhuma NF nova na planilha (pedido não cadastrado ou NF já lançada).');
    const nf = plano.tabela.dados.length ? plano.novas[0] : null;
    return {
      ...nf, id: undefined,
      avisoImportacao: `Planilha lida: ${plano.quantidade} NF(s) encontrada(s); este cadastro traz a primeira (${nf.numero}). Para lançar todas, use Importar na aba Notas fiscais. Confira antes de salvar.`,
    };
  }
  const lido = /\.pdf$/i.test(arquivo.name) ? await lerPdfDanfe(arquivo) : lerXmlNFe(await arquivo.text());
  const { ped, como } = encontrarPedidoNF(lido);
  const { itens, semVinculo } = vincularItensNF(ped, lido.itens);
  const avisos = [
    ped ? `Pedido ${ped.numero} identificado pelo ${como}.` : 'Nenhum pedido correspondente encontrado: escolha o pedido.',
    lido.pdf ? 'PDF: lidos apenas nº, data, valor e CNPJ; marque os produtos da NF na tabela abaixo.' : `${itens.length} item(ns) vinculado(s) a produtos do pedido; ${semVinculo.length} sem correspondência.`,
    'Confira todos os campos antes de salvar.',
  ];
  const ufO = lido.ufOrigem || ped?.ufOrigem || '';
  const ufD = lido.ufDestino || ped?.ufDestino || obra.ufObra || '';
  return {
    pedidoId: ped?.id || '', numero: lido.numero, data: lido.data, bm: bmPelaData(lido.data), valor: lido.valor,
    ufOrigem: ufO, ufDestino: ufD, importado: ped?.importado || false,
    difalPerc: calcularDifal(ufO, ufD, ped?.importado).perc,
    itens, itensSemVinculo: semVinculo, grds: [], observacoes: `Importada de ${arquivo.name}.`,
    avisoImportacao: avisos.join(' '),
  };
}

/** Encontra o terceiro de um pedido/boleto lido de arquivo: CNPJ primeiro, depois nome. */
function acharTerceiroLido({ cnpj, cnpjs = [], terceiroNome, insumoNome }) {
  const todos = [cnpj, ...cnpjs].map(soDigitos).filter((c) => c.length === 14);
  let ter = terceiros.find((t) => soDigitos(t.cnpj) && todos.includes(soDigitos(t.cnpj)));
  if (!ter && terceiroNome) {
    const candidatos = terceiros.filter((t) => normalizarTexto(t.nome) === normalizarTexto(terceiroNome));
    ter = candidatos.find((t) => !insumoNome || normalizarTexto(insumoPorId(t.insumoId)?.nome) === normalizarTexto(insumoNome)) || candidatos[0];
  }
  return ter || null;
}

/** Pedido a partir de planilha (formato da importacao de pedidos; 1o pedido) ou de PDF (leitura parcial). */
async function lerPedidoDeArquivo(arquivo) {
  if (/\.(xlsx|xls|csv)$/i.test(arquivo.name)) {
    const linhas = (await lerPlanilhaFD(arquivo)).map((bruta) => {
      const l = {};
      Object.entries(bruta).forEach(([k, v]) => {
        const c = mapearColuna(k);
        if (c && l[c] == null && v !== '' && v != null) l[c] = typeof v === 'string' ? v.trim() : v;
      });
      return l;
    }).filter((l) => l.pedido || l.descricao || l.produtoNome);
    if (!linhas.length) throw new Error('Nenhuma linha de pedido reconhecida. Use o modelo (aba Pedidos > Importar > Baixar modelo).');
    const numero = String(linhas[0].pedido || '');
    const doPedido = linhas.filter((l) => !l.pedido || String(l.pedido) === numero);
    const qtdPedidos = new Set(linhas.map((l) => String(l.pedido || '')).filter(Boolean)).size;
    const l0 = doPedido[0];
    const modo = modoReidiDeTexto(l0.modo, false);
    const percLido = numPlanilha(l0.percReidi);
    const perc = modo === 'pedido' && percLido != null ? (percLido < 1 ? percLido * 100 : percLido) : null;
    const lidos = doPedido.filter((l) => l.descricao || l.produtoNome).map((l) => {
      const vals = completarValoresReidi(modo, perc, numPlanilha(l.unitSem), numPlanilha(l.unitCom) ?? numPlanilha(l.unit));
      return {
        descricao: String(l.produtoNome || l.descricao),
        detalhe: l.produtoNome && l.descricao && String(l.descricao) !== String(l.produtoNome) ? String(l.descricao) : '',
        descricaoNF: l.descricaoNF ? String(l.descricaoNF) : '', unidade: l.unidade ? String(l.unidade) : '', quantidade: vn(numPlanilha(l.quantidade)),
        unitSem: vals.unitSem, unitCom: vals.unitCom, ajusteManual: vals.ajusteManual,
      };
    });
    return {
      numero, dataEmissao: dataPlanilha(l0.data), modoReidi: modo, percentualReidi: perc,
      valor: numPlanilha(l0.valorPedido) ?? (lidos.reduce((t, p) => t + p.quantidade * p.unitCom, 0)),
      terceiroNome: l0.terceiro ? String(l0.terceiro) : '', cnpj: l0.cnpj ? String(l0.cnpj) : '', insumoNome: l0.insumo ? String(l0.insumo) : '',
      produtos: lidos,
      aviso: `${lidos.length} produto(s) lido(s); serão incluídos ao salvar.${qtdPedidos > 1 ? ` A planilha tem ${qtdPedidos} pedidos: este cadastro traz o primeiro (${numero}); para todos, use Importar na aba Pedidos.` : ''}`,
    };
  }
  const tabela = interpretarTabelaProdutosPdf(await extrairItensPdf(arquivo));
  const texto = await extrairTextoPdf(arquivo);
  const achar = (re) => (texto.match(re) || [])[1] || '';
  const numero = tabela.numeroPedido || achar(/PEDIDO(?:\s+DE\s+COMPRAS?)?\s*(?:N[º°o.]*|N[ÚU]MERO)?\s*[:\-]?\s*(\d{6,12})/i) || achar(/\b(\d{10})\b/);
  const data = paraData(tabela.dataPedido || achar(/(?:DATA\s*(?:DE\s*)?EMISS[ÃA]O|EMITIDO\s+EM|DATA\s+DO\s+PEDIDO)\s*[:\-]?\s*(\d{2}\/\d{2}\/\d{4})/i) || achar(/(\d{2}\/\d{2}\/\d{4})/));
  const valor = paraNumero(achar(/(?:VALOR\s+TOTAL(?:\s+DO\s+PEDIDO)?|TOTAL\s+GERAL|TOTAL\s+DO\s+PEDIDO)[^\d]{0,40}(\d{1,3}(?:\.\d{3})*,\d{2})/i));
  return {
    numero, dataEmissao: data ? formatarData(data, 'iso') : '', valor,
    /* CNPJs com ou sem pontuacao (o do fornecedor e reconhecido pelo cadastro de terceiros) */
    cnpjs: [...(texto.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/g) || []), ...[...texto.matchAll(/CNPJ\s*:?\s*(\d{14})\b/gi)].map((m) => m[1])],
    terceiroNome: tabela.fornecedor || '',
    /* um valor so no PDF (ex.: Pc.Unit) = valor pago; o modo de REIDI do pedido decide o outro */
    produtos: tabela.itens.map(({ unit, ...i }) => ({ ...i, quantidade: vn(i.quantidade), unitSem: i.unitSem ?? null, unitCom: i.unitCom ?? unit ?? null, ajusteManual: false })),
    aviso: tabela.itens.length
      ? `PDF: lidos o nº do pedido, o fornecedor e ${tabela.itens.length} produto(s) com quantidade e valores; eles entram no pedido ao salvar (o modo de REIDI escolhido acima define o valor que falta).${valor ? ` Valor total do PDF: ${formatarMoeda(valor)} (o pedido vale a soma dos produtos).` : ''}`
      : 'PDF: lidos nº do pedido, data, valor e CNPJ (leitura parcial; a tabela de produtos não foi reconhecida). Lance os produtos na aba Produtos do pedido ou importe a planilha.',
  };
}

/** Boleto a partir de PDF (linha digitavel, vencimento, valor, nº documento) ou planilha (1a linha). */
async function lerBoletoDeArquivo(arquivo) {
  if (/\.(xlsx|xls|csv)$/i.test(arquivo.name)) {
    const mapa = [
      ['numeroNF', ['nnf', 'nf', 'numeronf', 'notafiscal']], ['numeroPedido', ['npedido', 'pedido']],
      ['numero', ['ndocboleto', 'ndocumento', 'documento', 'boleto', 'ndoc']], ['valor', ['valor', 'valorboleto']], ['vencimento', ['vencimento']],
      ['pagamento', ['pagamento', 'datapagamento']], ['observacoes', ['observacoes', 'obs']],
    ];
    const l = (await lerPlanilhaFD(arquivo)).map((b) => mapearPorApelidos(b, mapa)).find((x) => x.numero || x.valor);
    if (!l) throw new Error('Nenhuma linha de boleto reconhecida. Use o modelo (aba Boletos > Importar > Baixar modelo).');
    const nf = l.numeroNF ? notas.find((n) => normalizarTexto(n.numero) === normalizarTexto(l.numeroNF)
      && (!l.numeroPedido || normalizarTexto(pedidoPorId(n.pedidoId)?.numero) === normalizarTexto(l.numeroPedido))) : null;
    return {
      numero: l.numero ? String(l.numero) : '', valor: numPlanilha(l.valor), vencimento: dataPlanilha(l.vencimento), pagamento: dataPlanilha(l.pagamento),
      notaId: nf?.id || '', observacoes: l.observacoes ? String(l.observacoes) : '',
      aviso: `Planilha: usada a primeira linha${nf ? ` (NF ${nf.numero})` : ''}. Para vários boletos, use Importar na aba Boletos.`,
    };
  }
  const texto = await extrairTextoPdf(arquivo, 2);
  const achar = (re) => (texto.match(re) || [])[1] || '';
  const linha = achar(/(\d{5}\.?\d{5}\s*\d{5}\.?\d{6}\s*\d{5}\.?\d{6}\s*\d\s*\d{14})/);
  const venc = paraData(achar(/VENCIMENTO[\s\S]{0,40}?(\d{2}\/\d{2}\/\d{4})/i));
  let valor = paraNumero(achar(/VALOR\s+DO\s+DOCUMENTO[\s\S]{0,40}?(\d{1,3}(?:\.\d{3})*,\d{2})/i));
  const digitos = soDigitos(linha);
  if (valor == null && digitos.length === 47) valor = Number(digitos.slice(-10)) / 100;
  const doc = achar(/N[º°o.]?\s*(?:DO\s+)?DOCUMENTO\s*[:\-]?\s*([A-Z0-9][A-Z0-9./\-]{2,})/i);
  return {
    numero: doc || (digitos ? digitos.slice(-14) : ''), valor, vencimento: venc ? formatarData(venc, 'iso') : '',
    observacoes: linha ? `Linha digitável: ${linha.replace(/\s+/g, ' ')}` : '',
    aviso: 'PDF: lidos nº do documento, vencimento, valor e linha digitável (leitura parcial). Escolha a NF e confira antes de salvar.',
  };
}

/* ---- Produtos de um pedido: Excel/CSV/PDF ---- */

const CAB_PRODUTOS = ['Produto', 'Descrição', 'Unidade', 'Quantidade', 'Valor Unit SEM REIDI', 'Valor Unit COM REIDI'];

/** Le produtos de planilha (colunas pelo nome) ou de PDF (linhas "descricao un qtd unitario total"). */
async function lerProdutosDeArquivo(arquivo) {
  if (/\.(xlsx|xls|csv)$/i.test(arquivo.name)) {
    const mapa = [
      ['dif', ['dif']],
      ['descricaoNF', ['descricaonf', 'produtonf', 'descricaonanf']],
      ['produtoNome', ['produto', 'produtoproposta', 'produtocorrespondente', 'nomedoproduto', 'nomeproduto']],
      ['unitSem', ['valorunitsemreidi', 'runitsemreidi', 'unitsemreidi', 'semreidi', 'valorsemreidi']],
      ['unitCom', ['valorunitcomreidi', 'runitcomreidi', 'unitcomreidi', 'comreidi', 'valorcomreidi', 'runitpedido', 'unitpedido', 'valorunitpedido']],
      ['unit', ['valorunit', 'valorunitario', 'precounitario', 'preco', 'unitario']],
      ['descricao', ['descricao', 'descricaopedidobase', 'descricaopedido', 'descricaodoproduto', 'item', 'material']],
      ['unidade', ['unidade', 'un', 'und', 'um']],
      ['quantidade', ['quantidade', 'qtd', 'qtde', 'quant']],
      ['total', ['valortotal', 'total']],
    ];
    const itens = (await lerPlanilhaFD(arquivo)).map((b) => mapearPorApelidos(b, mapa)).filter((l) => l.descricao || l.produtoNome)
      .map((l) => {
        const qtd = numPlanilha(l.quantidade) ?? 1;
        const total = numPlanilha(l.total);
        return {
          descricao: String(l.produtoNome || l.descricao),
          detalhe: l.produtoNome && l.descricao && String(l.descricao) !== String(l.produtoNome) ? String(l.descricao) : '',
          descricaoNF: l.descricaoNF ? String(l.descricaoNF) : '', unidade: l.unidade ? String(l.unidade) : '', quantidade: qtd,
          unitSem: numPlanilha(l.unitSem), unitCom: numPlanilha(l.unitCom),
          unit: numPlanilha(l.unit) ?? (total != null && qtd ? total / qtd : null),
        };
      });
    if (!itens.length) throw new Error('Nenhum produto reconhecido. Use o modelo (colunas Produto, Descrição, Unidade, Quantidade, Valor Unit SEM REIDI, Valor Unit COM REIDI).');
    return { itens, origem: 'planilha' };
  }
  const tabela = interpretarTabelaProdutosPdf(await extrairItensPdf(arquivo));
  if (tabela.itens.length) return { itens: tabela.itens, origem: 'PDF', numeroPedido: tabela.numeroPedido, fornecedor: tabela.fornecedor };
  const linhas = await extrairLinhasPdf(arquivo);
  const numero = '(\\d{1,3}(?:\\.\\d{3})*(?:,\\d{1,4})?)';
  const re = new RegExp(`^(?:\\d{1,4}\\s+)?(?:[\\d.]{5,}\\s+)?(.*?[A-Za-zÀ-ú].*?)\\s+([A-Za-z³²]{1,4})\\s+${numero}\\s+(?:R\\$\\s*)?${numero}\\s+(?:R\\$\\s*)?${numero}$`);
  const itens = linhas.map((l) => l.match(re)).filter(Boolean).map((m) => ({
    descricao: m[1].trim(), unidade: m[2], quantidade: paraNumero(m[3]), unit: paraNumero(m[4]), total: paraNumero(m[5]),
  })).filter((i) => i.quantidade && i.unit && i.total && Math.abs(i.quantidade * i.unit - i.total) <= Math.max(0.05, i.total * 0.01))
    .map(({ total, ...i }) => ({ ...i, unitSem: null, unitCom: null }));
  if (!itens.length) throw new Error('A tabela de produtos não foi reconhecida neste PDF. O leitor procura um cabeçalho com Descrição e Quantidade (ou Qtde) e, abaixo, linhas com quantidade e valor. Se o PDF for imagem (escaneado), use a planilha.');
  return { itens, origem: 'PDF' };
}

function abrirImportacaoProdutos(ped) {
  const area = h('div', {});
  let lidos = null;
  const modoPedido = temPercPedido(ped);
  const perc = vn(ped.percentualReidi);
  const opcoesValor = h('div', {});
  let valorDoArquivo = modoPedido ? 'sem' : 'com';

  const montarProdutos = () => (lidos || []).map((i) => {
    let sem = i.unitSem;
    let com = i.unitCom;
    if (sem == null && com == null && i.unit != null) { if (valorDoArquivo === 'sem') sem = i.unit; else com = i.unit; }
    const vals = completarValoresReidi(ped.modoReidi, modoPedido ? perc : null, sem, com);
    const repetido = produtosDoPedido(ped.id).some((p) => normalizarTexto(p.descricao) === normalizarTexto(i.descricao));
    return {
      descricao: i.descricao, detalhe: i.detalhe || '', descricaoNF: i.descricaoNF || '', unidade: i.unidade, quantidade: vn(i.quantidade),
      unitSem: vals.unitSem, unitCom: vals.unitCom, ajusteManual: vals.ajusteManual, falta: vals.falta, repetido,
    };
  });

  const desenhar = () => {
    const prods = montarProdutos();
    const novos = prods.filter((p) => !p.repetido);
    const totalCom = novos.reduce((t, p) => t + p.quantidade * p.unitCom, 0);
    const temUnico = ped.modoReidi !== 'sem' && (lidos || []).some((i) => i.unit != null && i.unitSem == null && i.unitCom == null);
    opcoesValor.replaceChildren(temUnico ? criarSegmentado({
      rotulo: 'O valor unitário do arquivo é',
      opcoes: [{ valor: 'sem', texto: 'Valor do arquivo = SEM REIDI' }, { valor: 'com', texto: 'Valor do arquivo = COM REIDI' }],
      valor: valorDoArquivo,
      onMudar: (v) => { valorDoArquivo = v; desenhar(); },
    }).elemento : '');
    area.replaceChildren(h('div', { class: 'ctc-stack' },
      criarAlerta({
        tipo: novos.length ? 'success' : 'warning',
        titulo: `${novos.length} produto(s) prontos para incluir no pedido ${ped.numero}`,
        mensagem: `Total COM REIDI dos novos: ${formatarMoeda(totalCom)} · Pedido: ${formatarMoeda(ped.valor)} · Já lançados: ${formatarMoeda(resumoPedido(ped).totalCom)}. Nada foi gravado ainda.`,
      }),
      prods.some((p) => p.repetido) ? criarAlerta({ tipo: 'info', mensagem: `Já existem neste pedido (serão ignorados): ${prods.filter((p) => p.repetido).map((p) => p.descricao).join(', ')}` }) : null,
      prods.some((p) => p.falta) ? criarAlerta({ tipo: 'warning', mensagem: 'Este pedido pede os dois valores (SEM e COM REIDI) e alguns itens vieram com só um. Eles entram com o outro zerado; complete depois em Editar produto.' }) : null,
      opcoesValor,
      criarTabela({
        dados: prods.map((p) => ({ ...p, totalCom: p.quantidade * p.unitCom, obs: p.repetido ? 'já existe' : p.falta })),
        compacta: true, altura: 'auto',
        linhaVariante: (l) => (l.repetido ? 'warning' : l.falta ? 'danger' : null),
        colunas: [
          { campo: 'descricao', titulo: 'Produto' }, { campo: 'detalhe', titulo: 'Descrição' }, { campo: 'unidade', titulo: 'Un' }, { campo: 'quantidade', titulo: 'Qtd', tipo: 'numero' },
          { campo: 'unitSem', titulo: 'Unit. SEM REIDI', tipo: 'moeda' }, { campo: 'unitCom', titulo: 'Unit. COM REIDI', tipo: 'moeda' },
          { campo: 'totalCom', titulo: 'Total COM', tipo: 'moeda', total: 'soma' }, { campo: 'obs', titulo: 'Observação' },
        ],
      }).elemento));
  };

  const entrada = h('input', { type: 'file', accept: '.xlsx,.xls,.csv,.pdf', class: 'ctc-input' });
  entrada.addEventListener('change', async () => {
    const arquivo = entrada.files[0];
    if (!arquivo) return;
    area.replaceChildren(criarAlerta({ tipo: 'info', mensagem: `Lendo ${arquivo.name}...` }));
    try {
      const r = await lerProdutosDeArquivo(arquivo);
      lidos = r.itens;
      desenhar();
    } catch (erro) {
      lidos = null;
      opcoesValor.replaceChildren();
      area.replaceChildren(criarAlerta({ tipo: 'danger', titulo: 'Falha ao ler o arquivo', mensagem: erro.message }));
    }
  });
  const modal = criarModal({
    titulo: `Importar produtos — pedido ${ped.numero}`, tamanho: 'xl', destruirAoFechar: true,
    conteudo: [
      criarAlerta({
        tipo: 'info',
        mensagem: `O produto é identificado pela coluna PRODUTO (nome); a Descrição longa fica como detalhe. Planilha: colunas Produto, Descrição, Unidade, Quantidade e os valores unitários (SEM e/ou COM REIDI; se houver uma coluna só de valor, você escolhe qual é). PDF: lê as linhas com descrição, unidade, quantidade, valor unitário e total (leitura parcial; o layout varia). REIDI deste pedido: ${rotuloReidiPedido(ped)}.${ped.modoReidi === 'sem' ? ' Um valor só por produto.' : modoPedido ? ' Basta um dos valores; o outro é calculado.' : ' São necessários os dois valores.'}`,
        acoes: [{ texto: 'Baixar modelo (CSV)', onClick: () => baixarTextoFD('modelo-produtos-do-pedido.csv', `${CAB_PRODUTOS.join(';')}\n`) }],
      }),
      entrada, area,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      {
        texto: 'Incluir no pedido', variante: 'primary', fechar: false,
        onClick: () => {
          const novos = montarProdutos().filter((p) => !p.repetido);
          if (!novos.length) { toast.aviso('Nenhum produto novo para incluir'); return; }
          novos.forEach(({ falta, repetido, ...p }) => produtos.push({ id: novoIdFD('pro'), pedidoId: ped.id, ...p }));
          modal.fechar();
          registrarAlteracao();
          toast.sucesso('Produtos incluídos', `${novos.length} no pedido ${ped.numero}`);
        },
      },
    ],
  });
  modal.abrir();
}

/** Botao discreto "Preencher de arquivo" com seletor de arquivo escondido. */
function botaoPreencherArquivo({ texto = 'Preencher de arquivo', accept, aoEscolher }) {
  if (!podeEditar()) return null;
  const entrada = h('input', { type: 'file', accept, hidden: true });
  entrada.addEventListener('change', async () => {
    const arquivo = entrada.files[0];
    entrada.value = '';
    if (!arquivo) return;
    try {
      toast.info('Lendo arquivo', arquivo.name);
      await aoEscolher(arquivo);
    } catch (erro) {
      notificar({ tipo: 'danger', titulo: 'Não foi possível ler o arquivo', mensagem: erro.message });
    }
  });
  return h('div', { class: 'ctc-toolbar' },
    h('span', { class: 'ctc-spacer' }),
    entrada,
    criarBotao({ texto, icone: 'upload', variante: 'ghost', tamanho: 'sm', onClick: () => entrada.click() }));
}

function abrirImportacaoNF() {
  const area = h('div', {});
  const entrada = h('input', { type: 'file', accept: '.xml,.pdf,.xlsx,.xls,.csv', class: 'ctc-input' });
  let modal = null;
  entrada.addEventListener('change', async () => {
    const arquivo = entrada.files[0];
    if (!arquivo) return;
    area.replaceChildren(criarAlerta({ tipo: 'info', mensagem: `Lendo ${arquivo.name}...` }));
    if (/\.(xlsx|xls|csv)$/i.test(arquivo.name)) {
      modal.fechar();
      abrirImportacaoPlanilha({
        titulo: 'Importar NFs de planilha', cabecalhoModelo: CAB_NOTAS, nomeModelo: 'modelo-notas-fiscais.csv',
        explicacao: 'Uma linha por item da NF (repita os dados da NF em cada item) ou uma linha só por NF, sem itens. O pedido precisa estar cadastrado. Itens são vinculados aos produtos do pedido pela descrição; os que não baterem ficam como "sem pedido". NF já lançada no mesmo pedido é ignorada.',
        planejar: planejarImportacaoNotas, arquivoInicial: arquivo,
        aoEscolherPdf: async (pdf) => abrirModalNota(null, { rascunho: await rascunhoNFDeArquivo(pdf) }),
      });
      return;
    }
    try {
      const rascunho = await rascunhoNFDeArquivo(arquivo);
      modal.fechar();
      abrirModalNota(null, { rascunho });
    } catch (erro) {
      area.replaceChildren(criarAlerta({ tipo: 'danger', titulo: 'Falha ao ler o arquivo', mensagem: erro.message }));
    }
  });
  modal = criarModal({
    titulo: 'Importar NF (XML ou PDF)', tamanho: 'md', destruirAoFechar: true,
    conteudo: [
      criarAlerta({
        tipo: 'info',
        mensagem: 'XML da NF-e: lê número, data, valor, UFs, emitente e itens, e tenta vincular cada item a um produto do pedido. PDF do DANFE: leitura parcial. Planilha (Excel/CSV): várias NFs de uma vez, no formato da exportação. Nada é salvo antes da sua conferência.',
        acoes: [{ texto: 'Importar várias NFs por planilha', onClick: () => { modal.fechar(); abrirImportacaoPlanilha({ titulo: 'Importar NFs de planilha', cabecalhoModelo: CAB_NOTAS, nomeModelo: 'modelo-notas-fiscais.csv', explicacao: 'Uma linha por item da NF (repita os dados da NF em cada item) ou uma linha só por NF, sem itens. O pedido precisa estar cadastrado. Itens são vinculados aos produtos do pedido pela descrição; os que não baterem ficam como "sem pedido". NF já lançada no mesmo pedido é ignorada.', planejar: planejarImportacaoNotas, aoEscolherPdf: async (pdf) => abrirModalNota(null, { rascunho: await rascunhoNFDeArquivo(pdf) }) }); } }],
      }),
      entrada, area,
    ],
    acoes: [{ texto: 'Cancelar', variante: 'outline' }],
  });
  modal.abrir();
}



/* =============================================================================
   11b. IMPORTAR E EXPORTAR EM TODAS AS BASES
   - Exportar: Excel (.xlsx) com o recorte atual (filtros); sem internet, CSV.
   - Importar: Excel ou CSV no MESMO formato da exportacao (exportar, editar,
     importar). Tudo passa por conferencia antes de gravar.
   - Registros ja existentes: insumos e terceiros sao ATUALIZADOS; pedidos,
     NFs e boletos repetidos sao IGNORADOS (nao duplicam e nao sobrescrevem).
   ========================================================================== */

const dataTexto = (v) => (v ? formatarData(v, 'curta', { vazio: '' }) : '');
const simNao = (v) => (v ? 'Sim' : 'Não');
const ehSim = (v) => ['sim', 's', 'x', 'true', '1', 'ok'].includes(normalizarTexto(String(v ?? '')).trim());
const carimboArquivo = () => formatarData(new Date(), 'iso');

function valorCsv(v) {
  if (v == null) return '';
  if (typeof v === 'number') return Number.isFinite(v) ? String(Math.round(v * 10000) / 10000).replace('.', ',') : '';
  const t = String(v);
  return /[;"\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
}

/** abas: [{ nome, cabecalho: [], linhas: [[]] }] */
/* ---- Exportacao para Excel (padrao unico de todas as bases) ---- */

function carregarExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise((resolver, rejeitar) => {
    const script = document.createElement('script');
    script.src = URL_EXCELJS;
    script.onload = () => (window.ExcelJS ? resolver(window.ExcelJS) : rejeitar(new Error('Gerador de Excel indisponível.')));
    script.onerror = () => { script.remove(); rejeitar(new Error('Não foi possível carregar o gerador de Excel.')); };
    document.head.append(script);
  });
}

/** Tipo de cada coluna pelo nome (e pelos valores): define formato, alinhamento e total. */
function tipoColunaExport(nome, valores) {
  const t = normalizarTexto(String(nome || ''));
  const numerico = valores.some((v) => typeof v === 'number') && valores.every((v) => v === '' || v == null || typeof v === 'number');
  if (/^n[ºo°]?\s|^nº|^n\b|cnpj|grd|\bbm\b|^uf\b|^uf |status|situac|modo|tipo|e-clic|eclic|sim\/nao/.test(t)) return 'texto';
  if (/data|emiss|vencim|pagamento|recebid|inicio|\bfim\b|aprovad|reprovad|novo fim/.test(t)) return 'data';
  if (t.includes('%')) return numerico ? 'perc' : 'texto';
  if (/qtd|quantidade|qtde|unidades|duracao|dias|saldo do produto|saldo \(qtd\)|saldo \(un\)|contratado|^(pedidos|nfs|itens|produtos|boletos|linhas)$/.test(t)) return numerico ? 'numero' : 'texto';
  if (/valor|total|saldo|reidi|difal|faturad|comprometid|em pedidos|previst|vigente|unit|preco|r\$|pago|desvio|real|tendenc|estimad|aditivo|a distribuir|falta|^bm\d/.test(t)) return numerico ? 'moeda' : 'texto';
  return numerico ? 'numero' : 'texto';
}
/* colunas que repetem o valor do "pai" em cada linha (pedido/NF): nao somar */
const COLUNA_REPETIDA = /valor ?nf|valor da nf|reidi da nf|^reidi$|^reidi \(r\$\)$|valor difal|valor pedido|valor do pedido|faturado \(nfs\) do pedido|saldo do pedido|unit|preco|saldo do produto|acumulad/;

const FORMATO_EXCEL = {
  moeda: '"R$" #,##0.00;[Red]-"R$" #,##0.00',
  numero: '#,##0.00####;[Red]-#,##0.00####',
  inteiro: '#,##0;[Red]-#,##0',
  perc: '0.00"%";[Red]-0.00"%"',
  data: 'dd/mm/yyyy',
};
const COR_ABA = ['1A2F4E', '2E86AB', 'C2702E', '2D9E6B', '7C3AED', 'E6A817', 'E63946', '475569'];

/** Data "dd/mm/aaaa" (ou ISO) vira data do Excel; o resto fica como esta. */
function valorCelulaExport(v, tipo) {
  if (v == null || v === '') return null;
  if (tipo === 'data' && typeof v === 'string') {
    const d = paraData(v);
    return d ? new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 12)) : v;
  }
  return v;
}
const nomeAbaExcel = (nome) => String(nome || 'Aba').replace(/[[\]:*?/\\]/g, ' ').slice(0, 31);

/**
 * Exporta abas [{ nome, cabecalho, linhas, descricao? }] num Excel formatado:
 *  linha 1 titulo (obra · base) · linha 2 data e quantidade · linha 3 totais (SUBTOTAL, so linhas
 *  visiveis no filtro) · linha 4 cabecalho com filtro · dados com formato por tipo de coluna.
 * O cabecalho continua sendo a linha com os nomes das colunas: as importacoes leem o arquivo.
 */
async function exportarPlanilha(nomeArquivo, abas) {
  const total = abas.reduce((t, a) => t + a.linhas.length, 0);
  try {
    const ExcelJS = await carregarExcelJS();
    const livro = new ExcelJS.Workbook();
    livro.creator = 'CTC · Faturamento Direto';
    livro.created = new Date();
    const agora = `${formatarData(new Date())} ${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}`;
    const borda = { style: 'thin', color: { argb: 'FFE3E7ED' } };
    const bordas = { top: borda, left: borda, bottom: borda, right: borda };
    const nomesUsados = new Set();
    const unico = (nome) => { let n = nomeAbaExcel(nome); let i = 2; while (nomesUsados.has(n)) n = `${nomeAbaExcel(nome).slice(0, 28)} ${i++}`; nomesUsados.add(n); return n; };
    /* aba "Leia-me" quando ha varias abas */
    if (abas.length > 1) {
      const ws = livro.addWorksheet(unico('Leia-me'), { properties: { tabColor: { argb: 'FF475569' } }, views: [{ showGridLines: false }] });
      ws.columns = [{ width: 30 }, { width: 16 }, { width: 70 }];
      ws.mergeCells('A1:C1');
      Object.assign(ws.getCell('A1'), { value: `${obra.nome || 'Obra'} — Faturamento Direto`, font: { bold: true, size: 16, color: { argb: 'FFFFFFFF' } }, fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1A2F4E' } }, alignment: { vertical: 'middle', indent: 1 } });
      ws.getRow(1).height = 30;
      [['Cliente', obra.cliente || '—'], ['Consórcio', obra.consorcio || '—'], ['Período da obra', `${formatarData(obra.inicio) || '—'} a ${formatarData(fimVigente()) || '—'}`], ['Exportado em', agora]].forEach(([k, v], i) => {
        ws.getCell(`A${i + 3}`).value = k; ws.getCell(`A${i + 3}`).font = { bold: true, color: { argb: 'FF6C757D' } };
        ws.mergeCells(`B${i + 3}:C${i + 3}`); ws.getCell(`B${i + 3}`).value = v;
      });
      const cab = ws.getRow(8);
      cab.values = ['Aba', 'Linhas', 'Conteúdo'];
      cab.eachCell((c) => { c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF243D61' } }; c.border = bordas; });
      abas.forEach((a, i) => {
        const r = ws.getRow(9 + i);
        r.values = [a.nome, a.linhas.length, a.descricao || `${a.cabecalho.length} colunas: ${a.cabecalho.slice(0, 6).join(', ')}${a.cabecalho.length > 6 ? '…' : ''}`];
        r.eachCell((c) => { c.border = bordas; c.alignment = { wrapText: true, vertical: 'top' }; });
        r.getCell(1).font = { bold: true, color: { argb: `FF${COR_ABA[i % COR_ABA.length]}` } };
      });
      const leg = 10 + abas.length;
      [['Como usar', 'Cada aba tem: título, linha de TOTAIS (soma só o que estiver visível no filtro), cabeçalho com filtro e os dados.'],
        ['Cores', 'Valores negativos em vermelho. Linhas alternadas para leitura. Painel congelado no cabeçalho e na 1ª coluna.'],
        ['Reimportar', 'Este arquivo pode ser importado de volta (Importar / Exportar): o sistema reconhece as abas e o cabeçalho.']].forEach(([k, v], i) => {
        ws.getCell(`A${leg + i}`).value = k; ws.getCell(`A${leg + i}`).font = { bold: true };
        ws.mergeCells(`B${leg + i}:C${leg + i}`); ws.getCell(`B${leg + i}`).value = v; ws.getCell(`B${leg + i}`).alignment = { wrapText: true };
      });
    }
    abas.forEach((a, ia) => {
      const nCol = a.cabecalho.length;
      const ws = livro.addWorksheet(unico(a.nome), {
        properties: { tabColor: { argb: `FF${COR_ABA[ia % COR_ABA.length]}` } },
        views: [{ state: 'frozen', xSplit: 1, ySplit: 4 }],
      });
      const tipos = a.cabecalho.map((c, i) => {
        const valores = a.linhas.map((l) => l[i]);
        const tipo = tipoColunaExport(c, valores);
        /* contagens e quantidades inteiras sem casas decimais */
        return tipo === 'numero' && valores.every((v) => typeof v !== 'number' || Number.isInteger(v)) ? 'inteiro' : tipo;
      });
      const ultimaCol = ws.getColumn(nCol).letter;
      /* titulo e subtitulo */
      ws.mergeCells(`A1:${ultimaCol}1`);
      Object.assign(ws.getCell('A1'), {
        value: `${obra.nome || 'Obra'} — ${a.nome}`,
        font: { bold: true, size: 14, color: { argb: 'FFFFFFFF' } },
        fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1A2F4E' } },
        alignment: { vertical: 'middle', indent: 1 },
      });
      ws.getRow(1).height = 26;
      ws.mergeCells(`A2:${ultimaCol}2`);
      Object.assign(ws.getCell('A2'), {
        value: `Exportado em ${agora} · ${a.linhas.length} linha(s)${obra.cliente ? ` · Cliente: ${obra.cliente}` : ''}${obra.consorcio ? ` · ${obra.consorcio}` : ''}`,
        font: { italic: true, size: 9, color: { argb: 'FF6C757D' } },
      });
      /* cabecalho (linha 4) */
      const cab = ws.getRow(4);
      cab.values = a.cabecalho;
      cab.height = 32;
      cab.eachCell((c, i) => {
        c.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10 };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF243D61' } };
        c.alignment = { vertical: 'middle', horizontal: ['moeda', 'numero', 'inteiro', 'perc'].includes(tipos[i - 1]) ? 'right' : 'left', wrapText: true };
        c.border = bordas;
      });
      /* dados (a partir da linha 5) */
      a.linhas.forEach((linha, il) => {
        const r = ws.getRow(5 + il);
        r.values = linha.map((v, i) => valorCelulaExport(v, tipos[i]));
        r.eachCell({ includeEmpty: true }, (c, i) => {
          if (i > nCol) return;
          const tipo = tipos[i - 1];
          if (FORMATO_EXCEL[tipo]) c.numFmt = FORMATO_EXCEL[tipo];
          c.border = bordas;
          c.alignment = { vertical: 'top', wrapText: tipo === 'texto' && String(c.value ?? '').length > 40, horizontal: tipo === 'data' ? 'center' : undefined };
          if (il % 2) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F7FA' } };
        });
        r.getCell(1).font = { bold: true, color: { argb: 'FF1A2F4E' } };
      });
      /* totais (linha 3): SUBTOTAL(109) soma so as linhas visiveis no filtro */
      const ini = 5; const fim = Math.max(5, 4 + a.linhas.length);
      const tot = ws.getRow(3);
      let comTotal = false;
      tipos.forEach((tipo, i) => {
        if (i === 0 || !a.linhas.length || !['moeda', 'numero', 'inteiro'].includes(tipo) || COLUNA_REPETIDA.test(normalizarTexto(String(a.cabecalho[i])))) return;
        const col = ws.getColumn(i + 1).letter;
        const soma = a.linhas.reduce((t, l) => t + (typeof l[i] === 'number' ? l[i] : 0), 0);
        const c = tot.getCell(i + 1);
        c.value = { formula: `SUBTOTAL(109,${col}${ini}:${col}${fim})`, result: soma };
        c.numFmt = FORMATO_EXCEL[tipo];
        c.font = { bold: true, color: { argb: 'FF1A2F4E' } };
        comTotal = true;
      });
      if (comTotal) {
        tot.getCell(1).value = 'TOTAIS (linhas visíveis)';
        tot.getCell(1).font = { bold: true, size: 9, color: { argb: 'FF1A2F4E' } };
      }
      for (let i = 1; comTotal && i <= nCol; i += 1) {
        const c = tot.getCell(i);
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE3F0FB' } };
        c.border = { top: borda, bottom: { style: 'medium', color: { argb: 'FF1A2F4E' } } };
      }
      tot.height = 20;
      /* filtro e larguras */
      if (a.linhas.length) ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: fim, column: nCol } };
      a.cabecalho.forEach((nome, i) => {
        const tipo = tipos[i];
        const maior = a.linhas.slice(0, 400).reduce((m, l) => {
          const v = l[i];
          const tam = tipo === 'moeda' ? formatarMoeda(v).length + 1 : tipo === 'data' ? 10 : String(v ?? '').length;
          return Math.max(m, tam);
        }, 0);
        ws.getColumn(i + 1).width = Math.min(48, Math.max(tipo === 'data' ? 12 : 9, Math.ceil(Math.max(maior, Math.min(String(nome).length, 22)) * 1.1) + 2));
      });
      ws.pageSetup = { orientation: nCol > 8 ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9, printTitlesRow: '4:4' };
    });
    const buffer = await livro.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const link = h('a', { href: url, download: `${nomeArquivo}.xlsx` });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast.sucesso('Planilha exportada', `${nomeArquivo}.xlsx · ${total} linha(s)`);
  } catch (erro) {
    /* sem o gerador formatado: tenta o simples (SheetJS) e, por ultimo, CSV */
    try {
      const XLSX = await import(URL_SHEETJS);
      const livro = XLSX.utils.book_new();
      abas.forEach((a) => {
        const folha = XLSX.utils.aoa_to_sheet([a.cabecalho, ...a.linhas]);
        folha['!cols'] = a.cabecalho.map((c) => ({ wch: Math.min(45, Math.max(12, String(c).length + 2)) }));
        XLSX.utils.book_append_sheet(livro, folha, nomeAbaExcel(a.nome));
      });
      XLSX.writeFile(livro, `${nomeArquivo}.xlsx`);
      toast.info('Planilha exportada sem formatação', 'O gerador formatado não carregou; o arquivo saiu simples.');
    } catch (erro2) {
      abas.forEach((a) => {
        const sufixo = abas.length > 1 ? `-${chaveColuna(a.nome)}` : '';
        baixarTextoFD(`${nomeArquivo}${sufixo}.csv`, `${[a.cabecalho, ...a.linhas].map((l) => l.map(valorCsv).join(';')).join('\n')}\n`);
      });
      toast.info('Exportado em CSV', 'O gerador de Excel não carregou (internet ou rede bloqueada). O CSV abre normalmente no Excel.');
    }
  }
}

/** Le cada linha da planilha pelos nomes das colunas: primeiro nome exato, depois inicio do nome. */
function mapearPorApelidos(bruta, mapa) {
  const l = {};
  Object.entries(bruta).forEach(([k, v]) => {
    const ck = chaveColuna(k);
    if (!ck) return;
    const achado = mapa.find(([c, apelidos]) => l[c] == null && apelidos.includes(ck))
      || mapa.find(([c, apelidos]) => l[c] == null && apelidos.some((a) => ck.startsWith(a)));
    if (achado && v !== '' && v != null) l[achado[0]] = typeof v === 'string' ? v.trim() : v;
  });
  return l;
}

const numPlanilha = (v) => (v == null || v === '' ? null : typeof v === 'number' ? v : paraNumero(String(v).replace(/^R\$\s*/i, '')));

/**
 * Modal generico de importacao: le a planilha, mostra o plano e so grava ao confirmar.
 * planejar(linhas) -> { avisos: [alertas], tabela: { dados, colunas }, quantidade, aplicar: () => texto }
 */
function abrirImportacaoPlanilha({
  titulo, explicacao, cabecalhoModelo, nomeModelo, planejar, arquivoInicial = null,
  lerPdf = null,        // PDF -> linhas no formato da planilha (varios registros)
  aoEscolherPdf = null, // PDF de UM registro -> abre o cadastro preenchido
}) {
  const area = h('div', {});
  let plano = null;
  const entrada = h('input', { type: 'file', accept: '.xlsx,.xls,.csv,.pdf', class: 'ctc-input' });
  entrada.addEventListener('change', () => processar(entrada.files[0]));
  async function processar(arquivo) {
    if (!arquivo) return;
    if (/\.pdf$/i.test(arquivo.name) && aoEscolherPdf) {
      modal.fechar();
      try { await aoEscolherPdf(arquivo); } catch (erro) { notificar({ tipo: 'danger', titulo: 'Não foi possível ler o PDF', mensagem: erro.message }); }
      return;
    }
    if (/\.pdf$/i.test(arquivo.name) && !lerPdf) {
      area.replaceChildren(criarAlerta({ tipo: 'warning', mensagem: 'Esta base não lê PDF; use Excel ou CSV.' }));
      return;
    }
    area.replaceChildren(criarAlerta({ tipo: 'info', mensagem: `Lendo ${arquivo.name}...` }));
    try {
      plano = planejar(/\.pdf$/i.test(arquivo.name) ? await lerPdf(arquivo) : await lerPlanilhaFD(arquivo));
      area.replaceChildren(h('div', { class: 'ctc-stack' },
        criarAlerta({
          tipo: plano.quantidade ? 'success' : 'warning',
          titulo: plano.quantidade ? `${plano.quantidade} registro(s) prontos para importar` : 'Nada novo para importar',
          mensagem: 'Nada foi gravado ainda. Confira e clique em Importar.',
        }),
        ...(plano.avisos || []).filter(Boolean),
        plano.tabela ? criarTabela({ ...plano.tabela, compacta: true, altura: 'auto' }).elemento : null));
    } catch (erro) {
      plano = null;
      area.replaceChildren(criarAlerta({ tipo: 'danger', titulo: 'Falha ao ler a planilha', mensagem: erro.message }));
    }
  }
  const modal = criarModal({
    titulo, tamanho: 'xl', destruirAoFechar: true,
    conteudo: [
      criarAlerta({
        tipo: 'info', mensagem: `${explicacao}${lerPdf ? ' PDF: lido em linhas e mostrado para conferência.' : aoEscolherPdf ? ' PDF: abre o cadastro já preenchido para conferência.' : ''}`,
        acoes: [{ texto: 'Baixar modelo (CSV)', onClick: () => baixarTextoFD(nomeModelo, `${cabecalhoModelo.join(';')}\n`) }],
      }),
      entrada, area,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      {
        texto: 'Importar', variante: 'primary', fechar: false,
        onClick: () => {
          if (!plano || !plano.quantidade) { toast.aviso('Nada para importar'); return; }
          const resumo = plano.aplicar();
          modal.fechar();
          registrarAlteracao();
          toast.sucesso('Importação concluída', resumo);
        },
      },
    ],
  });
  modal.abrir();
  if (arquivoInicial) processar(arquivoInicial);
}

/* ---- Insumos ---- */

const CAB_INSUMOS = ['Insumo', 'Valor Total', 'Aditivos', 'Valor Vigente', 'Estimado por Mês', 'Falta Distribuir nos BMs', 'Em Pedidos', 'Faturado', 'Saldo a Faturar'];

function cabecalhoInsumos() {
  return temAditivoValor() ? CAB_INSUMOS : CAB_INSUMOS.filter((c) => c !== 'Aditivos' && c !== 'Valor Vigente');
}

function linhasExportInsumos(lista) {
  const comAditivo = temAditivoValor();
  return lista.map((ins) => {
    const r = resumoInsumo(ins);
    return [ins.nome, vn(ins.valorTotal), ...(comAditivo ? [r.vigente - vn(ins.valorTotal), r.vigente] : []), (estimadoMensal(ins)),
      distribuicaoInsumo(ins).falta, r.comprometido, r.faturado, r.saldoFaturar];
  });
}

function exportarInsumos(lista = insumos) {
  exportarPlanilha(`${FORMATO_BASE}-insumos-${carimboArquivo()}`, [{ nome: 'Insumos', cabecalho: cabecalhoInsumos(), linhas: linhasExportInsumos(lista) }]);
}

function planejarImportacaoInsumos(brutas) {
  const mapa = [['nome', ['insumo', 'nome']], ['valorTotal', ['valortotal', 'valortotaldoinsumo', 'valor']]];
  const linhas = brutas.map((b) => mapearPorApelidos(b, mapa)).filter((l) => l.nome);
  const ops = linhas.map((l) => {
    const existente = insumos.find((i) => normalizarTexto(i.nome) === normalizarTexto(l.nome));
    const valor = numPlanilha(l.valorTotal);
    return { l, existente, valor, acao: existente ? (valor != null && valor !== vn(existente.valorTotal) ? 'Atualizar valor' : 'Sem mudança') : 'Criar' };
  });
  const validos = ops.filter((o) => o.acao !== 'Sem mudança');
  return {
    quantidade: validos.length,
    tabela: {
      dados: ops.map((o) => ({ nome: o.l.nome, atual: o.existente ? vn(o.existente.valorTotal) : null, novo: o.valor, acao: o.acao })),
      colunas: [{ campo: 'nome', titulo: 'Insumo' }, { campo: 'atual', titulo: 'Valor atual', tipo: 'moeda' }, { campo: 'novo', titulo: 'Valor da planilha', tipo: 'moeda' }, { campo: 'acao', titulo: 'Ação' }],
    },
    aplicar: () => {
      validos.forEach((o) => {
        if (o.existente) o.existente.valorTotal = o.valor;
        else insumos.push({ id: novoIdFD('ins'), nome: String(o.l.nome), valorTotal: o.valor ?? 0, modoProjecao: 'manual', projecao: {} });
      });
      return `${validos.length} insumo(s)`;
    },
  };
}

  abrirImportacaoPlanilha({

const CAB_TERCEIROS = ['Insumo', 'Terceiro', 'CNPJ', 'UF', 'Pedidos', 'Valor em Pedidos', 'Faturado', 'Saldo'];

function exportarTerceiros(lista = terceiros) {
  const linhas = lista.map((t) => {
    const peds = pedidos.filter((p) => p.terceiroId === t.id);
    const valor = somar(peds, 'valor');
    const fat = peds.reduce((s2, p) => s2 + resumoPedido(p).faturado, 0);
    return [insumoPorId(t.insumoId)?.nome || '', t.nome, t.cnpj || '', t.uf || '', peds.length, valor, fat, valor - fat];
  });
  exportarPlanilha(`${FORMATO_BASE}-terceiros-${carimboArquivo()}`, [{ nome: 'Terceiros', cabecalho: CAB_TERCEIROS, linhas }]);
}

function planejarImportacaoTerceiros(brutas, { semConsultaCnpj = false } = {}) {
  const mapa = [['insumo', ['insumo']], ['nome', ['terceiro', 'fornecedor', 'nome']], ['cnpj', ['cnpj']], ['uf', ['uf', 'ufemissor', 'ufterceiro']]];
  const linhas = brutas.map((b) => mapearPorApelidos(b, mapa)).filter((l) => l.nome || l.insumo);
  const erros = [];
  const ops = [];
  linhas.forEach((l, i) => {
    if (!l.nome || !l.insumo) { erros.push(`Linha ${i + 2}: falta insumo ou terceiro.`); return; }
    const ins = insumos.find((x) => normalizarTexto(x.nome) === normalizarTexto(l.insumo));
    const existente = ins && terceiros.find((t) => t.insumoId === ins.id && normalizarTexto(t.nome) === normalizarTexto(l.nome));
    const uf = String(l.uf || '').toUpperCase().slice(0, 2);
    const muda = existente && ((l.cnpj && String(l.cnpj) !== existente.cnpj) || (uf && uf !== existente.uf));
    ops.push({ l, ins, existente, uf, acao: existente ? (muda ? 'Atualizar' : 'Sem mudança') : (ins ? 'Criar' : 'Criar (com insumo novo)') });
  });
  const validos = ops.filter((o) => o.acao !== 'Sem mudança');
  return {
    quantidade: validos.length,
    avisos: [erros.length ? criarAlerta({ tipo: 'danger', titulo: 'Linhas ignoradas', mensagem: erros.slice(0, 10).join(' ') }) : null],
    tabela: {
      dados: ops.map((o) => ({ insumo: o.l.insumo, nome: o.l.nome, cnpj: o.l.cnpj || '', uf: o.uf, acao: o.acao })),
      colunas: [{ campo: 'insumo', titulo: 'Insumo' }, { campo: 'nome', titulo: 'Terceiro' }, { campo: 'cnpj', titulo: 'CNPJ' }, { campo: 'uf', titulo: 'UF' }, { campo: 'acao', titulo: 'Ação' }],
    },
    aplicar: () => {
      validos.forEach((o) => {
        if (o.existente) {
          if (o.l.cnpj) o.existente.cnpj = String(o.l.cnpj);
          if (o.uf) o.existente.uf = o.uf;
          return;
        }
        let ins = o.ins || insumos.find((x) => normalizarTexto(x.nome) === normalizarTexto(o.l.insumo));
        if (!ins) { ins = { id: novoIdFD('ins'), nome: String(o.l.insumo), valorTotal: 0, modoProjecao: 'manual', projecao: {} }; insumos.push(ins); }
        terceiros.push({ id: novoIdFD('ter'), insumoId: ins.id, nome: String(o.l.nome), cnpj: o.l.cnpj ? String(o.l.cnpj) : '', uf: o.uf });
      });
      if (!semConsultaCnpj) setTimeout(() => completarUfPorCnpj(terceiros), 0);
      return `${validos.length} terceiro(s)`;
    },
  };
}

function importarTerceiros() {
  abrirImportacaoPlanilha({
    titulo: 'Importar terceiros', cabecalhoModelo: ['Insumo', 'Terceiro', 'CNPJ', 'UF'], nomeModelo: 'modelo-terceiros.csv',
    aoEscolherPdf: async (arquivo) => abrirModalTerceiro(null, '', { arquivoInicial: arquivo }),
    explicacao: 'Colunas usadas: Insumo, Terceiro, CNPJ e UF. Terceiro já existente no mesmo insumo tem CNPJ e UF atualizados; insumo que não existir é criado com valor 0.',

  });
}

function exportarPedidos(lista = pedidos) {

function linhasNfExport(n) {
  const ped = pedidoPorId(n.pedidoId);
  const inicio = [ped?.numero || '', terceiroDoPedido(ped)?.nome || '', insumoDoPedido(ped)?.nome || '', n.numero];
  const dadosNf = [dataTexto(n.data), n.bm ? `BM${n.bm}` : '', vn(n.valor), vn(n.reidi), n.ufOrigem || '', n.ufDestino || '', simNao(n.importado),
    vn(n.difalPerc), vn(n.difalValor), textoGrds(n.grds), simNao(n.eclic), dataTexto(n.eclicData), analisarNota(n).situacao];
  const itens = [
    ...(n.itens || []).map((i) => {
      const pr = produtoPorId(i.produtoId);
      const reidi = pr ? vn(i.quantidade) * Math.max(0, vn(pr.unitSem) - vn(i.valorUnit)) : 0;
      return [pr?.descricao || '(produto removido)', pr?.detalhe || '', pr?.unidade || '', vn(i.quantidade), vn(i.valorUnit), vn(i.quantidade) * vn(i.valorUnit), reidi, 'Não'];
    }),
    ...(n.itensSemVinculo || []).map((i) => [i.descricao, '', '', vn(i.quantidade), vn(i.quantidade) ? (vn(i.valorTotal) / vn(i.quantidade)) : '', vn(i.valorTotal), 0, 'Sim']),
  ];
  const bols = ordenar(boletosDaNota(n.id), 'vencimento', 'asc', 'data').map((b) => [b.numero, b.valor == null ? '' : vn(b.valor), dataTexto(b.vencimento), dataTexto(b.pagamento), statusBoleto(b), textoGrds(b.grds)]);
  const linhas = [];
  for (let j = 0; j < Math.max(1, itens.length, bols.length); j += 1) {
    linhas.push([...inicio, ...(itens[j] || ['', '', '', '', '', '', '', '']), ...dadosNf, ...(bols[j] || ['', '', '', '', '', '']), n.observacoes || '']);
  }
  return linhas;
}

function linhasExportNotas(lista) {
  return ordenar(lista, [{ campo: 'data', direcao: 'asc', tipo: 'data' }, { campo: 'numero', direcao: 'asc' }]).flatMap(linhasNfExport);
}

const MAPA_NOTAS = [
  ['numeroPedido', ['npedido', 'pedido', 'numeropedido', 'npedidodecompra']],
  ['terceiro', ['terceiro', 'fornecedor', 'emitente']],
  ['numero', ['nnf', 'nf', 'numeronf', 'notafiscal', 'numerodanf']],

  ['bm', ['bm', 'boletim', 'boletimdemedicao']],
  ['valor', ['valornf', 'valordanf', 'valor']],
  ['reidi', ['reidi']],
  ['ufOrigem', ['uforigem']],
  ['ufDestino', ['ufdestino']],
  ['importado', ['importado4', 'importado']],
  ['difalPerc', ['difal']],

  ['observacoes', ['observacoes', 'obs']],
  ['itemDescricao', ['descricaodoitem', 'descricao', 'produto', 'item']],
  ['quantidade', ['quantidade', 'qtd']],
  ['valorUnit', ['valorunit', 'valorunitario']],
  ['valorTotalItem', ['valortotalitem']],
  ['eclic', ['lancadanoeclicsimnao', 'lancadanoeclic', 'eclic', 'viaassinadasimnao', 'viaassinada']],
  ['eclicData', ['dataeclic', 'eclicdata', 'viarecebidaem']],
];

function planejarImportacaoNotas(brutas) {
  const linhas = brutas.map((b) => mapearPorApelidos(b, MAPA_NOTAS)).filter((l) => l.numero);
  const erros = [];
  const ignoradas = [];
  const grupos = new Map();
  linhas.forEach((l, i) => {
    const candidatos = pedidos.filter((p) => normalizarTexto(p.numero) === normalizarTexto(l.numeroPedido)
      && (!l.terceiro || normalizarTexto(terceiroDoPedido(p)?.nome) === normalizarTexto(l.terceiro)));
    if (!l.numeroPedido || candidatos.length !== 1) {
      erros.push(`Linha ${i + 2}: ${!l.numeroPedido ? 'sem nº do pedido' : candidatos.length ? 'pedido repetido em terceiros diferentes (informe o Terceiro)' : `pedido ${l.numeroPedido} não cadastrado`}.`);
      return;
    }
    const ped = candidatos[0];
    if (notas.some((n) => n.pedidoId === ped.id && normalizarTexto(n.numero) === normalizarTexto(l.numero))) {
      if (!ignoradas.includes(String(l.numero))) ignoradas.push(String(l.numero));
      return;
    }
    const chave = `${ped.id}|${normalizarTexto(l.numero)}`;
    if (!grupos.has(chave)) grupos.set(chave, { ped, l, itensArquivo: [] });
    if (l.itemDescricao) {
      const qtd = numPlanilha(l.quantidade) ?? 1;
      const total = numPlanilha(l.valorTotalItem);
      const unit = numPlanilha(l.valorUnit) ?? (total != null && qtd ? total / qtd : 0);
      grupos.get(chave).itensArquivo.push({ descricao: String(l.itemDescricao), quantidade: qtd, valorUnit: unit, valorTotal: total ?? qtd * unit });
    }
  });
  const novas = [...grupos.values()].map(({ ped, l, itensArquivo }) => {
    const { itens, semVinculo } = vincularItensNF(ped, itensArquivo);
    const somaItens = itensArquivo.reduce((t, i) => t + vn(i.valorTotal), 0);
    const valor = numPlanilha(l.valor) ?? (somaItens);
    const ufO = String(l.ufOrigem || ped.ufOrigem || '').toUpperCase().slice(0, 2);
    const ufD = String(l.ufDestino || ped.ufDestino || obra.ufObra || '').toUpperCase().slice(0, 2);
    const importado = l.importado != null ? ehSim(l.importado) : Boolean(ped.importado);
    const difalPerc = numPlanilha(l.difalPerc) ?? calcularDifal(ufO, ufD, importado).perc;
    const data = dataPlanilha(l.data);
    const bmLido = l.bm != null ? String(l.bm).replace(/\D/g, '') : '';
    const nf = {
      id: novoIdFD('nf'), pedidoId: ped.id, numero: String(l.numero), data, bm: bmLido || bmPelaData(data), valor,
      reidi: 0, ufOrigem: ufO, ufDestino: ufD, importado, difalPerc,
      difalValor: numPlanilha(l.difalValor) ?? ((valor * difalPerc) / 100),
      itens, itensSemVinculo: semVinculo, grds: lerGrds(l.grds), observacoes: l.observacoes ? String(l.observacoes) : 'Importada de planilha.',
      eclic: (l.eclic != null ? ehSim(l.eclic) : false) || lerGrds(l.grds).length > 0, eclicData: dataPlanilha(l.eclicData),
    };
    /* REIDI da planilha so prevalece quando difere do calculado pelos produtos */
    const reidiPlanilha = numPlanilha(l.reidi);
    nf.reidi = reidiPlanilha ?? reidiDosItens(nf);
    nf.reidiManual = reidiPlanilha != null && nf.itens.length > 0 && Math.abs(reidiPlanilha - reidiDosItens(nf)) > 0.05;
    return nf;
  });
  return {
    quantidade: novas.length,
    avisos: [
      ignoradas.length ? criarAlerta({ tipo: 'info', titulo: 'NFs já lançadas (ignoradas)', mensagem: ignoradas.join(', ') }) : null,
      erros.length ? criarAlerta({ tipo: 'danger', titulo: 'Linhas com problema', mensagem: erros.slice(0, 10).join(' ') }) : null,
    ],
    tabela: {
      dados: novas.map((n) => ({ numero: n.numero, pedido: pedidoPorId(n.pedidoId)?.numero, data: n.data, bm: n.bm ? `BM${n.bm}` : '—', valor: n.valor, itens: n.itens.length, sem: n.itensSemVinculo.length, situacao: analisarNota(n).situacao })),
      colunas: [
        { campo: 'numero', titulo: 'Nº NF' }, { campo: 'pedido', titulo: 'Pedido' }, { campo: 'data', titulo: 'Data', tipo: 'data' }, { campo: 'bm', titulo: 'BM' },
        { campo: 'valor', titulo: 'Valor', tipo: 'moeda', total: 'soma' }, { campo: 'itens', titulo: 'Itens vinculados', tipo: 'numero' }, { campo: 'sem', titulo: 'Sem pedido', tipo: 'numero' },
        { campo: 'situacao', titulo: 'Conferência', render: (v) => criarBadge({ texto: v, variante: VARIANTE_NF[v] }) },
      ],
    },
    novas,
    aplicar: () => { notas.push(...novas); return `${novas.length} NF(s)`; },
  };
}

function planejarImportacaoBoletos(brutas) {
  const mapa = [
    ['numeroNF', ['nnf', 'nf', 'numeronf', 'notafiscal']], ['numeroPedido', ['npedido', 'pedido']], ['terceiro', ['terceiro', 'fornecedor']],
    ['numero', ['ndocboleto', 'ndocumento', 'documento', 'boleto', 'ndoc']], ['valor', ['valor', 'valorboleto']], ['vencimento', ['vencimento']],
    ['pagamento', ['pagamento', 'datapagamento']], ['status', ['status']], ['grds', ['grd', 'ngrd']],
    ['observacoes', ['observacoes', 'obs']],
  ];
  const linhas = brutas.map((b) => mapearPorApelidos(b, mapa)).filter((l) => l.numero || l.numeroNF);
  const erros = [];
  const ignorados = [];
  const novos = [];
  linhas.forEach((l, i) => {
    if (!l.numero || !l.numeroNF) { erros.push(`Linha ${i + 2}: falta nº do boleto ou da NF.`); return; }
    const candidatas = notas.filter((n) => normalizarTexto(n.numero) === normalizarTexto(l.numeroNF)
      && (!l.numeroPedido || normalizarTexto(pedidoPorId(n.pedidoId)?.numero) === normalizarTexto(l.numeroPedido)));
    if (candidatas.length !== 1) { erros.push(`Linha ${i + 2}: NF ${l.numeroNF} ${candidatas.length ? 'existe em mais de um pedido (informe o Nº Pedido)' : 'não lançada'}.`); return; }
    const nf = candidatas[0];
    if (boletos.some((b) => b.notaId === nf.id && normalizarTexto(b.numero) === normalizarTexto(l.numero))
      || novos.some((b) => b.notaId === nf.id && normalizarTexto(b.numero) === normalizarTexto(l.numero))) { ignorados.push(String(l.numero)); return; }
    const pagamento = dataPlanilha(l.pagamento);
    let status = STATUS_BOLETO.find((st) => normalizarTexto(st) === normalizarTexto(l.status || '')) || 'Em aberto';
    if (pagamento && status === 'Em aberto') status = 'Pago';
    novos.push({
      id: novoIdFD('bol'), notaId: nf.id, numero: String(l.numero), valor: numPlanilha(l.valor), vencimento: dataPlanilha(l.vencimento), pagamento, status,
      grds: lerGrds(l.grds), observacoes: l.observacoes ? String(l.observacoes) : '',
    });
  });
  return {
    quantidade: novos.length,
    avisos: [
      ignorados.length ? criarAlerta({ tipo: 'info', titulo: 'Boletos já lançados (ignorados)', mensagem: ignorados.join(', ') }) : null,
      erros.length ? criarAlerta({ tipo: 'danger', titulo: 'Linhas com problema', mensagem: erros.slice(0, 10).join(' ') }) : null,
    ],
    tabela: {
      dados: novos.map((b) => ({ numero: b.numero, nf: notaPorId(b.notaId)?.numero, valor: b.valor, vencimento: b.vencimento, status: statusBoleto(b) })),
      colunas: [
        { campo: 'numero', titulo: 'Boleto' }, { campo: 'nf', titulo: 'NF' }, { campo: 'valor', titulo: 'Valor', tipo: 'moeda', total: 'soma' },
        { campo: 'vencimento', titulo: 'Vencimento', tipo: 'data' }, { campo: 'status', titulo: 'Status' },
      ],
    },
    aplicar: () => { boletos.push(...novos); return `${novos.length} boleto(s)`; },
  };
}
