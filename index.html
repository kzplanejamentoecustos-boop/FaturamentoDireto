    texto: 'Controlador',
    onClick: () => abrirPainelControlador({
      sessao,
      titulo: `Controlador — ${usuario ? usuario.nome : NOME_PERFIL[perfil]}`,
      prefixoArquivo: FORMATO_BASE,
      obterBaseParaSalvar,
      armazenamento: nuvem,
      administrador: ADMINISTRADOR,
      onEditarCabecalho: () => abrirEditorCabecalho({
        identidade,
        onSalvar: (nova) => {
          identidade = { ...identidade, ...nova };
          app.cabecalho.definirTitulo(identidade.titulo);
          app.cabecalho.definirSubtitulo(subtituloCabecalho());
          app.cabecalho.definirLogo(identidade.logo || MARCA.logo);
          sessao.marcarAlteracao();
          toast.sucesso('Cabeçalho atualizado', 'Salve a base para gravar a alteração.');
        },
      }),
      onSair: sair,
      abasExtras: [{ id: 'relatorios', texto: 'Gerar relatórios', conteudo: abaGerarRelatorios }],
    }),
  });

  const app = montarAplicativo({
    marca: { logo: identidade.logo || MARCA.logo, titulo: identidade.titulo, subtitulo: baseDemonstrativa ? 'Dados fictícios' : 'Faturamento direto' },
    cabecalho: {
      titulo: identidade.titulo,
      subtitulo: subtituloCabecalho(),
      acoes: [
        { texto: 'Ajuda', icone: 'info', variante: 'outline', onClick: abrirAjuda },
        botaoControlador,
      ],
    },
    menu: {
      secoes: [
        {
          titulo: 'Principal',
          itens: [
            { id: 'painel', texto: 'Dashboard FD', icone: 'painel' },
            { id: 'insumos', texto: 'Insumos', icone: 'moeda' },
            { id: 'base', texto: 'Base de faturamento', icone: 'tabela' },
            { id: 'tendencia', texto: 'Tendência', icone: 'grafico' },
            { id: 'importar', texto: 'Importar / Exportar', icone: 'upload' },
          ],
        },
        {
          titulo: 'Configurações',
          itens: [
            {
              id: 'grupo-config', texto: 'Obra e referência', icone: 'configuracao',
              itens: [
                { id: 'obra', texto: 'Obra e aditivos' },
                { id: 'aliquotas', texto: 'Tabela ICMS / DIFAL' },
              ],
            },
          ],
        },
      ],
      rodape: 'Faturamento Direto v1.68 · CTC App Standard v1.6',
    },
    paginas: {
      painel: { titulo: 'Dashboard FD', caminho: ['Principal'], render: paginaPainel },
      tendencia: { titulo: 'Tendência', caminho: ['Principal'], render: paginaTendencia },
      obra: { titulo: 'Obra e aditivos', caminho: ['Configurações'], render: paginaObra },
      insumos: {
        titulo: 'Insumos', caminho: ['Principal'], render: paginaInsumos,
        acoes: [
          { texto: 'Importar', icone: 'upload', variante: 'ghost', tamanho: 'sm', apenasEdicao: true, titulo: 'Importar insumos (Excel/CSV)', onClick: importarInsumos },
          { texto: 'Exportar', icone: 'download', variante: 'ghost', tamanho: 'sm', titulo: 'Exportar insumos (Excel)', onClick: () => exportarInsumos() },
          { texto: 'Novo insumo', icone: 'mais', variante: 'primary', apenasEdicao: true, onClick: () => abrirModalInsumo() },
        ],
      },
      base: { titulo: 'Base de faturamento — terceiros, pedidos, NFs e boletos', caminho: ['Principal'], render: paginaBase },
      aliquotas: { titulo: 'Tabela ICMS / DIFAL', caminho: ['Configurações'], render: paginaAliquotas },
      importar: { titulo: 'Importar / Exportar — Excel e base completa', caminho: ['Principal'], render: paginaImportarExportar },
    },
    paginaInicial: 'painel',
    somenteLeitura: perfil === 'visualizador',
  });
  appAtual = app;

  toast.info(`Bem-vindo, ${usuario ? usuario.nome : NOME_PERFIL[perfil]}`,
    perfil === 'visualizador' ? 'Acesso somente para visualização.' : 'Lembre-se de salvar a base em Controlador > Ferramentas.');

  /* Exposto apenas para inspecao no console do navegador durante testes */
  window.ctcFaturamento = { app, sessao, obterBaseParaSalvar };
}

/* Inicio: toda abertura passa pela tela de entrada */
const telaEntrada = criarTelaEntrada({
  logo: MARCA.logo,
  titulo: MARCA.titulo,
  subtitulo: 'Controle de faturamento direto — escolha como deseja acessar',
  formato: FORMATO_BASE,
  prefixoArquivo: FORMATO_BASE,
  administrador: ADMINISTRADOR,
  baseInicial: criarBaseDemonstrativa(),
  armazenamento: nuvem,
  /* base em branco do botao "Iniciar controle": mesma estrutura, sem nenhum registro */
  criarBaseNova: () => ({ ...criarBaseVazia(FORMATO_BASE), dados: dadosVazios() }),
  textoBaseInicial: 'Nenhuma base importada: será usada a base de demonstração com dados fictícios (controlador fictício: controlador.demo / demo123).',
  rodape: 'CTC App Standard v1.6 — sem servidor: os perfis controlam o uso, não substituem segurança de rede.',
  onEntrar: abrirAplicativo,
});

function mostrarEntrada() {
  telaEntrada.mostrar();
}

mostrarEntrada();

})();
</script>
</body>
</html>
