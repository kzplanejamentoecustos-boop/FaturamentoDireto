const filtrosColunaNotas = {};     // filtro digitado em cada coluna (como o filtro do Excel)

/** Saldo de cada produto apos cada NF, em ordem de data (contratado - acumulado ate a NF). */
function saldosProdutoPorNota() {
  const mapa = new Map();
  const porProduto = new Map();
  ordenar(notas, [{ campo: 'data', direcao: 'asc', tipo: 'data' }, { campo: 'numero', direcao: 'asc' }]).forEach((nf) => {
    (nf.itens || []).forEach((it) => {
      const pr = produtoPorId(it.produtoId);
      if (!pr) return;
      const acum = (porProduto.get(pr.id) || 0) + vn(it.quantidade);
      porProduto.set(pr.id, acum);
      mapa.set(`${nf.id}|${pr.id}`, { acumulado: acum, saldo: vn(pr.quantidade) - acum });
    });
  });
  return mapa;
}

/** Todas as linhas de item (uma por produto de cada NF), sem filtro. */
function itensDeNotas() {
  const saldos = saldosProdutoPorNota();
  const itens = [];
  notas.forEach((nf) => {
    const ped = pedidoPorId(nf.pedidoId);
    const ter = terceiroDoPedido(ped);
    const ins = insumoDoPedido(ped);
    const bols = ordenar(boletosDaNota(nf.id), 'vencimento', 'asc', 'data');
    const base = { nf, ped, ter, ins, bols };
    const lista = [
      ...(nf.itens || []).map((it) => {
        const pr = produtoPorId(it.produtoId);
        const qtd = vn(it.quantidade);
        const unit = vn(it.valorUnit);
        const sal = pr ? saldos.get(`${nf.id}|${pr.id}`) : null;
        return {
          ...base, tipo: 'item', pr, produto: pr?.descricao || '(produto removido)', detalhe: pr?.detalhe || '', un: pr?.unidade || '',
          qtd, unit, total: qtd * unit, reidi: pr ? qtd * Math.max(0, vn(pr.unitSem) - unit) : 0, saldo: sal ? sal.saldo : null,
        };
      }),
      ...(nf.itensSemVinculo || []).map((it) => ({
        ...base, tipo: 'sem', pr: null, produto: it.descricao, detalhe: 'item sem produto no pedido', un: '',
        qtd: vn(it.quantidade), unit: vn(it.quantidade) ? vn(it.valorTotal) / vn(it.quantidade) : null, total: vn(it.valorTotal), reidi: 0, saldo: null,
      })),
    ];
    if (!lista.length) lista.push({ ...base, tipo: 'vazia', pr: null, produto: 'NF sem produtos marcados', detalhe: 'marque os produtos na NF', un: '', qtd: null, unit: null, total: vn(nf.valor), reidi: vn(nf.reidi), saldo: null });
    itens.push(...lista);
  });
  return itens;
}
const chaveNomeProduto = (l) => normalizarTexto(l.produto || '');
const statusBoletosTexto = (l) => (l.bols.length ? l.bols.map((x) => prazoBoleto(x)).join(' ') : 'Sem boleto');

/* ---- Fichas (mini-dashboard) de produto, terceiro e insumo, com exportacao ---- */

/** Consumo por mes (data da NF) de um conjunto de itens. */
function consumoPorMes(itens) {
  const m = new Map();
  itens.forEach((l) => {
    const k = String(l.nf.data || '').slice(0, 7) || 'sem data';
    const x = m.get(k) || { qtd: 0, valor: 0, nfs: new Set() };
    x.qtd += vn(l.qtd); x.valor += vn(l.total); x.nfs.add(l.nf.id);
    m.set(k, x);
  });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([k, x]) => ({ mes: k, rotulo: k === 'sem data' ? k : formatarData(`${k}-01`, 'mes-ano'), qtd: x.qtd, valor: x.valor, nfs: x.nfs.size }));
}

function dadosFicha(tipo, chave) {
  const todos = itensDeNotas();
  const cab = (titulo, subtitulo) => ({ titulo, subtitulo });
  if (tipo === 'produto') {
    const itens = todos.filter((l) => l.pr && chaveNomeProduto(l) === chave);
    const nome = itens[0]?.produto || produtos.find((p) => normalizarTexto(p.descricao) === chave)?.descricao || chave;
    const prods = produtos.filter((p) => normalizarTexto(p.descricao) === chave);
    const un = prods[0]?.unidade || '';
    const contratado = prods.reduce((t, p) => t + vn(p.quantidade), 0);
    const faturado = prods.reduce((t, p) => t + analisarProduto(p).qtdFaturada, 0);
    const valor = itens.reduce((t, l) => t + l.total, 0);
    const reidi = itens.reduce((t, l) => t + l.reidi, 0);
    const porData = ordenar(itens, [{ campo: 'nf.data', direcao: 'asc', tipo: 'data' }, { campo: 'nf.numero', direcao: 'asc' }]);
    let acum = 0;
    return {
      ...cab(`Produto: ${nome}`, `${prods.length} pedido(s) · unidade de referência: ${un || '—'}`),
      kpis: [
        { rotulo: 'Contratado', valor: `${numExato(contratado)} ${un}`.trim(), sub: `${prods.length} pedido(s)` },
        { rotulo: 'Consumido (NFs)', valor: `${numExato(faturado)} ${un}`.trim(), sub: formatarPercentual(contratado ? (faturado / contratado) * 100 : 0, { casas: 2 }), progresso: contratado ? (faturado / contratado) * 100 : 0 },
        { rotulo: 'Saldo', valor: `${numExato(contratado - faturado)} ${un}`.trim(), sub: contratado - faturado < -0.000001 ? 'acima do contratado' : 'a faturar' },
        { rotulo: 'Valor faturado', valor: formatarMoeda(valor), sub: `REIDI ${formatarMoeda(reidi)} · ${new Set(itens.map((l) => l.nf.id)).size} NF(s)` },
      ],
      tabelas: [
        {
          titulo: 'Pedidos com este produto',
          colunas: ['Pedido', 'Terceiro', 'Emissão', `Contratado (${un})`, `Faturado (${un})`, `Saldo (${un})`, 'Unit. COM REIDI', 'Valor contratado', 'Valor faturado'],
          linhas: prods.map((p) => {
            const a = analisarProduto(p);
            const ped = pedidoPorId(p.pedidoId);
            const fatR = itens.filter((l) => l.pr?.id === p.id).reduce((t, l) => t + l.total, 0);
            return [ped?.numero || '—', terceiroDoPedido(ped)?.nome || '—', dataTexto(ped?.dataEmissao), vn(p.quantidade), a.qtdFaturada, vn(p.quantidade) - a.qtdFaturada, unitComEfetivo(p), vn(p.quantidade) * unitComEfetivo(p), fatR];
          }),
        },
        {
          titulo: 'Notas fiscais em que o produto foi faturado (ordem de data)',
          colunas: ['Emissão', 'NF', 'Pedido', 'BM', `Qtd (${un})`, `Acumulado (${un})`, `Saldo do pedido após NF (${un})`, 'Unit. na NF', 'Valor do item', 'REIDI do item', 'Boleto'],
          linhas: porData.map((l) => { acum += vn(l.qtd); return [dataTexto(l.nf.data), l.nf.numero, l.ped?.numero || '', l.nf.bm ? `BM${l.nf.bm}` : '', l.qtd, acum, l.saldo ?? '', l.unit, l.total, l.reidi, statusBoletosTexto(l)]; }),
        },
        { titulo: 'Consumo por mês', colunas: ['Mês', `Quantidade (${un})`, 'Valor', 'NFs'], linhas: consumoPorMes(itens).map((x) => [x.rotulo, x.qtd, x.valor, x.nfs]), barra: 2 },
      ],
    };
  }
  if (tipo === 'terceiro') {
    const ter = terceiroPorId(chave);
    const itens = todos.filter((l) => l.ter?.id === chave);
    const peds = pedidos.filter((p) => p.terceiroId === chave);
    const valorPed = somar(peds, 'valor');
    const nfs = [...new Set(itens.map((l) => l.nf))];
    const fat = somar(nfs, 'valor');
    const bols = nfs.flatMap((nf) => boletosDaNota(nf.id));
    const abertos = bols.filter((x) => ['Em aberto', 'Vencido', 'Em contestação'].includes(statusBoleto(x)));
    const porProd = new Map();
    itens.filter((l) => l.tipo !== 'vazia').forEach((l) => {
      const k = chaveNomeProduto(l);
      const x = porProd.get(k) || { nome: l.produto, un: l.un, qtd: 0, valor: 0, reidi: 0 };
      x.qtd += vn(l.qtd); x.valor += l.total; x.reidi += l.reidi;
      porProd.set(k, x);
    });
    return {
      ...cab(`Terceiro: ${ter?.nome || '—'}`, `${ter?.cnpj ? `CNPJ ${ter.cnpj} · ` : ''}${ter?.uf || ''} · ${insumoPorId(ter?.insumoId)?.nome || ''}`),
      kpis: [
        { rotulo: 'Comprometido em pedidos', valor: formatarMoeda(valorPed), sub: `${peds.length} pedido(s)` },
        { rotulo: 'Faturado (NFs)', valor: formatarMoeda(fat), sub: formatarPercentual(valorPed ? (fat / valorPed) * 100 : 0, { casas: 2 }), progresso: valorPed ? (fat / valorPed) * 100 : 0 },
        { rotulo: 'Saldo dos pedidos', valor: formatarMoeda(valorPed - fat), sub: `REIDI nas NFs ${formatarMoeda(somar(nfs, 'reidi'))}` },
        { rotulo: 'Boletos', valor: `${bols.length}`, sub: `${abertos.length} em aberto · ${formatarMoeda(somar(abertos, 'valor'))}` },
      ],
      tabelas: [
        {
          titulo: 'Pedidos',
          colunas: ['Pedido', 'Emissão', 'Valor', 'Faturado', 'Saldo', '% faturado', 'NFs'],
          linhas: peds.map((p) => { const r = resumoPedido(p); return [p.numero, dataTexto(p.dataEmissao), vn(p.valor), r.faturado, r.saldo, r.perc, r.nfs.length]; }),
        },
        { titulo: 'Produtos faturados', colunas: ['Produto', 'Un', 'Quantidade', 'Valor', 'REIDI'], linhas: [...porProd.values()].map((x) => [x.nome, x.un, x.qtd, x.valor, x.reidi]) },
        { titulo: 'Faturamento por mês', colunas: ['Mês', 'Valor', 'NFs'], linhas: consumoPorMes(itens).map((x) => [x.rotulo, x.valor, x.nfs]), barra: 1 },
      ],
    };
  }
  /* insumo */
  const ins = insumoPorId(chave);
  const itens = todos.filter((l) => l.ins?.id === chave);
  const r = ins ? resumoInsumo(ins) : { vigente: 0, comprometido: 0, faturado: 0, saldoFaturar: 0 };
  const ters = terceiros.filter((t) => t.insumoId === chave);
  const porProd = new Map();
  itens.filter((l) => l.tipo !== 'vazia').forEach((l) => {
    const k = chaveNomeProduto(l);
    const x = porProd.get(k) || { nome: l.produto, un: l.un, qtd: 0, valor: 0 };
    x.qtd += vn(l.qtd); x.valor += l.total;
    porProd.set(k, x);
  });
  return {
    ...cab(`Insumo: ${ins?.nome || '—'}`, `${ters.length} terceiro(s) · ${pedidos.filter((p) => insumoDoPedido(p)?.id === chave).length} pedido(s)`),
    kpis: [
      { rotulo: 'Previsto (vigente)', valor: formatarMoeda(r.vigente) },
      { rotulo: 'Comprometido', valor: formatarMoeda(r.comprometido), sub: formatarPercentual(r.vigente ? (r.comprometido / r.vigente) * 100 : 0, { casas: 2 }), progresso: r.vigente ? (r.comprometido / r.vigente) * 100 : 0 },
      { rotulo: 'Faturado (NFs)', valor: formatarMoeda(r.faturado), sub: formatarPercentual(r.vigente ? (r.faturado / r.vigente) * 100 : 0, { casas: 2 }), progresso: r.vigente ? (r.faturado / r.vigente) * 100 : 0 },
      { rotulo: 'Saldo a faturar', valor: formatarMoeda(r.saldoFaturar) },
    ],
    tabelas: [
      {
        titulo: 'Terceiros',
        colunas: ['Terceiro', 'UF', 'Pedidos', 'Valor em pedidos', 'Faturado', 'Saldo'],
        linhas: ters.map((t) => { const ps = pedidos.filter((p) => p.terceiroId === t.id); const v = somar(ps, 'valor'); const f = ps.reduce((s2, p) => s2 + resumoPedido(p).faturado, 0); return [t.nome, t.uf || '', ps.length, v, f, v - f]; }),
      },
      { titulo: 'Produtos faturados', colunas: ['Produto', 'Un', 'Quantidade', 'Valor'], linhas: [...porProd.values()].map((x) => [x.nome, x.un, x.qtd, x.valor]) },
      { titulo: 'Faturamento por mês', colunas: ['Mês', 'Valor', 'NFs'], linhas: consumoPorMes(itens).map((x) => [x.rotulo, x.valor, x.nfs]), barra: 1 },
    ],
  };
}

/** Formata um valor de tabela de ficha conforme o nome da coluna. */
function valorFichaTexto(col, v) {
  if (v == null || v === '') return '—';
  if (typeof v !== 'number') return String(v);
  const t = normalizarTexto(col);
  if (t.includes('%')) return formatarPercentual(v, { casas: 2 });
  if (/qtd|quantidade|contratado \(|faturado \(|saldo \(|acumulado|saldo do pedido apos|^nfs$|^pedidos$/.test(t)) return numExato(v);
  return formatarMoeda(v);
}

function abrirFicha(tipo, chave) {
  const f = dadosFicha(tipo, chave);
  const conteudo = h('div', { class: 'ctc-stack' },
    f.subtitulo ? h('div', { class: 'ctc-text-sm ctc-text-muted' }, f.subtitulo) : null,
    h('div', { class: 'ctc-grid ctc-grid--4' }, ...f.kpis.map((k) => criarKpi({
      rotulo: k.rotulo, valor: k.valor, sub: k.sub,
      progresso: k.progresso != null ? { percentual: Math.min(100, k.progresso), variante: k.progresso > 100.001 ? 'danger' : null } : undefined,
    }).elemento)),
    ...f.tabelas.map((tb) => {
      const maior = tb.barra != null ? Math.max(1, ...tb.linhas.map((l) => vn(l[tb.barra]))) : 0;
      return criarPainel({
        titulo: tb.titulo, icone: 'tabela', semEspaco: true,
        conteudo: criarTabela({
          compacta: true, grade: true, listrada: true, altura: 'auto',
          dados: tb.linhas.map((l) => Object.fromEntries(l.map((v, i) => [`c${i}`, v]))),
          colunas: tb.colunas.map((c, i) => ({
            campo: `c${i}`, titulo: c,
            render: (v) => {
              const texto = valorFichaTexto(c, v);
              if (tb.barra === i && typeof v === 'number') {
                return h('div', { class: 'ctc-stack' }, h('span', { class: 'ctc-num' }, texto), criarProgresso({ percentual: (v / maior) * 100, tamanho: 'sm', rotulo: c }));
              }
              return typeof v === 'number' ? h('span', { class: `ctc-num${v < -0.000001 ? ' ctc-text-danger' : ''}` }, texto) : texto;
            },
          })),
          vazio: { titulo: 'Sem dados' },
        }).elemento,
      }).elemento;
    }));
  const modal = criarModal({
    titulo: f.titulo, tamanho: 'xl', destruirAoFechar: true, conteudo,
    acoes: [
      { texto: 'Exportar Excel', icone: 'download', variante: 'outline', fechar: false, onClick: () => exportarFichaExcel(f) },
      { texto: 'Exportar PDF', icone: 'download', variante: 'outline', fechar: false, onClick: () => exportarFichaPdf(f) },
      { texto: 'Fechar', variante: 'primary' },
    ],
  });
  modal.abrir();
}

function exportarFichaExcel(f) {
  const nome = chaveColuna(f.titulo).slice(0, 40);
  exportarPlanilha(`ficha-${nome}-${carimboArquivo()}`, [
    { nome: 'Resumo', cabecalho: ['Indicador', 'Valor', 'Detalhe'], linhas: f.kpis.map((k) => [k.rotulo, k.valor, k.sub || '']), descricao: f.titulo },
    ...f.tabelas.map((tb) => ({ nome: tb.titulo.slice(0, 31), cabecalho: tb.colunas, linhas: tb.linhas })),

function exportarFichaPdf(f) {
  const tabelaHtml = (tb) => `<table class="nf-tab" data-dividir><thead><tr><th class="cab-th" colspan="${tb.colunas.length}">${esc(tb.titulo)}<span class="cont"></span></th></tr>

    ${tb.linhas.length ? tb.linhas.map((l) => `<tbody><tr>${l.map((v, i) => `<td class="${i ? '' : 'e'}">${esc(valorFichaTexto(tb.colunas[i], v))}</td>`).join('')}</tr></tbody>`).join('') : `<tbody><tr><td class="e" colspan="${tb.colunas.length}">Sem dados</td></tr></tbody>`}</table>`;
  const d = dadosRelatorio(null);
  const u = [
    `<div data-cabecalho="nao">${topoRelClienteHtml(d).replace('Relatório — Faturamento Direto', esc(f.titulo))}</div>`,
    `<div class="nf-grade" style="grid-template-columns:repeat(4,1fr)">${f.kpis.map((k) => `<div class="nf-card"><div class="tit">${esc(k.rotulo)}</div><div class="destaque">${esc(k.valor)}</div>${k.sub ? `<div class="lin"><span>${esc(k.sub)}</span></div>` : ''}</div>`).join('')}</div>`,
    ...f.tabelas.map(tabelaHtml),
  ];
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${esc(f.titulo)}</title>
<style>${CSS_REL_CLIENTE}${CSS_PDF_NF}${BARRA_IMPRESSAO_CSS}</style></head><body class="nf-doc">
${barraImpressao('Ficha — use "Salvar como PDF" na janela de impressão (A4 retrato).')}
<div class="doc"><div id="paginas"></div><div id="fonte">${u.join('')}</div></div></body></html>`;
  const agora = agoraRel();
  abrirDocumentoImpressao(html, {
    aoCarregar: (doc) => paginarRelatorio(doc, {
      alturaUtilMm: 274, classeFolha: 'retrato',
      titulo: `<span><b>${esc(f.titulo)}</b></span><span>${esc(obra.nome || '')}</span>`,
      rodape: `${esc(obra.nome || 'Obra')} · ${esc(f.titulo)} · emitido em ${agora.data}, ${agora.hora}`,
    }),
  });
}

/* ---- A grade ---- */

function secaoNotasBoletos() {
  /*
   * Cada opcao do seletor e uma BASE propria, em colunas (como uma planilha):
   *  Notas (1 linha por NF) · Produtos das notas (1 por produto de cada NF) · Boletos (1 por boleto)
   *  · Terceiros (1 por fornecedor) · Insumos (1 por atividade). Todas com filtro por coluna,
   *  ordenacao pelo titulo, cabecalho e totais fixos e exportacao do que esta na tela.
   */
  const base = 'tudo';
  const cfg = BASES_NOTAS[base]();
  const filtros = filtrosColunaNotas[base] || (filtrosColunaNotas[base] = {});
  const ordem = ordemColunaNotas[base] || (ordemColunaNotas[base] = { ...cfg.ordem });
  const colunas = cfg.colunas;
  const corpo = h('tbody', {});
  const rodape = h('tfoot', {});
  const plural = (q, s1, sN) => `${q} ${q === 1 ? s1 : sN}`;
  let estadoAtual = { filtros: filtroBase };
  let visiveis = [];
  const textoDe = (c, r) => {
    if (c.texto) return c.texto(r);
    const v = c.valor(r);
    if (v == null || v === '') return '';
    if (c.tipo === 'moeda') return formatarMoeda(v);
    if (c.tipo === 'numero') return numExato(v);
    if (c.tipo === 'perc') return formatarPercentual(v, { casas: 2 });
    if (c.tipo === 'data') return formatarData(v);
    return String(v);
  };

  function filtrar(estado) {
    const f = estado.filtros || {};
    const termo = normalizarTexto(estado.busca || '');
    let linhas = cfg.linhas().filter((r) => {
      if (f.insumo && cfg.insumoDe && cfg.insumoDe(r) !== f.insumo) return false;
      if (f.terceiro && cfg.terceiroDe && cfg.terceiroDe(r) !== f.terceiro) return false;
      if (termo && !normalizarTexto(colunas.map((c) => textoDe(c, r)).join(' ')).includes(termo)) return false;
      return colunas.every((c) => {
        const txt = normalizarTexto(textoDe(c, r));
        if (filtros[`${c.id}__sel`] && txt !== normalizarTexto(filtros[`${c.id}__sel`])) return false;
        return !filtros[c.id] || txt.includes(normalizarTexto(filtros[c.id]));
      });
    });
    const col = ordem.coluna ? colunas.find((c) => c.id === ordem.coluna) : null;
    if (col) {
      const chave = (r) => {
        const v = col.valor(r);
        if (col.tipo === 'data') return v ? String(v) : '';
        return typeof v === 'number' ? v : normalizarTexto(String(v ?? ''));
      };
      linhas = linhas.slice().sort((a, b) => {
        const x = chave(a); const y = chave(b);
        const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR', { numeric: true });
        return ordem.direcao === 'desc' ? -r : r;
      });
    }
    return linhas;
  }

  function celula(c, r, i) {
    const classes = [c.tipo && c.tipo !== 'texto' && c.tipo !== 'data' && c.tipo !== 'badge' ? 'ctc-col--num' : '', i === 0 ? 'ctc-col--sticky' : '', c.forte ? 'ctc-text-strong' : '', c.fraco ? 'ctc-text-muted' : '']
      .filter(Boolean).join(' ') || null;
    if (c.render) return h('td', { class: classes }, c.render(r));
    const v = c.valor(r);
    const negativo = typeof v === 'number' && v < -0.000001 && c.alertaNegativo;
    return h('td', { class: [classes, negativo ? 'ctc-text-danger' : ''].filter(Boolean).join(' ') || null }, textoDe(c, r));
  }

  function desenhar(estado = estadoAtual) {
    estadoAtual = estado;
    visiveis = filtrar(estado);
    corpo.replaceChildren(...(visiveis.length
      ? visiveis.map((r) => h('tr', { onClick: cfg.aoClicar ? () => cfg.aoClicar(r) : null, class: cfg.variante ? cfg.variante(r) : null, title: cfg.aoClicar ? 'Abrir' : null },
        ...colunas.map((c, i) => celula(c, r, i)), h('td', {}, ...(cfg.acoes ? cfg.acoes(r) : []))))
      : [h('tr', {}, h('td', { colspan: colunas.length + 1, class: 'ctc-text-subtle' }, 'Nenhuma linha com estes filtros.'))]));
    rodape.replaceChildren(h('tr', {}, ...colunas.map((c, i) => {
      if (i === 0) return h('td', { class: 'ctc-col--sticky' }, `Total · ${plural(visiveis.length, cfg.unidade[0], cfg.unidade[1])}`);
      if (c.total) return h('td', { class: 'ctc-col--num' }, c.tipo === 'moeda' ? formatarMoeda(visiveis.reduce((t, r) => t + vn(c.valor(r)), 0)) : numExato(visiveis.reduce((t, r) => t + vn(c.valor(r)), 0)));
      if (c.totalPorNota) {
        const vistas = new Set();
        const soma = visiveis.reduce((t, r) => { if (vistas.has(r.nf.id)) return t; vistas.add(r.nf.id); return t + vn(c.valor(r)); }, 0);
        return h('td', { class: 'ctc-col--num' }, formatarMoeda(soma));
      }
      return h('td', {});
    }), h('td', {})));
    definirMetaBase(`${plural(visiveis.length, cfg.unidade[0], cfg.unidade[1])}`);
  }

  /* cabecalho fixo: titulo (clique ordena) + lista de valores (selecao) + filtro digitado */
  const todasLinhas = cfg.linhas();
  const cabecalho = h('tr', {}, ...colunas.map((c, i) => {
    let campo = null;
    let selecao = null;
    if (!c.opcoes && !c.semFiltro && (!c.tipo || c.tipo === 'texto' || c.tipo === 'data')) {
      const valores = [...new Set(todasLinhas.map((r) => textoDe(c, r)).filter((v) => v !== ''))].sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true })).slice(0, 300);
      selecao = h('select', { class: 'ctc-select ctc-select--sm', 'aria-label': `Selecionar ${c.titulo}` },
        h('option', { value: '' }, '(todos)'), ...valores.map((v) => h('option', { value: v, selected: filtros[`${c.id}__sel`] === v ? true : null }, v)));
      selecao.addEventListener('change', () => { filtros[`${c.id}__sel`] = selecao.value; desenhar(); });
      selecao.addEventListener('click', (e) => e.stopPropagation());
    }

/**
 * Linhas da base "tudo" (mesma montagem da exportacao em Excel): por NF, linha j = produto j +
 * boleto j; os dados da NF se repetem em todas as linhas dela.
 */
function linhasBaseTudo() {
  const porNf = new Map();
  itensDeNotas().forEach((l) => { if (!porNf.has(l.nf.id)) porNf.set(l.nf.id, []); porNf.get(l.nf.id).push(l); });
  const linhas = [];
  ordenar([...porNf.values()], [{ campo: '0.nf.data', direcao: 'asc', tipo: 'data' }, { campo: '0.nf.numero', direcao: 'asc' }]).forEach((its) => {
    const { nf, ped, ter, ins, bols } = its[0];
    const reais = its.filter((l) => l.tipo !== 'vazia');
    for (let j = 0; j < Math.max(1, reais.length, bols.length); j += 1) {
      const it = reais[j] || null;
      linhas.push({ nf, ped, ter, ins, it, bol: bols[j] || null, primeira: j === 0, nBols: bols.length, semProdutos: !reais.length });
    }
  });
  return linhas;
}

/* =============================================================================
   09b. BASE UNICA: TERCEIROS, PEDIDOS, NOTAS E BOLETOS
   Uma pagina com filtros comuns (busca, insumo, terceiro) e uma aba por cadastro.
   Cada aba mantem todas as colunas, filtros proprios e acoes de antes.
   ========================================================================== */

let abaBase = 'geral';
let filtroBase = { insumo: '', terceiro: '' };
let definirMetaBase = () => {};

const SECOES_BASE = [
  /* paleta forte e neutra: cabecalhos neutros; a hierarquia aparece nas faixas das tabelas */
  { id: 'geral', texto: 'Visão geral', montar: () => secaoGeral(), contar: () => insumos.length },
  { id: 'terceiros', texto: 'Terceiros', montar: () => secaoTerceiros(), contar: () => terceiros.length },
  { id: 'pedidos', texto: 'Pedidos e produtos', montar: () => secaoPedidosProdutos(), contar: () => pedidos.length },
  { id: 'notas', texto: 'Notas e boletos', montar: () => secaoNotasBoletos(), contar: () => notas.length },
];

function irParaBase(aba) {
  abaBase = aba;
  if (appAtual) appAtual.navegar('base');
}

/* ---- Visao geral: insumo > terceiro > pedido > NF > boleto ---- */

function situacaoPedido(r) {
  if (r.perc >= 99.995) return 'Esgotado';
  if (r.perc >= 80) return 'Crítico';
  return 'Normal';
}
const VARIANTE_SITUACAO = { Normal: 'success', Crítico: 'warning', Esgotado: 'danger' };

/** Aviso de prazo do boleto em aberto: vencido ou vence em ate 2 dias. */
function prazoBoleto(b) {
  const st = statusBoleto(b);
  if (st !== 'Em aberto' || !b.vencimento) return st;
  const dias = Math.round((paraData(b.vencimento) - paraData(hojeIso())) / 86400000);
  return dias <= 2 ? 'Vence em até 2 dias' : 'A vencer';
}
const VARIANTE_PRAZO = { ...VARIANTE_BOLETO, 'Vence em até 2 dias': 'warning', 'A vencer': 'info' };

let mesEstimadoGeral = '';

function mesEstimadoAtual() {
  const meses = mesesObra();
  if (!meses.length) return '';
  if (meses.includes(mesEstimadoGeral)) return mesEstimadoGeral;
  const hoje = mesHoje();
  if (hoje < meses[0]) return meses[0];
  if (hoje > meses[meses.length - 1]) return meses[meses.length - 1];
  return hoje;
}

/* ---- Visao geral: tabela unica linha x coluna ---- */

/**
 * Uma linha por boleto (ou por NF sem boleto, pedido sem NF, terceiro sem pedido,
 * insumo sem terceiro). Os textos (insumo, terceiro, pedido, NF) aparecem em todas as
 * linhas para busca e filtro; os VALORES do insumo, do pedido e da NF aparecem so na
 * primeira linha de cada um, para os totais nao somarem em dobro.
 */
function linhasVisaoGeral() {
  const linhas = [];
  const codigos = codigosHierarquia();
  const cod = (id) => codigos.get(id) || { codigo: '', ordem: '' };
  const idxMes = mesesObra().indexOf(mesEstimadoAtual());
  ordenar(insumos, 'nome').forEach((ins) => {
    let insPrimeira = true;
    const doInsumo = () => {
      const r = insPrimeira
        ? { valorInsumo: valorVigente(ins), estimadoMes: idxMes >= 0 ? previstoMensal(ins)[idxMes] : null, insPrimeira: true }
        : { valorInsumo: null, estimadoMes: null, insPrimeira: false };
      insPrimeira = false;
      return r;
    };
    const ters = ordenar(terceiros.filter((t) => t.insumoId === ins.id), 'nome');
    const baseIns = { _ins: ins, insumo: ins.nome, codIns: cod(ins.id).codigo, ...cod(ins.id) };
    if (!ters.length) { linhas.push({ ...baseIns, ...doInsumo(), terceiro: '', nivel: 'Insumo sem terceiro' }); return; }
    ters.forEach((ter) => {
      const peds = pedidos.filter((p) => p.terceiroId === ter.id)
        .sort((x, y) => String(x.dataEmissao).localeCompare(String(y.dataEmissao)) || String(x.numero).localeCompare(String(y.numero)));
      const valorTer = somar(peds, 'valor');
      const fatTer = peds.reduce((t, p) => t + resumoPedido(p).faturado, 0);
      let terPrimeira = true;
      const doTerceiro = () => {
        const v = terPrimeira
          ? { pedidosTer: peds.length, valorTer, saldoTer: valorTer - fatTer, terPrimeira: true }
          : { pedidosTer: null, valorTer: null, saldoTer: null, terPrimeira: false };
        terPrimeira = false;
        return v;
      };
      const baseTer = { ...baseIns, _ter: ter, terceiro: ter.nome, codTer: cod(ter.id).codigo, uf: ter.uf || '', ...cod(ter.id) };
      if (!peds.length) { linhas.push({ ...baseTer, ...doInsumo(), ...doTerceiro(), nivel: 'Terceiro sem pedido' }); return; }
      peds.forEach((ped) => {
        const r = resumoPedido(ped);
        const situacao = situacaoPedido(r);
        let pedPrimeira = true;
        const doPedido = () => {
          const v = pedPrimeira
            ? { valorPedido: vn(ped.valor), faturadoPedido: r.faturado, saldoPedido: r.saldo, utilizacao: r.perc, reidiPedido: r.reidi, pedPrimeira: true }
            : { valorPedido: null, faturadoPedido: null, saldoPedido: null, utilizacao: null, reidiPedido: null, pedPrimeira: false };
          pedPrimeira = false;
          return v;
        };
        const basePed = {
          ...baseTer, ...cod(ped.id), codPed: cod(ped.id).codigo, posicao: cod(ped.id).posicao,
          _ped: ped, pedido: ped.numero, emissao: ped.dataEmissao, situacao, divergente: r.divergente,
          modoReidi: rotuloReidiPedido(ped, r),
        };
        const nfs = ordenar(r.nfs, 'data', 'asc', 'data');
        if (!nfs.length) { linhas.push({ ...basePed, ...doInsumo(), ...doTerceiro(), ...doPedido(), nivel: 'Pedido sem NF' }); return; }
        nfs.forEach((nf) => {
          const an = analisarNota(nf);
          const bols = ordenar(boletosDaNota(nf.id), 'vencimento', 'asc', 'data');
          const baseNf = { ...basePed, ...cod(nf.id), _nf: nf, eclic: nf.eclic ? 'Sim' : 'Não', nf: nf.numero, dataNf: nf.data, bm: nf.bm ? `BM${nf.bm}` : '', conferencia: an.situacao, grdNf: textoGrds(nf.grds) };
          const valoresNf = {
            valorNf: vn(nf.valor), reidi: vn(nf.reidi), difalPerc: vn(nf.difalPerc), difalValor: vn(nf.difalValor), ufNf: `${nf.ufOrigem || '?'}→${nf.ufDestino || '?'}`, nfPrimeira: true,
          };
          const semValoresNf = { valorNf: null, reidi: null, difalPerc: null, difalValor: null, ufNf: '', nfPrimeira: false };
          if (!bols.length) { linhas.push({ ...baseNf, ...doInsumo(), ...doTerceiro(), ...doPedido(), ...valoresNf, status: 'Sem boleto', nivel: 'NF sem boleto' }); return; }
          bols.forEach((b, i) => {
            linhas.push({
              ...baseNf, ...cod(b.id), ...doInsumo(), ...doTerceiro(), ...doPedido(), ...(i === 0 ? valoresNf : semValoresNf),
              _bol: b, boleto: b.numero, valorBoleto: b.valor == null ? null : vn(b.valor), vencimento: b.vencimento, pagamento: b.pagamento,
              status: statusBoleto(b), prazo: prazoBoleto(b), grdBoleto: textoGrds(b.grds), nivel: 'Boleto',
            });
          });
        });
      });
    });
  });
  return linhas;
}

/** Rotulo "Estimado em <mes ▾>": o mes e um botao pequeno que abre a escolha de qualquer mes da obra. */
function botaoMesEstimado() {
  const meses = mesesObra();
  if (!meses.length) return null;
  const atual = mesEstimadoAtual();
  const bms = opcoesBM();
  const textoMes = (m) => {
    const i = meses.indexOf(m);
    return `${formatarData(m, 'mes-ano')}${bms[i] ? ` · BM${bms[i].valor}` : ''}`;
  };
  return h('span', { class: 'ctc-cluster ctc-text-sm ctc-text-muted' }, 'Estimado em',
    h('button', {
      type: 'button', class: 'ctc-btn ctc-btn--ghost ctc-btn--sm', title: 'Escolher outro mês da obra',
      onClick: () => {
        const formulario = criarFormulario({
          colunas: 1, semBotoes: true, valores: { mes: atual },
          campos: [{ nome: 'mes', rotulo: 'Mês da obra', tipo: 'select', obrigatorio: true, opcoes: meses.map((m) => ({ valor: m, texto: `${textoMes(m)}${m === mesHoje() ? ' (atual)' : ''}` })) }],
          onEnviar: (v) => { mesEstimadoGeral = v.mes; modal.fechar(); recarregar(); },
        });
        const modal = criarModal({
          titulo: 'Estimado em qual mês?', tamanho: 'sm', destruirAoFechar: true, conteudo: formulario.elemento,

        });
        modal.abrir();
      },
    }, textoMes(atual), criarIcone('chevron-baixo')));
}

/** Visao recolhida: uma linha por pedido (e terceiro sem pedido), com resumo das NFs e boletos. */
function secaoGeralRecolhida() {
  const codigos = codigosHierarquia();
  const linhas = [];
  ordenar(insumos, 'nome').forEach((ins) => {
    let insPrimeira = true;
    ordenar(terceiros.filter((t) => t.insumoId === ins.id), 'nome').forEach((ter) => {
      const peds = pedidos.filter((p) => p.terceiroId === ter.id)
        .sort((x, y) => String(x.dataEmissao).localeCompare(String(y.dataEmissao)) || String(x.numero).localeCompare(String(y.numero)));
      const valorTer = somar(peds, 'valor');
      const fatTer = peds.reduce((t, p) => t + resumoPedido(p).faturado, 0);
      const base = {
        _ins: ins, _ter: ter, insumo: ins.nome, codIns: codigos.get(ins.id)?.codigo, terceiro: ter.nome, codTer: codigos.get(ter.id)?.codigo, uf: ter.uf || '',
      };
      const terceiroCampos = (primeira) => (primeira
        ? { pedidosTer: peds.length, valorTer, saldoTer: valorTer - fatTer, terPrimeira: true }
        : { pedidosTer: null, valorTer: null, saldoTer: null, terPrimeira: false });
      if (!peds.length) {
        linhas.push({ ...base, ...codigos.get(ter.id), ...terceiroCampos(true), insPrimeira });
        insPrimeira = false;
        return;
      }
      peds.forEach((ped, k) => {
        const r = resumoPedido(ped);
        const bols = r.nfs.flatMap((n) => boletosDaNota(n.id));
        const abertos = bols.filter((b) => ['Em aberto', 'Vencido', 'Em contestação'].includes(statusBoleto(b))).length;
        const vencidos = bols.filter((b) => statusBoleto(b) === 'Vencido').length;
        const ultimaNf = r.nfs.map((n) => n.data).filter(Boolean).sort().pop() || '';
        linhas.push({
          ...base, ...codigos.get(ped.id), ...terceiroCampos(k === 0), insPrimeira, _ped: ped,
          pedido: ped.numero, codPed: codigos.get(ped.id)?.codigo, posicao: codigos.get(ped.id)?.posicao, emissao: ped.dataEmissao,
          modoReidi: rotuloReidiPedido(ped, r),
          valorPedido: vn(ped.valor), faturadoPedido: r.faturado, saldoPedido: r.saldo, utilizacao: r.perc, situacao: situacaoPedido(r), divergente: r.divergente,
          produtosQtd: r.prods.length, nfsQtd: r.nfs.length, ultimaNf,
          boletosTexto: bols.length ? `${bols.length}${abertos ? ` · ${abertos} em aberto` : ' · quitados'}` : (r.nfs.length ? 'sem boleto' : ''),
          vencidos,
        });
        insPrimeira = false;
      });
    });
  });
  const so = (flag, fn) => (v, l) => (l[flag] ? fn(v, l) : '');
  const tabela = criarTabela({
    dados: linhas, compacta: true, listrada: true, porPagina: 50,
    onAtualizar: ({ total, filtrados }) => definirMetaBase(`${filtrados} de ${total} linhas (terceiros e pedidos)`),
    onLinhaClick: (l) => (l._ped ? abrirPedido(l._ped) : abrirModalTerceiro(l._ter)),
    linhaVariante: (l) => (l.vencidos ? 'danger' : l.situacao === 'Esgotado' ? 'warning' : null),
    vazio: { titulo: 'Nenhum terceiro cadastrado', mensagem: 'Use o painel "Cadastrar" para lançar terceiros e pedidos.' },
    colunas: [
      { campo: 'insumo', titulo: 'Insumo', fixa: true, render: (v, l) => h('span', { class: l.insPrimeira ? 'ctc-text-strong' : 'ctc-text-muted' }, `${l.codIns} · ${v}`) },
      { campo: 'terceiro', titulo: 'Terceiro', render: (v, l) => h('span', { class: l.terPrimeira ? 'ctc-text-strong' : 'ctc-text-muted' }, `${l.codTer} · ${v}`) },
      { campo: 'uf', titulo: 'UF' },
      { campo: 'pedidosTer', titulo: 'Pedidos do terceiro', ordenavel: false, render: so('terPrimeira', (v) => criarBadge({ texto: v === 1 ? '1 pedido' : `${v} pedidos`, variante: v ? 'info' : 'warning' })) },
      { campo: 'valorTer', titulo: 'Total do terceiro', tipo: 'moeda', ordenavel: false, render: so('terPrimeira', (v) => formatarMoeda(v)) },
      { campo: 'saldoTer', titulo: 'Saldo do terceiro', tipo: 'moeda', ordenavel: false, render: so('terPrimeira', (v) => h('span', { class: v < 0 ? 'ctc-text-danger ctc-num' : 'ctc-num' }, formatarMoeda(v))) },
      {
        campo: 'pedido', titulo: 'Pedido',
        render: (v, l) => (v ? h('div', {}, h('div', { class: 'ctc-text-strong' }, `${l.codPed} · ${v}`), h('div', { class: 'ctc-text-xs ctc-text-muted' }, `pedido ${l.posicao} do terceiro`)) : h('span', { class: 'ctc-text-xs ctc-text-subtle' }, 'sem pedido')),
      },
      { campo: 'emissao', titulo: 'Emissão', tipo: 'data' },
      { campo: 'modoReidi', titulo: 'REIDI' },
      { campo: 'produtosQtd', titulo: 'Produtos', tipo: 'numero' },
      { campo: 'valorPedido', titulo: 'Valor pedido', tipo: 'moeda', total: 'soma' },
      { campo: 'faturadoPedido', titulo: 'Faturado', tipo: 'moeda', total: 'soma' },
      { campo: 'saldoPedido', titulo: 'Saldo', tipo: 'moeda', total: 'soma', render: (v) => (v == null ? '' : h('span', { class: v < 0 ? 'ctc-text-danger ctc-num' : 'ctc-num' }, formatarMoeda(v))) },
      {
        campo: 'utilizacao', titulo: 'Utilização', ordenavel: false,
        render: (v, l) => (l._ped ? h('div', { class: 'ctc-stack' },
          criarProgresso({ percentual: v, tamanho: 'sm', variante: v >= 80 ? 'danger' : 'success', rotulo: 'Utilização' }),
          h('span', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(v, { casas: 2 }))) : ''),
      },
      { campo: 'situacao', titulo: 'Situação', render: (v, l) => (v ? h('div', { class: 'ctc-cluster' }, criarBadge({ texto: v, variante: VARIANTE_SITUACAO[v] }), l.divergente ? criarBadge({ texto: 'Divergente', variante: 'warning' }) : null) : '') },
      { campo: 'nfsQtd', titulo: 'NFs', tipo: 'numero', total: 'soma' },
      { campo: 'ultimaNf', titulo: 'Última NF', tipo: 'data' },
      { campo: 'boletosTexto', titulo: 'Boletos', render: (v, l) => (v ? criarBadge({ texto: v, variante: l.vencidos ? 'danger' : v.includes('aberto') || v === 'sem boleto' ? 'warning' : 'success' }) : '') },
    ],
  });
  return {
    tabela, titulo: 'Visão geral recolhida — terceiros e pedidos', icone: 'tabela',
    topo: painelCadastro(),
    selects: [{ campo: 'situacao', rotulo: 'Situação pedido', opcoes: ['Normal', 'Crítico', 'Esgotado'] }],
    acoes: [
      seletorModoGeral(),
      { texto: 'Exportar tudo', icone: 'download', variante: 'ghost', tamanho: 'sm', titulo: 'Planilha completa do recorte', onClick: exportarTudo },
    ],
    rodape: 'Uma linha por pedido (terceiros sem pedido também aparecem). Os totais do terceiro ficam na primeira linha dele. Clique num pedido para abrir produtos e NFs; use "Completa" para ver cada NF e boleto.',
  };
}

/* ---- Visao "Por pedido": uma tabela so, organizada como planilha de controle ---- */

const pedidosFechados = new Set();   // pedidos com NFs ocultas (seta)
const nfsAbertasGeral = new Set();   // NFs com produtos visiveis na visao por pedido
const insumosFechadosGeral = new Set();   // insumos recolhidos (faixa com totais continua visivel)
const terceirosFechadosGeral = new Set(); // terceiros recolhidos (faixa com totais continua visivel)

/**
 * Linhas por nivel, na ordem: INSUMO (faixa) > TERCEIRO (faixa) > PEDIDO (nº real) >
 * NFs do pedido por data, com valor ACUMULADO do pedido e SALDO apos cada NF > boletos da NF.
 * Funciona como tabela da base: recebe busca e filtros comuns (insumo, terceiro, situacao).
 */
function secaoGeralAgrupada() {
  const COLS = ['Documento', 'Data', 'BM', 'Valor', 'Acumulado do pedido', 'Saldo do pedido', '% do pedido', 'REIDI', 'DIFAL', 'Situação', 'Boletos / pagamento', 'GRD'];
  const n = COLS.length;
  const area = h('tbody', {});
  const rodape = h('tfoot', {});
  const num = (v, classe = '') => h('td', { class: `ctc-col--num ctc-num ${classe}`.trim() }, v == null ? '' : formatarMoeda(v));
  const vazio = () => h('td', {});
  const faixa = (classe, ...conteudo) => h('tr', { class: classe }, h('td', { colspan: n }, h('div', { class: 'ctc-toolbar' }, ...conteudo)));
  const resumoTexto = (partes) => h('span', { class: 'ctc-text-xs ctc-text-muted' }, partes.filter(Boolean).join(' · '));
  /* texto claro para faixas escuras (sem a cor apagada) */
  const resumoClaro = (partes) => h('span', { class: 'ctc-text-xs' }, partes.filter(Boolean).join(' · '));
  const plural = (q, s1, sN) => `${q} ${q === 1 ? s1 : sN}`;

  /* cada linha guarda a que insumo/terceiro/pedido/NF pertence; a visibilidade e recalculada de uma vez */
  function aplicarVisibilidade() {
    [...area.children].forEach((tr) => {
      const d = tr.dataset;
      tr.hidden = Boolean((d.dentroIns && insumosFechadosGeral.has(d.dentroIns))
        || (d.dentroTer && terceirosFechadosGeral.has(d.dentroTer))
        || (d.dentroPed && pedidosFechados.has(d.dentroPed))
        || (d.nfItem && !nfsAbertasGeral.has(d.nfItem)));
    });
  }
  /* seta padrao: alterna o item no conjunto e redesenha a visibilidade */
  function setaNivel(conjunto, id, { fecharQuandoMarcado = true, tituloAberto, tituloFechado, variante = 'ghost' }) {
    const aberto = () => (fecharQuandoMarcado ? !conjunto.has(id) : conjunto.has(id));
    const botao = h('button', {
      type: 'button', class: `ctc-btn ctc-btn--${variante} ctc-btn--sm`, title: aberto() ? tituloAberto : tituloFechado, 'aria-expanded': String(aberto()),
      onClick: (e) => {
        e.stopPropagation();
        if (conjunto.has(id)) conjunto.delete(id); else conjunto.add(id);
        aplicarVisibilidade();
        botao.replaceChildren(criarIcone(aberto() ? 'chevron-baixo' : 'chevron-direita'));
        botao.setAttribute('aria-expanded', String(aberto()));
        botao.title = aberto() ? tituloAberto : tituloFechado;
      },
    }, criarIcone(aberto() ? 'chevron-baixo' : 'chevron-direita'));
    return botao;
  }

  function desenhar(estado = {}) {
    const f = estado.filtros || {};
    const termo = normalizarTexto(estado.busca || '');
    const linhas = [];
    let totPed = 0; let totFat = 0; let qtdPed = 0; let qtdNf = 0;
    const casa = (...textos) => !termo || normalizarTexto(textos.filter(Boolean).join(' ')).includes(termo);
    ordenar(insumos, 'nome').filter((i) => !f.insumo || i.nome === f.insumo).forEach((ins) => {
      const ri = resumoInsumo(ins);
      const blocoIns = [];
      ordenar(terceiros.filter((t) => t.insumoId === ins.id), 'nome').filter((t) => !f.terceiro || t.nome === f.terceiro).forEach((ter) => {
        const peds = pedidos.filter((p) => p.terceiroId === ter.id)
          .sort((x, y) => String(x.dataEmissao).localeCompare(String(y.dataEmissao)) || String(x.numero).localeCompare(String(y.numero)));
        const blocoTer = [];
        peds.forEach((ped, k) => {
          const r = resumoPedido(ped);
          const situacao = situacaoPedido(r);
          if (f.situacao && f.situacao !== situacao) return;
          const nfs = ordenar(r.nfs, 'data', 'asc', 'data');
          const textosBusca = [ins.nome, ter.nome, ter.cnpj, ped.numero, ped.observacoes,
            ...produtosDoPedido(ped.id).map((p) => p.descricao),
            ...nfs.flatMap((nf) => [nf.numero, ...(nf.grds || []), ...boletosDaNota(nf.id).flatMap((b) => [b.numero, ...(b.grds || [])])])];
          if (!casa(...textosBusca)) return;
          qtdPed += 1; qtdNf += nfs.length; totPed += vn(ped.valor); totFat += r.faturado;
          const filhos = [];
          const seta = setaNivel(pedidosFechados, ped.id, { tituloAberto: 'Ocultar NFs', tituloFechado: 'Mostrar NFs' });
          const bolsPed = nfs.flatMap((nf) => boletosDaNota(nf.id));
          const abertos = bolsPed.filter((b) => ['Em aberto', 'Vencido', 'Em contestação'].includes(statusBoleto(b))).length;
          blocoTer.push(h('tr', { class: 'ctc-row--subtotal ctc-row--info', onClick: () => abrirPedido(ped), title: 'Abrir pedido (produtos e NFs)' },
            h('td', {}, h('div', {},
              h('div', { class: 'ctc-cluster' }, seta, h('span', { class: 'ctc-text-strong' }, `Pedido ${ped.numero}`)),
              resumoTexto([`${k + 1}º de ${peds.length} do terceiro`, plural(r.prods.length, 'produto', 'produtos'), plural(nfs.length, 'NF', 'NFs')]))),
            h('td', {}, formatarData(ped.dataEmissao)),
            vazio(),
            num(vn(ped.valor), 'ctc-text-strong'),
            num(r.faturado, 'ctc-text-strong'),
            num(r.saldo, r.saldo < 0 ? 'ctc-text-danger ctc-text-strong' : 'ctc-text-strong'),
            h('td', {}, h('div', { class: 'ctc-stack' },
              criarProgresso({ percentual: r.perc, tamanho: 'sm', variante: r.perc >= 99.995 ? 'danger' : r.perc >= 80 ? 'warning' : 'success', rotulo: '% faturado do pedido' }),
              h('span', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(r.perc, { casas: 2 })))),
            num(r.reidi),
            h('td', { class: 'ctc-text-xs' }, `${formatarPercentual(ped.difalPerc, { casas: 2 })} · ${ped.ufOrigem || '?'}→${ped.ufDestino || '?'}`),
            h('td', {}, h('div', { class: 'ctc-cluster' }, criarBadge({ texto: situacao, variante: VARIANTE_SITUACAO[situacao] }), r.divergente ? criarBadge({ texto: 'Divergente', variante: 'warning' }) : null)),
            h('td', {}, bolsPed.length ? criarBadge({ texto: `${plural(bolsPed.length, 'boleto', 'boletos')}${abertos ? ` · ${abertos} em aberto` : ' · quitados'}`, variante: abertos ? 'warning' : 'success' }) : ''),
            h('td', {}, podeEditar() ? botaoFD({ texto: 'NF', icone: 'mais', variante: 'ghost', tamanho: 'sm', apenasEdicao: true, titulo: `Lançar NF do pedido ${ped.numero}`, onClick: (e) => { if (e) e.stopPropagation(); abrirModalNota(null, { pedidoId: ped.id }); } }) : '')));
          let acumulado = 0;
          if (!nfs.length) {
            filhos.push(h('tr', {}, h('td', { colspan: n, class: 'ctc-text-xs ctc-text-subtle' }, '\u00a0\u00a0\u00a0\u00a0└ nenhuma NF lançada para este pedido')));
          }
          nfs.forEach((nf, i) => {
            acumulado += vn(nf.valor);
            const saldoApos = vn(ped.valor) - acumulado;
            const perc = vn(ped.valor) ? (acumulado / vn(ped.valor)) * 100 : 0;
            const an = analisarNota(nf);
            const bols = ordenar(boletosDaNota(nf.id), 'vencimento', 'asc', 'data');
            /* produtos da NF: abrem pela seta, ainda nesta aba */
            const linhasProdutosNf = [
              ...(nf.itens || []).map((it) => {
                const pr = produtoPorId(it.produtoId);
                return h('tr', {},
                  h('td', {}, h('div', {},
                    h('div', { class: 'ctc-text-sm' }, `\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0· ${pr ? pr.descricao : '(produto removido)'}`),
                    pr?.detalhe ? h('div', { class: 'ctc-text-xs ctc-text-muted' }, `\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0${pr.detalhe}`) : null)),
                  h('td', { class: 'ctc-text-xs' }, `${formatarNumero(it.quantidade)} ${pr?.unidade || ''}`.trim()),
                  vazio(),
                  num(vn(it.quantidade) * vn(it.valorUnit), 'ctc-text-muted'),
                  h('td', { class: 'ctc-text-xs ctc-text-muted', colspan: 3 }, pr ? `unit. ${formatarMoeda(it.valorUnit)} · saldo do produto ${formatarNumero(analisarProduto(pr).saldoQtd)} ${pr.unidade || ''}` : ''),
                  num(pr ? vn(it.quantidade) * Math.max(0, vn(pr.unitSem) - vn(it.valorUnit)) : null, 'ctc-text-muted'),
                  vazio(), vazio(), vazio(), vazio());
              }),
              ...(nf.itensSemVinculo || []).map((it) => h('tr', { class: 'ctc-row--danger' },
                h('td', { class: 'ctc-text-sm' }, `\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0⚠ ${it.descricao} (sem produto no pedido)`),
                h('td', { class: 'ctc-text-xs' }, formatarNumero(it.quantidade)),
                vazio(), num(vn(it.valorTotal), 'ctc-text-muted'),

            ];
            linhasProdutosNf.forEach((tr) => { tr.dataset.nfItem = nf.id; });
            const setaNf = linhasProdutosNf.length
              ? setaNivel(nfsAbertasGeral, nf.id, { fecharQuandoMarcado: false, tituloAberto: 'Ocultar produtos da NF', tituloFechado: 'Ver produtos da NF' }) : null;
            filhos.push(h('tr', { onClick: () => abrirModalNota(nf), title: 'Abrir NF' },
              h('td', {}, h('div', {},
                h('div', { class: 'ctc-cluster' }, `\u00a0\u00a0\u00a0\u00a0└ NF ${nf.numero}`, setaNf),
                resumoTexto([`\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0${i + 1}ª NF do pedido`, (nf.itens || []).length ? plural(nf.itens.length, 'produto', 'produtos') : 'sem produto marcado', (nf.itensSemVinculo || []).length ? `${nf.itensSemVinculo.length} item sem pedido` : '']))),
              h('td', {}, formatarData(nf.data)),
              h('td', {}, rotuloBM(nf.bm)),
              num(vn(nf.valor)),
              num(acumulado),
              num(saldoApos, saldoApos < 0 ? 'ctc-text-danger' : ''),
              h('td', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(perc, { casas: 2 })),
              num(vn(nf.reidi)),
              h('td', { class: 'ctc-text-xs' }, `${formatarMoeda(nf.difalValor)} (${formatarPercentual(nf.difalPerc, { casas: 2 })})`),
              h('td', {}),
              h('td', {}, h('div', { class: 'ctc-cluster' }, seloEclic(nf), bols.length ? null : criarBadge({ texto: 'sem boleto', variante: 'warning' }))),
              h('td', {}, celulaGrd(nf))));
            filhos.push(...linhasProdutosNf);
            bols.forEach((b) => {
              const prazo = prazoBoleto(b);
              filhos.push(h('tr', { onClick: () => abrirModalBoleto(b), title: 'Abrir boleto' },
                h('td', { class: 'ctc-text-sm' }, `\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0└ Boleto ${b.numero}`),
                h('td', { class: 'ctc-text-xs' }, `venc. ${formatarData(b.vencimento)}`),
                vazio(),
                num(b.valor == null ? null : vn(b.valor), 'ctc-text-muted'),
                vazio(), vazio(), vazio(), vazio(), vazio(),
                h('td', {}, criarBadge({ texto: prazo, variante: VARIANTE_PRAZO[prazo] })),
                h('td', { class: 'ctc-text-xs' }, b.pagamento ? `pago ${formatarData(b.pagamento)}` : ''),
                h('td', {}, celulaGrd(b))));
            });
          });
          filhos.forEach((tr) => { tr.dataset.dentroPed = ped.id; });
          blocoTer.push(...filhos);
        });
        if (!blocoTer.length && (termo || f.situacao)) return;
        const valorTer = somar(peds, 'valor');
        const fatTer = peds.reduce((t, p) => t + resumoPedido(p).faturado, 0);
        blocoTer.forEach((tr) => { tr.dataset.dentroTer = ter.id; });
        blocoIns.push(faixa('ctc-row--level-3 ctc-row--success',
          setaNivel(terceirosFechadosGeral, ter.id, { tituloAberto: 'Recolher terceiro', tituloFechado: 'Abrir terceiro' }),
          h('span', { class: 'ctc-text-strong' }, ter.nome),
          criarBadge({ texto: ter.uf || 'UF?', variante: 'neutral' }),
          ter.cnpj ? h('span', { class: 'ctc-text-xs ctc-text-muted' }, `CNPJ ${ter.cnpj}`) : null,
          resumoTexto([plural(peds.length, 'pedido', 'pedidos'), `total ${formatarMoeda(valorTer)}`, `faturado ${formatarMoeda(fatTer)}`, `saldo ${formatarMoeda(valorTer - fatTer)}`]),
          botaoFD({ texto: 'Pedido', icone: 'mais', variante: 'ghost', tamanho: 'sm', apenasEdicao: true, titulo: `Novo pedido de ${ter.nome}`, onClick: () => abrirModalPedido(null, ter.id) })));
        if (!peds.length) {
          const vazioTer = h('tr', {}, h('td', { colspan: n, class: 'ctc-text-xs ctc-text-subtle' }, '\u00a0\u00a0└ nenhum pedido lançado para este terceiro'));
          vazioTer.dataset.dentroTer = ter.id;
          blocoIns.push(vazioTer);
        }
        blocoIns.push(...blocoTer);
      });
      if (!blocoIns.length && (termo || f.situacao || f.terceiro)) return;
      blocoIns.forEach((tr) => { tr.dataset.dentroIns = ins.id; });
      linhas.push(faixa('ctc-row--level-1',
        setaNivel(insumosFechadosGeral, ins.id, { tituloAberto: 'Recolher insumo', tituloFechado: 'Abrir insumo', variante: 'primary' }),
        h('span', {}, ins.nome),
        resumoClaro([`${rotuloValorInsumo().toLowerCase()} ${formatarMoeda(ri.vigente)}`, `em pedidos ${formatarMoeda(ri.comprometido)}`, `faturado ${formatarMoeda(ri.faturado)} (${formatarPercentual(ri.percFaturado, { casas: 2 })})`, `saldo a faturar ${formatarMoeda(ri.saldoFaturar)}`])));
      if (!blocoIns.length) {
        const vazioIns = h('tr', {}, h('td', { colspan: n, class: 'ctc-text-xs ctc-text-subtle' }, '\u00a0\u00a0└ nenhum terceiro cadastrado para este insumo'));
        vazioIns.dataset.dentroIns = ins.id;
        linhas.push(vazioIns);
      }
      linhas.push(...blocoIns);
    });
    area.replaceChildren(...(linhas.length ? linhas : [h('tr', {}, h('td', { colspan: n, class: 'ctc-text-subtle' }, 'Nada encontrado com estes filtros.'))]));
    aplicarVisibilidade();
    rodape.replaceChildren(h('tr', {},
      h('td', {}, `Total — ${plural(qtdPed, 'pedido', 'pedidos')} · ${plural(qtdNf, 'NF', 'NFs')}`), vazio(), vazio(),
      num(totPed), num(totFat), num(totPed - totFat),
      h('td', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(totPed ? (totFat / totPed) * 100 : 0, { casas: 2 })),
      vazio(), vazio(), vazio(), vazio(), vazio()));
    definirMetaBase(`${plural(qtdPed, 'pedido', 'pedidos')} · ${plural(qtdNf, 'NF', 'NFs')}`);
  }

  const elemento = h('div', { class: 'ctc-table-wrap ctc-table-wrap--auto' },
    h('table', { class: 'ctc-table ctc-table--compact' },
      h('thead', {}, h('tr', {}, COLS.map((c, i) => h('th', { class: [3, 4, 5, 7].includes(i) ? 'ctc-col--num' : null }, c)))),
      area, rodape));
  desenhar({ filtros: filtroBase });
  /* objeto com a mesma interface usada pela base (atualizarConsulta) */
  const tabela = { elemento, atualizarConsulta: desenhar, obterFiltrados: () => [] };
  return {
    tabela, titulo: 'Visão geral por pedido — insumo › terceiro › pedido › NFs › boletos', icone: 'tabela',
    topo: painelCadastro(),
    selects: [{ campo: 'situacao', rotulo: 'Situação pedido', opcoes: ['Normal', 'Crítico', 'Esgotado'] }],
    acoes: [

      { texto: 'Até pedidos', variante: 'ghost', tamanho: 'sm', titulo: 'Mostrar até os pedidos (oculta NFs)', onClick: () => { insumosFechadosGeral.clear(); terceirosFechadosGeral.clear(); pedidos.forEach((x) => pedidosFechados.add(x.id)); recarregar(); } },
      { texto: 'Até terceiros', variante: 'ghost', tamanho: 'sm', titulo: 'Mostrar insumos e terceiros com os totais', onClick: () => { insumosFechadosGeral.clear(); terceiros.forEach((x) => terceirosFechadosGeral.add(x.id)); recarregar(); } },

    ],
    rodape: 'Cores por nível: faixa escura = insumo, faixa azul-acinzentada com barra verde = terceiro, faixa cinza com barra azul = pedido, linhas brancas = NFs e boletos. Recolher um nível mantém os totais dele visíveis na própria faixa. Cada pedido aparece pelo seu número, com as NFs em ordem de data. "Acumulado do pedido" soma as NFs até aquela linha e "Saldo do pedido" mostra quanto falta faturar depois dela. A seta do pedido oculta ou mostra as NFs. Clique numa linha para abrir pedido, NF ou boleto.',

/** Indicadores do recorte atual (insumo e terceiro escolhidos). */
function resumoBase() {
  const passa = (ped) => (!filtroBase.insumo || insumoDoPedido(ped)?.nome === filtroBase.insumo)
    && (!filtroBase.terceiro || terceiroDoPedido(ped)?.nome === filtroBase.terceiro);
  const peds = pedidos.filter(passa);
  const ids = new Set(peds.map((p) => p.id));
  const nfs = notas.filter((n) => ids.has(n.pedidoId));
  const idsNf = new Set(nfs.map((n) => n.id));
  const bols = boletos.filter((b) => idsNf.has(b.notaId));
  const valor = somar(peds, 'valor');
  const faturado = somar(nfs, 'valor');
  const abertos = bols.filter((b) => ['Em aberto', 'Vencido', 'Em contestação'].includes(statusBoleto(b))).length;
  const vencidos = bols.filter((b) => statusBoleto(b) === 'Vencido').length;
  return h('div', { class: 'ctc-grid ctc-grid--4' },
    criarKpi({ rotulo: `Pedidos (${peds.length})`, valor: formatarMoeda(valor), sub: 'valor dos pedidos de compra' }).elemento,
    criarKpi({ rotulo: `Faturado em NFs (${nfs.length})`, valor: formatarMoeda(faturado), variante: 'accent', tema: 1, progresso: { percentual: valor ? (faturado / valor) * 100 : 0 }, sub: `${formatarPercentual(valor ? (faturado / valor) * 100 : 0, { casas: 2 })} dos pedidos` }).elemento,
    criarKpi({ rotulo: 'Saldo dos pedidos', valor: formatarMoeda(valor - faturado), sub: 'pedidos − NFs', variante: valor - faturado < 0 ? 'danger' : 'success' }).elemento,
    criarKpi({
      rotulo: 'Boletos em aberto', valor: `${abertos} boleto(s)`, variante: vencidos ? 'warning' : null,
      sub: vencidos ? `${vencidos} boleto(s) vencido(s)` : 'nenhum vencido',
    }).elemento);
}

function paginaBase() {
  if (abaBase && !SECOES_BASE.some((s) => s.id === abaBase)) abaBase = 'geral';
  if (filtroBase.insumo && !insumos.some((i) => i.nome === filtroBase.insumo)) filtroBase.insumo = '';
  if (filtroBase.terceiro && !terceiros.some((t) => t.nome === filtroBase.terceiro)) filtroBase.terceiro = '';
  let tabelaAtiva = null;
  let extrasAtivos = {};
  let buscaComum = '';
  const resumo = h('div', {}, resumoBase());
  const aplicar = () => {
    if (tabelaAtiva) tabelaAtiva.atualizarConsulta({ busca: buscaComum, filtros: { ...filtroBase, ...extrasAtivos } });
  };
  const barra = criarBarraFiltros({
    busca: { placeholder: 'Pesquisar terceiro, pedido, NF, boleto, GRD...' },
    selects: [
      { campo: 'insumo', rotulo: 'Insumo', opcoes: insumos.map((i) => i.nome), valor: filtroBase.insumo },
      { campo: 'terceiro', rotulo: 'Terceiro', opcoes: [...new Set(terceiros.map((t) => t.nome))].sort(), valor: filtroBase.terceiro },
    ],
    onMudar: (estado) => {
      buscaComum = estado.busca;
      filtroBase = { insumo: estado.filtros.insumo || '', terceiro: estado.filtros.terceiro || '' };
      resumo.replaceChildren(resumoBase());
      aplicar();
    },
  });
  definirMetaBase = (texto) => barra.definirMeta(texto);
  const abas = criarAbas({
    ativa: abaBase,
    onMudar: (id) => { abaBase = id; },
    abas: SECOES_BASE.map((sec) => ({
      id: sec.id,
      texto: sec.id === 'geral' ? sec.texto : `${sec.texto} (${sec.contar()})`,
      conteudo: () => {
        const s = sec.montar();
        tabelaAtiva = s.tabela;
        extrasAtivos = {};
        const extra = s.selects.length ? criarBarraFiltros({
          busca: false, selects: s.selects,
          onMudar: (estado) => { extrasAtivos = estado.filtros; aplicar(); },
        }) : null;
        aplicar();
        return h('div', { class: 'ctc-stack' },
          s.topo || null,
          ...(s.avisos || []).filter(Boolean),
          h('div', { class: 'ctc-toolbar' },
            extra ? extra.elemento : null,
            h('span', { class: 'ctc-spacer' }),
            ...s.acoes.map((a) => (a instanceof Node ? a : botaoFD(a)))),
          criarPainel({ titulo: s.titulo, icone: s.icone, tema: sec.tema, semEspaco: true, conteudo: s.tabela.elemento }).elemento,
          s.rodape ? h('div', { class: 'ctc-text-xs ctc-text-subtle' }, s.rodape) : null);
      },
    })),
  });
  return [
    alertaFicticio(),
    barra.elemento,
    resumo,
    abas.elemento,
  ];
}

const URL_SHEETJS = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm';
const URL_EXCELJS = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
const URL_PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
const URL_PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

const chaveColuna = (texto) => normalizarTexto(String(texto || '')).replace(/[^a-z0-9]/g, '');
const soDigitos = (texto) => String(texto || '').replace(/\D/g, '');

function baixarTextoFD(nome, conteudo, tipo = 'text/csv;charset=utf-8') {
  const url = URL.createObjectURL(new Blob(['\ufeff', conteudo], { type: tipo }));
  const link = h('a', { href: url, download: nome });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/** CSV simples com aspas; separador ; ou , detectado pela 1a linha. */
function lerCsvFD(texto) {
  const limpo = texto.replace(/^\ufeff/, '');
  const primeira = limpo.split(/\r?\n/)[0] || '';
  const sep = (primeira.match(/;/g) || []).length >= (primeira.match(/,/g) || []).length ? ';' : ',';
  const linhas = [];
  let campo = '';
  let linha = [];
  let aspas = false;
  for (let i = 0; i < limpo.length; i += 1) {
    const c = limpo[i];
    if (aspas) {
      if (c === '"' && limpo[i + 1] === '"') { campo += '"'; i += 1; } else if (c === '"') aspas = false; else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; } else if (c === '\n' || c === '\r') {
      if (c === '\r' && limpo[i + 1] === '\n') i += 1;
      linha.push(campo); linhas.push(linha); linha = []; campo = '';
    } else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return matrizParaObjetos(linhas);
}

/**
 * Converte linhas (arrays) em objetos pelo cabecalho. O cabecalho pode nao ser a 1a linha
 * (planilhas com titulo em cima): escolhe, entre as 15 primeiras, a linha com mais nomes
 * de coluna conhecidos.
 */
const PALAVRAS_CABECALHO = ['pedido', 'terceiro', 'fornecedor', 'insumo', 'descricao', 'produto', 'unidade', 'quantidade', 'qtd',
  'valor', 'unit', 'reidi', 'nf', 'nota', 'boleto', 'vencimento', 'data', 'cnpj', 'uf', 'campo', 'grd', 'status', 'correspondente'];
function matrizParaObjetos(matriz) {
  const linhas = matriz.filter((l) => Array.isArray(l) && l.some((v) => String(v ?? '').trim()));
  if (!linhas.length) return [];
  let melhor = 0;
  let pontos = -1;
  linhas.slice(0, 15).forEach((l, i) => {
    const p = l.filter((c) => { const k = chaveColuna(c); return k && PALAVRAS_CABECALHO.some((w) => k.includes(w)); }).length;
    if (p > pontos) { pontos = p; melhor = i; }
  });
  const vistos = {};
  const cab = linhas[melhor].map((c) => {
    const nome = String(c ?? '').trim() || 'coluna';
    vistos[nome] = (vistos[nome] || 0) + 1;
    return vistos[nome] > 1 ? `${nome} (${vistos[nome]})` : nome;
  });
  return linhas.slice(melhor + 1).map((l) => Object.fromEntries(cab.map((c, i) => [c, l[i] ?? ''])));
}

async function lerPlanilhaFD(arquivo) {
  if (/\.csv$/i.test(arquivo.name)) return lerCsvFD(await arquivo.text());
  let XLSX;
  try {
    XLSX = await import(URL_SHEETJS);
  } catch (erro) {
    throw new Error('Não foi possível carregar o leitor de Excel (internet ou bloqueio de rede). Salve a planilha como CSV e importe de novo.');
  }
  const livro = XLSX.read(await arquivo.arrayBuffer(), { type: 'array' });
  const aba = livro.Sheets[livro.SheetNames[0]];
  return matrizParaObjetos(XLSX.utils.sheet_to_json(aba, { header: 1, defval: '', raw: true }));
}

/** Identifica cada coluna da planilha pelo nome do cabecalho. */
function mapearColuna(nome) {
  const k = chaveColuna(nome);
  if (k.startsWith('dif')) return null;                       /* colunas de diferenca: calculadas aqui */
  if (k.includes('descricaonf') || k.includes('produtonf') || k.includes('descricaonanf')) return 'descricaoNF';
  if (k.includes('correspondente') || k.includes('proposta') || k === 'produto' || k === 'nomedoproduto' || k === 'nomeproduto') return 'produtoNome';
  if (k.includes('semreidi')) return 'unitSem';
  if ((k.includes('unit') || k.includes('preco')) && k.includes('pedido')) return 'unitCom';   /* "R$ Unit. PEDIDO" = valor pago (COM REIDI) */
  if (k.includes('comreidi')) return 'unitCom';
  if (k.includes('modo')) return 'modo';
  if (k.includes('cnpj')) return 'cnpj';
  if (k.startsWith('uf')) return 'uf';
  if (k.includes('valorpedido') || k.includes('valordopedido')) return 'valorPedido';
  if (k.includes('reidi')) return 'percReidi';
  if (k.includes('descricao')) return 'descricao';
  if (k === 'un' || k.includes('unidade')) return 'unidade';
  if (k.includes('quantidade') || k === 'qtd' || k === 'qtde') return 'quantidade';
  if (k.includes('data')) return 'data';
  if (k.includes('pedido')) return 'pedido';
  if (k.includes('terceiro') || k.includes('fornecedor')) return 'terceiro';
  if (k.includes('insumo')) return 'insumo';
  return null;
}

function dataPlanilha(v) {
  if (v instanceof Date) return formatarData(v, 'iso');
  if (typeof v === 'number') return formatarData(dataDeSerialExcel(v), 'iso');
  const d = paraData(v);
  return d ? formatarData(d, 'iso') : '';
}

const CABECALHO_MODELO = ['Insumo', 'Terceiro', 'CNPJ Terceiro', 'UF Terceiro', 'Nº Pedido', 'Data Emissão', 'Valor Pedido',
  'Modo REIDI (sem/pedido/produto)', '% REIDI Pedido', 'Descrição', 'Unidade', 'Quantidade', 'Valor Unit SEM REIDI', 'Valor Unit COM REIDI'];

/** Monta o plano de importacao (nada e gravado ate a confirmacao). */
function planejarImportacaoPedidos(linhasBrutas, { insumoPadraoId = '' } = {}) {
  const plano = { insumosNovos: [], terceirosNovos: [], pedidos: [], ignorados: [], erros: [] };
  const linhas = linhasBrutas.map((bruta) => {
    const l = {};
    Object.entries(bruta).forEach(([k, v]) => { const c = mapearColuna(k); if (c && l[c] == null) l[c] = typeof v === 'string' ? v.trim() : v; });
    return l;
  }).filter((l) => l.pedido || l.descricao || l.produtoNome);
  const acharInsumo = (nome) => insumos.find((i) => normalizarTexto(i.nome) === normalizarTexto(nome)) || plano.insumosNovos.find((i) => normalizarTexto(i.nome) === normalizarTexto(nome));
  const acharTerceiro = (nome, insumoId) => [...terceiros, ...plano.terceirosNovos].find((t) => t.insumoId === insumoId && normalizarTexto(t.nome) === normalizarTexto(nome));
  linhas.forEach((l, i) => {
    const linhaN = i + 2;
    if (!l.insumo && l.terceiro) {
      const terExistente = terceiros.find((t) => normalizarTexto(t.nome) === normalizarTexto(l.terceiro));
      const ins = insumoPorId(terExistente?.insumoId) || insumoPorId(insumoPadraoId);
      if (ins) l.insumo = ins.nome;
    }
    if (!l.insumo || !l.terceiro || !l.pedido) { plano.erros.push(`Linha ${linhaN}: falta ${!l.insumo ? 'insumo (escolha o insumo acima)' : !l.terceiro ? 'terceiro' : 'nº do pedido'}.`); return; }
    let ins = acharInsumo(l.insumo);
    if (!ins) { ins = { id: novoIdFD('ins'), nome: String(l.insumo), valorTotal: 0, modoProjecao: 'manual', projecao: {} }; plano.insumosNovos.push(ins); }
    let ter = acharTerceiro(l.terceiro, ins.id);
    if (!ter) {
      ter = { id: novoIdFD('ter'), insumoId: ins.id, nome: String(l.terceiro), cnpj: l.cnpj ? String(l.cnpj) : '', uf: String(l.uf || '').toUpperCase().slice(0, 2) };
      plano.terceirosNovos.push(ter);
    }
    const existente = pedidos.find((p) => p.terceiroId === ter.id && normalizarTexto(p.numero) === normalizarTexto(l.pedido));
    if (existente) { if (!plano.ignorados.includes(String(l.pedido))) plano.ignorados.push(String(l.pedido)); return; }
    let ped = plano.pedidos.find((p) => p.terceiroId === ter.id && normalizarTexto(p.numero) === normalizarTexto(l.pedido));
    if (!ped) {
      const percLido = numPlanilha(l.percReidi);
      const modo = modoReidiDeTexto(l.modo, false);
      const ufO = ter.uf || '';
      const ufD = obra.ufObra || '';
      ped = {
        id: novoIdFD('ped'), terceiroId: ter.id, numero: String(l.pedido), dataEmissao: dataPlanilha(l.data), valor: paraNumero(l.valorPedido),
        modoReidi: modo, percentualReidi: modo === 'pedido' && percLido != null ? (percLido < 1 ? percLido * 100 : percLido) : null, ufOrigem: ufO, ufDestino: ufD, importado: false,
        difalPerc: calcularDifal(ufO, ufD, false).perc, observacoes: 'Importado de planilha.', produtos: [], insumoNome: ins.nome, terceiroNome: ter.nome,
      };
      plano.pedidos.push(ped);
    }
    if (l.descricao || l.produtoNome) {
      const vals = completarValoresReidi(ped.modoReidi, ped.percentualReidi, numPlanilha(l.unitSem), numPlanilha(l.unitCom) ?? numPlanilha(l.unit));
      ped.produtos.push({
        id: novoIdFD('pro'), pedidoId: ped.id, descricao: String(l.produtoNome || l.descricao),
        detalhe: l.produtoNome && l.descricao && String(l.descricao) !== String(l.produtoNome) ? String(l.descricao) : '',
        descricaoNF: l.descricaoNF ? String(l.descricaoNF) : '',
        unidade: l.unidade ? String(l.unidade) : '', quantidade: vn(numPlanilha(l.quantidade)),
        unitSem: vals.unitSem, unitCom: vals.unitCom, ajusteManual: vals.ajusteManual,
      });
    }
  });
  /* valor do pedido = soma dos produtos; o "Valor Pedido" da planilha so serve de conferencia */
  plano.divergencias = [];
  plano.pedidos.forEach((p) => {
    const soma = p.produtos.reduce((t, x) => t + x.quantidade * x.unitCom, 0);
    if (p.valor != null && Math.abs(vn(p.valor) - soma) > 0.05) plano.divergencias.push(`${p.numero}: planilha ${formatarMoeda(p.valor)} × produtos ${formatarMoeda(soma)}`);
    p.valor = soma;
  });
  return plano;
}

function abrirImportacaoPedidos() {
  const area = h('div', {});
  let plano = null;
  let modal = null;
  let ultimoArquivo = null;
  /* insumo para linhas sem a coluna Insumo (quando o terceiro ainda nao esta cadastrado) */
  const seletorInsumo = h('select', { class: 'ctc-select', 'aria-label': 'Insumo padrão' },
    h('option', { value: '' }, 'Insumo para linhas sem a coluna Insumo: escolher...'),
    ...insumos.map((i) => h('option', { value: i.id }, i.nome)));
  seletorInsumo.addEventListener('change', () => { if (ultimoArquivo) processar(ultimoArquivo); });
  const entrada = h('input', { type: 'file', accept: '.xlsx,.xls,.csv,.pdf', class: 'ctc-input' });
  entrada.addEventListener('change', () => processar(entrada.files[0]));
  async function processar(arquivo) {
    if (!arquivo) return;
    ultimoArquivo = arquivo;
    if (/\.pdf$/i.test(arquivo.name)) {
      modal.fechar();
      abrirModalPedido(null, '', { arquivoInicial: arquivo });
      return;
    }
    area.replaceChildren(criarAlerta({ tipo: 'info', mensagem: `Lendo ${arquivo.name}...` }));
    try {
      plano = planejarImportacaoPedidos(await lerPlanilhaFD(arquivo), { insumoPadraoId: seletorInsumo.value });
      const nProd = plano.pedidos.reduce((t, p) => t + p.produtos.length, 0);
      const semQtd = plano.pedidos.reduce((t, p) => t + p.produtos.filter((x) => !x.quantidade).length, 0);
      const semValor = plano.pedidos.filter((p) => !p.valor).length;
      area.replaceChildren(h('div', { class: 'ctc-stack' },
        criarAlerta({ tipo: plano.pedidos.length ? 'success' : 'warning', titulo: `${plano.pedidos.length} pedido(s) e ${nProd} produto(s) prontos para importar`, mensagem: 'Nada foi gravado ainda. Confira e clique em Importar.' }),
        plano.insumosNovos.length ? criarAlerta({ tipo: 'warning', titulo: 'Insumos novos (valor total 0 — complete depois)', mensagem: plano.insumosNovos.map((i) => i.nome).join(', ') }) : null,
        plano.terceirosNovos.length ? criarAlerta({ tipo: 'info', titulo: 'Terceiros novos', mensagem: plano.terceirosNovos.map((t) => `${t.nome}${t.uf ? ` (${t.uf})` : ' (sem UF)'}`).join(', ') }) : null,
        plano.ignorados.length ? criarAlerta({ tipo: 'info', titulo: 'Pedidos já existentes (ignorados)', mensagem: plano.ignorados.join(', ') }) : null,
        plano.erros.length ? criarAlerta({ tipo: 'danger', titulo: 'Linhas com problema', mensagem: plano.erros.slice(0, 10).join(' ') }) : null,
        semQtd ? criarAlerta({ tipo: 'warning', titulo: `${semQtd} produto(s) sem quantidade contratada`, mensagem: 'Eles entram com quantidade 0. Informe a quantidade de cada produto no pedido (aba Pedidos e produtos): é dela que as NFs abatem as unidades.' }) : null,
        semValor ? criarAlerta({ tipo: 'warning', mensagem: `${semValor} pedido(s) com valor 0: o valor do pedido é a soma dos produtos e eles estão sem quantidade.` }) : null,
        plano.divergencias.length ? criarAlerta({ tipo: 'info', titulo: 'Valor da planilha diferente da soma dos produtos (vale a soma)', mensagem: plano.divergencias.slice(0, 5).join(' · ') }) : null,
        criarTabela({
          dados: plano.pedidos.map((p) => ({ numero: p.numero, terceiro: p.terceiroNome, insumo: p.insumoNome, produtos: p.produtos.length, valor: p.valor, modo: p.modoReidi === 'pedido' ? `% único ${percExato(p.percentualReidi)}` : 'Por produto' })),
          compacta: true, altura: 'auto',
          colunas: [
            { campo: 'numero', titulo: 'Pedido' }, { campo: 'insumo', titulo: 'Insumo' }, { campo: 'terceiro', titulo: 'Terceiro' },
            { campo: 'modo', titulo: 'REIDI' }, { campo: 'produtos', titulo: 'Produtos', tipo: 'numero' }, { campo: 'valor', titulo: 'Valor', tipo: 'moeda', total: 'soma' },
          ],
        }).elemento));
    } catch (erro) {
      plano = null;
      area.replaceChildren(criarAlerta({ tipo: 'danger', titulo: 'Falha ao ler a planilha', mensagem: erro.message }));
    }
  }
  modal = criarModal({
    titulo: 'Importar pedidos e produtos', tamanho: 'xl', destruirAoFechar: true,
    conteudo: [
      criarAlerta({
        tipo: 'info',
        mensagem: 'PDF de um pedido: abre o cadastro já preenchido. Planilha: uma linha por produto (pode ter título acima do cabeçalho). Aceita também "Produto correspondente" (descrição na NF) e "R$ Unit. PEDIDO" (valor pago, COM REIDI). Colunas reconhecidas pelo nome: Insumo, Terceiro, CNPJ Terceiro, UF Terceiro, Nº Pedido, Data Emissão, Valor Pedido, Modo REIDI (produto/pedido), % REIDI Pedido, Descrição, Unidade, Quantidade, Valor Unit SEM REIDI, Valor Unit COM REIDI.',
        acoes: [{ texto: 'Baixar modelo (CSV)', onClick: () => baixarTextoFD('modelo-pedidos-faturamento-direto.csv', `${CABECALHO_MODELO.join(';')}\n`) }],
      }),
      seletorInsumo,
      entrada,
      area,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      {
        texto: 'Importar', variante: 'primary', fechar: false,
        onClick: () => {
          if (!plano || !plano.pedidos.length) { toast.aviso('Nenhum pedido para importar'); return; }
          insumos.push(...plano.insumosNovos);
          terceiros.push(...plano.terceirosNovos);
          plano.pedidos.forEach(({ produtos: lista, insumoNome, terceiroNome, ...ped }) => { pedidos.push(ped); produtos.push(...lista); });
          modal.fechar();
          registrarAlteracao();
          toast.sucesso('Importação concluída', `${plano.pedidos.length} pedido(s)`);
          completarUfPorCnpj(plano.terceirosNovos);
        },
      },
    ],
  });
  modal.abrir();
}

/* ---- Informacoes da obra: Excel/CSV ---- */

const CAMPOS_OBRA = [
  { campo: 'nome', rotulo: 'Nome da Obra' },
  { campo: 'inicio', rotulo: 'Início da Obra', tipo: 'data' },
  { campo: 'fim', rotulo: 'Fim da Obra', tipo: 'data' },
  { campo: 'modoPrazo', rotulo: 'Modo do prazo' },
  { campo: 'duracaoDias', rotulo: 'Duração do contrato (dias)', tipo: 'numero' },
  { campo: 'bmInicial', rotulo: 'BM inicial', tipo: 'numero' },
  { campo: 'bmFinal', rotulo: 'BM final', tipo: 'numero' },
  { campo: 'bmMesInicial', rotulo: 'Mês do BM inicial', tipo: 'mes' },
  { campo: 'consorcio', rotulo: 'Consórcio' },
  { campo: 'cliente', rotulo: 'Cliente' },
  { campo: 'ufObra', rotulo: 'UF da obra' },
];

/** Reconhece o campo da obra pelo nome da coluna/linha da planilha. */
function mapearCampoObra(nome) {
  const k = chaveColuna(nome);
  if (k.includes('mesdobm')) return 'bmMesInicial';
  if (k.includes('bminicial')) return 'bmInicial';
  if (k.includes('bmfinal')) return 'bmFinal';
  if (k.includes('inicio')) return 'inicio';
  if (k.includes('termino') || k.startsWith('fim') || k.includes('datafim')) return 'fim';
  if (k.includes('modo')) return 'modoPrazo';
  if (k.includes('duracao') || k.includes('prazodias')) return 'duracaoDias';
  if (k.includes('consorcio')) return 'consorcio';
  if (k.includes('cliente') || k.includes('contratante')) return 'cliente';
  if (k.startsWith('uf') || k.includes('estado')) return 'ufObra';
  if (k.includes('nome') || k === 'obra') return 'nome';
  return null;
}

function valorCampoObra(campo, bruto) {
  if (bruto == null || String(bruto).trim() === '') return undefined;
  if (campo === 'inicio' || campo === 'fim') return dataPlanilha(bruto) || undefined;
  if (campo === 'bmMesInicial') {
    const t = String(bruto).trim();
    if (/^\d{4}-\d{2}$/.test(t)) return t;
    const iso = dataPlanilha(bruto);
    return iso ? iso.slice(0, 7) : undefined;
  }
  if (['duracaoDias', 'bmInicial', 'bmFinal'].includes(campo)) {
    const n = typeof bruto === 'number' ? bruto : paraNumero(String(bruto).replace(/^BM/i, ''));
    return n == null ? undefined : n;
  }
  if (campo === 'modoPrazo') return normalizarTexto(bruto).includes('uteis') ? 'Dias úteis' : 'Dias corridos';
  if (campo === 'ufObra') {
    const uf = String(bruto).trim().toUpperCase().slice(0, 2);
    return UFS.includes(uf) ? uf : undefined;
  }
  return String(bruto).trim();
}

/**
 * Aceita dois formatos: vertical (colunas "Campo" e "Valor", uma linha por campo)
 * ou horizontal (uma coluna por campo, valores na 1a linha).
 */
function lerInformacoesObra(linhas) {
  const lido = {};
  if (!linhas.length) return lido;
  const chaves = Object.keys(linhas[0]).map(chaveColuna);
  if (chaves.includes('campo') && chaves.includes('valor')) {
    linhas.forEach((l) => {
      const par = Object.fromEntries(Object.entries(l).map(([k, v]) => [chaveColuna(k), v]));
      const campo = mapearCampoObra(par.campo);
      const v = campo ? valorCampoObra(campo, par.valor) : undefined;
      if (campo && v !== undefined && lido[campo] === undefined) lido[campo] = v;
    });
  } else {
    Object.entries(linhas[0]).forEach(([k, bruto]) => {
      const campo = mapearCampoObra(k);
      const v = campo ? valorCampoObra(campo, bruto) : undefined;
      if (campo && v !== undefined && lido[campo] === undefined) lido[campo] = v;
    });
  }
  return lido;
}

function exibirCampoObra(campo, valor) {
  if (valor == null || valor === '') return '—';
  if (campo === 'inicio' || campo === 'fim') return formatarData(valor);
  if (campo === 'bmInicial' || campo === 'bmFinal') return `BM${valor}`;
  if (campo === 'bmMesInicial') return formatarData(valor, 'mes-ano');
  return String(valor);
}

function abrirImportacaoObra() {
  const area = h('div', {});
  let lido = null;
  const entrada = h('input', { type: 'file', accept: '.xlsx,.xls,.csv,.pdf', class: 'ctc-input' });
  entrada.addEventListener('change', async () => {
    const arquivo = entrada.files[0];
    if (!arquivo) return;
    area.replaceChildren(criarAlerta({ tipo: 'info', mensagem: `Lendo ${arquivo.name}...` }));
    try {
      lido = lerInformacoesObra(/\.pdf$/i.test(arquivo.name) ? await linhasObraDePdf(arquivo) : await lerPlanilhaFD(arquivo));
      const fim = lido.fim ?? obra.fim;
      const ini = lido.inicio ?? obra.inicio;
      if (ini && fim && fim < ini) throw new Error('A data de fim está antes da data de início.');
      if (lido.duracaoDias === undefined && ini && fim) lido.duracaoDias = calcularDuracaoDias(ini, fim, lido.modoPrazo ?? obra.modoPrazo);
      if (lido.bmFinal === undefined && ini && fim) lido.bmFinal = vn(lido.bmInicial ?? obra.bmInicial ?? 1) + diferencaEmMeses(ini, fim);
      const encontrados = CAMPOS_OBRA.filter((c) => lido[c.campo] !== undefined);
      if (!encontrados.length) throw new Error('Nenhum campo da obra reconhecido. Use o modelo (colunas Campo e Valor).');
      area.replaceChildren(h('div', { class: 'ctc-stack' },
        criarAlerta({ tipo: 'success', titulo: `${encontrados.length} campo(s) reconhecido(s)`, mensagem: 'Nada foi gravado ainda. Confira e clique em Aplicar. Campos que não vieram na planilha continuam como estão.' }),
        criarTabela({
          dados: CAMPOS_OBRA.map((c) => ({
            rotulo: c.rotulo, atual: exibirCampoObra(c.campo, obra[c.campo]),
            novo: lido[c.campo] === undefined ? 'não informado' : exibirCampoObra(c.campo, lido[c.campo]),
            muda: lido[c.campo] !== undefined && String(lido[c.campo]) !== String(obra[c.campo] ?? ''),
          })),
          compacta: true, altura: 'auto',
          linhaVariante: (l) => (l.muda ? 'info' : null),
          colunas: [
            { campo: 'rotulo', titulo: 'Campo', ordenavel: false },
            { campo: 'atual', titulo: 'Atual', ordenavel: false },
            { campo: 'novo', titulo: 'Da planilha', ordenavel: false },
          ],
        }).elemento));
    } catch (erro) {
      lido = null;
      area.replaceChildren(criarAlerta({ tipo: 'danger', titulo: 'Falha ao ler a planilha', mensagem: erro.message }));
    }
  });
  const modeloCsv = ['Campo;Valor', ...CAMPOS_OBRA.map((c) => `${c.rotulo};`)].join('\n');
  const modal = criarModal({
    titulo: 'Importar informações da obra', tamanho: 'lg', destruirAoFechar: true,
    conteudo: [
      criarAlerta({
        tipo: 'info',
        mensagem: 'Planilha Excel ou CSV com as colunas "Campo" e "Valor" (uma linha por informação: Nome da Obra, Início, Fim, Modo do prazo, Duração, BM inicial, BM final, Consórcio, Cliente, UF). Também aceita uma linha só, com uma coluna para cada campo.',
        acoes: [{ texto: 'Baixar modelo (CSV)', onClick: () => baixarTextoFD('modelo-informacoes-obra.csv', `${modeloCsv}\n`) }],
      }),
      entrada,
      area,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      {
        texto: 'Aplicar', variante: 'primary', fechar: false,
        onClick: () => {
          if (!lido) { toast.aviso('Escolha a planilha primeiro'); return; }
          const novos = Object.fromEntries(Object.entries(lido).filter(([, v]) => v !== undefined));
          obra = { ...obra, ...novos };
          if (appAtual) appAtual.cabecalho.definirSubtitulo(identidade.subtitulo || obra.nome || '');
          modal.fechar();
          registrarAlteracao();
          toast.sucesso('Informações da obra importadas', 'Salve a base para gravar.');
        },
      },
    ],
  });
  modal.abrir();
}
