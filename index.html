/* ---- Visao geral: exportacao completa (recorte atual de insumo/terceiro) ---- */

function exportarTudo({ comAditivos = false } = {}) {
  const passaPedido = (p) => (!filtroBase.insumo || insumoDoPedido(p)?.nome === filtroBase.insumo)
    && (!filtroBase.terceiro || terceiroDoPedido(p)?.nome === filtroBase.terceiro);
  const ins = insumos.filter((i) => !filtroBase.insumo || i.nome === filtroBase.insumo);
  const ters = terceiros.filter((t) => ins.some((i) => i.id === t.insumoId) && (!filtroBase.terceiro || t.nome === filtroBase.terceiro));
  const peds = pedidos.filter(passaPedido);
  const nfs = notas.filter((n) => peds.some((p) => p.id === n.pedidoId));
  const bols = boletos.filter((b) => nfs.some((n) => n.id === b.notaId));
  const obraLinhas = CAMPOS_OBRA.map((c) => [c.rotulo, ['inicio', 'fim'].includes(c.campo) ? dataTexto(obra[c.campo]) : (obra[c.campo] ?? '')]);
  obraLinhas.push(['Fim vigente (com aditivos)', dataTexto(fimVigente())], ['BM final vigente', bmFinalVigente()]);
  const linhasPedidos = [];
  peds.forEach((p) => {
    const ter = terceiroDoPedido(p);
    const r = resumoPedido(p);
    const base = [insumoDoPedido(p)?.nome || '', ter?.nome || '', ter?.cnpj || '', ter?.uf || '', p.numero, dataTexto(p.dataEmissao), vn(p.valor),
      p.modoReidi || 'produto', temPercPedido(p) ? vn(p.percentualReidi) : ''];
    const fim = [r.faturado, r.saldo, p.observacoes || ''];
    if (!r.prods.length) linhasPedidos.push([...base, '', '', '', '', '', vn(p.difalPerc), '', ...fim, '']);
    r.prods.forEach((pr) => {
      const a = analisarProduto(pr);
      linhasPedidos.push([...base, pr.detalhe || pr.descricao, pr.unidade || '', vn(pr.quantidade), a.unitSem, (a.unitCom), vn(p.difalPerc), a.qtdFaturada, ...fim, pr.descricao]);
    });
  });
  const linhasNotas = linhasExportNotas(nfs);
  const linhasBoletos = bols.map((b) => {
    const nf = notaPorId(b.notaId);
    const ped = pedidoPorId(nf?.pedidoId);
    return [nf?.numero || '', ped?.numero || '', terceiroDoPedido(ped)?.nome || '', b.numero, b.valor == null ? '' : vn(b.valor), dataTexto(b.vencimento),
      dataTexto(b.pagamento), statusBoleto(b), textoGrds(b.grds), b.observacoes || ''];
  });
  const linhasTerceiros = ters.map((t) => {
    const ps = pedidos.filter((p) => p.terceiroId === t.id);
    const valor = somar(ps, 'valor');
    const fat = ps.reduce((s2, p) => s2 + resumoPedido(p).faturado, 0);
    return [insumoPorId(t.insumoId)?.nome || '', t.nome, t.cnpj || '', t.uf || '', ps.length, valor, fat, valor - fat];
  });
  exportarPlanilha(`${FORMATO_BASE}-completo-${carimboArquivo()}`, [
    { nome: 'Obra', cabecalho: ['Campo', 'Valor'], linhas: obraLinhas },
    ...(comAditivos ? [{ nome: 'Aditivos', cabecalho: CAB_ADITIVOS, linhas: linhasExportAditivos() }] : []),
    { nome: 'Insumos', cabecalho: cabecalhoInsumos(), linhas: linhasExportInsumos(ins) },
    ...(comAditivos && mesesObra().length ? [abaPlanilhaProjecao()] : []),
    { nome: 'Terceiros', cabecalho: CAB_TERCEIROS, linhas: linhasTerceiros },
    { nome: 'Pedidos e produtos', cabecalho: CAB_PEDIDOS, linhas: linhasPedidos },
    { nome: 'NFs e itens', cabecalho: CAB_NOTAS, linhas: linhasNotas },
    { nome: 'Boletos', cabecalho: CAB_BOLETOS, linhas: linhasBoletos },
  ]);
}

/* ---- Obra ---- */

function exportarObra() {
  const linhas = CAMPOS_OBRA.map((c) => [c.rotulo, ['inicio', 'fim'].includes(c.campo) ? dataTexto(obra[c.campo]) : (obra[c.campo] ?? '')]);
  const linhasAditivos = aditivosOrdenados().map((a) => [a.numero, dataTexto(a.data), a.tipo, dataTexto(a.novoFim), a.novoBmFinal ? `BM${a.novoBmFinal}` : '', insumoPorId(a.insumoId)?.nome || '', vn(a.valor), a.descricao || '']);
  exportarPlanilha(`${FORMATO_BASE}-obra-${carimboArquivo()}`, [
    { nome: 'Obra', cabecalho: ['Campo', 'Valor'], linhas },
    { nome: 'Aditivos', cabecalho: ['Nº Aditivo', 'Data', 'Tipo', 'Novo Fim', 'Novo BM Final', 'Insumo', 'Valor', 'Descrição'], linhas: linhasAditivos },
  ]);
}

/* =============================================================================
   13. RELATORIOS (Controlador > Gerar relatorios)
   - Relatorio para o cliente (PDF): modelo "Relatorio — Faturamento Direto"
     (A4 paisagem). Gerado como pagina propria e impresso pelo navegador
     ("Salvar como PDF"), o que mantem textos e tabelas em vetor.
   - Apresentacao FD por terceiro: o MESMO conjunto de slides sai em PowerPoint
     (PptxGenJS, carregado sob demanda) e em PDF (pagina 16:9 impressa).
     Os slides sao descritos uma unica vez (elementos em polegadas) e dois
     desenhistas os convertem: um para .pptx e outro para HTML.
   Os documentos gerados ficam FORA da interface do app: por isso tem estilos
   proprios (sao arquivos de saida, como o SVG dos graficos).
   ========================================================================== */

const URL_PPTXGEN = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';

/** Paleta dos modelos de referencia (hex sem #). */
const COR_REL = {
  navy: '1A2F4E', titulo: '00144D', azul: '2041E8', vermelho: 'E63946', verde: '2D9E6B', ambar: 'E6A817',
  laranja: 'F4A261', roxo: '7C3AED', cinza: '6C757D', cinzaPonto: '9AA3AD', cabecalho: '243D61', faixaNF: '2E86AB',
  faixaBoleto: 'C2702E', texto: '1A1A2E', borda: 'DEE2E6', textoSub: '495057', descricao: '8A94A6',
};

const MESES_ABREV = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
const MESES_NOME = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

/** Opcoes escolhidas na aba (ficam guardadas enquanto o app estiver aberto). */
const opcoesRelCliente = {
  capa: true, reidi: true, relacaoNotas: true, totalGeral: true, kpis: true, grafico: true, visaoPedidos: true, atividades: true,
};
const opcoesRelTerceiro = {
  atividades: true, relacaoNotas: true, linhaTotal: true, grafico: true, consumoMes: true, capa: true,
};
let terceirosRelatorio = null;   // ids escolhidos; null = todos

const esc = (v) => escaparHtml(v == null ? '' : String(v));
const moedaRel = (v) => formatarMoeda(vn(v));
const percRel = (v, casas = 1) => formatarPercentual(vn(v), { casas });
const dataRel = (v) => (v ? formatarData(v) : '—');
const mesCurtoRel = (iso) => {
  const [a, m] = String(iso || '').split('-');
  return a && m ? `${MESES_ABREV[Number(m) - 1]}/${a.slice(2)}` : '';
};

function agoraRel() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return { data: formatarData(d), hora: `${p(d.getHours())}:${p(d.getMinutes())}`, mesIso: formatarData(d, 'iso-mes'), mesNome: `${MESES_NOME[d.getMonth()]}/${d.getFullYear()}` };
}

/** Situacao do pedido pelo % consumido: Normal (ate 79,9%), Critico (80% a 99,9%), Esgotado (100% ou mais). */
const corSituacaoRel = (perc) => (perc >= 99.995 ? COR_REL.vermelho : perc >= 80 ? COR_REL.ambar : COR_REL.verde);

/** Status do boleto no relatorio: Pago, Vence hoje / Vence em Nd (ate 2 dias), Atrasado, A vencer. */
function statusBoletoRel(b) {
  const st = statusBoleto(b);
  if (st === 'Pago') return { texto: 'Pago', cor: COR_REL.verde, fundo: 'D4F4E2' };
  if (st === 'Cancelado') return { texto: 'Cancelado', cor: COR_REL.cinzaPonto, fundo: 'EEF0F3' };
  if (st === 'Vencido') return { texto: 'Atrasado', cor: COR_REL.vermelho, fundo: 'FDE2E4' };
  if (st === 'Em contestação') return { texto: 'Em contestação', cor: COR_REL.ambar, fundo: 'FEF3C7' };
  if (b.vencimento) {
    const dias = Math.round((paraData(b.vencimento) - paraData(hojeIso())) / 86400000);
    if (dias <= 0) return { texto: 'Vence hoje', cor: COR_REL.ambar, fundo: 'FEF3C7' };
    if (dias <= 2) return { texto: `Vence em ${dias}d`, cor: COR_REL.ambar, fundo: 'FEF3C7' };
  }
  return { texto: 'A vencer', cor: COR_REL.cinzaPonto, fundo: 'EEF0F3' };
}

/** Descricao da NF: produtos vinculados + itens sem pedido (no maximo 4 linhas). */
function descricaoNFRel(nf) {
  /* produto com a quantidade faturada nesta NF (e o REIDI do item, quando houver) */
  const linhas = [
    ...(nf.itens || []).map((i) => {
      const pr = produtoPorId(i.produtoId);
      if (!pr) return null;
      const reidi = vn(i.quantidade) * Math.max(0, vn(pr.unitSem) - vn(i.valorUnit));
      return `${pr.descricao} — ${formatarNumero(i.quantidade)} ${pr.unidade || ''}`.trim() + (reidi > 0.004 ? ` · REIDI ${moedaRel(reidi)}` : '');
    }).filter(Boolean),
    ...(nf.itensSemVinculo || []).map((i) => (i.descricao ? `${i.descricao} (sem produto no pedido)` : null)).filter(Boolean),
  ];
  if (!linhas.length) return ['—'];
  return linhas.length > 4 ? [...linhas.slice(0, 3), `… e mais ${linhas.length - 3} item(ns)`] : linhas;
}

/** Descricao curta do pedido (produto unico: o detalhe dele). */
function descricaoPedidoRel(ped) {
  const prods = produtosDoPedido(ped.id);
  if (prods.length === 1) return prods[0].detalhe || prods[0].descricao || '';
  return '';
}

/** NF com seus boletos, pronta para as tabelas dos relatorios. */
function linhaNFRel(nf) {
  const bols = ordenar(boletosDaNota(nf.id), 'vencimento', 'asc', 'data');
  return {
    nf, bols,
    descricao: descricaoNFRel(nf),
    vencimento: nf.vencimento || (bols[0] && bols[0].vencimento) || '',
    grd: textoGrds(nf.grds) || '—',
    percReidi: vn(nf.valor) > 0 ? (vn(nf.reidi) / vn(nf.valor)) * 100 : 0,
  };
}

/** Dados consolidados dos relatorios. terceiroIds: null = todos. */
function dadosRelatorio(terceiroIds = null) {
  const cods = codigosHierarquia();
  const ordem = (id) => (cods.get(id) || {}).ordem || 'zzz';
  const ters = terceiros.filter((t) => !terceiroIds || terceiroIds.includes(t.id)).sort((a, b) => ordem(a.id).localeCompare(ordem(b.id)));
  const peds = [];
  ters.forEach((t) => {
    pedidos.filter((p) => p.terceiroId === t.id).sort((a, b) => ordem(a.id).localeCompare(ordem(b.id))).forEach((p) => {
      const r = resumoPedido(p);
      const nfs = r.nfs.slice().sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')) || String(a.numero).localeCompare(String(b.numero), 'pt-BR', { numeric: true }));
      const linhas = nfs.map(linhaNFRel);
      peds.push({
        ped: p, ter: t, ins: insumoPorId(t.insumoId), valor: vn(p.valor), consumido: r.faturado, reidi: somar(nfs, 'reidi'),
        saldo: r.saldo, perc: r.perc, nfs: linhas, descricao: descricaoPedidoRel(p),
        boletos: linhas.reduce((t2, l) => t2 + l.bols.reduce((s, b) => s + vn(b.valor), 0), 0),
      });
    });
  });
  const previsto = insumos.reduce((t, i) => t + valorVigente(i), 0);
  const consumidoContrato = somar(notas, 'valor');
  return {
    ters, peds, previsto, nInsumos: insumos.length,
    consumidoContrato, nNotasContrato: notas.length,
    comprometidoContrato: somar(pedidos, 'valor'),
    reidiContrato: somar(notas, 'reidi'),
    agora: agoraRel(),
  };
}

/* ---- Grafico: evolucao mensal (SVG; no PowerPoint vira imagem) ---- */

function rotuloMilMi(v, casas = null) {
  const a = Math.abs(vn(v));
  const fmt = (x, padrao) => x.toLocaleString('pt-BR', { minimumFractionDigits: casas ?? padrao, maximumFractionDigits: casas ?? padrao });
  if (a >= 1e6) return `${fmt(v / 1e6, 1)} mi`;
  if (a >= 1e3) return `${fmt(v / 1e3, 0)} mil`;
  return a ? Math.round(v).toLocaleString('pt-BR') : '0';
}

function textosGraficoEvolucao(s) {
  const periodo = `${dataRel(obra.inicio)} → ${dataRel(fimVigente())}`;
  const titulo = `Evolução Mensal do Consumo de Faturamento Direto — ${obra.nome || 'Obra'} | ${periodo}`;
  const n = s.meses.length;
  const ini = Math.max(0, s.emAndamento >= 0 ? s.emAndamento : s.idxRef + 1);
  if (!n || ini >= n) return { titulo, subtitulo: 'Rótulos em R$ (mil / mi).' };
  const resto = s.tendMensal.slice(ini).reduce((t, v) => t + v, 0);
  const projetado = s.total > 0 ? (s.acumTend[n - 1] / s.total) * 100 : 0;
  return {
    titulo,
    subtitulo: `Tendência projetada: ${moedaRel(resto)} distribuídos de ${mesCurtoRel(s.meses[ini])} a ${mesCurtoRel(s.meses[n - 1])} — acumulado projetado de ${formatarPercentual(projetado, { casas: 2 })} do previsto do contrato. Rótulos em R$ (mil / mi).`,
  };
}

function svgEvolucao(s, {
  largura = 1300, altura = 440, comPrevisto = false, titulo: tituloFixo = null,
} = {}) {
  const textos = textosGraficoEvolucao(s);
  const titulo = tituloFixo || textos.titulo;
  const { subtitulo } = textos;
  const n = s.meses.length;
  const fonte = 'Arial, Helvetica, sans-serif';
  const partes = [];
  const t = (x, y, texto, { tam = 11, cor = '#333', peso = 'normal', anc = 'middle', ital = false } = {}) => partes.push(
    `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${fonte}" font-size="${tam}" fill="${cor}" font-weight="${peso}" text-anchor="${anc}"${ital ? ' font-style="italic"' : ''}>${esc(texto)}</text>`);
  partes.push(`<rect x="0" y="0" width="${largura}" height="${altura}" fill="#FFFFFF"/>`);
  t(largura / 2, 24, titulo, { tam: 15, cor: '#1F2A44', peso: 'bold' });
  t(largura / 2, 43, subtitulo, { tam: 10.5, cor: '#6C757D', ital: true });
  /* legenda */
  const itens = [
    { texto: 'Acumulado real', tipo: 'caixa', cor: '#E63946', fundo: '#FFFFFF' },
    { texto: 'Tendência acumulada (projetada)', tipo: 'tracejado', cor: '#D9822B' },
    { texto: 'NF no mês (real)', tipo: 'caixa', cor: '#4A8DB0', fundo: '#8DBBD3' },
    { texto: 'Tendência no mês (projetada)', tipo: 'caixa', cor: '#F0B48A', fundo: '#FCE4D3' },
    ...(comPrevisto ? [{ texto: 'Previsto acumulado', tipo: 'linha', cor: '#5B6B8C' }] : []),
  ];
  /* mes atual (em andamento): barra da tendencia do mes atras da barra do real ja lancado */
  const iAtual = s.emAndamento ?? -1;
  const larguraItem = itens.map((i) => 34 + i.texto.length * 6.1);
  let lx = largura / 2 - larguraItem.reduce((a, b) => a + b, 0) / 2;
  itens.forEach((it, i) => {
    if (it.tipo === 'caixaTracejada') {
      partes.push(`<rect x="${lx}" y="58" width="24" height="11" fill="${it.fundo}" stroke="${it.cor}" stroke-width="1.5" stroke-dasharray="3 2"/>`);
    } else if (it.tipo === 'linha') {
      partes.push(`<line x1="${lx}" x2="${lx + 24}" y1="63.5" y2="63.5" stroke="${it.cor}" stroke-width="2.5"/>`);
    } else if (it.tipo === 'tracejado') {
      partes.push(`<rect x="${lx}" y="58" width="24" height="11" fill="#FFFFFF" stroke="${it.cor}" stroke-width="2" stroke-dasharray="4 3"/>`);
    } else {
      partes.push(`<rect x="${lx}" y="58" width="24" height="11" fill="${it.fundo}" stroke="${it.cor}" stroke-width="2"/>`);
    }
    t(lx + 29, 67.5, it.texto, { tam: 11, cor: '#333', anc: 'start' });
    lx += larguraItem[i];
  });
  const L = 52; const R = 22; const T = 92; const B = 32;
  const W = largura - L - R; const H = altura - T - B;
  if (!n) {
    t(largura / 2, T + H / 2, 'Informe início e fim da obra para montar a evolução mensal.', { tam: 13, cor: '#6C757D' });
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${largura} ${altura}" width="${largura}" height="${altura}">${partes.join('')}</svg>`;
  }
  const total = s.total > 0 ? s.total : 1;
  const yMax = 105;
  const y = (v) => T + H - (Math.max(0, Math.min(yMax, (vn(v) / total) * 100)) / yMax) * H;
  const slot = W / n;
  const cx = (i) => L + slot * (i + 0.5);
  const bw = Math.min(26, slot * 0.5);
  [0, 20, 40, 60, 80, 100].forEach((p) => {
    const yy = T + H - (p / yMax) * H;
    partes.push(`<line x1="${L}" x2="${L + W}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${p ? '#EEF1F5' : '#C9CFD8'}" stroke-width="1"/>`);
    t(L - 6, yy + 4, `${p}%`, { tam: 10, cor: '#555', anc: 'end' });
  });
  /* eixo vai ate 100% (o espaco acima e so folga para os rotulos) */
  s.meses.forEach((m, i) => t(cx(i), T + H + 18, mesCurtoRel(m), { tam: 10, cor: '#555' }));
  /*
   * Rotulos de valor: o valor do MES fica em cima de cada barra e o ACUMULADO em cima de cada
   * ponto da linha. Todos levam contorno branco (aparecem mesmo sobre a linha tracejada) e sao
   * desenhados por ultimo. Quando o rotulo da linha cairia em cima do rotulo da barra do mesmo
   * mes, ele sobe para ficar acima (o caso do inicio da obra, com a linha rente as barras).
   */
  const rotulos = [];
  const rot = (x, yy, texto, cor, peso = 'bold') => rotulos.push({ x, y: yy, texto, cor, peso });
  const barra = (i, v, larguraExtra, fill, stroke) => {
    const yy = y(v);
    partes.push(`<rect x="${(cx(i) - (bw + larguraExtra) / 2).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw + larguraExtra).toFixed(1)}" height="${Math.max(1, T + H - yy).toFixed(1)}" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`);
    return yy;
  };
  const topoRotuloBarra = new Array(n).fill(null);
  /* y do ponto da linha acumulada no mes (real nos fechados; tendencia do mes atual em diante) */
  const yPontoLinha = (i) => {
    const fechado = iAtual >= 0 ? i < iAtual : i <= s.idxRef;
    const v = fechado ? s.acumReal[i] : s.acumTend[i];
    return v == null ? null : y(v);
  };
  /* rotulo da barra: em cima; se o ponto da linha cair sobre ele, dentro da barra (quando cabe) */
  const rotBarra = (i, yTopo, texto, cor) => {
    const yp = yPontoLinha(i);
    let yl = yTopo - 5;
    if (yp != null && yp > yl - 14 && yp < yl + 8 && T + H - yTopo >= 14) yl = yTopo + 11;
    rot(cx(i), yl, texto, cor);
    if (yl < yTopo) topoRotuloBarra[i] = yl;
  };
  s.meses.forEach((m, i) => {
    if (i === iAtual) {
      /* mes atual: tendencia do mes (laranja) com o real ja lancado na frente (azul) */
      const vt = vn(s.tendMensal[i]);
      const vr = vn(s.real[i]);
      const yt = vt > 0 ? barra(i, vt, 8, '#FCE4D3', '#F0B48A') : null;
      const yr = vr > 0 ? barra(i, vr, 0, '#8DBBD3', '#4A8DB0') : null;
      if (yt != null) rotBarra(i, yt, rotuloMilMi(vt), '#C46A1B');
      void yr;   /* real parcial do mes: so a barra azul, sem rotulo (evita poluir) */
      return;
    }
    const real = i <= s.idxRef;
    const v = real ? s.real[i] : s.tendMensal[i];
    if (!(v > 0)) return;
    const yy = barra(i, v, 0, real ? '#8DBBD3' : '#FCE4D3', real ? '#4A8DB0' : '#F0B48A');
    if (real && rotuloMilMi(v) === rotuloMilMi(s.acumReal[i])) return;
    rotBarra(i, yy, rotuloMilMi(v), real ? '#2F6E8F' : '#C46A1B');
  });
  /* posicao do rotulo de um ponto da linha: acima do ponto; se encostar no rotulo da barra, acima dele */
  const yRotuloLinha = (i, yPonto) => {
    let yl = yPonto - 10;
    const yb = topoRotuloBarra[i];
    if (yb != null && Math.abs(yl - yb) < 12) yl = Math.min(yl, yb) - 13;
    return yl;
  };
  /* previsto acumulado (opcional): linha fina, sem rotulos, por baixo das demais */
  if (comPrevisto) {
    partes.push(`<polyline fill="none" stroke="#5B6B8C" stroke-width="2" stroke-opacity="0.75" points="${s.acumPrev.map((v, i) => `${cx(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`);
  }
  /* linha acumulada real */
  const pontosReal = [];
  const ultimoFechado = iAtual >= 0 ? iAtual - 1 : s.idxRef;
  for (let i = 0; i <= ultimoFechado; i += 1) pontosReal.push([cx(i), y(s.acumReal[i] || 0), s.acumReal[i] || 0, i]);
  const yRotuloReal = new Map();
  if (pontosReal.length) {
    partes.push(`<polyline fill="none" stroke="#E63946" stroke-width="2.5" points="${pontosReal.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}"/>`);
    pontosReal.forEach((p) => {
      partes.push(`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#E63946"/>`);
      if (p[2] > 0) {
        const yl = yRotuloLinha(p[3], p[1]);
        yRotuloReal.set(p[3], yl);
        rot(p[0], yl, rotuloMilMi(p[2]), '#C1121F');
      }
    });
  }
  /* linha de tendencia acumulada (a partir do ultimo mes fechado) */
  const inicioTend = Math.max(0, iAtual >= 0 ? iAtual - 1 : s.idxRef);
  const pontosTend = [];
  for (let i = inicioTend; i < n; i += 1) pontosTend.push([cx(i), y(s.acumTend[i]), s.acumTend[i], i]);
  if (pontosTend.length > 1) {
    partes.push(`<polyline fill="none" stroke="#D9822B" stroke-width="2.5" stroke-dasharray="7 5" points="${pontosTend.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}"/>`);
    pontosTend.forEach((p) => {
      if (p[3] <= s.idxRef && p[3] !== iAtual) return;
      partes.push(`<rect x="${(p[0] - 4.5).toFixed(1)}" y="${(p[1] - 4.5).toFixed(1)}" width="9" height="9" fill="#D9822B" transform="rotate(45 ${p[0].toFixed(1)} ${p[1].toFixed(1)})"/>`);
      let yl = yRotuloLinha(p[3], p[1]);
      /* mes atual: o rotulo do real acumulado ja esta ali; a tendencia sobe se encostar, ou sai se for o mesmo valor */
      if (yRotuloReal.has(p[3])) {
        const yr = yRotuloReal.get(p[3]);
        if (rotuloMilMi(p[2]) === rotuloMilMi(s.acumReal[p[3]])) return;
        if (Math.abs(yl - yr) < 12) yl = Math.min(yl, yr) - 13;
      }
      /* tendencia acumulada: 2 casas decimais */
      rot(p[0], yl, rotuloMilMi(p[2], 2), '#C46A1B');
    });
  }
  /* rotulos por ultimo, com contorno branco */
  rotulos.forEach((r) => partes.push(
    `<text x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" font-family="${fonte}" font-size="10" fill="${r.cor}" font-weight="${r.peso}" text-anchor="middle" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" paint-order="stroke">${esc(r.texto)}</text>`));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${largura} ${altura}" width="${largura}" height="${altura}">${partes.join('')}</svg>`;
}

/** Converte o SVG em PNG (data URL) para o PowerPoint. */
function svgParaPng(svg, largura, altura, escala = 2) {
  return new Promise((resolver, rejeitar) => {
    const imagem = new Image();
    imagem.onload = () => {
      const tela = document.createElement('canvas');
      tela.width = largura * escala;
      tela.height = altura * escala;
      const ctx = tela.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, tela.width, tela.height);
      ctx.drawImage(imagem, 0, 0, tela.width, tela.height);
      resolver(tela.toDataURL('image/png'));
    };
    imagem.onerror = () => rejeitar(new Error('Não foi possível desenhar o gráfico.'));
    imagem.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
  });
}

/* ---- Abrir documento para impressao (PDF) ---- */

function abrirDocumentoImpressao(html, { aoCarregar = null } = {}) {
  const janela = window.open('', '_blank');
  if (!janela) {
    notificar({ tipo: 'warning', titulo: 'Janela bloqueada', mensagem: 'Permita pop-ups para este arquivo e tente de novo: o relatório abre numa nova aba para salvar em PDF.' });
    return null;
  }
  janela.document.open();
  janela.document.write(html);
  janela.document.close();
  const imprimir = async () => {
    try { if (janela.document.fonts) await janela.document.fonts.ready; } catch (erro) { /* segue */ }
    await Promise.all([...janela.document.images].map((img) => (img.complete ? null : new Promise((r) => { img.onload = r; img.onerror = r; }))));
    if (aoCarregar) {
      try { aoCarregar(janela.document); } catch (erro) { console.error(erro); }
    }
    setTimeout(() => { janela.focus(); janela.print(); }, 350);
  };
  if (janela.document.readyState === 'complete') imprimir();
  else janela.addEventListener('load', imprimir);
  return janela;
}

/** Pedidos agrupados por terceiro (mesma ordem dos relatorios). */
function gruposPorTerceiro(peds) {
  const grupos = [];
  peds.forEach((p) => {
    const g = grupos[grupos.length - 1];
    if (g && g.ter.id === p.ter.id) g.peds.push(p); else grupos.push({ ter: p.ter, peds: [p] });
  });
  return grupos.map((g) => {
    const valor = somar(g.peds, 'valor'); const consumido = somar(g.peds, 'consumido');
    return { ...g, valor, consumido, reidi: somar(g.peds, 'reidi'), saldo: valor - consumido, perc: valor > 0 ? (consumido / valor) * 100 : 0 };
  });
}

/** Pontos de atencao do contrato (boletos, pedidos, e-clic e consumo do mes). */
function pontosAtencaoRel(d) {
  const todasNfs = d.peds.flatMap((p) => p.nfs);
  const bols = todasNfs.flatMap((l) => l.bols);
  const atrasados = bols.filter((b) => statusBoleto(b) === 'Vencido');
  const vencendo = bols.filter((b) => {
    if (!['Em aberto', 'Em contestação'].includes(statusBoleto(b)) || !b.vencimento) return false;
    const dias = Math.round((paraData(b.vencimento) - paraData(hojeIso())) / 86400000);
    return dias >= 0 && dias <= 2;
  });
  const esgotados = d.peds.filter((p) => p.perc >= 99.995);
  const criticos = d.peds.filter((p) => p.perc >= 80 && p.perc < 99.995);
  const semEclic = todasNfs.filter((l) => !l.nf.eclic);
  const nfsMes = notas.filter((n) => n.data && formatarData(n.data, 'iso-mes') === d.agora.mesIso);
  const lista = (itens, campo) => itens.slice(0, 3).map((x) => campo(x)).join(', ') + (itens.length > 3 ? ` e mais ${itens.length - 3}` : '');
  return [
    {
      rot: 'Boletos atrasados', cor: atrasados.length ? COR_REL.vermelho : COR_REL.verde,
      v: atrasados.length ? `${atrasados.length} · ${moedaRel(somar(atrasados, 'valor'))}` : 'Nenhum',
      d: atrasados.length ? lista(atrasados, (b) => b.numero) : 'Todos os boletos em dia',
    },
    {
      rot: 'Boletos vencendo (até 2 dias)', cor: vencendo.length ? COR_REL.ambar : COR_REL.verde,
      v: vencendo.length ? `${vencendo.length} · ${moedaRel(somar(vencendo, 'valor'))}` : 'Nenhum',
      d: vencendo.length ? lista(vencendo, (b) => `${b.numero} (${dataRel(b.vencimento)})`) : 'Sem vencimentos próximos',
    },
    {
      rot: 'Pedidos zerados / críticos', cor: esgotados.length ? COR_REL.vermelho : criticos.length ? COR_REL.ambar : COR_REL.verde,
      v: `${esgotados.length} zerado(s) · ${criticos.length} crítico(s)`,
      d: [...esgotados, ...criticos].length ? lista([...esgotados, ...criticos], (p) => `${p.ped.numero} (${percRel(p.perc)})`) : 'Todos abaixo de 80% de consumo',
    },
    {
      rot: 'NFs não lançadas no e-clic', cor: semEclic.length ? COR_REL.ambar : COR_REL.verde,
      v: semEclic.length ? `${semEclic.length} · ${moedaRel(somar(semEclic.map((l) => l.nf), 'valor'))}` : 'Todas lançadas',
      d: semEclic.length ? lista(semEclic, (l) => l.nf.numero) : `${todasNfs.length} NF(s) com via assinada`,
    },
    {
      rot: `Consumido em ${d.agora.mesNome}`, cor: COR_REL.navy, inteiro: true,
      v: moedaRel(somar(nfsMes, 'valor')), d: `${nfsMes.length} nota(s) fiscal(is) emitida(s) no mês`,
    },
  ];
}

/* ---- Montagem das paginas (no documento aberto, antes de imprimir) ---- */

/**
 * Distribui o conteudo em folhas A4 paisagem do tamanho real, sem deixar meia folha vazia:
 * - [data-pagina="propria"]: ocupa uma folha inteira (capa, grafico);
 * - [data-dividir] (tabelas): cada <tbody> e uma unidade; se nao cabe, a tabela continua na
 *   folha seguinte com o cabecalho repetido ("continuacao");
 * - demais blocos: inteiros na folha atual ou na seguinte.
 * Cada folha recebe cabecalho curto (menos a capa) e rodape com "Pagina X de Y".
 */
function paginarRelatorio(doc, { titulo, rodape, alturaUtilMm = 187, classeFolha = '' }) {
  const fonte = doc.getElementById('fonte');
  const destino = doc.getElementById('paginas');
  if (!fonte || !destino) return;
  const mm = (v) => (v * 96) / 25.4;
  const ALTURA = mm(alturaUtilMm);
  let corpo = null;
  let cheia = false;
  const novaPagina = (comCabecalho = true) => {
    const pagina = doc.createElement('div');
    pagina.className = `pagina ${classeFolha}`.trim();
    corpo = doc.createElement('div');
    corpo.className = 'corpo';
    if (comCabecalho) {
      const cab = doc.createElement('div');
      cab.className = 'cab-pag';
      cab.innerHTML = titulo;
      corpo.append(cab);
    }
    pagina.append(corpo);
    destino.append(pagina);
    cheia = false;
  };
  const cabe = () => corpo.getBoundingClientRect().height <= ALTURA + 0.5;
  const vazia = () => corpo.children.length <= 1;
  const casca = (tabela, continuacao) => {
    const nova = tabela.cloneNode(false);
    [...tabela.children].filter((f) => f.tagName === 'COLGROUP' || f.tagName === 'THEAD').forEach((f) => nova.append(f.cloneNode(true)));
    if (continuacao) nova.querySelectorAll('.cont').forEach((c) => { c.textContent = '(continuação)'; });
    return nova;
  };
  const colocarBloco = (bloco) => {
    if (!corpo) novaPagina(bloco.dataset.cabecalho !== 'nao');
    else if (cheia || (bloco.dataset.folhaNova != null && !vazia())) novaPagina();
    corpo.append(bloco);
    if (cabe() || vazia()) return;
    /* tabela que deve ficar inteira: tenta caber na folha atual em versao compacta */
    if (bloco.dataset.inteira != null) {
      bloco.classList.add('compacta');
      if (cabe()) return;
      bloco.classList.remove('compacta');
    }
    bloco.remove();
    novaPagina();
    corpo.append(bloco);
    if (!cabe() && bloco.dataset.inteira != null) bloco.classList.add('compacta');
  };
  const colocarTabela = (tabela) => {
    const partes = [...tabela.tBodies];
    if (!corpo || cheia) novaPagina();
    let atual = casca(tabela, false);
    corpo.append(atual);
    let comLinhas = 0;
    partes.forEach((parte) => {
      atual.append(parte);
      if (cabe()) { comLinhas += 1; return; }
      parte.remove();
      if (!comLinhas) {
        /* cabecalho sozinho no pe da folha: a tabela inteira comeca na folha seguinte
           (se a folha ja so tem o cabecalho, fica nela mesmo: nunca gera folha vazia) */
        atual.remove();
        if (!vazia()) novaPagina();
        atual = casca(tabela, false);
      } else {
        novaPagina();
        atual = casca(tabela, true);
      }
      corpo.append(atual);
      atual.append(parte);
      comLinhas = 1;
    });
  };
  [...fonte.children].forEach((unidade) => {
    if (unidade.dataset.pagina === 'propria') {
      novaPagina(unidade.dataset.cabecalho !== 'nao');
      corpo.append(unidade);
      cheia = true;
    } else if (unidade.tagName === 'TABLE' && unidade.dataset.dividir != null) {
      colocarTabela(unidade);
    } else {
      colocarBloco(unidade);
    }
  });
  /* seguranca: folha que ficou so com o cabecalho e removida */
  [...destino.children].forEach((pg) => {
    const c = pg.querySelector('.corpo');
    if (c && [...c.children].every((x) => x.classList.contains('cab-pag'))) pg.remove();
  });
  const paginas = [...destino.children];
  paginas.forEach((pg, i) => {
    const r = doc.createElement('div');
    r.className = 'rodape-pag';
    r.innerHTML = `<span>${rodape}</span><span>Página ${i + 1} de ${paginas.length}</span>`;
    pg.append(r);
  });
  doc.body.classList.add('paginado');
}

function htmlRelatorioCliente(op) {
  const d = dadosRelatorio(null);
  const u = [];
  /* folha 1: capa completa (cabecalho, previsto x consumido, consumo por atividade e pontos de atencao) */
  if (op.capa) {
    u.push(`<section class="capa-pag" data-pagina="propria" data-cabecalho="nao">
      <div>${topoRelClienteHtml(d)}</div>
      ${capaRelClienteHtml(d)}
    </section>`);
  } else {
    u.push(`<div>${topoRelClienteHtml(d)}</div>`);
  }
  /* folha 2: Atividades Contratuais inteiras */
  if (op.atividades) u.push(atividadesHtml(d, op).replace('data-inteira', 'data-inteira data-folha-nova'));
  /* folha do grafico (inteira) */
  if (op.grafico) {
    u.push(`<section class="grafico-pag" data-pagina="propria">
      <div class="grafico">${svgEvolucao(serieTendencia(insumos), { largura: 1300, altura: 700 })}</div>
      <div class="nota">Real: notas fiscais lançadas por mês (BM) · Tendência: saldo do previsto distribuído conforme a projeção por BM · Percentuais sobre o previsto do contrato (${moedaRel(d.previsto)}).</div>
    </section>`);
  }
  /* conteudo corrido: preenche as folhas e continua na seguinte quando precisa */
  if (op.visaoPedidos) u.push(visaoPedidosHtml(d, op));
  if (op.relacaoNotas) d.peds.forEach((p) => u.push(blocoPedidoHtml(p, op)));
  const titulo = `Relatório Faturamento Direto — ${obra.nome || 'Obra'} — ${d.agora.data}`;
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${esc(titulo)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>${CSS_REL_CLIENTE}${BARRA_IMPRESSAO_CSS}</style></head><body>
${barraImpressao('Relatório para o cliente — confira e use "Salvar como PDF" na janela de impressão (A4 paisagem, margens: nenhuma).')}
<div class="doc"><div id="paginas"></div><div id="fonte">${u.join('')}</div></div></body></html>`;
}

function gerarRelatorioCliente() {
  if (!insumos.length && !pedidos.length) { toast.aviso('Sem dados para o relatório', 'Cadastre insumos, pedidos e NFs antes.'); return; }
  const agora = agoraRel();
  abrirDocumentoImpressao(htmlRelatorioCliente({ ...opcoesRelCliente }), {
    aoCarregar: (doc) => paginarRelatorio(doc, {
      titulo: `<span><b>Relatório — Faturamento Direto</b>${esc(obra.nome || '')}</span><span>${esc(obra.cliente || '')}${obra.consorcio ? ` · ${esc(obra.consorcio)}` : ''}</span>`,
      rodape: `${esc(obra.nome || 'Obra')} · Relatório — Faturamento Direto · emitido em ${agora.data}, ${agora.hora}`,
    }),
  });
}

/** Ficha completa de uma NF em HTML (folhas A4 retrato montadas pelo paginador). */
function htmlPdfNota(nf) {
  const d = dadosRelatorio(null);
  const ped = pedidoPorId(nf.pedidoId);
  const ter = terceiroDoPedido(ped);
  const ins = insumoDoPedido(ped);
  const an = analisarNota(nf);
  const rp = ped ? resumoPedido(ped) : null;
  const nfsPed = ped ? ordenar(notasDoPedido(ped.id), [{ campo: 'data', direcao: 'asc', tipo: 'data' }, { campo: 'numero', direcao: 'asc' }]) : [nf];
  const pos = nfsPed.findIndex((x) => x.id === nf.id);
  const antes = nfsPed.slice(0, Math.max(0, pos)).reduce((t, x) => t + vn(x.valor), 0);
  const valorPed = ped ? vn(ped.valor) : 0;
  const depois = antes + vn(nf.valor);
  const pc = (v) => (valorPed > 0 ? (v / valorPed) * 100 : 0);
  const bols = ordenar(boletosDaNota(nf.id), 'vencimento', 'asc', 'data');
  const selo = (texto, cor, fundo) => `<span class="selo" style="background:#${fundo};color:#${cor}"><i style="background:#${cor}"></i>${esc(texto)}</span>`;
  const linha = (rot, val) => `<div class="lin"><span>${esc(rot)}</span><b>${val}</b></div>`;
  const corSit = { Conferida: [COR_REL.verde, 'D4F4E2'], 'Sem itens': [COR_REL.cinzaPonto, 'EEF0F3'] }[an.situacao] || [COR_REL.ambar, 'FEF3C7'];
  /* produtos: quantidade, precos SEM/COM REIDI, REIDI do item e saldo do produto apos esta NF */
  const itens = (nf.itens || []).map((it) => {
    const pr = produtoPorId(it.produtoId);
    const qtd = vn(it.quantidade);
    const unitNf = vn(it.valorUnit);
    const unitSem = pr ? vn(pr.unitSem) : 0;
    const dif = Math.max(0, unitSem - unitNf);
    /* saldo do produto: quantidade do pedido - outras NFs - esta NF (mesma conta do cadastro da NF) */
    const outras = notas.filter((x) => x.id !== nf.id).reduce((t, x) => t + (x.itens || []).filter((i) => i.produtoId === it.produtoId).reduce((s2, i) => s2 + vn(i.quantidade), 0), 0);
    const contratado = pr ? vn(pr.quantidade) : 0;
    const bruto = contratado - outras - qtd;
    return {
      pr, qtd, unitNf, unitSem, total: qtd * unitNf, reidi: qtd * dif, perc: unitSem > 0 ? (dif / unitSem) * 100 : 0,
      contratado, outras, saldo: Number(bruto.toFixed(6)) === 0 ? 0 : bruto,
    };
  });
  const sem = nf.itensSemVinculo || [];
  const u = [];
  u.push(`<div data-cabecalho="nao">${topoRelClienteHtml(d).replace('Relatório — Faturamento Direto', 'Nota Fiscal — Ficha de Controle')}</div>`);
  u.push(`<div class="nf-hero">
    <div>
      <div class="rot">Nota fiscal</div>
      <div class="num">NF ${esc(nf.numero)}</div>
      <div class="sub">${esc(ter?.nome || '—')} · Pedido ${esc(ped?.numero || '—')} · ${esc(ins?.nome || '—')}</div>
      <div class="chips">
        <span class="nf-chip">Emissão ${dataRel(nf.data)}</span>
        <span class="nf-chip">${nf.bm ? `BM${esc(nf.bm)}` : 'sem BM'}</span>
        <span class="nf-chip"><i style="background:#${corSit[0]}"></i>${esc(an.situacao)}</span>
        <span class="nf-chip"><i style="background:#${nf.eclic ? COR_REL.verde : COR_REL.vermelho}"></i>${nf.eclic ? `e-clic ${nf.eclicData ? dataRel(nf.eclicData) : 'ok'}` : 'sem e-clic'}</span>
        <span class="nf-chip"><i style="background:#${bols.length ? statusBoletoRel(bols[0]).cor : COR_REL.ambar}"></i>${bols.length ? `${bols.length} boleto(s) · ${esc(statusBoletoRel(bols[0]).texto)}` : 'sem boleto'}</span>
      </div>
    </div>
    <div class="valor"><div class="rot">Valor da NF (COM REIDI)</div><div class="v">${moedaRel(nf.valor)}</div>
      ${pos >= 0 && ped ? `<div class="sub">${pos + 1}ª NF de ${nfsPed.length} do pedido</div>` : ''}</div>
  </div>`);
  u.push(`<div class="nf-grade">
    <div class="nf-card" style="--cor:#1A2F4E"><div class="tit">Pedido de compra</div>
      ${linha('Nº do pedido', esc(ped?.numero || '—'))}${linha('Emissão', dataRel(ped?.dataEmissao))}
      ${linha('Valor do pedido', moedaRel(valorPed))}${linha('REIDI', esc(ped ? rotuloReidiPedido(ped) : '—'))}
      ${linha('Atividade', esc(ins?.nome || '—'))}</div>
    <div class="nf-card" style="--cor:#2E86AB"><div class="tit">Fornecedor (terceiro)</div>
      ${linha('Razão social', esc(ter?.nome || '—'))}${linha('CNPJ', esc(ter?.cnpj || '—'))}${linha('UF', esc(ter?.uf || '—'))}
      ${linha('Obra', esc(obra.nome || '—'))}${linha('Cliente', esc(obra.cliente || '—'))}</div>
    <div class="nf-card" style="--cor:#7C3AED"><div class="tit">Tributos e lançamento</div>
      <div class="destaque" style="color:#7C3AED">REIDI ${moedaRel(nf.reidi)}</div>

      ${linha('Nº GRD', esc(textoGrds(nf.grds) || '—'))}</div>
  </div>`);
  if (ped) {
    u.push(`<div class="nf-sec"><div class="cab">Posição do pedido ${esc(ped.numero)} com esta NF</div>
      <div class="nf-pos">
        <div><div class="rot">Valor do pedido</div><div class="v">${moedaRel(valorPed)}</div><div class="d">${(rp?.prods || []).length} produto(s)</div></div>
        <div><div class="rot">Faturado antes</div><div class="v">${moedaRel(antes)}</div><div class="d">${Math.max(0, pos)} NF(s) anteriores · ${percRel(pc(antes))}</div></div>
        <div><div class="rot">Esta NF</div><div class="v" style="color:#E63946">${moedaRel(nf.valor)}</div><div class="d">${percRel(pc(nf.valor))} do pedido</div></div>
        <div><div class="rot">Acumulado após</div><div class="v">${moedaRel(depois)}</div><div class="d">${percRel(pc(depois))} do pedido</div></div>
        <div><div class="rot">Saldo após esta NF</div><div class="v" style="color:#${valorPed - depois < -0.005 ? COR_REL.vermelho : COR_REL.verde}">${moedaRel(valorPed - depois)}</div><div class="d">saldo atual: ${moedaRel(rp?.saldo)}</div></div>
      </div>
      <div class="nf-barra"><div class="trilho"><div class="antes" style="width:${Math.min(100, pc(antes))}%"></div><div class="esta" style="left:${Math.min(100, pc(antes))}%;width:${Math.max(0, Math.min(100, pc(depois)) - Math.min(100, pc(antes)))}%"></div></div>
        <div class="leg"><span><i style="background:#9AA3AD"></i>Faturado antes</span><span><i style="background:#E63946"></i>Esta NF</span><span><i style="background:#E6F4EA;border:1px solid #CDE8D6"></i>Saldo do pedido</span></div></div>
    </div>`);
  }
  /* produtos da NF (tabela que continua na folha seguinte, se precisar) */
  const un = (x) => esc(x.pr?.unidade || '');
  const corpoItens = itens.map((x) => `<tbody><tr${x.saldo < 0 ? ' class="excede"' : ''}>
      <td class="e"><b>${esc(x.pr?.descricao || '(produto removido)')}</b>${x.pr?.detalhe ? `<small>${esc(x.pr.detalhe)}</small>` : ''}</td>
      <td>${numExato(x.contratado)} ${un(x)}</td><td>${numExato(x.outras)}</td><td><b>${numExato(x.qtd)}</b></td>
      <td class="sal${x.saldo < 0 ? ' neg' : x.saldo === 0 ? ' zero' : ''}">${numExato(x.saldo)}<small>${x.saldo < 0 ? `excede ${numExato(-x.saldo)} ${un(x)}` : x.saldo === 0 ? 'produto zerado' : `${un(x)} a faturar`}</small></td>
      <td>${moedaRel(x.unitSem)}</td><td>${moedaRel(x.unitNf)}</td><td><b>${moedaRel(x.total)}</b></td>
      <td class="roxo">${x.reidi > 0.004 ? moedaRel(x.reidi) : '—'}<small>${x.reidi > 0.004 ? `${percExato(x.perc)} · ${moedaRel(x.unitSem - x.unitNf)}/${esc(x.pr?.unidade || 'un')}` : ''}</small></td></tr></tbody>`);
  sem.forEach((i) => corpoItens.push(`<tbody><tr class="semvinc"><td class="e"><b>${esc(i.descricao)}</b><small>item sem produto no pedido</small></td><td>—</td><td>—</td><td><b>${formatarNumero(i.quantidade)}</b></td><td>—</td><td>—</td><td>—</td><td><b>${moedaRel(i.valorTotal)}</b></td><td>—</td></tr></tbody>`));
  if (!corpoItens.length) corpoItens.push('<tbody><tr><td class="e" colspan="9">Nenhum produto marcado nesta NF</td></tr></tbody>');
  const totItens = itens.reduce((t, x) => t + x.total, 0) + sem.reduce((t, i) => t + vn(i.valorTotal), 0);
  corpoItens.push(`<tbody><tr class="tot"><td class="e">Total dos itens</td><td></td><td></td><td></td><td></td><td></td><td></td><td>${moedaRel(totItens)}</td><td>${moedaRel(itens.reduce((t, x) => t + x.reidi, 0))}</td></tr></tbody>`);
  u.push(`<table class="nf-tab nf-tab--itens" data-dividir><thead><tr><th class="cab-th" colspan="9">Produtos faturados nesta NF — quantidades, saldo e valores<span class="cont"></span></th></tr>
    <tr class="grupos"><th class="e"></th><th colspan="4" class="g-qtd">Quantidade do produto</th><th colspan="4" class="g-val">Valores</th></tr>
    <tr><th class="e" style="width:23%">Produto</th><th>Qtd pedido</th><th>Em outras NFs</th><th>Nesta NF</th><th>Saldo após NF</th><th>Unit. SEM REIDI</th><th>Unit. na NF</th><th>Total na NF</th><th>REIDI do item</th></tr></thead>${corpoItens.join('')}</table>`);
  /* conferencia */
  const excedidos = itens.filter((x) => x.saldo < 0);
  const zerados = itens.filter((x) => x.saldo === 0);
  u.push(`<div class="nf-sec"><div class="cab">Conferência da NF</div>
    ${excedidos.length ? `<div class="nf-alerta">⚠ ${excedidos.length} produto(s) passam da quantidade do pedido com esta NF: ${excedidos.map((x) => `${esc(x.pr?.descricao || '')} (excede ${numExato(-x.saldo)} ${esc(x.pr?.unidade || '')})`).join(' · ')}</div>` : ''}
    ${!excedidos.length && itens.length ? `<div class="nf-alerta ok">✓ Todas as quantidades dentro do pedido${zerados.length ? ` · ${zerados.length} produto(s) zerado(s) com esta NF` : ''}</div>` : ''}
    <div class="nf-conf">
    <div><div class="nf-card" style="border:0;background:none;padding:0"><div class="tit">Situação</div>${selo(an.situacao, corSit[0], corSit[1])}</div></div>

/** Valor em reais por extenso (ate centenas de bilhoes). */
function valorPorExtenso(valor) {
  const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const ate999 = (n) => {
    if (n === 0) return '';
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100); const r = n % 100;
    const partes = [];
    if (c) partes.push(C[c]);
    if (r) partes.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ` e ${U[r % 10]}` : ''));
    return partes.join(' e ');
  };
  const inteiro = Math.floor(Math.abs(vn(valor)) + 1e-9);
  const centavos = Math.round((Math.abs(vn(valor)) - inteiro) * 100);
  const grupos = [];
  let n = inteiro;
  while (n > 0) { grupos.push(n % 1000); n = Math.floor(n / 1000); }
  const escalas = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']];
  const textos = [];
  grupos.forEach((g, i) => {
    if (!g) return;
    if (i === 1 && g === 1) { textos.unshift('mil'); return; }
    textos.unshift(`${ate999(g)}${escalas[i][0] ? ` ${g === 1 ? escalas[i][0] : escalas[i][1]}` : ''}`);
  });
  /* "e" antes do ultimo grupo quando ele e menor que 100 ou centena redonda */
  let reais = '';
  textos.forEach((t, i) => {
    if (!i) { reais = t; return; }
    const ultimo = grupos[0];
    reais += i === textos.length - 1 && grupos[0] && (ultimo < 100 || ultimo % 100 === 0) ? ` e ${t}` : `, ${t}`;
  });
  reais = reais.replace(/, /g, ' ');
  const milhaoRedondo = inteiro >= 1e6 && inteiro % 1e6 === 0;
  const parteReais = inteiro ? `${reais}${milhaoRedondo ? ' de' : ''} ${inteiro === 1 ? 'real' : 'reais'}` : '';
  const parteCent = centavos ? `${ate999(centavos)} ${centavos === 1 ? 'centavo' : 'centavos'}` : '';
  return [parteReais, parteCent].filter(Boolean).join(' e ') || 'zero real';
}

  return { elementos: el };
}

const celCab = (texto, extra = {}) => ({ texto, preenchimento: COR_REL.cabecalho, cor: 'FFFFFF', tamanho: 9, negrito: true, alinhar: 'center', ...extra });

function slidesResumo(d, op) {
  const pedidosSel = d.peds;
  const comprometido = somar(pedidosSel, 'valor');
  const totalNF = somar(pedidosSel, 'consumido');
  const totalBol = somar(pedidosSel, 'boletos');
  const cab = [
    celCab('Terceiro', { alinhar: 'left' }), celCab('Nº Pedido de Compra'), celCab('Valor do Pedido (R$)', { alinhar: 'right' }),
    celCab('Total NF (R$)', { alinhar: 'right' }), celCab('Saldo (R$)', { alinhar: 'right' }), celCab('Utilização'), celCab('Status'),
  ];
  const SUB = 'F3F6FA';
  const T = 'E8F4FC';
  /* cada terceiro vira um bloco de linhas (nome em celula unica + subtotal se tiver 2 ou mais pedidos) */
  const montarBloco = (g, peds, comSubtotal) => {
    const linhasG = peds.map((p, i) => [
      ...(i === 0 ? [{ texto: g.ter.nome.toUpperCase(), negrito: true, cor: COR_REL.texto, alinhar: 'left', rowspan: peds.length + (comSubtotal ? 1 : 0) }] : []),
      { texto: p.ped.numero, cor: COR_REL.navy, alinhar: 'center' },
      { texto: moedaRel(p.valor), alinhar: 'right' }, { texto: moedaRel(p.consumido), alinhar: 'right' },
      { texto: moedaRel(p.saldo), alinhar: 'right', cor: Math.abs(p.saldo) < 0.005 ? COR_REL.cinza : COR_REL.verde },
      { texto: percRel(p.perc), alinhar: 'center' },
      { texto: '●', tamanho: 14, cor: corSituacaoRel(p.perc), alinhar: 'center' },
    ]);
    if (comSubtotal) {
      linhasG.push([
        { texto: `Subtotal (${g.peds.length} pedidos)`, negrito: true, alinhar: 'center', preenchimento: SUB, tamanho: 9 },
        { texto: moedaRel(g.valor), negrito: true, alinhar: 'right', preenchimento: SUB, tamanho: 9 },
        { texto: moedaRel(g.consumido), negrito: true, alinhar: 'right', preenchimento: SUB, tamanho: 9 },
        { texto: moedaRel(g.saldo), negrito: true, alinhar: 'right', preenchimento: SUB, tamanho: 9 },
        { texto: percRel(g.perc), negrito: true, alinhar: 'center', preenchimento: SUB, tamanho: 9 },
        { texto: '●', tamanho: 14, cor: corSituacaoRel(g.perc), alinhar: 'center', preenchimento: SUB },
      ]);
    }
    return linhasG;
  };
  const blocos = [];
  gruposPorTerceiro(pedidosSel).forEach((g) => {
    /* terceiro com muitos pedidos: partes de ate 10 linhas (o nome se repete em cada parte) */
    for (let k = 0; k < g.peds.length; k += 10) {
      const peds = g.peds.slice(k, k + 10);
      blocos.push(montarBloco(g, peds, g.peds.length > 1 && k + 10 >= g.peds.length));
    }
  });
  if (!blocos.length) blocos.push([[{ texto: 'Nenhum pedido de compra para os terceiros escolhidos', colspan: 7, alinhar: 'center', cor: COR_REL.cinza }]]);
  else if (op.linhaTotal) {
    const s2 = comprometido - totalNF;
    blocos.push([[
      { texto: 'TOTAL', negrito: true, alinhar: 'left', preenchimento: T }, { texto: '', preenchimento: T },
      { texto: moedaRel(comprometido), negrito: true, alinhar: 'right', preenchimento: T }, { texto: moedaRel(totalNF), negrito: true, alinhar: 'right', preenchimento: T },
      { texto: moedaRel(s2), negrito: true, alinhar: 'right', preenchimento: T },
      { texto: percRel(comprometido > 0 ? (totalNF / comprometido) * 100 : 0), negrito: true, alinhar: 'center', preenchimento: T }, { texto: '', preenchimento: T },
    ]]);
  }
  /* paginacao por bloco (um terceiro nao se divide entre slides): 7 linhas no 1o slide e 13 nos seguintes */
  /* o TOTAL acompanha o ultimo terceiro (nunca fica sozinho num slide) */
  if (blocos.length > 1 && op.linhaTotal && pedidosSel.length) blocos.splice(-2, 2, [...blocos[blocos.length - 2], ...blocos[blocos.length - 1]]);
  const nLinhas = blocos.reduce((t, b) => t + b.length, 0);
  /* ate 9 linhas: cabe num slide so, com linhas um pouco mais baixas */
  const alturaLinha = nLinhas <= 9 ? Math.min(0.32, 2.6 / (nLinhas + 1)) : 0.32;
  const capacidade1 = nLinhas <= 9 ? 9 : 7;
  const paginasLinhas = [];
  let atualP = [];
  blocos.forEach((b) => {
    const cabe = paginasLinhas.length === 0 ? capacidade1 : 13;
    if (atualP.length && atualP.length + b.length > cabe) { paginasLinhas.push(atualP); atualP = []; }
    atualP.push(...b);
  });
  paginasLinhas.push(atualP);
  const slides = [];
  let pagina = 0;
  while (pagina < paginasLinhas.length) {
    const parte = paginasLinhas[pagina];
    const el = slideBase('Relatório de Faturamento Direto');
    el.push({ tipo: 'texto', x: 0.54, y: 1.18, w: 12.2, h: 0.4, texto: `Resumo por Pedido de Compra${pagina ? ' (continuação)' : ''}`, tamanho: 20, negrito: true, cor: COR_REL.titulo, fonte: 'titulo', vertical: 'middle' });
    let yTab = 1.9;
    if (pagina === 0) {
      el.push(
        ...kpiLateral(0.46, 2.65, 2.933, 'COMPROMETIDO', moedaRel(comprometido), COR_REL.laranja),
        ...kpiLateral(3.592, 2.65, 2.933, 'TOTAL NFS', moedaRel(totalNF), COR_REL.vermelho),
        ...kpiLateral(6.725, 2.65, 2.933, 'SALDO (NF VS PC)', moedaRel(comprometido - totalNF), COR_REL.verde),
        ...kpiLateral(9.857, 2.65, 2.933, 'TOTAL BOLETOS (VINCULADOS A NFS)', moedaRel(totalBol), COR_REL.navy),
      );
      yTab = 3.75;
    }
    el.push({
      tipo: 'tabela', x: 0.46, y: yTab, w: 12.33, colunas: [3.6, 2.0, 1.7, 1.6, 1.6, 1.0, 0.83],
      linhas: [cab, ...parte], alturas: [cab, ...parte].map(() => alturaLinha), tamanho: 10, cor: COR_REL.texto,
    });
    el.push(legendaStatusPedido());
    slides.push({ elementos: el });
    pagina += 1;
  }
  return slides;
}

function slideConsumoMes(d) {
  const { mesIso, mesNome } = d.agora;
  const idsPed = new Set(d.peds.map((p) => p.ped.id));
  const nfsMes = notas.filter((n) => idsPed.has(n.pedidoId) && n.data && formatarData(n.data, 'iso-mes') === mesIso);
  const grupos = new Map();
  nfsMes.forEach((n) => {
    const ped = pedidoPorId(n.pedidoId);
    const ter = terceiroDoPedido(ped);
    const ins = insumoDoPedido(ped);
    const chave = `${ins?.id}|${ter?.id}`;
    if (!grupos.has(chave)) grupos.set(chave, { insumo: ins?.nome || '—', terceiro: ter?.nome || '—', valor: 0 });
    grupos.get(chave).valor += vn(n.valor);
  });
  const lista = ordenar([...grupos.values()], [{ campo: 'insumo' }, { campo: 'terceiro' }]);
  const linhaBorda = { borda: { baixo: [COR_REL.titulo, 1.5] } };
  const cab = [
    { texto: 'Insumo', tamanho: 14, negrito: true, cor: COR_REL.titulo, alinhar: 'left', ...linhaBorda, semBorda: true },
    { texto: 'Terceiro', tamanho: 14, negrito: true, cor: COR_REL.titulo, alinhar: 'left', ...linhaBorda, semBorda: true },
    { texto: mesCurtoRel(mesIso).toLowerCase(), tamanho: 14, negrito: true, cor: COR_REL.titulo, alinhar: 'right', ...linhaBorda, semBorda: true },
  ];
  const linhas = lista.map((g) => [
    { texto: g.insumo, negrito: true, cor: '1F2A3C', alinhar: 'left', semBorda: true },
    { texto: g.terceiro, cor: '1F2A3C', alinhar: 'left', semBorda: true },
    { texto: moedaRel(g.valor), cor: '1F2A3C', alinhar: 'right', semBorda: true },
  ]);
  if (!linhas.length) return null;   /* sem NF no mes: o slide nao entra */
  linhas.push([
    { texto: 'Total', negrito: true, cor: COR_REL.titulo, alinhar: 'left', preenchimento: 'E8EDF6', semBorda: true },
    { texto: '', preenchimento: 'E8EDF6', semBorda: true },
    { texto: moedaRel(lista.reduce((t, g) => t + g.valor, 0)), negrito: true, cor: COR_REL.titulo, alinhar: 'right', preenchimento: 'E8EDF6', semBorda: true },
  ]);
  const el = slideBase(`Consumido (${mesNome})`, `Notas fiscais emitidas em ${mesNome} — ${nfsMes.length} NF(s)`);
  const todas = [cab, ...linhas].slice(0, 12);
  el.push({ tipo: 'tabela', x: 0.46, y: 1.9, w: 12.33, colunas: [4.6, 5.03, 2.7], linhas: todas, alturas: todas.map(() => 0.5), tamanho: 13, cor: '1F2A3C', margem: [4, 8, 4, 8] });
  return { elementos: el };
}

/** Atividades Contratuais (contrato inteiro): previsto x comprometido x consumido, com total. */
function slidesAtividades(d, op) {
  const lista = ordenar(insumos.map((ins) => ({ ins, r: resumoInsumo(ins) })), 'ins.nome');
  if (!lista.length) return [];
  const cab = [
    celCab('Atividade', { alinhar: 'left' }), celCab('Previsto (R$)', { alinhar: 'right' }), celCab('Comprometido (R$)', { alinhar: 'right' }),
    celCab('Consumido NFs (R$)', { alinhar: 'right' }), celCab('Saldo a contratar (R$)', { alinhar: 'right' }),
    celCab('Comprometido %'), celCab('Consumido %'), celCab('Status'),
  ];
  const linhas = lista.map(({ ins, r }) => {
    const pComp = r.vigente > 0 ? (r.comprometido / r.vigente) * 100 : 0;
    const pCons = r.vigente > 0 ? (r.faturado / r.vigente) * 100 : 0;
    return [
      { texto: ins.nome, alinhar: 'left' },
      { texto: moedaRel(r.vigente), alinhar: 'right' },
      { texto: moedaRel(r.comprometido), alinhar: 'right' },
      { texto: moedaRel(r.faturado), alinhar: 'right' },
      { texto: moedaRel(r.saldoContratar), alinhar: 'right', cor: COR_REL.verde },
      { texto: percRel(pComp), alinhar: 'center' },
      { texto: percRel(pCons), alinhar: 'center' },
      { texto: '●', tamanho: 14, cor: corSituacaoRel(pComp), alinhar: 'center' },
    ];
  });
  const T = 'E8F4FC';
  const prev = lista.reduce((t, x) => t + x.r.vigente, 0);
  const comp = lista.reduce((t, x) => t + x.r.comprometido, 0);
  const cons = lista.reduce((t, x) => t + x.r.faturado, 0);
  const total = [
    { texto: 'TOTAL', negrito: true, alinhar: 'left', preenchimento: T },
    { texto: moedaRel(prev), negrito: true, alinhar: 'right', preenchimento: T },
    { texto: moedaRel(comp), negrito: true, alinhar: 'right', preenchimento: T },
    { texto: moedaRel(cons), negrito: true, alinhar: 'right', preenchimento: T },
    { texto: moedaRel(prev - comp), negrito: true, alinhar: 'right', preenchimento: T },
    { texto: percRel(prev > 0 ? (comp / prev) * 100 : 0), negrito: true, alinhar: 'center', preenchimento: T },
    { texto: percRel(prev > 0 ? (cons / prev) * 100 : 0), negrito: true, alinhar: 'center', preenchimento: T },
    { texto: '', preenchimento: T },
  ];
  /* ate 15 atividades num slide (linhas ajustadas a altura); acima disso, continua no seguinte */
  const POR_SLIDE = 15;
  const partes = [];
  for (let i = 0; i < linhas.length; i += POR_SLIDE) partes.push(linhas.slice(i, i + POR_SLIDE));
  if (op.linhaTotal !== false) partes[partes.length - 1].push(total);
  return partes.map((parte, i) => {
    const el = slideBase(`Atividades Contratuais${i ? ' (continuação)' : ''}`, `Previsto x Comprometido x Consumido — contrato inteiro — posição em ${d.agora.data}`);
    const todas = [cab, ...parte];
    const altura = Math.min(0.36, 4.75 / todas.length);
    el.push({
      tipo: 'tabela', x: 0.46, y: 1.68, w: 12.33, colunas: [3.6, 1.45, 1.4, 1.4, 1.5, 1.05, 1.05, 0.88],
      linhas: todas, alturas: todas.map(() => altura), tamanho: todas.length > 12 ? 9 : 10, cor: COR_REL.texto,
    });
    el.push(linhaLegenda(6.45, [
      { texto: 'Status (% comprometido do previsto da atividade):   ' },
      { texto: '● ', cor: COR_REL.verde }, { texto: 'até 79,9%   ' },
      { texto: '● ', cor: COR_REL.ambar }, { texto: 'de 80% a 99,9%   ' },
      { texto: '● ', cor: COR_REL.vermelho }, { texto: '100% ou mais' },
    ]));
    return { elementos: el };
  });
}

/** Slides de um pedido: cartoes + tabela NF/boleto, paginada pela altura. */
function slidesPedido(p, d, op) {
  const COLS = [0.85, 0.82, 0.8, 1.16, 0.8, 1.15, 0.85, 1.05, 0.8, 0.8, 0.8, 1.1, 1.25];
  const cabecalho = [
    [celCab('Nº Pedido de Compra', { rowspan: 2, tamanho: 8 }), celCab('NOTA FISCAL', { colspan: 6, preenchimento: COR_REL.faixaNF }), celCab('BOLETO', { colspan: 6, preenchimento: COR_REL.faixaBoleto })],
    [celCab('Nº NF', { tamanho: 8 }), celCab('Emissão', { tamanho: 8 }), celCab('Valor (R$)', { tamanho: 8 }), celCab('Vencimento', { tamanho: 8 }), celCab('Nº GRD', { tamanho: 8 }),
      celCab('', { tamanho: 8, partes: [{ texto: 'Via Assinada', quebra: true }, { texto: 'lançado no e-clic', tamanho: 5, negrito: false }] }),
      celCab('Nº Doc.', { tamanho: 8 }), celCab('Emissão', { tamanho: 8 }), celCab('Vencimento', { tamanho: 8 }), celCab('Pagamento', { tamanho: 8 }), celCab('Status', { tamanho: 8 }), celCab('Nº GRD', { tamanho: 8 })],
  ];
  /* blocos: cada NF (linhas da NF + boletos + descricao) fica inteira no mesmo slide */
  const blocos = p.nfs.map((l) => {
    const nb = Math.max(1, l.bols.length);
    const celBoleto = (b) => {
      if (!b) return ['—', '—', '—', '—', '—', '—'].map((t) => ({ texto: t }));
      const st = statusBoletoRel(b);
      return [{ texto: b.numero || '—' }, { texto: dataRel(l.nf.data) }, { texto: dataRel(b.vencimento) }, { texto: b.pagamento ? dataRel(b.pagamento) : '—' },
        { texto: `● ${st.texto}`, cor: st.cor === COR_REL.cinzaPonto ? COR_REL.cinzaPonto : st.cor, negrito: st.texto !== 'A vencer' },
        { texto: textoGrds(b.grds) || '—' }];
    };
    const primeira = [
      { texto: p.ped.numero, rowspan: nb + 1 }, { texto: l.nf.numero, negrito: true, rowspan: nb + 1, tamanho: String(l.nf.numero).length > 9 ? 7.5 : 9 },
      { texto: dataRel(l.nf.data), rowspan: nb }, { texto: moedaRel(l.nf.valor), rowspan: nb }, { texto: dataRel(l.vencimento), rowspan: nb },
      { texto: l.grd, rowspan: nb },
      { texto: l.nf.eclic ? '● Sim' : '● Não', cor: l.nf.eclic ? COR_REL.verde : COR_REL.vermelho, negrito: true, rowspan: nb },
      ...celBoleto(l.bols[0]),
    ];
    const linhas = [primeira, ...l.bols.slice(1).map((b) => celBoleto(b))];
    linhas.push([{
      colspan: 11, alinhar: 'center', tamanho: 7, cor: '333333', partes: [
        { texto: 'DESCRIÇÃO', tamanho: 6, negrito: true, cor: COR_REL.descricao, quebra: true },
        ...l.descricao.map((t, i) => ({ texto: t, quebra: i < l.descricao.length - 1 })),
      ],
    }]);
    const alturas = [...linhas.slice(0, -1).map(() => 0.3), 0.2 + 0.11 * l.descricao.length];
    return { linhas, alturas };
  });
  let total = null;
  if (p.nfs.length && op.linhaTotal) {
    const lanc = p.nfs.filter((l) => l.nf.eclic);
    const naoLanc = p.nfs.filter((l) => !l.nf.eclic);
    const f = 'E8F4FC';
    total = {
      linhas: [[
        { texto: `TOTAL NFs (${p.nfs.length})`, colspan: 3, alinhar: 'right', negrito: true, preenchimento: f },
        { texto: moedaRel(p.consumido), negrito: true, preenchimento: f },
        {
          colspan: 9, alinhar: 'left', preenchimento: f, partes: [
            { texto: '● ', cor: COR_REL.verde }, { texto: `Lançadas no e-clic: ${lanc.length} NF · ${moedaRel(somar(lanc.map((l) => l.nf), 'valor'))}        ` },
            { texto: '● ', cor: COR_REL.vermelho }, { texto: `Não lançadas: ${naoLanc.length} NF · ${moedaRel(somar(naoLanc.map((l) => l.nf), 'valor'))}` },
          ],
        },
      ]],
      alturas: [0.32],
    };
  }
  const vazio = { linhas: [[{ texto: 'Nenhuma NF lançada', colspan: 13, alinhar: 'center', cor: COR_REL.cinza }]], alturas: [0.32] };
  /* o total acompanha a ultima NF (nunca fica sozinho num slide) */
  const fila = p.nfs.length ? blocos.slice() : [vazio];
  if (total) {
    const ult = fila[fila.length - 1];
    fila[fila.length - 1] = { linhas: [...ult.linhas, ...total.linhas], alturas: [...ult.alturas, ...total.alturas] };
  }
  /* distribui os blocos pelos slides; depois equilibra: reduz o limite enquanto o numero de
     slides nao aumenta, para o ultimo slide nao ficar com uma ou duas linhas */
  const Y0 = 3.15 + 0.64; const Y1 = 2.05 + 0.64;
  const distribuir = (limite) => {
    const pgs = [];
    let atual = { blocos: [], y: Y0 };
    fila.forEach((b) => {
      const hb = b.alturas.reduce((a, c) => a + c, 0);
      if (atual.blocos.length && atual.y + hb > limite) { pgs.push(atual); atual = { blocos: [], y: Y1 }; }
      atual.blocos.push(b);
      atual.y += hb;
    });
    pgs.push(atual);
    return pgs;
  };
  const LIMITE = 6.35;
  let paginas = distribuir(LIMITE);
  if (paginas.length > 1) {
    for (let lim = LIMITE - 0.05; lim > Y1 + 0.5; lim -= 0.05) {
      const teste = distribuir(lim);
      if (teste.length !== paginas.length || teste.some((pg) => !pg.blocos.length)) break;
      paginas = teste;
    }
  }
  const n = paginas.length;
  const partesSub = [`Atividade: ${p.ins?.nome || '—'}`, `Pedido de Compra: ${p.ped.numero}${p.ped.dataEmissao ? ` (emissão ${dataRel(p.ped.dataEmissao)})` : ''}`];
  if (p.descricao) partesSub.push(p.descricao);
  const subtitulo = partesSub.join('   |   ');
  return paginas.map((pg, i) => {
    const el = slideBase(`${p.ter.nome} — PC ${p.ped.numero}${n > 1 ? ` (${i + 1}/${n})` : ''}`, subtitulo, { subtituloAlto: subtitulo.length > 120 });
    let yTab = 2.05;
    if (i === 0) {
      const cor = corSituacaoRel(p.perc);
      el.push(
        ...kpiLateral(0.46, 2.05, 2.933, 'VALOR DO PEDIDO', moedaRel(p.valor), COR_REL.navy),
        ...kpiLateral(3.592, 2.05, 2.933, 'TOTAL NF', moedaRel(p.consumido), COR_REL.vermelho),
        ...kpiLateral(6.725, 2.05, 2.933, 'SALDO', moedaRel(p.saldo), COR_REL.verde),
        ...kpiLateral(9.857, 2.05, 2.933, 'UTILIZAÇÃO', percRel(p.perc), cor, { ponto: cor }),
      );
      yTab = 3.15;
    }
    const linhas = [...cabecalho, ...pg.blocos.flatMap((b) => b.linhas)];
    const alturas = [0.32, 0.32, ...pg.blocos.flatMap((b) => b.alturas)];
    el.push({ tipo: 'tabela', x: 0.46, y: yTab, w: 12.33, colunas: COLS, linhas, alturas, tamanho: 9, cor: COR_REL.texto, alinhar: 'center' });
    el.push(legendaStatusBoleto(d.agora.data));
    return { elementos: el };
  });
}

async function montarSlidesTerceiros(ids, op) {
  const d = dadosRelatorio(ids);
  const slides = [];
  if (op.capa) slides.push(slideCapa(d));
  if (op.atividades) slides.push(...slidesAtividades(d, op));
  slides.push(...slidesResumo(d, op));
  if (op.grafico) slides.push(await slideGrafico(op));
  if (op.consumoMes) { const sm = slideConsumoMes(d); if (sm) slides.push(sm); }
  if (op.relacaoNotas) d.peds.forEach((p) => slides.push(...slidesPedido(p, d, op)));
  return { slides, d };
}

/* ---- Desenhista PowerPoint (PptxGenJS) ---- */

function carregarPptxGen() {
  if (window.PptxGenJS) return Promise.resolve(window.PptxGenJS);
  return new Promise((resolver, rejeitar) => {
    const script = document.createElement('script');
    script.src = URL_PPTXGEN;
    script.onload = () => (window.PptxGenJS ? resolver(window.PptxGenJS) : rejeitar(new Error('Gerador de PowerPoint indisponível.')));
    script.onerror = () => { script.remove(); rejeitar(new Error('Não foi possível carregar o gerador de PowerPoint (internet ou bloqueio de rede). Use "Gerar em PDF".')); };
    document.head.append(script);
  });
}

const dadosImagemPptx = (url) => String(url).replace(/^data:/, '');

function runsPptx(cel, padrao) {
  if (!cel.partes) return cel.texto ?? '';
  return cel.partes.map((p) => ({
    text: p.texto,
    options: {
      ...(p.cor || cel.cor || padrao.cor ? { color: p.cor || cel.cor || padrao.cor } : {}),
      ...(p.tamanho || cel.tamanho || padrao.tamanho ? { fontSize: p.tamanho || cel.tamanho || padrao.tamanho } : {}),
      bold: p.negrito ?? cel.negrito ?? false,
      ...(p.quebra ? { breakLine: true } : {}),
    },
  }));
}

function desenharSlidePptx(pres, slide) {
  const s = pres.addSlide();
  s.background = { color: 'FFFFFF' };
  slide.elementos.forEach((el) => {
    if (el.tipo === 'imagem') s.addImage({ data: dadosImagemPptx(el.dados), x: el.x, y: el.y, w: el.w, h: el.h });
    else if (el.tipo === 'retangulo' || el.tipo === 'circulo') {
      s.addShape(el.tipo === 'circulo' ? pres.ShapeType.ellipse : pres.ShapeType.rect, {
        x: el.x, y: el.y, w: el.w, h: el.h, fill: { color: el.preenchimento },
        line: { color: el.borda || el.preenchimento, width: el.espessura || 1 },
      });
    } else if (el.tipo === 'texto') {
      const opcoes = {
        x: el.x, y: el.y, w: el.w, h: el.h, margin: 0, isTextBox: true,
        fontFace: el.fonte === 'titulo' ? FONTE_TITULO : FONTE_CORPO, fontSize: el.tamanho, bold: Boolean(el.negrito), italic: Boolean(el.italico),
        color: el.cor, align: el.alinhar || 'left', valign: el.vertical || 'top', fit: 'shrink',
      };
      if (el.espacamento) opcoes.charSpacing = el.espacamento;
      s.addText(el.partes ? runsPptx(el, el) : el.texto, opcoes);
    } else if (el.tipo === 'tabela') {
      const linhas = el.linhas.map((linha) => linha.map((cel) => {
        const borda = cel.semBorda
          ? [{ type: 'none' }, { type: 'none' }, cel.borda && cel.borda.baixo ? { type: 'solid', pt: cel.borda.baixo[1], color: cel.borda.baixo[0] } : { type: 'none' }, { type: 'none' }]
          : { type: 'solid', pt: 0.75, color: COR_REL.borda };
        return {
          text: runsPptx(cel, el),
          options: {
            ...(cel.preenchimento ? { fill: { color: cel.preenchimento } } : {}),
            color: cel.cor || el.cor, fontSize: cel.tamanho || el.tamanho, bold: Boolean(cel.negrito), fontFace: FONTE_CORPO,
            align: cel.alinhar || el.alinhar || 'left', valign: 'middle', border: borda,
            ...(cel.colspan ? { colspan: cel.colspan } : {}), ...(cel.rowspan ? { rowspan: cel.rowspan } : {}),
          },
        };
      }));
      s.addTable(linhas, { x: el.x, y: el.y, w: el.w, colW: el.colunas, rowH: el.alturas, margin: el.margem || [2, 3, 2, 3], fontFace: FONTE_CORPO, autoPage: false });
    }
  });
}

async function gerarApresentacaoPptx(ids, op) {
  const PptxGenJS = await carregarPptxGen();
  const { slides } = await montarSlidesTerceiros(ids, op);
  const pres = new PptxGenJS();
  pres.layout = 'LAYOUT_WIDE';
  pres.title = `Relatório de Faturamento Direto — ${obra.nome || 'Obra'}`;
  pres.author = 'CTC Faturamento Direto';
  pres.theme = { headFontFace: FONTE_TITULO, bodyFontFace: FONTE_CORPO };
  slides.forEach((sl) => desenharSlidePptx(pres, sl));
  const nome = `relatorio_faturamento_direto_${hojeIso()}.pptx`;
  await pres.writeFile({ fileName: nome });
  return { nome, quantidade: slides.length };
}

/* ---- Desenhista HTML (PDF da apresentacao) ---- */

const CSS_SLIDES = `
@page { size: 13.333in 7.5in; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #E9ECF1; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: Calibri, Carlito, 'Segoe UI', Arial, sans-serif; }
.slide { position: relative; width: 13.333in; height: 7.5in; overflow: hidden; background: #fff; margin: 16px auto; box-shadow: 0 2px 12px rgba(0,0,0,.18); break-after: page; }
@media print { html, body { background: #fff; } .slide { margin: 0; box-shadow: none; } }
.el { position: absolute; }
.tx { display: flex; flex-direction: column; overflow: hidden; line-height: 1.15; white-space: pre-wrap; }
.slide table { position: absolute; border-collapse: collapse; table-layout: fixed; }
.slide td { padding: 2pt 3pt; vertical-align: middle; line-height: 1.12; overflow: hidden; word-wrap: break-word; }
`;

function estiloParteHtml(p, cel, padrao) {
  const cor = p.cor || cel.cor || padrao.cor;
  const tam = p.tamanho || cel.tamanho || padrao.tamanho;
  const neg = p.negrito ?? cel.negrito ?? false;
  return `${cor ? `color:#${cor};` : ''}${tam ? `font-size:${tam}pt;` : ''}font-weight:${neg ? 700 : 400};`;
}

function textoHtml(cel, padrao) {
  if (!cel.partes) return esc(cel.texto ?? '');
  return cel.partes.map((p) => `<span style="${estiloParteHtml(p, cel, padrao)}">${esc(p.texto)}</span>${p.quebra ? '<br>' : ''}`).join('');
}

function desenharSlideHtml(slide) {
  const pos = (el) => `left:${el.x}in;top:${el.y}in;width:${el.w}in;`;
  const partes = slide.elementos.map((el) => {
    if (el.tipo === 'imagem') {
      if (el.svg) return `<div class="el" style="${pos(el)}height:${el.h}in">${el.svg.replace('<svg ', '<svg style="width:100%;height:100%" preserveAspectRatio="xMidYMid meet" ')}</div>`;
      return `<img class="el" src="${el.dados}" style="${pos(el)}height:${el.h}in" alt="">`;
    }
    if (el.tipo === 'retangulo' || el.tipo === 'circulo') {
      return `<div class="el" style="${pos(el)}height:${el.h}in;background:#${el.preenchimento};border:${el.espessura || 0.75}pt solid #${el.borda || el.preenchimento};${el.tipo === 'circulo' ? 'border-radius:50%;' : ''}"></div>`;
    }
    if (el.tipo === 'texto') {
      const just = { top: 'flex-start', middle: 'center', bottom: 'flex-end' }[el.vertical || 'top'];
      const fonte = el.fonte === 'titulo' ? "'Open Sans', 'Segoe UI', Arial, sans-serif" : "Calibri, Carlito, 'Segoe UI', Arial, sans-serif";
      return `<div class="el tx" style="${pos(el)}height:${el.h}in;justify-content:${just};text-align:${el.alinhar || 'left'};font-family:${fonte};font-size:${el.tamanho}pt;font-weight:${el.negrito ? 700 : 400};${el.italico ? 'font-style:italic;' : ''}color:#${el.cor};${el.espacamento ? `letter-spacing:${el.espacamento}pt;` : ''}"><div>${textoHtml(el, el)}</div></div>`;
    }
    if (el.tipo === 'tabela') {
      const [mt, mr, mb, ml] = el.margem || [2, 3, 2, 3];
      const cols = el.colunas.map((w) => `<col style="width:${w}in">`).join('');
      const linhas = el.linhas.map((linha, i) => `<tr style="height:${el.alturas[i]}in">${linha.map((cel) => {
        const bordaBaixo = cel.borda && cel.borda.baixo ? `border-bottom:${cel.borda.baixo[1]}pt solid #${cel.borda.baixo[0]};` : '';
        const borda = cel.semBorda ? `border:0;${bordaBaixo}` : `border:0.75pt solid #${COR_REL.borda};`;
        const estilo = `${borda}padding:${mt}pt ${mr}pt ${mb}pt ${ml}pt;${cel.preenchimento ? `background:#${cel.preenchimento};` : ''}color:#${cel.cor || el.cor};font-size:${cel.tamanho || el.tamanho}pt;font-weight:${cel.negrito ? 700 : 400};text-align:${cel.alinhar || el.alinhar || 'left'};`;
        return `<td${cel.colspan ? ` colspan="${cel.colspan}"` : ''}${cel.rowspan ? ` rowspan="${cel.rowspan}"` : ''} style="${estilo}">${textoHtml(cel, el)}</td>`;
      }).join('')}</tr>`).join('');
      return `<table style="left:${el.x}in;top:${el.y}in;width:${el.w}in"><colgroup>${cols}</colgroup>${linhas}</table>`;
    }
    return '';
  });
  return `<section class="slide">${partes.join('')}</section>`;
}

async function gerarApresentacaoPdf(ids, op) {
  const { slides } = await montarSlidesTerceiros(ids, op);
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório de Faturamento Direto — ${esc(obra.nome || 'Obra')}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&family=Carlito:wght@400;700&display=swap">
<style>${CSS_SLIDES}${BARRA_IMPRESSAO_CSS}</style></head><body>
${barraImpressao(`Apresentação FD — ${slides.length} slide(s). Use "Salvar como PDF" na janela de impressão.`)}
${slides.map(desenharSlideHtml).join('')}</body></html>`;
  abrirDocumentoImpressao(html);
  return slides.length;
}

/** Le todas as abas de um Excel: [{ nome, linhas: [objetos] }]. CSV vira uma aba so. */
async function lerLivroFD(arquivo) {
  if (/\.csv$/i.test(arquivo.name)) return [{ nome: arquivo.name.replace(/\.csv$/i, ''), linhas: lerCsvFD(await arquivo.text()) }];
  let XLSX;
  try { XLSX = await import(URL_SHEETJS); } catch (erro) {
    throw new Error('Não foi possível carregar o leitor de Excel (internet ou bloqueio de rede).');
  }
  const livro = XLSX.read(await arquivo.arrayBuffer(), { type: 'array' });
  return livro.SheetNames.map((nome) => ({ nome, linhas: matrizParaObjetos(XLSX.utils.sheet_to_json(livro.Sheets[nome], { header: 1, defval: '', raw: true })) }));
}

/** Identifica a aba pelo nome (ou pelas colunas, quando o nome nao diz). */
function tipoDaAba(aba) {
  const n = chaveColuna(aba.nome);
  const cols = aba.linhas.length ? Object.keys(aba.linhas[0]).map(chaveColuna) : [];
  if (n.includes('projec')) return 'projecao';
  if (n.includes('aditivo')) return 'aditivos';
  if (n.includes('boleto')) return 'boletos';
  if (n.startsWith('nf') || n.includes('nota')) return 'notas';
  if (n.includes('pedido') || n.includes('produto')) return 'pedidos';
  if (n.includes('terceiro')) return 'terceiros';
  if (n.includes('insumo') || n.includes('atividade')) return 'insumos';
  if (n.includes('obra')) return 'obra';
  if (cols.includes('ndocboleto')) return 'boletos';
  if (cols.includes('nnf')) return 'notas';
  if (cols.includes('npedido')) return 'pedidos';
  if (cols.includes('terceiro')) return 'terceiros';
  if (cols.includes('insumo')) return 'insumos';
  if (cols.includes('campo') && cols.includes('valor')) return 'obra';
  return null;
}

function planejarImportacaoAditivos(brutas) {
  const mapa = [['numero', ['naditivo', 'aditivo', 'numero']], ['data', ['data']], ['tipo', ['tipo']], ['novoFim', ['novofim']],
    ['novoBmFinal', ['novobmfinal']], ['insumo', ['insumo']], ['valor', ['valor']], ['descricao', ['descricao']]];
  const linhas = brutas.map((b) => mapearPorApelidos(b, mapa)).filter((l) => l.numero);
  const novos = linhas.filter((l) => !aditivos.some((a) => normalizarTexto(a.numero) === normalizarTexto(l.numero))).map((l) => ({
    id: novoIdFD('adt'), numero: String(l.numero), data: dataPlanilha(l.data),
    tipo: TIPOS_ADITIVO.find((t) => normalizarTexto(t) === normalizarTexto(l.tipo || '')) || 'Valor',
    novoFim: dataPlanilha(l.novoFim), novoBmFinal: l.novoBmFinal ? Number(String(l.novoBmFinal).replace(/\D/g, '')) || null : null,
    insumoId: insumos.find((i) => normalizarTexto(i.nome) === normalizarTexto(l.insumo || ''))?.id || '',
    valor: numPlanilha(l.valor) ?? 0, descricao: l.descricao ? String(l.descricao) : '',
  }));
  return { quantidade: novos.length, aplicar: () => { aditivos.push(...novos); return `${novos.length} aditivo(s)`; } };
}

/** Copia de trabalho dos cadastros (para desfazer uma importacao nao confirmada). */
function fotografarDados() {
  return JSON.parse(JSON.stringify({ obra, aditivos, insumos, terceiros, pedidos, produtos, notas, boletos }));
}
function restaurarDados(f) {
  ({ obra, aditivos, insumos, terceiros, pedidos, produtos, notas, boletos } = f);
}

async function importarPlanilhaCompleta(arquivo, modo) {
  const abas = await lerLivroFD(arquivo);
  const reconhecidas = abas.map((a) => ({ ...a, tipo: tipoDaAba(a) })).filter((a) => a.tipo && a.linhas.length);
  if (!reconhecidas.length) throw new Error('Nenhuma aba reconhecida. Use a planilha de "Exportar tudo" (abas Obra, Insumos, Terceiros, Pedidos e produtos, NFs e itens, Boletos).');
  const foto = fotografarDados();
  if (modo === 'substituir') { aditivos = []; insumos = []; terceiros = []; pedidos = []; produtos = []; notas = []; boletos = []; }
  const resumo = [];
  const avisos = [];
  const ordemTipos = ['obra', 'insumos', 'aditivos', 'projecao', 'terceiros', 'pedidos', 'notas', 'boletos'];
  const ROTULO = { obra: 'Obra', insumos: 'Insumos', aditivos: 'Aditivos', projecao: 'Projeção por BM', terceiros: 'Terceiros', pedidos: 'Pedidos e produtos', notas: 'NFs e itens', boletos: 'Boletos' };
  try {
    ordemTipos.forEach((tipo) => {
      reconhecidas.filter((a) => a.tipo === tipo).forEach((aba) => {
        let texto = '';
        if (tipo === 'obra') {
          const lido = lerInformacoesObra(aba.linhas);
          const novos = Object.fromEntries(Object.entries(lido).filter(([, v]) => v !== undefined));
          obra = { ...obra, ...novos };
          texto = `${Object.keys(novos).length} campo(s)`;
        } else if (tipo === 'pedidos') {
          const plano = planejarImportacaoPedidos(aba.linhas);
          insumos.push(...plano.insumosNovos);
          terceiros.push(...plano.terceirosNovos);
          plano.pedidos.forEach(({ produtos: lista, insumoNome, terceiroNome, ...ped }) => { pedidos.push(ped); produtos.push(...lista); });
          texto = `${plano.pedidos.length} pedido(s), ${plano.pedidos.reduce((t, p) => t + p.produtos.length, 0)} produto(s)`;
          if (plano.ignorados.length) avisos.push(criarAlerta({ tipo: 'info', titulo: 'Pedidos já existentes (ignorados)', mensagem: plano.ignorados.slice(0, 15).join(', ') }));
          if (plano.erros.length) avisos.push(criarAlerta({ tipo: 'danger', titulo: 'Pedidos: linhas com problema', mensagem: plano.erros.slice(0, 8).join(' ') }));
        } else {
          const planejar = {
            insumos: planejarImportacaoInsumos, aditivos: planejarImportacaoAditivos, terceiros: planejarImportacaoTerceiros, projecao: planejarImportacaoProjecao,
            notas: planejarImportacaoNotas, boletos: planejarImportacaoBoletos,
          }[tipo];
          const plano = planejar(aba.linhas, { semConsultaCnpj: true });
          texto = plano.quantidade ? plano.aplicar() : 'nada novo';
          (plano.avisos || []).filter(Boolean).forEach((a) => avisos.push(a));
        }
        resumo.push({ aba: aba.nome, tipo: ROTULO[tipo], lidas: aba.linhas.length, resultado: texto });
      });
    });
    sincronizarValoresPedidos();
  } catch (erro) {
    restaurarDados(foto);
    throw erro;
  }
  abas.filter((a) => !reconhecidas.includes(a) && !reconhecidas.some((r) => r.nome === a.nome)).forEach((a) => resumo.push({ aba: a.nome, tipo: '—', lidas: a.linhas.length, resultado: 'aba não reconhecida (ignorada)' }));
  return { foto, resumo, avisos };
}

        },
        { nome: 'senha', rotulo: 'Senha do controlador', tipo: 'senha', obrigatorio: true, regras: { minCaracteres: 6 }, atributos: { autocomplete: 'new-password' } },
        {

      ],

        base.controladores = [...(base.controladores || []), credencial];

    });

/**
 * "Iniciar controle" (e qualquer entrada com perfil administrador) nao abre o app:
 * exige um controlador autorizado. Base com controladores -> login do controlador;
 * base sem controladores -> o administrador autoriza o primeiro.
 */
async function entrarPorControlador(entrada) {
  const base = entrada.base;
  base.controladores = Array.isArray(base.controladores) ? base.controladores : [];
  let usuario = null;
  let novo = false;
  if (base.controladores.length) {
    usuario = await solicitarCredenciais({
      controladores: base.controladores,
      titulo: 'Entrar como Controlador',
      mensagem: 'O controle é operado por um controlador autorizado pelo administrador. Escolha seu nome e informe sua senha.',
      textoConfirmar: 'Entrar',
    });
  } else {
    usuario = await cadastrarPrimeiroControlador(base);
    novo = Boolean(usuario);
  }
  if (!usuario) {
    mostrarEntrada();
    toast.info('Entrada cancelada', 'O controle só abre com um controlador autorizado.');
    return;
  }
  abrirAplicativo({ ...entrada, perfil: 'controlador', usuario });
  if (novo) {
    sessao.marcarAlteracao();
    notificar({
      tipo: 'warning', titulo: `Controlador ${usuario.nome} autorizado`, duracao: 0,
      mensagem: 'Salve a base (Controlador > Ferramentas: nuvem ou exportar JSON) para que este acesso valha nas próximas entradas.',
    });
  }
}
