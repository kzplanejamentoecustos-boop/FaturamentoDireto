const esperar = (ms) => new Promise((resolver) => { setTimeout(resolver, ms); });

/** Campo "Controlador": lista os controladores cadastrados para escolher com um clique. */
function campoLoginControlador(controladores, valor) {
  const lista = [...controladores].sort((a, b) => String(a.nome || a.login).localeCompare(String(b.nome || b.login), 'pt-BR'));
  return {
    nome: 'login',
    rotulo: 'Controlador',
    tipo: 'select',
    obrigatorio: true,
    placeholder: 'Selecione o controlador...',
    opcoes: lista.map((c) => ({ valor: c.login, texto: c.nome ? `${c.nome} (${c.login})` : c.login })),
    valor,   // sem valor: o campo abre vazio ("Selecione o controlador...")
  };
}

/** Ao escolher o controlador, o cursor vai direto para a senha. */
function ligarLoginASenha(formulario) {
  const lista = formulario.campo('login');
  lista.addEventListener('change', () => { if (lista.value) formulario.campo('senha').focus(); });
  return () => { if (lista.value) formulario.campo('senha').focus(); };
}
const ROTULO_PERFIL = { administrador: 'Administrador', controlador: 'Controlador', visualizador: 'Visualizador' };

function descreverBase(base, nomeArquivo) {
  const n = base.controladores.length;
  const partes = [nomeArquivo ? `Base carregada: ${nomeArquivo}` : 'Base carregada'];
  if (base.salvoEm) partes.push(`salva em ${formatarData(base.salvoEm, 'data-hora')}`);
  partes.push(`${n} controlador${n === 1 ? '' : 'es'}`);
  return partes.join(' — ');
}

/**
 * criarTelaEntrada({
 *   logo, titulo, subtitulo, formato ('id-do-aplicativo'), prefixoArquivo,
 *   administrador: { sal, hash },     // resumo da senha do administrador (nunca o texto)
 *   baseInicial: null | base,         // usada quando nenhum JSON e importado (ex.: demonstracao)
 *   textoBaseInicial,                 // explica qual base sera usada sem importacao
 *   armazenamento,                    // opcional: provedor de versoes (botao "Abrir versao salva")
 *   criarBaseNova: () => base,        // opcional: estrutura da base em branco do botao "Iniciar controle"
 * "Iniciar controle" pede a senha do administrador e entra no app com perfil 'administrador' (edicao).
 *   rodape,
 *   onEntrar({ perfil, usuario, base, nomeArquivo })
 * })
 * Retorna { elemento, mostrar(alvo), remover, obterBase, definirBase(base, nomeArquivo) }.
 * A base carregada continua na tela ao voltar do aplicativo; so sai pelo link "Remover base carregada".
 */
function criarTelaEntrada({
  logo, titulo = 'Aplicativo', subtitulo = 'Escolha como deseja acessar', formato,
  prefixoArquivo, administrador = {}, baseInicial = null,
  textoBaseInicial = 'Nenhuma base importada.', rodape, onEntrar, armazenamento, criarBaseNova,
} = {}) {
  let base = baseInicial ? validarBase(JSON.parse(JSON.stringify(baseInicial)), { formato }).base : null;
  let nomeArquivo = null;
  let importada = false;
  let pendenteExportar = false;

  const entrada = h('input', { type: 'file', accept: '.json,application/json', class: 'ctc-hidden', 'aria-hidden': 'true', tabindex: '-1' });
  const status = h('div', { class: 'ctc-landing__status', role: 'status' });
  const linkRemover = h('button', {
    type: 'button',
    class: 'ctc-link ctc-link--danger ctc-text-xs',
    onClick: async () => {
      if (pendenteExportar && !(await confirmar({ titulo: 'Remover a base?', mensagem: 'Há controladores cadastrados que ainda não foram exportados.', textoConfirmar: 'Remover', perigo: true }))) return;
      base = baseInicial ? validarBase(JSON.parse(JSON.stringify(baseInicial)), { formato }).base : null;
      nomeArquivo = null;
      importada = false;
      pendenteExportar = false;
      atualizarStatus();
    },
  }, 'Remover base carregada');

  const elLogoEntrada = h('div', { class: 'ctc-landing__logo' });
  const elTituloEntrada = h('h1', { class: 'ctc-landing__title' }, titulo);
  function atualizarMarca() {
    const identidade = base?.identidade || {};
    const logoAtual = identidade.logo || logo;
    elLogoEntrada.replaceChildren(conteudoLogo(logoAtual));
    elLogoEntrada.classList.toggle('ctc-hidden', !logoAtual);
    elTituloEntrada.textContent = identidade.titulo || titulo;
  }

  function atualizarStatus() {
    atualizarMarca();
    let texto;
    if (importada && base) texto = descreverBase(base, nomeArquivo);
    else if (base) texto = `${textoBaseInicial} ${base.controladores.length ? `(${base.controladores.length} controlador${base.controladores.length === 1 ? '' : 'es'})` : ''}`.trim();
    else texto = textoBaseInicial;
    if (pendenteExportar) texto += ' — alterações de controladores ainda não exportadas';
    status.textContent = texto;
    status.classList.toggle('is-loaded', importada);
    linkRemover.classList.toggle('ctc-hidden', !importada && !pendenteExportar);
  }

  /** Base importada que traz configuracao de nuvem: passa a usa-la neste navegador. */
  async function adotarNuvemDaBase(novaBase) {
    const recebida = novaBase && novaBase.nuvem && novaBase.nuvem.firebase;
    if (!recebida || !armazenamento || !armazenamento.configurar) return;
    const atual = armazenamento.obterConfig();
    if (atual && atual.projectId === recebida.projectId && atual.appId === recebida.appId) return;
    await armazenamento.configurar(recebida, { testar: false });
    toast.info('Nuvem configurada pela base', `Firebase — projeto ${recebida.projectId}`);
  }

  async function podeSubstituirBase() {
    if (!pendenteExportar) return true;
    return confirmar({ titulo: 'Substituir a base?', mensagem: 'Há controladores cadastrados que ainda não foram exportados.', textoConfirmar: 'Substituir', perigo: true });
  }

  function abrirVersaoSalva() {
    abrirListaVersoes({
      armazenamento,
      titulo: 'Abrir versão salva',
      textoAcao: 'Abrir',
      onEscolher: async (versao) => {
        if (!(await podeSubstituirBase())) return false;
        let registro;
        try {
          registro = await armazenamento.abrir(versao.id);
        } catch (erro) {
          toast.erro('Versão não aberta', erro.message);
          return false;
        }
        const resultado = validarBase(registro.base, { formato });
        if (!resultado.valida) {
          toast.erro('Versão não aberta', resultado.erros.join(' '));
          return false;
        }
        base = resultado.base;
        nomeArquivo = `Nuvem: ${registro.nome}`;
        importada = true;
        pendenteExportar = false;
        atualizarStatus();
        toast.sucesso('Versão aberta', registro.nome);
        return true;
      },
    });
  }

  entrada.addEventListener('change', async () => {
    const arquivo = entrada.files[0];
    entrada.value = '';
    if (!arquivo) return;
    if (!(await podeSubstituirBase())) return;
    try {
      const resultado = validarBase(await lerArquivoJSON(arquivo), { formato });
      if (!resultado.valida) {
        toast.erro('Base não importada', resultado.erros.join(' '));
        return;
      }
      base = resultado.base;
      nomeArquivo = arquivo.name;
      importada = true;
      await adotarNuvemDaBase(base);
      pendenteExportar = false;
      atualizarStatus();
      toast.sucesso('Base importada', arquivo.name);
    } catch (erro) {
      toast.erro('Base não importada', erro.message);
    }
  });

  function exigirBase() {
    if (base) return true;
    toast.aviso('Importe a base de dados', 'Use o botão "Importar base de dados (JSON)" antes de entrar.');
    return false;
  }

  function entrar(perfil, usuario = null) {
    elemento.remove();
    // o aplicativo recebe uma COPIA: o que for editado e nao salvo nao altera a base carregada aqui
    const copia = JSON.parse(JSON.stringify(base));
    if (typeof onEntrar === 'function') onEntrar({ perfil, usuario, base: copia, nomeArquivo });
  }

  /* ---- Visualizador ---- */
  function entrarVisualizador() {
    if (exigirBase()) entrar('visualizador');
  }

  /* ---- Controlador ---- */
  function entrarControlador() {
    if (!exigirBase()) return;
    if (!base.controladores.length) {
      criarModal({
        titulo: 'Nenhum controlador cadastrado',
        tamanho: 'sm',
        destruirAoFechar: true,
        conteudo: h('p', {}, 'Esta base ainda não tem controladores. O administrador precisa cadastrá-los e exportar a base.'),
        acoes: [{ texto: 'Entendi', variante: 'primary' }],
      }).abrir();
      return;
    }
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [
        campoLoginControlador(base.controladores),
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true },
      ],
      onEnviar: async ({ login, senha }) => {
        const registro = base.controladores.find((c) => c.login === normalizarLogin(login));
        if (!registro || !(await verificarSenha(senha, registro))) {
          await esperar(500);
          formulario.definirErro('senha', 'Login ou senha incorretos.');
          return;
        }
        modal.fechar();
        entrar('controlador', { login: registro.login, nome: registro.nome || registro.login });
      },
    });
    const focarSenha = ligarLoginASenha(formulario);
    const modal = criarModal({
      titulo: 'Entrar como Controlador',
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: formulario.elemento,
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: 'Entrar', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    modal.abrir();
    focarSenha();
  }

  /* ---- Administrador ---- */
  function abrirAdministracao(senhaMestra) {
    if (!base) base = criarBaseVazia(formato);
    let tabela = null;

    const atualizarTabela = () => tabela.definirDados(base.controladores);
    tabela = criarTabela({
      compacta: true,
      altura: 'auto',
      dados: base.controladores,
      vazio: { titulo: 'Nenhum controlador cadastrado', mensagem: 'Use o formulário abaixo para adicionar.' },
      colunas: [
        { campo: 'login', titulo: 'Login' },
        { campo: 'nome', titulo: 'Nome' },
        {
          campo: 'senha', titulo: 'Senha', ordenavel: false,
          render: (_, linha) => {
            const oculto = '••••••••';
            const botao = criarBotao({ texto: oculto, icone: 'olho', variante: 'ghost', tamanho: 'sm', titulo: 'Mostrar senha' });
            const texto = botao.querySelector('span');
            let visivel = false;
            botao.addEventListener('click', async () => {
              if (visivel) {
                texto.textContent = oculto;
                visivel = false;
                botao.title = 'Mostrar senha';
                return;
              }
              if (!linha.senhaCifrada || !criptografiaDisponivel()) {
                toast.aviso('Senha não disponível', 'Este controlador foi cadastrado antes desta versão. Remova-o e cadastre de novo para poder visualizar a senha.');
                return;
              }
              try {
                texto.textContent = await comCarregamento(botao, () => decifrarTexto(linha.senhaCifrada, senhaMestra, linha.sal));
                visivel = true;
                botao.title = 'Ocultar senha';
              } catch (erro) {
                toast.erro('Não foi possível mostrar a senha', 'A base pode ter sido alterada fora do aplicativo.');
              }
            });
            return botao;
          },
        },
        { campo: 'criadoEm', titulo: 'Cadastrado em', formatar: (v) => formatarData(v, 'data-hora') },
        {
          campo: 'acoes', titulo: '', ordenavel: false, classe: 'ctc-col--actions',
          render: (_, linha) => criarBotao({
            icone: 'lixeira', variante: 'ghost', tamanho: 'sm', titulo: `Remover ${linha.login}`,
            onClick: async () => {
              const ok = await confirmar({ titulo: `Remover ${linha.login}?`, mensagem: 'Este controlador não conseguirá mais entrar com a base exportada a partir de agora.', textoConfirmar: 'Remover', perigo: true });
              if (!ok) return;
              base.controladores = base.controladores.filter((c) => c !== linha);
              pendenteExportar = true;
              atualizarTabela();
              atualizarStatus();
              toast.aviso('Controlador removido', 'Exporte a base para gravar a alteração.');
            },
          }),
        },
      ],
    });

    const formulario = criarFormulario({
      colunas: 2,
      textoEnviar: 'Adicionar controlador',
      campos: [
        { nome: 'nome', rotulo: 'Nome', obrigatorio: true },
        {
          nome: 'login', rotulo: 'Login', obrigatorio: true, dica: 'De 3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.',
          regras: {
            validar: (v) => {
              if (!/^[a-zA-Z0-9._-]{3,30}$/.test(String(v).trim())) return 'Use de 3 a 30 letras, números, ponto, hífen ou sublinhado.';
              if (base.controladores.some((c) => c.login === normalizarLogin(v))) return 'Este login já está cadastrado.';
              return true;
            },
          },
        },
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true, regras: { minCaracteres: 6 }, atributos: { autocomplete: 'new-password' } },
        {
          nome: 'confirmacao', rotulo: 'Confirmar senha', tipo: 'senha', obrigatorio: true, atributos: { autocomplete: 'new-password' },
          regras: { validar: (v, valores) => v === valores.senha || 'As senhas não conferem.' },
        },
      ],
      onEnviar: async ({ nome, login, senha }) => {
        base.controladores.push(await criarCredencial({ login, nome, senha, senhaMestra }));
        pendenteExportar = true;
        formulario.elemento.reset();
        formulario.limparErros();
        atualizarTabela();
        atualizarStatus();
        toast.sucesso('Controlador adicionado', `${normalizarLogin(login)} — exporte a base para gravar.`);
      },
    });

    /* ---- Banco de dados na nuvem (Firebase) ---- */
    let modalAdmin = null;
    let painelNuvem = null;
    if (armazenamento && armazenamento.configurar) {
      const statusNuvem = h('div', {});
      const atualizarStatusNuvem = () => {
        const cfg = armazenamento.obterConfig();
        statusNuvem.replaceChildren(cfg
          ? criarAlerta({ tipo: 'success', titulo: `Conectado ao Firebase — projeto ${cfg.projectId}`, mensagem: 'Salvar na nuvem, Salvar na base existente e Abrir versão salva usam este banco.' })
          : criarAlerta({ tipo: 'info', titulo: 'Firebase não configurado', mensagem: 'Enquanto isso, as versões ficam guardadas somente neste navegador.' }));
      };
      const campoConfig = criarCampo({
        nome: 'firebaseConfig', rotulo: 'Configuração do Firebase (firebaseConfig)', tipo: 'textarea', larguraTotal: true,
        placeholder: 'Cole aqui o trecho do console do Firebase:\nconst firebaseConfig = {\n  apiKey: "...",\n  projectId: "...",\n  appId: "..."\n};',
        dica: 'Console do Firebase > Configurações do projeto > Seus apps > SDK setup and configuration.',
      });
      const textoConfig = campoConfig.querySelector('textarea');
      const cfgAtual = armazenamento.obterConfig();
      if (cfgAtual) textoConfig.value = `const firebaseConfig = ${JSON.stringify(cfgAtual, null, 2)};`;

      const botaoConectar = criarBotao({
        texto: 'Salvar e conectar', icone: 'upload', variante: 'primary',
        onClick: async () => {
          const leitura = interpretarConfigFirebase(textoConfig.value);
          if (!leitura.valido) { toast.erro('Configuração incompleta', leitura.erros.join(' ')); return; }
          try {
            const { versoes } = await comCarregamento(botaoConectar, () => armazenamento.configurar(leitura.config));
            base.nuvem = { ...(base.nuvem || {}), firebase: leitura.config };
            atualizarStatusNuvem();
            atualizarStatus();
            toast.sucesso('Firebase conectado', `Projeto ${leitura.config.projectId} — ${versoes.length} versão(ões) encontrada(s).`);
            // ja traz as versoes da nuvem para escolher qual abrir
            if (versoes.length) { modalAdmin.fechar(); abrirVersaoSalva(); }
          } catch (erro) {
            toast.erro('Não foi possível conectar', erro.message);
          }
        },
      });
      const botaoRemoverNuvem = criarBotao({
        texto: 'Remover configuração', icone: 'lixeira', variante: 'ghost',
        onClick: async () => {
          const ok = await confirmar({ titulo: 'Remover a configuração do Firebase?', mensagem: 'Os dados na nuvem não são apagados; este navegador apenas deixa de usá-los.', textoConfirmar: 'Remover', perigo: true });
          if (!ok) return;
          armazenamento.removerConfig();
          if (base.nuvem) delete base.nuvem.firebase;
          textoConfig.value = '';
          atualizarStatusNuvem();
          toast.info('Configuração removida', 'As versões voltam a ser guardadas neste navegador.');
        },
      });
      atualizarStatusNuvem();
      painelNuvem = criarPainel({
        titulo: 'Banco de dados na nuvem (Firebase)', icone: 'configuracao',
        conteudo: h('div', { class: 'ctc-stack' },
          statusNuvem,
          campoConfig,
          h('div', { class: 'ctc-cluster' }, botaoConectar, botaoRemoverNuvem),
          criarAlerta({
            tipo: 'warning',
            titulo: 'Regras de acesso do Firestore',
            mensagem: 'Este modelo não usa login do Firebase. As regras do banco precisam permitir leitura e escrita, e qualquer pessoa com esta configuração consegue acessar os dados. Use apenas para dados internos e revise as regras no console.',
          })),
      }).elemento;
    }

    modalAdmin = criarModal({
      titulo: 'Administração de controladores',
      tamanho: 'lg',
      destruirAoFechar: true,
      conteudo: [
        criarAlerta({
          tipo: 'info',
          titulo: 'Os controladores ficam gravados dentro do arquivo JSON',
          mensagem: 'Depois de adicionar ou remover, clique em "Exportar base (JSON)" e passe a usar o novo arquivo.',
        }),
        criarPainel({ titulo: 'Controladores cadastrados', icone: 'usuario', semEspaco: true, conteudo: tabela.elemento }).elemento,
        criarPainel({ titulo: 'Novo controlador', icone: 'mais', conteudo: formulario.elemento }).elemento,
        painelNuvem,
      ],
      acoes: [
        { texto: 'Fechar', variante: 'outline' },
        {
          texto: 'Exportar base (JSON)', icone: 'download', variante: 'primary', fechar: false,
          onClick: () => {
            const nome = nomeArquivoBase(prefixoArquivo || formato || 'base');
            base = prepararBaseParaSalvar(base);
            baixarJSON(base, nome);
            pendenteExportar = false;
            atualizarStatus();
            toast.sucesso('Base exportada', `${nome} — use este arquivo na próxima abertura.`);
          },
        },
      ],
    });
    modalAdmin.abrir();
  }

  async function entrarAdministrador() {
    const senha = await solicitarSenhaAdministrador({ administrador, titulo: 'Acesso do Administrador', textoConfirmar: 'Entrar' });
    if (senha) abrirAdministracao(senha);
  }

  /* ---- Iniciar controle: base em branco, liberada pela senha do administrador ---- */
  async function iniciarControle() {
    if (importada || pendenteExportar) {
      const ok = await confirmar({
        titulo: 'Iniciar um controle em branco?',
        mensagem: 'A base carregada sai da tela inicial (o arquivo ou a versão na nuvem não são alterados). Os dados novos só ficam gravados quando você salvar.',
        textoConfirmar: 'Iniciar em branco',
      });
      if (!ok) return;
    }
    const senha = await solicitarSenhaAdministrador({
      administrador,
      titulo: 'Iniciar controle',
      mensagem: 'Informe a senha do administrador para criar uma base em branco.',
      textoConfirmar: 'Criar base em branco',
    });
    if (!senha) return;
    const nova = typeof criarBaseNova === 'function' ? criarBaseNova() : criarBaseVazia(formato);
    base = validarBase({ ...nova, formato }, { formato }).base;
    nomeArquivo = 'Novo controle (ainda não salvo)';
    importada = true;
    pendenteExportar = false;
    atualizarStatus();
    toast.sucesso('Base em branco criada', 'Comece a atualizar e salve em Controlador > Ferramentas.');
    entrar('administrador', { login: 'administrador', nome: 'Administrador' });
  }

  const elemento = h('div', { class: 'ctc-landing' },
    h('div', { class: 'ctc-landing__card' },
      h('div', { class: 'ctc-landing__brand' },
        elLogoEntrada,
        elTituloEntrada,
        h('p', { class: 'ctc-landing__subtitle' }, subtitulo)),
      h('section', { class: 'ctc-landing__section' },
        h('div', { class: 'ctc-landing__section-title' }, '1. Base de dados'),
        criarBotao({ texto: 'Iniciar controle', icone: 'mais', variante: 'success', bloco: true, onClick: iniciarControle }),
        criarBotao({ texto: 'Importar base de dados (JSON)', icone: 'upload', variante: 'outline', bloco: true, onClick: () => entrada.click() }),
        armazenamento ? criarBotao({ texto: 'Abrir versão salva (nuvem)', icone: 'documento', variante: 'outline', bloco: true, onClick: abrirVersaoSalva }) : null,
        status,
        linkRemover,
        entrada),
      h('section', { class: 'ctc-landing__section' },
        h('div', { class: 'ctc-landing__section-title' }, '2. Como você vai acessar?'),
        criarBotao({ texto: 'Administrador', icone: 'configuracao', variante: 'outline', tamanho: 'lg', bloco: true, onClick: entrarAdministrador }),
        criarBotao({ texto: 'Controlador', icone: 'editar', variante: 'primary', tamanho: 'lg', bloco: true, onClick: entrarControlador }),
        criarBotao({ texto: 'Visualizador', icone: 'olho', variante: 'secondary', tamanho: 'lg', bloco: true, onClick: entrarVisualizador })),
      rodape ? h('div', { class: 'ctc-landing__footer' }, rodape) : null));

  atualizarStatus();

  return {
    elemento,
    mostrar: (alvo = document.body) => { atualizarStatus(); alvo.append(elemento); },
    remover: () => elemento.remove(),
    obterBase: () => base,
    /** Atualiza a base mantida na tela (ex.: a versao que acabou de ser salva no aplicativo). */
    definirBase: (novaBase, novoNome = nomeArquivo) => {
      const resultado = validarBase(JSON.parse(JSON.stringify(novaBase)), { formato });
      if (!resultado.valida) return false;
      base = resultado.base;
      nomeArquivo = novoNome;
      importada = Boolean(novoNome);
      atualizarStatus();
      return true;
    },
  };
}

/**
 * Botao do canto superior direito que mostra o perfil e o numero de alteracoes nao salvas.
 * criarBotaoSessao({ sessao, texto: 'Controlador', onClick })
 */
function criarBotaoSessao({ sessao, texto = 'Controlador', onClick } = {}) {
  const botao = criarBotao({ texto, icone: 'usuario', variante: 'outline', contador: 0, onClick });
  const contador = botao.querySelector('.ctc-btn__count');
  const atualizar = ({ alteracoes }) => {
    contador.textContent = String(alteracoes);
    contador.classList.toggle('ctc-hidden', !alteracoes);
    botao.title = alteracoes ? `${alteracoes} alteração(ões) não salva(s)` : texto;
  };
  atualizar(sessao.obter());
  sessao.assinar(atualizar);
  return botao;
}

/**
 * Pede a senha do administrador. Retorna Promise<senha | null> (null = cancelado).
 *   const senha = await solicitarSenhaAdministrador({ administrador: { sal, hash } })
 */
function solicitarSenhaAdministrador({
  administrador = {}, titulo = 'Senha do administrador', mensagem, textoConfirmar = 'Confirmar',
} = {}) {
  return new Promise((resolver) => {
    let resposta = null;
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [{ nome: 'senha', rotulo: 'Senha do administrador', tipo: 'senha', obrigatorio: true }],
      onEnviar: async ({ senha }) => {
        if (!(await verificarSenha(senha, administrador))) {
          await esperar(500);
          formulario.definirErro('senha', 'Senha incorreta.');
          return;
        }
        resposta = senha;
        modal.fechar();
      },
    });
    const modal = criarModal({
      titulo,
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: [mensagem ? h('p', { class: 'ctc-text-sm ctc-text-muted' }, mensagem) : null, formulario.elemento],
      onFechar: () => resolver(resposta),
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: textoConfirmar, variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    modal.abrir();
  });
}

/**
 * Pede login e senha de um controlador novamente (confirmacao antes de acoes sensiveis).
 * Retorna Promise<{ login, nome } | null> (null = cancelado).
 *   const quem = await solicitarCredenciais({ controladores: base.controladores, titulo: 'Confirme seu acesso', loginPadrao })
 * O controlador e escolhido numa lista; loginPadrao ja deixa um selecionado.
 */
function solicitarCredenciais({
  controladores = [], titulo = 'Confirme seu acesso', mensagem = 'Informe novamente seu login e senha de controlador.',
  textoConfirmar = 'Confirmar', loginPadrao,
} = {}) {
  return new Promise((resolver) => {
    let resposta = null;
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [
        campoLoginControlador(controladores, loginPadrao),
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true },
      ],
      onEnviar: async ({ login, senha }) => {
        const registro = controladores.find((c) => c.login === normalizarLogin(login));
        if (!registro || !(await verificarSenha(senha, registro))) {
          await esperar(500);
          formulario.definirErro('senha', 'Login ou senha incorretos.');
          return;
        }
        resposta = { login: registro.login, nome: registro.nome || registro.login };
        modal.fechar();
      },
    });
    const modal = criarModal({
      titulo,
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: [h('p', { class: 'ctc-text-sm ctc-text-muted' }, mensagem), formulario.elemento],
      onFechar: () => resolver(resposta),
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: textoConfirmar, variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    const focarSenha = ligarLoginASenha(formulario);
    modal.abrir();
    focarSenha();
  });
}

/**
 * Lista as versoes salvas e permite escolher uma.
 *   abrirListaVersoes({ armazenamento, titulo, textoAcao: 'Abrir', varianteAcao, perigo,
 *                       onEscolher: async (versao) => true | false })   // false mantem a lista aberta
 */
async function abrirListaVersoes({
  armazenamento, titulo = 'Versões salvas', textoAcao = 'Abrir', varianteAcao = 'primary', onEscolher,
} = {}) {
  let versoes;
  try {
    versoes = await armazenamento.listar();
  } catch (erro) {
    toast.erro('Não foi possível listar as versões', erro.message);
    return null;
  }
  let modal = null;
  const tabela = criarTabela({
    dados: versoes,
    compacta: true,
    altura: 'auto',
    ordenacao: { campo: 'salvoEm', direcao: 'desc' },
    vazio: { titulo: 'Nenhuma versão salva ainda', mensagem: 'Use "Salvar na nuvem" no painel do Controlador para criar a primeira.' },
    colunas: [
      { campo: 'nome', titulo: 'Nome' },
      { campo: 'salvoEm', titulo: 'Salvo em', tipo: 'data', formatar: (v) => formatarData(v, 'data-hora') },
      { campo: 'autor', titulo: 'Salvo por' },
      {
        campo: 'acao', titulo: '', ordenavel: false, classe: 'ctc-col--actions',
        render: (_, versao) => {
          const botao = criarBotao({ texto: textoAcao, variante: varianteAcao, tamanho: 'sm' });
          botao.addEventListener('click', async () => {
            const fechar = await comCarregamento(botao, () => onEscolher(versao));
            if (fechar !== false) modal.fechar();
          });
          return botao;
        },
      },
    ],
  });
  modal = criarModal({
    titulo,
    tamanho: 'lg',
    destruirAoFechar: true,
    conteudo: [
      armazenamento.descricao ? h('p', { class: 'ctc-text-xs ctc-text-muted' }, `Local de armazenamento: ${armazenamento.descricao}`) : null,
      tabela.elemento,
    ],
    acoes: [{ texto: 'Fechar', variante: 'outline' }],
  });
  modal.abrir();
  return modal;
}

/**
 * Editor do cabecalho: logo (imagem importada), titulo e subtitulo.
 *   abrirEditorCabecalho({ identidade: { logo, titulo, subtitulo }, onSalvar(novaIdentidade) })
 */
function abrirEditorCabecalho({ identidade = {}, onSalvar } = {}) {
  let logo = identidade.logo || null;
  const previa = h('div', { class: 'ctc-landing__logo' });
  const atualizarPrevia = () => {
    previa.replaceChildren(conteudoLogo(logo || '—'));
    botaoRemover.disabled = !logo;
  };
  const entradaImagem = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml', class: 'ctc-hidden', tabindex: '-1', 'aria-hidden': 'true' });
  entradaImagem.addEventListener('change', async () => {
    const arquivo = entradaImagem.files[0];
    entradaImagem.value = '';
    if (!arquivo) return;
    try {
      logo = await lerImagemComoDataURL(arquivo);
      atualizarPrevia();
    } catch (erro) {
      toast.erro('Imagem não carregada', erro.message);
    }
  });
  const botaoRemover = criarBotao({ texto: 'Remover logo', icone: 'lixeira', variante: 'ghost', tamanho: 'sm', onClick: () => { logo = null; atualizarPrevia(); } });

  const formulario = criarFormulario({
    colunas: 1,
    semBotoes: true,
    valores: { titulo: identidade.titulo || '', subtitulo: identidade.subtitulo || '' },
    campos: [
      { nome: 'titulo', rotulo: 'Título do cabeçalho', obrigatorio: true, regras: { maxCaracteres: 60 } },
      { nome: 'subtitulo', rotulo: 'Subtítulo', dica: 'Ex.: nome da obra, contrato ou unidade. Opcional.', regras: { maxCaracteres: 90 } },
    ],
    onEnviar: ({ titulo, subtitulo }) => {
      if (typeof onSalvar === 'function') onSalvar({ logo, titulo, subtitulo });
      modal.fechar();
    },
  });

  const modal = criarModal({
    titulo: 'Editar cabeçalho e logo',
    tamanho: 'md',
    destruirAoFechar: true,
    conteudo: [
      h('div', { class: 'ctc-cluster' },
        previa,
        h('div', { class: 'ctc-stack' },
          criarBotao({ texto: 'Importar imagem da logo', icone: 'upload', variante: 'outline', tamanho: 'sm', onClick: () => entradaImagem.click() }),
          botaoRemover,
          h('div', { class: 'ctc-text-xs ctc-text-muted' }, 'PNG, JPG, GIF, WEBP ou SVG. A imagem é reduzida para caber na base.')),
        entradaImagem),
      formulario.elemento,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      { texto: 'Aplicar', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
    ],
  });
  atualizarPrevia();
  modal.abrir();
  return modal;
}

/**
 * Abre o painel do controlador.
 *   abrirPainelControlador({
 *     sessao, titulo: 'Controlador', prefixoArquivo,
 *     obterBaseParaSalvar: () => base,   // o aplicativo monta a base atual (dados + controladores)
 *     armazenamento,                     // provedor de versoes: habilita "Salvar na nuvem" e "Salvar na base existente"
 *     administrador: { sal, hash },      // confirma os salvamentos de quem entrou como administrador
 *     onEditarCabecalho: () => {},       // habilita o bloco "Cabecalho e logo"
 *     onSair: () => { ... },             // trocar perfil / voltar a tela de entrada
 *     abasExtras: [{ id, texto, conteudo }],
 *   })
 * Os dois salvamentos em versao pedem login e senha de novo antes de abrir.
 */
function abrirPainelControlador({
  sessao, titulo = 'Controlador', prefixoArquivo = 'base', obterBaseParaSalvar, armazenamento, administrador,
  onEditarCabecalho, onSair, abasExtras = [],
} = {}) {
  let modal = null;
  let abas = null;
  const atualizarAba = () => { if (modal && modal.estaAberto()) abas.ativar('ferramentas'); };
  /* a configuracao da nuvem viaja junto com a base salva */
  const baseAtual = () => {
    const base = obterBaseParaSalvar();
    const configNuvem = armazenamento && armazenamento.obterConfig ? armazenamento.obterConfig() : null;
    return configNuvem ? { ...base, nuvem: { ...(base.nuvem || {}), firebase: configNuvem } } : base;
  };

  async function confirmarAcesso(acao) {
    // quem entrou por "Iniciar controle" (perfil administrador) confirma com a senha do administrador
    if (sessao.obter().perfil === 'administrador') {
      const senha = await solicitarSenhaAdministrador({
        administrador, titulo: 'Confirme seu acesso', mensagem: `Para ${acao}, informe novamente a senha do administrador.`,
      });
      return senha ? { login: 'administrador', nome: 'Administrador' } : null;
    }
    return solicitarCredenciais({
      controladores: obterBaseParaSalvar().controladores || [],
      titulo: 'Confirme seu acesso',
      mensagem: `Para ${acao}, confirme o controlador e informe a senha novamente.`,
      loginPadrao: sessao.obter().usuario ? sessao.obter().usuario.login : undefined,
    });
  }

  async function salvarNaNuvem() {
    const quem = await confirmarAcesso('salvar na nuvem');
    if (!quem) return;
    const nome = await solicitarValor({
      titulo: 'Salvar na nuvem',
      rotulo: 'Nome do salvamento',
      obrigatorio: true,
      regras: { minCaracteres: 3, maxCaracteres: 80 },
      valor: `${prefixoArquivo} ${formatarData(new Date(), 'data-hora')}`,
      textoConfirmar: 'Salvar',
    });
    if (nome == null) return;
    try {
      const versao = await armazenamento.salvar({ nome, base: prepararBaseParaSalvar(baseAtual()), autor: quem.nome });
      sessao.limparAlteracoes(`Nuvem: ${versao.nome}`);
      toast.sucesso('Salvo na nuvem', `${versao.nome} — por ${quem.nome}`);
      atualizarAba();
    } catch (erro) {
      toast.erro('Falha ao salvar', erro.message);
    }
  }

  async function salvarNaBaseExistente() {
    const quem = await confirmarAcesso('substituir um salvamento existente');
    if (!quem) return;
    await abrirListaVersoes({
      armazenamento,
      titulo: 'Salvar na base existente',
      textoAcao: 'Substituir',
      varianteAcao: 'warning',
      onEscolher: async (versao) => {
        const ok = await confirmar({
          titulo: `Substituir "${versao.nome}"?`,
          mensagem: `O conteúdo salvo em ${formatarData(versao.salvoEm, 'data-hora')} será trocado pelos dados atuais.`,
          textoConfirmar: 'Substituir',
          perigo: true,
        });
        if (!ok) return false;
        try {
          const nova = await armazenamento.substituir(versao.id, { base: prepararBaseParaSalvar(baseAtual()), autor: quem.nome });
          sessao.limparAlteracoes(`Nuvem: ${nova.nome}`);
          toast.sucesso('Base substituída', `${nova.nome} — por ${quem.nome}`);
          atualizarAba();
          return true;
        } catch (erro) {
          toast.erro('Falha ao substituir', erro.message);
          return false;
        }
      },
    });
  }

  function exportarArquivo() {
    const nome = nomeArquivoBase(prefixoArquivo);
    baixarJSON(prepararBaseParaSalvar(baseAtual()), nome);
    sessao.limparAlteracoes(nome);
    toast.sucesso('Arquivo exportado', nome);
    atualizarAba();
  }

  function ferramentas() {
    const estado = sessao.obter();
    const blocos = [];
    if (sessao.podeEditar()) {
      if (estado.alteracoes) {
        blocos.push(criarAlerta({ tipo: 'warning', titulo: 'Alterações não salvas', mensagem: `Há ${estado.alteracoes} alteração(ões) feitas nesta sessão que ainda não foram gravadas.` }));
      }
      blocos.push(criarPainel({
        titulo: 'Salvar', icone: 'salvar',
        conteudo: h('div', { class: 'ctc-stack' },
          armazenamento ? h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Salvar na nuvem', icone: 'upload', variante: 'primary', onClick: salvarNaNuvem }),
            criarBotao({ texto: 'Salvar na base existente', icone: 'salvar', variante: 'secondary', onClick: salvarNaBaseExistente })) : null,
          armazenamento && armazenamento.descricao
            ? h('p', { class: 'ctc-text-xs ctc-text-muted' }, `Local de armazenamento: ${armazenamento.descricao}. Os dois salvamentos pedem login e senha novamente.`)
            : null,
          h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Exportar arquivo JSON', icone: 'download', variante: 'outline', tamanho: 'sm', onClick: exportarArquivo }),
            h('span', { class: 'ctc-text-xs ctc-text-muted' }, 'Cópia em arquivo, para guardar ou enviar.'))),
      }).elemento);
      if (typeof onEditarCabecalho === 'function') {
        blocos.push(criarPainel({
          titulo: 'Cabeçalho e logo', icone: 'editar',
          conteudo: h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Editar cabeçalho e logo', icone: 'editar', variante: 'outline', onClick: onEditarCabecalho }),
            h('span', { class: 'ctc-text-xs ctc-text-muted' }, 'A alteração é gravada na base no próximo salvamento.')),
        }).elemento);
      }
    } else {
      blocos.push(criarAlerta({ tipo: 'info', titulo: 'Modo visualizador', mensagem: 'Salvamento e edição do cabeçalho estão disponíveis somente para controladores.' }));
    }
    return h('div', { class: 'ctc-stack' }, blocos);
  }

  function painelSaida() {
    return criarPainel({
      titulo: 'Sessão de uso', icone: 'sair',
      conteudo: h('div', { class: 'ctc-stack' },
        h('p', { class: 'ctc-text-sm ctc-text-muted' }, 'Volta à tela inicial para trocar de perfil ou abrir outra base.'),
        criarBotao({
          texto: 'Trocar perfil / Sair', icone: 'sair', variante: 'outline',
          onClick: async () => {
            const pendentes = sessao.obter().alteracoes;
            if (pendentes && sessao.podeEditar()) {
              const ok = await confirmar({ titulo: 'Sair sem salvar?', mensagem: `As ${pendentes} alteração(ões) não salvas serão perdidas.`, textoConfirmar: 'Sair sem salvar', perigo: true });
              if (!ok) return;
            }
            modal.fechar();
            if (typeof onSair === 'function') onSair();
          },
        })),
    }).elemento;
  }

  function infoSessao() {
    const e = sessao.obter();
    const linhas = [
      { item: 'Perfil', valor: ROTULO_PERFIL[e.perfil] || '—' },
      { item: 'Usuário', valor: e.usuario ? `${e.usuario.nome} (${e.usuario.login})` : '—' },
      { item: 'Base em uso', valor: e.nomeArquivo || 'Base de demonstração (não importada)' },
      { item: 'Último salvamento', valor: e.ultimoSalvamento ? formatarData(e.ultimoSalvamento, 'data-hora') : '—' },
      { item: 'Alterações não salvas', valor: String(e.alteracoes) },
    ];
    const tabela = criarTabela({
      compacta: true, altura: 'auto', cabecalhoClaro: true, dados: linhas,
      colunas: [{ campo: 'item', titulo: 'Item', ordenavel: false }, { campo: 'valor', titulo: 'Valor', ordenavel: false }],
    }).elemento;
    return h('div', { class: 'ctc-stack' }, tabela, painelSaida());
  }

  abas = criarAbas({
    abas: [
      { id: 'ferramentas', texto: 'Ferramentas', conteudo: ferramentas },
      { id: 'sessao', texto: 'Sessão', conteudo: infoSessao },
      ...abasExtras,
    ],
  });

  modal = criarModal({ titulo, tamanho: 'lg', destruirAoFechar: true, conteudo: abas.elemento });
  modal.abrir();
  return modal;
}

/**
 * Nuvem com VINCULO: a base aberta (ou ja salva) fica vinculada a um registro
 * da nuvem, e "Salvar na nuvem" passa a ATUALIZAR esse registro em vez de criar
 * outro. So o primeiro salvamento de uma base nova cria um registro.
 * "Salvar na base existente" continua disponivel e muda o vinculo para a base escolhida.
 * Este objeto apenas envolve o armazenamento padrao (mesma interface).
 */
let vinculoNuvem = null;       // { id, nome } da base da nuvem em uso
let ultimaAbertaNuvem = null;  // { id, nome } da ultima base aberta da nuvem

const nuvem = {
  get descricao() {
    const local = armazenamento.descricao;
    return vinculoNuvem
      ? `${local}. Base vinculada: "${vinculoNuvem.nome}" — "Salvar na nuvem" atualiza esta base, sem criar outra`
      : `${local}. O primeiro "Salvar na nuvem" cria a base; os próximos atualizam a mesma base`;
  },
  usandoFirebase: () => armazenamento.usandoFirebase(),
  obterConfig: () => armazenamento.obterConfig(),
  configurar: (...args) => armazenamento.configurar(...args),
  removerConfig: () => armazenamento.removerConfig(),
  listar: () => armazenamento.listar(),
  remover: async (id) => {
    await armazenamento.remover(id);
    if (vinculoNuvem && vinculoNuvem.id === id) vinculoNuvem = null;
  },
  async abrir(id) {
    const registro = await armazenamento.abrir(id);
    ultimaAbertaNuvem = { id, nome: registro.nome };
    return registro;
  },
  async substituir(id, dados) {
    const registro = await armazenamento.substituir(id, dados);
    vinculoNuvem = { id: registro.id, nome: registro.nome };
    return registro;
  },
  async salvar({ nome, base, autor }) {
    if (vinculoNuvem) {
      try {
        const registro = await armazenamento.substituir(vinculoNuvem.id, { base: { ...base, vinculoNuvem }, autor });
        vinculoNuvem = { id: registro.id, nome: registro.nome };
        return registro;
      } catch (erro) {
        /* a base vinculada foi removida da nuvem: cria uma nova com o nome informado */
        if (!/não encontrada/i.test(erro.message)) throw erro;
        vinculoNuvem = null;
      }
    }
    const registro = await armazenamento.salvar({ nome: await nomeParaNovaBase(nome), base, autor });
    vinculoNuvem = { id: registro.id, nome: registro.nome };
    return registro;
  },
};

/**
 * Nome automatico da base na nuvem: se o nome sugerido (prefixo + data/hora) nao foi
 * trocado, usa "<nome da obra> — Faturamento Direto"; repete com (2), (3)... se ja existir.
 */
async function nomeParaNovaBase(nomeDigitado) {
  const digitado = String(nomeDigitado || '').trim();
  if (digitado && !digitado.startsWith(FORMATO_BASE)) return digitado;
  const base = `${(obra.nome || 'Obra sem nome').trim()} — Faturamento Direto`;
  let existentes = [];
  try { existentes = (await armazenamento.listar()).map((v) => normalizarTexto(v.nome)); } catch (erro) { /* segue com o nome base */ }
  let nome = base;
  for (let n = 2; existentes.includes(normalizarTexto(nome)) && n < 100; n += 1) nome = `${base} (${n})`;
  return nome;
}

/* ---- Consulta de CNPJ (UF do emissor) ----
   O numero do CNPJ nao contem o estado: a UF vem do cadastro da Receita Federal,
   consultado na BrasilAPI (servico publico, gratuito, sem chave). Precisa de internet. */
const URL_CNPJ = 'https://brasilapi.com.br/api/cnpj/v1/';
const cacheCnpj = new Map();
async function consultarCnpj(cnpj) {
  const d = String(cnpj || '').replace(/\D/g, '');
  if (d.length !== 14) throw new Error('O CNPJ precisa ter 14 dígitos.');
  if (cacheCnpj.has(d)) return cacheCnpj.get(d);
  let resposta;
  try {
    resposta = await fetch(`${URL_CNPJ}${d}`);
  } catch (erro) {
    throw new Error('Sem acesso à consulta de CNPJ (internet ou rede bloqueada). Informe a UF manualmente.');
  }
  if (resposta.status === 404) throw new Error('CNPJ não encontrado no cadastro da Receita.');
  if (!resposta.ok) throw new Error(`Consulta de CNPJ indisponível agora (erro ${resposta.status}). Informe a UF manualmente.`);
  const j = await resposta.json();
  const r = { uf: String(j.uf || '').toUpperCase(), nome: j.razao_social || '', fantasia: j.nome_fantasia || '', municipio: j.municipio || '' };
  cacheCnpj.set(d, r);
  return r;
}

/** Completa a UF de terceiros sem UF (e dos pedidos deles sem UF de origem) pelo CNPJ. */
async function completarUfPorCnpj(lista) {
  const alvo = lista.filter((t) => !t.uf && String(t.cnpj || '').replace(/\D/g, '').length === 14);
  if (!alvo.length) return;
  let ok = 0;
  const falhas = [];
  for (const t of alvo) {
    try {
      const r = await consultarCnpj(t.cnpj);
      if (!UFS.includes(r.uf)) continue;
      t.uf = r.uf;
      pedidos.filter((p) => p.terceiroId === t.id && !p.ufOrigem).forEach((p) => {
        p.ufOrigem = r.uf;
        p.difalPerc = calcularDifal(p.ufOrigem, p.ufDestino, p.importado).perc;
      });
      ok += 1;
    } catch (erro) {
      falhas.push(`${t.nome}: ${erro.message}`);
    }
  }
  if (ok) { registrarAlteracao(); toast.sucesso('UF consultada pelo CNPJ', `${ok} terceiro(s) atualizado(s)`); }
  if (falhas.length) notificar({ tipo: 'warning', titulo: 'UF não consultada', mensagem: falhas.slice(0, 5).join(' · ') });
}

/* ---- Prazo, aditivos e BM ---- */

function calcularDuracaoDias(inicio, fim, modo) {
  const a = paraData(inicio);
  const b = paraData(fim);
  if (!a || !b || b < a) return null;
  if (modo === 'Dias úteis') {
    let dias = 0;
    const d = new Date(a);
    while (d <= b) {
      if (d.getDay() !== 0 && d.getDay() !== 6) dias += 1;
      d.setDate(d.getDate() + 1);
    }
    return dias;
  }
  return Math.round((b - a) / 86400000) + 1;
}

const aditivosOrdenados = () => ordenar(aditivos, 'data', 'asc', 'data');

function fimVigente() {
  const comPrazo = aditivosOrdenados().filter((a) => a.novoFim);
  return comPrazo.length ? comPrazo[comPrazo.length - 1].novoFim : obra.fim;
}

/**
 * Mes (aaaa-mm) do BM inicial. Informado em "Obra e aditivos" (campo Mes do BM1) ou, por
 * padrao: obra que comeca no dia 1 -> o proprio mes; comecando no meio do mes -> o mes
 * seguinte (os dias antes do BM1 entram no BM1). Ex.: inicio 16/07/2026 -> BM1 = ago/26.
 */
function mesBMInicialPadrao(inicio) {
  const d = paraData(inicio);
  if (!d) return '';
  return formatarData(d.getDate() === 1 ? d : adicionarMeses(new Date(d.getFullYear(), d.getMonth(), 1), 1), 'iso-mes');
}
const mesBM1 = () => obra.bmMesInicial || mesBMInicialPadrao(obra.inicio);

/** BM final sugerido: um BM por mes, do mes do BM1 ate o mes do fim. */
function bmFinalSugerido(inicio, fim, bmInicial, mesInicial) {
  const m1 = mesInicial || mesBMInicialPadrao(inicio);
  if (!m1 || !fim) return null;
  return vn(bmInicial ?? 1) + Math.max(0, diferencaEmMeses(m1, fim));
}

function bmFinalVigente() {
  const extras = aditivos.map((a) => vn(a.novoBmFinal));
  const base = vn(obra.bmFinal) || (obra.inicio && obra.fim ? vn(bmFinalSugerido(obra.inicio, obra.fim, obra.bmInicial || 1, obra.bmMesInicial)) : 0);
  return Math.max(base, ...extras, 0);
}

function duracaoVigente() {
  return calcularDuracaoDias(obra.inicio, fimVigente(), obra.modoPrazo);
}

/** Meses da obra = meses dos BMs: do mes do BM1 ate o fim vigente (ou o BM final, se for depois). */
function mesesObra() {
  const ini = mesBM1();
  const fim = fimVigente();
  if (!ini || !fim) return [];
  let ultimo = formatarData(fim, 'iso-mes');
  if (ultimo < ini) ultimo = ini;
  const mFinal = mesDoBM(bmFinalVigente());
  if (mFinal && mFinal > ultimo) ultimo = mFinal;
  return listarMeses(ini, ultimo);
}

/** BM n = mes do BM1 + (n - BM inicial) meses. */
function mesDoBM(bm) {
  const ini = mesBM1();
  if (!ini || bm == null || bm === '' || !Number.isFinite(Number(bm))) return null;
  return formatarData(adicionarMeses(ini, vn(bm) - vn(obra.bmInicial || 1)), 'iso-mes');
}

/** Numero do BM de um mes (aaaa-mm). */
function bmDoMes(mes) {
  const ini = mesBM1();
  if (!ini || !mes) return null;
  return vn(obra.bmInicial || 1) + diferencaEmMeses(ini, mes);
}

function opcoesBM() {
  const ini = vn(obra.bmInicial || 1);
  const fim = bmFinalVigente();
  const lista = [];
  for (let n = ini; n <= fim && lista.length < 240; n += 1) {
    lista.push({ valor: String(n), texto: `BM${n}` });

}

/* ---- Insumos ---- */

/**
 * Aditivo de valor e raro nesta obra: so quando existir algum (valor diferente de zero)
 * as telas e planilhas mostram "Aditivos" e "Valor vigente"; senao, apenas "Valor total".
 */
const temAditivoValor = () => aditivos.some((a) => Math.abs(vn(a.valor)) > 0.004);
const rotuloValorInsumo = () => (temAditivoValor() ? 'Valor vigente' : 'Valor total');

function valorVigente(ins) {
  return vn(ins.valorTotal) + somar(aditivos.filter((a) => a.insumoId === ins.id), 'valor');
}

function estimadoMensal(ins) {
  const n = mesesObra().length;
  return n ? valorVigente(ins) / n : 0;
}

/** Previsto mes a mes do insumo: valores da grade "Projecao por BM" (mes sem valor = 0). */
function previstoMensal(ins) {
  return mesesObra().map((m) => vn((ins.projecao || {})[m]));
}

/**
 * BMs fechados: os meses ANTES do mes atual. Num BM fechado vale so o REAL (NFs); o previsto
 * daquele mes deixa de contar. Retorna o indice do mes atual em mesesObra() (0..n).
 */
function indiceFechamento(meses = mesesObra()) {
  const hoje = mesHoje();
  if (!meses.length || hoje < meses[0]) return 0;
  if (hoje > meses[meses.length - 1]) return meses.length;
  return meses.indexOf(hoje);
}

/** Real (NFs) de um insumo, mes a mes (pelo mes do BM). */
function realMensalInsumo(ins, meses = mesesObra()) {
  const real = new Array(meses.length).fill(0);
  notas.forEach((nf) => {
    if (insumoDaNota(nf)?.id !== ins.id) return;
    const i = meses.indexOf(mesDaNota(nf));
    if (i >= 0) real[i] += vn(nf.valor);
  });
  return real;
}

/**
 * Situacao da projecao do insumo:
 *  vigente     = real nos BMs fechados + previsto nos BMs abertos (mes atual em diante);
 *  difFechados = previsto - real nos BMs fechados (o que sobrou ou faltou no que ja passou);
 *  naoDistrib  = valor do insumo - soma da grade (o que nunca foi distribuido);
 *  falta       = valor - vigente (= naoDistrib + difFechados): o que precisa ser redistribuido.
 */
function distribuicaoInsumo(ins, { meses = mesesObra(), real = null } = {}) {
  const prev = previstoMensal(ins);
  const r = real || realMensalInsumo(ins, meses);
  const fech = indiceFechamento(meses);
  const vigente = prev.map((v, i) => (i < fech ? r[i] : v));
  const distribuido = vigente.reduce((t, v) => t + v, 0);
  const valor = valorVigente(ins);
  const difFechados = prev.slice(0, fech).reduce((t, v, i) => t + v - r[i], 0);
  const falta = valor - distribuido;
  return {
    vigente, distribuido, falta, difFechados, naoDistrib: valor - prev.reduce((t, v) => t + v, 0), fech,
    situacao: Math.abs(falta) < 0.05 ? 'fecha' : falta > 0 ? 'falta' : 'excede',
  };
}
const insumosSemFechar = () => insumos.filter((i) => distribuicaoInsumo(i).situacao !== 'fecha');

/**
 * Ajusta as projecoes ao calendario de BMs (chamado ao abrir a base e a cada alteracao):
 *  - insumos ainda "lineares" (bases antigas) viram valores na grade (valor / meses),
 *    sem mudar nenhum numero;
 *  - valores em meses fora do calendario (antes do BM1 ou depois do ultimo BM) somam ao
 *    primeiro/ultimo mes, para nada se perder quando o calendario muda.
 */
function normalizarProjecoes() {
  const meses = mesesObra();
  if (!meses.length) return;
  const primeiro = meses[0];
  const ultimo = meses[meses.length - 1];
  insumos.forEach((ins) => {
    if (ins.modoProjecao !== 'manual') {
      /* partes iguais em centavos; o resto dos centavos vai para o ultimo mes */
      const total = Math.round(valorVigente(ins) * 100);
      const parte = Math.floor(total / meses.length);
      ins.projecao = Object.fromEntries(meses.map((m, i) => [m, (i === meses.length - 1 ? total - parte * (meses.length - 1) : parte) / 100]));
      ins.modoProjecao = 'manual';
      return;
    }
    const proj = ins.projecao || {};
    Object.keys(proj).forEach((m) => {
      if (m >= primeiro && m <= ultimo) return;
      const alvo = m < primeiro ? primeiro : ultimo;
      proj[alvo] = vn(proj[alvo]) + vn(proj[m]);
      delete proj[m];
    });
    ins.projecao = proj;
  });
}

/* ---- Produtos e REIDI ---- */

/**
 * REIDI do pedido, em 3 modos:
 *  - 'sem'     Sem REIDI: um valor so por produto (SEM = COM, 0%).
 *  - 'pedido'  Por pedido: com % informado, vale para todos os produtos e basta UM valor
 *              (o outro e calculado); sem %, cada produto informa os dois valores e o %
 *              do pedido e calculado sobre o total.
 *  - 'produto' Por produto: dois valores por produto; % de cada um pela diferenca.
 */
const temPercPedido = (ped) => Boolean(ped) && ped.modoReidi === 'pedido' && ped.percentualReidi != null && ped.percentualReidi !== '';

/** Rotulo curto do REIDI do pedido (para tabelas). */
function rotuloReidiPedido(ped, r = null) {
  if (!ped) return '';
  if (ped.modoReidi === 'sem') return 'Sem REIDI';
  if (temPercPedido(ped)) return `Por pedido · ${percExato(ped.percentualReidi)}`;
  if (ped.modoReidi === 'pedido') return `Por pedido · ${percExato((r || resumoPedido(ped)).percReidi)} (calculado)`;
  return 'Por produto';
}

/** Completa os valores unitarios conforme o modo de REIDI (usado em cadastro e importacoes). */
function completarValoresReidi(modo, perc, sem, com) {
  const temPerc = modo === 'pedido' && perc != null && perc !== '';
  const p = vn(perc);
  if (modo === 'sem') {
    const v = com ?? sem;
    return { unitSem: vn(v), unitCom: vn(v), ajusteManual: false, falta: v == null ? 'falta o valor' : '' };
  }
  if (temPerc) {
    let s2 = sem; let c2 = com;
    if (s2 == null && c2 != null && p < 100) s2 = c2 / (1 - p / 100);
    if (c2 == null && s2 != null) c2 = s2 * (1 - p / 100);
    return {
      unitSem: vn(s2), unitCom: vn(c2), falta: s2 == null && c2 == null ? 'falta o valor' : '',
      ajusteManual: sem != null && com != null && Math.abs(vn(com) - vn(sem) * (1 - p / 100)) > 0.005,
    };
  }
  return { unitSem: vn(sem), unitCom: vn(com), ajusteManual: false, falta: sem == null ? 'falta SEM REIDI' : com == null ? 'falta COM REIDI' : '' };
}

/** Le o modo de REIDI de um texto de planilha ("sem", "pedido", "produto"). */
function modoReidiDeTexto(texto, temPercentual) {
  const t = normalizarTexto(String(texto || ''));
  if (t.includes('sem')) return 'sem';
  if (t.includes('pedido') || t.includes('%') || t.includes('unico')) return 'pedido';
  if (t.includes('produto')) return 'produto';
  return temPercentual ? 'pedido' : 'produto';
}

/** Valor unitario COM REIDI efetivo: no modo "% do pedido" e calculado, salvo ajuste manual. */
function unitComEfetivo(prod) {
  const ped = pedidoPorId(prod.pedidoId);
  if (ped && ped.modoReidi === 'sem') return vn(prod.unitSem ?? prod.unitCom);
  if (temPercPedido(ped) && !prod.ajusteManual) {
    return vn(prod.unitSem) * (1 - vn(ped.percentualReidi) / 100);
  }
  return vn(prod.unitCom);
}

function analisarProduto(prod) {
  const sem = vn(prod.unitSem);
  const com = unitComEfetivo(prod);
  const qtd = vn(prod.quantidade);
  const qtdFaturada = notas.reduce((t, n) => t + (n.itens || [])
    .filter((i) => i.produtoId === prod.id).reduce((s, i) => s + vn(i.quantidade), 0), 0);
  return {
    unitSem: sem,
    unitCom: com,
    diferenca: sem - com,
    percReidi: sem > 0 ? ((sem - com) / sem) * 100 : 0,
    totalSem: qtd * sem,
    totalCom: qtd * com,
    reidiTotal: qtd * (sem - com),
    qtdFaturada,
    saldoQtd: qtd - qtdFaturada,
  };
}

/* ---- Pedidos ---- */

function resumoPedido(ped) {
  const prods = produtosDoPedido(ped.id);
  const analises = prods.map(analisarProduto);
  const totalSem = analises.reduce((t, a) => t + a.totalSem, 0);
  const totalCom = analises.reduce((t, a) => t + a.totalCom, 0);
  const nfs = notasDoPedido(ped.id);
  const faturado = somar(nfs, 'valor');
  const valor = vn(ped.valor);
  return {
    prods, totalSem, totalCom,
    reidi: totalSem - totalCom,
    percReidi: totalSem > 0 ? ((totalSem - totalCom) / totalSem) * 100 : 0,
    nfs, faturado,
    saldo: valor - faturado,
    perc: valor > 0 ? (faturado / valor) * 100 : 0,
    /* [Interpretacao] o valor do pedido fecha com o total dos produtos COM REIDI */
    divergente: false,   /* o valor do pedido e a propria soma dos produtos */
    excedido: faturado - valor > 0.05,
  };
}

/* ---- DIFAL ---- */

function aliquotaInterestadual(origem, destino, importado) {
  if (!origem || !destino || origem === destino) return null;
  if (importado) return 4;
  if (UF_SUL_SUDESTE_EXCETO_ES.includes(origem) && !UF_SUL_SUDESTE_EXCETO_ES.includes(destino)) return 7;
  return 12;
}

function calcularDifal(origem, destino, importado) {
  const inter = aliquotaInterestadual(origem, destino, importado);
  const interna = vn(aliquotas[destino]);
  if (inter == null) {
    return { perc: 0, inter: null, interna, texto: origem && destino ? 'Operação interna (mesma UF): sem DIFAL.' : 'Informe UF de origem e de destino.' };
  }
  const perc = Math.max(0, arred2(interna - inter));
  return {
    perc, inter, interna,
    texto: `${origem} → ${destino}: interna ${destino} ${formatarPercentual(interna)} − interestadual ${formatarPercentual(inter, { casas: 0 })} = DIFAL ${formatarPercentual(perc)}`,
  };
}

/* ---- Notas fiscais ---- */

/** [Interpretacao] O mes "real" da NF e o mes do BM escolhido; sem BM, o mes da emissao. */
function mesDaNota(nf) {
  const mes = mesDoBM(nf.bm) || (nf.data ? formatarData(nf.data, 'iso-mes') : null);
  const ini = mesBM1();
  return mes && ini && mes < ini ? ini : mes;   /* dias antes do BM1 entram no BM1 */
}

function analisarNota(nf) {
  const itens = nf.itens || [];
  const semVinculo = nf.itensSemVinculo || [];
  const valorItens = itens.reduce((t, i) => t + vn(i.quantidade) * vn(i.valorUnit), 0)
    + semVinculo.reduce((t, i) => t + vn(i.valorTotal), 0);
  const reidiItens = itens.reduce((t, i) => {
    const p = produtoPorId(i.produtoId);
    return t + (p ? vn(i.quantidade) * Math.max(0, vn(p.unitSem) - vn(i.valorUnit)) : 0);
  }, 0);
  const excede = itens.some((i) => {
    const p = produtoPorId(i.produtoId);
    if (!p) return false;
    const outras = notas.filter((n) => n.id !== nf.id).reduce((t, n) => t + (n.itens || [])
      .filter((x) => x.produtoId === p.id).reduce((s, x) => s + vn(x.quantidade), 0), 0);
    return outras + vn(i.quantidade) - vn(p.quantidade) > 0.0001;
  });
  let situacao = 'Conferida';
  if (!itens.length && !semVinculo.length) situacao = 'Sem itens';
  else if (semVinculo.length || itens.some((i) => !produtoPorId(i.produtoId))) situacao = 'Item sem pedido';
  else if (excede) situacao = 'Excede pedido';
  else if (Math.abs(valorItens - vn(nf.valor)) > 0.05) situacao = 'Divergente';
  return { valorItens, reidiItens, situacao, diferenca: vn(nf.valor) - valorItens };
}

/* ---- Boletos ---- */

function statusBoleto(b) {
  if (b.status === 'Cancelado') return 'Cancelado';
  if (b.pagamento) return 'Pago';
  if (b.status === 'Em aberto' && b.vencimento && formatarData(b.vencimento, 'iso') < hojeIso()) return 'Vencido';
  return b.status || 'Em aberto';
}

/* ---- Insumo consolidado ---- */

function resumoInsumo(ins) {
  const ters = terceiros.filter((t) => t.insumoId === ins.id);
  const idsTer = new Set(ters.map((t) => t.id));
  const peds = pedidos.filter((p) => idsTer.has(p.terceiroId));
  const idsPed = new Set(peds.map((p) => p.id));
  const nfs = notas.filter((n) => idsPed.has(n.pedidoId));
  const vigente = valorVigente(ins);
  const comprometido = somar(peds, 'valor');
  const faturado = somar(nfs, 'valor');
  return {
    ters, peds, nfs, vigente, comprometido, faturado,
    reidi: somar(nfs, 'reidi'),
    difal: somar(nfs, 'difalValor'),
    saldoContratar: vigente - comprometido,
    saldoFaturar: vigente - faturado,
    percFaturado: vigente > 0 ? (faturado / vigente) * 100 : 0,
    percComprometido: vigente > 0 ? (comprometido / vigente) * 100 : 0,
  };
}

/* ---- Numeracao hierarquica ---- */

/**
 * Codigo de cada item na ordem geral do controle:
 * insumo 1 (ordem alfabetica) > terceiro 1.1 (alfabetica) > pedido 1.1.1 (emissao)
 * > NF 1.1.1.1 (data) > boleto 1.1.1.1.1 (vencimento).
 * Os codigos acompanham a ordem: um item novo pode deslocar a numeracao dos seguintes.
 */
function codigosHierarquia() {
  const mapa = new Map();
  const reg = (id, partes) => mapa.set(id, {
    codigo: partes.join('.'),
    ordem: partes.map((n) => String(n).padStart(3, '0')).join('.'),
  });
  ordenar(insumos, 'nome').forEach((ins, i) => {
    const cI = [i + 1];
    reg(ins.id, cI);
    ordenar(terceiros.filter((t) => t.insumoId === ins.id), 'nome').forEach((ter, j) => {
      const cT = [...cI, j + 1];
      reg(ter.id, cT);
      pedidos.filter((p) => p.terceiroId === ter.id)
        .sort((x, y) => String(x.dataEmissao).localeCompare(String(y.dataEmissao)) || String(x.numero).localeCompare(String(y.numero)))
        .forEach((ped, k, lista) => {
          const cP = [...cT, k + 1];
          reg(ped.id, cP);
          mapa.get(ped.id).posicao = `${k + 1} de ${lista.length}`;
          ordenar(notas.filter((n) => n.pedidoId === ped.id), 'data', 'asc', 'data').forEach((nf, l) => {
            const cN = [...cP, l + 1];
            reg(nf.id, cN);
            ordenar(boletos.filter((b) => b.notaId === nf.id), 'vencimento', 'asc', 'data').forEach((b, m) => reg(b.id, [...cN, m + 1]));
          });
        });
    });
  });
  return mapa;
}

/* ---- Tendencia ---- */

/**
 * Serie mensal de um conjunto de insumos.
 * Previsto: projecao de cada insumo. Real: NFs pelo mes do BM.
 * Tendencia: real ate o mes de referencia; depois, o saldo (valor vigente - real)
 * redistribuido na proporcao do previsto dos meses restantes.
 */
function serieTendencia(lista) {
  const meses = mesesObra();
  const n = meses.length;
  const prev = new Array(n).fill(0);
  const real = new Array(n).fill(0);
  let total = 0;
  let foraDoPrazo = 0;
  lista.forEach((ins) => {
    total += valorVigente(ins);
    previstoMensal(ins).forEach((v, i) => { prev[i] += v; });
  });
  const ids = new Set(lista.map((i) => i.id));
  notas.forEach((nf) => {
    const ins = insumoDaNota(nf);
    if (!ins || !ids.has(ins.id)) return;
    const i = meses.indexOf(mesDaNota(nf));
    if (i >= 0) real[i] += vn(nf.valor);
    else foraDoPrazo += vn(nf.valor);
  });
  const atual = mesHoje();
  let idxRef = -1;
  meses.forEach((m, i) => { if (m <= atual) idxRef = i; });
  real.forEach((v, i) => { if (v && i > idxRef) idxRef = i; });

  const acumular = (arr) => { let s = 0; return arr.map((v) => { s += v; return s; }); };
  const acumPrev = acumular(prev);
  const acumRealCompleto = acumular(real);
  const realAteRef = idxRef >= 0 ? acumRealCompleto[idxRef] : 0;
  const prevAteRef = idxRef >= 0 ? acumPrev[idxRef] : 0;
  /*
   * Mes em andamento (o mes de hoje): ainda nao fechou, entao tem real parcial E tendencia.
   * Tendencia do mes atual = o maior entre o real ja lancado e a sua parte do saldo
   * (saldo = valor vigente - real dos meses fechados, na proporcao do previsto do mes atual
   * em diante). O restante do saldo vai para os meses seguintes, na proporcao do previsto.
   */
  const emAndamento = idxRef >= 0 && meses[idxRef] === atual ? idxRef : -1;
  const reparte = (valor, de) => {
    const prevResto = prev.slice(de).reduce((t, v) => t + v, 0);
    const qtd = n - de;
    return (i) => (prevResto > 0 ? (prev[i] * valor) / prevResto : qtd > 0 ? valor / qtd : 0);
  };
  let tendMensal;
  if (emAndamento >= 0) {
    const realFechado = emAndamento > 0 ? acumRealCompleto[emAndamento - 1] : 0;
    const saldoMes = total - realFechado;
    const tendAtual = Math.max(real[emAndamento], Math.max(0, reparte(saldoMes, emAndamento)(emAndamento)));
    const parteResto = reparte(Math.max(0, saldoMes - tendAtual), emAndamento + 1);
    tendMensal = prev.map((p, i) => (i < emAndamento ? real[i] : i === emAndamento ? tendAtual : parteResto(i)));
  } else {
    const parte = reparte(total - realAteRef, idxRef + 1);
    tendMensal = prev.map((p, i) => (i <= idxRef ? real[i] : parte(i)));
  }
  return {
    meses, prev, real, acumPrev,
    acumReal: acumRealCompleto.map((v, i) => (i <= idxRef ? v : null)),
    tendMensal, acumTend: acumular(tendMensal),
    idxRef, emAndamento, total, realAteRef, prevAteRef, foraDoPrazo,
    desvio: realAteRef - prevAteRef,
  };
}

const podeEditar = () => sessao.podeEditar();

/** Redesenha a pagina atual depois de uma alteracao. */
function recarregar() {
  if (appAtual) appAtual.navegar(appAtual.paginaAtual());
}

/** Atualiza o detalhe de pedido aberto (modal) depois de alteracoes. */
let atualizarDetalheAberto = null;

/** Valor do pedido e SEMPRE a soma dos seus produtos (qtd x unitario COM REIDI), sem arredondar. */
function valorDosProdutos(pedidoId) {
  return produtosDoPedido(pedidoId).reduce((t, pr) => t + vn(pr.quantidade) * unitComEfetivo(pr), 0);
}
/* status do distrato: 'Solicitado' (registrado, sem efeito), 'Aprovado' (saldo sai do pedido
   e volta ao insumo) ou 'Reprovado' (fica no historico, sem efeito) */
const statusDistrato = (x) => x.status || 'Aprovado';   /* registros antigos (sem status) ja tinham efeito */
const distratoDoPedido = (pedidoId) => distratos.find((x) => x.pedidoId === pedidoId && statusDistrato(x) === 'Aprovado') || null;
/** Distrato em andamento ou aprovado (impede abrir outro); reprovados ficam so no historico. */
const distratoAtivoDoPedido = (pedidoId) => distratos.find((x) => x.pedidoId === pedidoId && statusDistrato(x) !== 'Reprovado') || null;
function sincronizarValoresPedidos() {
  /* valor comprometido = soma dos produtos - saldo distratado (o distratado volta para o insumo) */
  pedidos.forEach((p) => {
    p.valorOriginal = valorDosProdutos(p.id);
    const dist = distratoDoPedido(p.id);
    p.valor = p.valorOriginal - (dist ? vn(dist.valorSaldo) : 0);
  });
  sincronizarReidiNotas();
}

/**
 * REIDI da NF = soma, produto a produto, de qtd x (unitario SEM REIDI do pedido - unitario na NF).
 * O valor da NF ja vem COM REIDI; a diferenca para o preco SEM REIDI do pedido e o beneficio.
 * NF sem produtos marcados ou com REIDI ajustado a mao (reidiManual) mantem o valor informado.
 */
function reidiDosItens(nf) {
  return (nf.itens || []).reduce((t, i) => {
    const p = produtoPorId(i.produtoId);
    return t + (p ? vn(i.quantidade) * Math.max(0, vn(p.unitSem) - vn(i.valorUnit)) : 0);
  }, 0);
}
function sincronizarReidiNotas() {
  notas.forEach((n) => {
    if (n.reidiManual || !(n.itens || []).length) return;
    n.reidi = reidiDosItens(n);
  });
}

function registrarAlteracao() {
  sincronizarValoresPedidos();
  normalizarProjecoes();
  sessao.marcarAlteracao();
  recarregar();
  if (typeof atualizarDetalheAberto === 'function') atualizarDetalheAberto();
}

/**
 * Celula de GRD: numeros ja lancados + botao "+" ao lado para incluir outro.
 * Usada na ultima coluna das tabelas de notas e de boletos.
 */
function celulaGrd(objeto) {
  const lista = objeto.grds || [];
  return h('div', { class: 'ctc-cluster' },
    lista.length ? lista.map((g) => criarBadge({ texto: g, variante: 'info' })) : h('span', { class: 'ctc-text-subtle ctc-text-xs' }, 'sem GRD'),
    botaoFD({
      icone: 'mais', variante: 'ghost', tamanho: 'sm', titulo: 'Adicionar nº de GRD', apenasEdicao: true,
      onClick: async (e) => {
        if (e) e.stopPropagation();
        const valor = await solicitarValor({
          titulo: 'Adicionar GRD', rotulo: 'Nº da GRD (várias: separe por ;)', obrigatorio: true,
        });
        if (valor == null) return;
        objeto.grds = [...lista, ...lerGrds(valor)];
        /* na NF, a GRD e o lancamento no e-clic */
        if ('pedidoId' in objeto) { objeto.eclic = true; if (!objeto.eclicData) objeto.eclicData = hojeIso(); }
        registrarAlteracao();
        toast.sucesso('GRD adicionada', textoGrds(objeto.grds));
      },
    }));
}

/* ---- Grafico SVG (linhas e barras) ---- */

const SVG_NS = 'http://www.w3.org/2000/svg';
const COR_GRAFICO = {
  previsto: '#1e40af', real: '#0f766e', tendencia: '#b45309', grade: '#e2e8f0', eixo: '#64748b', hoje: '#dc2626',
};

function elSvg(tag, atributos = {}, ...filhos) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(atributos).forEach(([k, v]) => { if (v != null) el.setAttribute(k, String(v)); });
  filhos.flat().forEach((f) => {
    if (f == null) return;
    el.append(f instanceof Node ? f : document.createTextNode(String(f)));
  });
  return el;
}

function legendaGrafico(itens) {
  return h('div', { class: 'ctc-legend' }, itens.map(({ texto, tema, tracejada }) => h('span', { class: 'ctc-legend__item' },
    h('span', { class: `ctc-legend__swatch ctc-theme-${tema}` }), tracejada ? `${texto} (- -)` : texto)));
}

/**
 * Grafico mensal: barras agrupadas e/ou linhas, um eixo em R$.
 * serie: { meses, barras: [{ valores, cor }], linhas: [{ valores, cor, tracejada }], marcador: indice }
 */
function graficoMensal({ meses, barras = [], linhas = [], marcador = -1, altura: alturaTotal = 300 }) {
  const L = 960; const A = alturaTotal;
  const m = { e: 92, d: 16, t: 14, b: 46 };
  const largura = L - m.e - m.d;
  const altura = A - m.t - m.b;
  const n = Math.max(meses.length, 1);
  const todos = [...barras, ...linhas].flatMap((s) => s.valores).filter((v) => v != null);
  const maximo = Math.max(1, ...todos) * 1.08;
  const y = (v) => m.t + altura - (vn(v) / maximo) * altura;
  const faixa = largura / n;
  const xc = (i) => m.e + faixa * i + faixa / 2;

  const svg = elSvg('svg', {
    viewBox: `0 0 ${L} ${A}`, width: '100%', role: 'img', 'aria-label': 'Gráfico mensal', 'font-family': 'inherit',
  });
  for (let k = 0; k <= 4; k += 1) {
    const v = (maximo / 4) * k;
    svg.append(
      elSvg('line', { x1: m.e, x2: L - m.d, y1: y(v), y2: y(v), stroke: COR_GRAFICO.grade, 'stroke-width': 1 }),
      elSvg('text', { x: m.e - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: COR_GRAFICO.eixo }, formatarMoedaCompacta(v)),
    );
  }
  const passo = Math.ceil(n / 14);
  meses.forEach((mes, i) => {
    if (i % passo !== 0 && i !== n - 1) return;
    svg.append(elSvg('text', { x: xc(i), y: A - m.b + 18, 'text-anchor': 'middle', 'font-size': 11, fill: COR_GRAFICO.eixo }, formatarData(mes, 'mes-ano')));
  });
  if (marcador >= 0 && marcador < n) {
    const xm = m.e + faixa * (marcador + 1);
    svg.append(
      elSvg('line', { x1: xm, x2: xm, y1: m.t, y2: m.t + altura, stroke: COR_GRAFICO.hoje, 'stroke-width': 1, 'stroke-dasharray': '3 3' }),
      elSvg('text', { x: xm - 4, y: m.t + 10, 'text-anchor': 'end', 'font-size': 10, fill: COR_GRAFICO.hoje }, 'hoje'),
    );
  }
  const larguraBarra = Math.max(2, (faixa * 0.7) / Math.max(barras.length, 1));
  barras.forEach((s, b) => {
    s.valores.forEach((v, i) => {
      if (!v) return;
      const x0 = m.e + faixa * i + faixa * 0.15 + larguraBarra * b;
      svg.append(elSvg('rect', {
        x: x0, y: y(v), width: larguraBarra - 1, height: Math.max(0, m.t + altura - y(v)), fill: s.cor, 'fill-opacity': s.opacidade ?? 0.85, rx: 1,
      }, elSvg('title', {}, `${formatarData(meses[i], 'mes-ano')} — ${s.nome}: ${formatarMoeda(v)}`)));
    });
  });
  linhas.forEach((s) => {
    const pontos = s.valores.map((v, i) => (v == null ? null : `${xc(i)},${y(v)}`));
    let trecho = [];
    const fechar = () => {
      if (trecho.length > 1) {
        svg.append(elSvg('polyline', {
          points: trecho.join(' '), fill: 'none', stroke: s.cor, 'stroke-width': 2.5, 'stroke-dasharray': s.tracejada ? '6 4' : null, 'stroke-linejoin': 'round',
        }));
      }
      trecho = [];
    };
    pontos.forEach((p) => { if (p) trecho.push(p); else fechar(); });
    fechar();
    s.valores.forEach((v, i) => {
      if (v == null) return;
      svg.append(elSvg('circle', { cx: xc(i), cy: y(v), r: 3, fill: s.cor },
        elSvg('title', {}, `${formatarData(meses[i], 'mes-ano')} — ${s.nome}: ${formatarMoeda(v)}`)));
    });
  });
  svg.append(elSvg('line', { x1: m.e, x2: L - m.d, y1: m.t + altura, y2: m.t + altura, stroke: COR_GRAFICO.eixo, 'stroke-width': 1 }));
  return h('div', { class: 'ctc-stack' }, svg);
}

/** Curva acumulada (e, se pedido, barras mensais) de uma serie de tendencia. */
/** SVG (texto gerado aqui, valores escapados) -> elemento, ocupando a largura disponivel. */
function svgParaElemento(svg) {
  const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
  const el = document.importNode(doc.documentElement, true);
  el.removeAttribute('width');
  el.removeAttribute('height');
  el.setAttribute('style', 'width:100%;height:auto;display:block');
  el.setAttribute('role', 'img');
  return el;
}

/**
 * Grafico de evolucao no MESMO modelo do relatorio: barras do mes (real e tendencia),
 * linhas acumuladas (real, tendencia e, aqui, tambem o previsto), eixo em % do valor vigente
 * e rotulos em mil/mi. mensal=false (dashboard): grafico mais baixo.
 */
function blocoCurvas(serie, { mensal = true, titulo = null } = {}) {
  if (!serie.meses.length) {
    return criarAlerta({ tipo: 'info', mensagem: 'Sem meses de obra definidos: preencha início e fim da obra.' });
  }
  if (!serie.total && !serie.real.some(Boolean)) {
    return criarAlerta({ tipo: 'info', mensagem: 'Sem valores previstos nem NFs lançadas para desenhar a curva.' });
  }
  const svg = svgEvolucao(serie, { largura: 1300, altura: mensal ? 460 : 400, comPrevisto: true, titulo });
  return criarPainel({
    titulo: 'Evolução mensal', icone: 'grafico',
    tag: 'real × tendência × previsto',
    conteudo: svgParaElemento(svg),
  }).elemento;
}

function kpisSerie(serie) {
  const ultimoAcum = serie.acumTend.length ? serie.acumTend[serie.acumTend.length - 1] : 0;
  return h('div', { class: 'ctc-grid ctc-grid--4' },
    criarKpi({ rotulo: 'Previsto até a referência', valor: formatarMoeda(serie.prevAteRef), sub: 'soma da projeção até hoje' }).elemento,
    criarKpi({ rotulo: 'Real até a referência', valor: formatarMoeda(serie.realAteRef), sub: 'NFs pelo mês do BM', variante: 'accent', tema: 2 }).elemento,
    criarKpi({
      rotulo: 'Desvio acumulado (real − previsto)', valor: formatarMoeda(Math.abs(serie.desvio) < 0.005 ? 0 : serie.desvio),
      sub: serie.prevAteRef ? `${formatarPercentual((Math.abs(serie.desvio) < 0.005 ? 0 : serie.desvio / serie.prevAteRef) * 100, { casas: 2 })} do previsto` : '',
      variante: serie.desvio < -0.005 ? 'danger' : 'success',
    }).elemento,
    criarKpi({
      rotulo: 'Tendência no fim da obra', valor: formatarMoeda(ultimoAcum),
      sub: serie.foraDoPrazo ? `+ ${formatarMoeda(serie.foraDoPrazo)} em NFs fora do prazo` : `de ${formatarMoeda(serie.total)} vigentes`,
    }).elemento);
}

function tabelaSerie(serie) {
  const linhas = serie.meses.map((mes, i) => ({
    mes,
    bm: (() => {
      const op = opcoesBM().find((o) => mesDoBM(o.valor) === mes);
      return op ? `BM${op.valor}` : '—';
    })(),
    previsto: serie.prev[i],
    real: i <= serie.idxRef ? serie.real[i] : null,
    desvio: i <= serie.idxRef ? serie.real[i] - serie.prev[i] : null,
    acumPrev: serie.acumPrev[i],
    acumReal: serie.acumReal[i],
    tendencia: serie.tendMensal[i],
    acumTend: serie.acumTend[i],
    ref: i === serie.idxRef,
  }));
  return criarTabela({
    dados: linhas, compacta: true, altura: 'auto', listrada: true,
    linhaVariante: (l) => (l.ref ? 'info' : null),
    colunas: [
      { campo: 'mes', titulo: 'Mês', formatar: (v) => formatarData(v, 'mes-ano'), ordenavel: false, fixa: true },
      { campo: 'bm', titulo: 'BM', ordenavel: false },
      { campo: 'previsto', titulo: 'Previsto', tipo: 'moeda', total: 'soma', ordenavel: false },
      { campo: 'real', titulo: 'Real', tipo: 'moeda', total: 'soma', ordenavel: false },
      {
        campo: 'desvio', titulo: 'Desvio', tipo: 'moeda', ordenavel: false,
        render: (v) => {
          if (v == null) return '—';
          /* residuo de centavos (ex.: -0,000001) conta como zero: verde e sem sinal */
          const x = Math.abs(v) < 0.005 ? 0 : v;
          return h('span', { class: x < 0 ? 'ctc-text-danger ctc-num' : 'ctc-text-success ctc-num' }, formatarMoeda(x));
        },
      },
      { campo: 'acumPrev', titulo: 'Previsto acum.', tipo: 'moeda', ordenavel: false },
      { campo: 'acumReal', titulo: 'Real acum.', tipo: 'moeda', ordenavel: false },
      { campo: 'tendencia', titulo: 'Tendência no mês', tipo: 'moeda', total: 'soma', ordenavel: false },
      { campo: 'acumTend', titulo: 'Tendência acum.', tipo: 'moeda', ordenavel: false },
    ],
  });
}
