/* ---- Alterar o REIDI de um pedido ja cadastrado ---- */

/**
 * Novo valor de cada produto ao mudar o REIDI do pedido.
 * base 'sem' = mantem o valor SEM REIDI e recalcula o COM; base 'com' = mantem o COM e recalcula o SEM.
 */
function produtosComNovoReidi(ped, novoModo, novoPerc, base) {
  const temPerc = novoModo === 'pedido' && novoPerc != null && novoPerc !== '';
  const p = vn(novoPerc);
  return produtosDoPedido(ped.id).map((pr) => {
    const sem = vn(pr.unitSem);
    const com = unitComEfetivo(pr);
    let novoSem = sem; let novoCom = com; let aviso = '';
    if (novoModo === 'sem') {
      novoSem = base === 'com' ? com : sem; novoCom = novoSem;
    } else if (temPerc) {
      if (base === 'com' && p < 100) { novoCom = com; novoSem = com / (1 - p / 100); } else { novoSem = sem; novoCom = sem * (1 - p / 100); }
    } else if (ped.modoReidi === 'sem' || Math.abs(sem - com) < 0.000001) {
      aviso = 'SEM = COM: informe o valor COM REIDI deste produto';
    }
    return { pr, sem, com, novoSem, novoCom, aviso, qtd: vn(pr.quantidade) };
  });
}

function abrirAlterarReidi(ped) {
  const previa = h('div', {});
  const temNfs = notasDoPedido(ped.id).length;
  const formulario = criarFormulario({
    colunas: 2, semBotoes: true,
    valores: { modoReidi: ped.modoReidi || 'produto', percentualReidi: ped.percentualReidi, base: 'sem' },
    campos: [
      {
        nome: 'modoReidi', rotulo: 'Novo REIDI do pedido', tipo: 'radio', obrigatorio: true, larguraTotal: true,
        opcoes: [
          { valor: 'sem', texto: 'Sem REIDI' },
          { valor: 'pedido', texto: 'Por pedido (% geral, opcional)' },
          { valor: 'produto', texto: 'Por produto' },
        ],
      },
      { nome: 'percentualReidi', rotulo: '% REIDI do pedido (opcional)', tipo: 'percentual', regras: { minimo: 0, maximo: 99.99 } },
      {
        nome: 'base', rotulo: 'Ao recalcular, manter fixo', tipo: 'radio', larguraTotal: true,
        opcoes: [{ valor: 'sem', texto: 'o valor SEM REIDI (recalcula o COM)' }, { valor: 'com', texto: 'o valor COM REIDI (recalcula o SEM)' }],
      },
    ],
    onEnviar: async (v) => {
      const temPerc = v.modoReidi === 'pedido' && v.percentualReidi != null && v.percentualReidi !== '';
      const linhas = produtosComNovoReidi(ped, v.modoReidi, temPerc ? v.percentualReidi : null, v.base);
      const valorNovo = linhas.reduce((t, l) => t + l.qtd * l.novoCom, 0);
      const ok = await confirmar({
        titulo: 'Aplicar o novo REIDI?',
        mensagem: `Pedido ${ped.numero}: ${linhas.length} produto(s) recalculado(s); valor do pedido ${formatarMoeda(ped.valor)} → ${formatarMoeda(valorNovo)}.${temNfs ? ' As NFs já lançadas não mudam.' : ''}`,
        textoConfirmar: 'Aplicar',
      });
      if (!ok) return;
      ped.modoReidi = v.modoReidi;
      ped.percentualReidi = temPerc ? vn(v.percentualReidi) : null;
      linhas.forEach((l) => { l.pr.unitSem = l.novoSem; l.pr.unitCom = l.novoCom; l.pr.ajusteManual = false; });
      modal.fechar();
      registrarAlteracao();
      toast.sucesso('REIDI alterado', `${ped.numero}: ${rotuloReidiPedido(ped)}`);
    },
  });
  const campoPerc = formulario.campo('percentualReidi');
  const caixaPerc = campoPerc ? campoPerc.closest('.ctc-field') : null;
  const caixaBase = formulario.elemento.querySelector('input[name="base"]')?.closest('.ctc-field');
  const desenhar = () => {
    const v = formulario.obterValores();
    const temPerc = v.modoReidi === 'pedido' && v.percentualReidi != null && v.percentualReidi !== '';
    if (caixaPerc) caixaPerc.classList.toggle('ctc-hidden', v.modoReidi !== 'pedido');
    /* a escolha da base so importa quando um valor e calculado a partir do outro */
    if (caixaBase) caixaBase.classList.toggle('ctc-hidden', !(v.modoReidi === 'sem' || temPerc));
    const linhas = produtosComNovoReidi(ped, v.modoReidi, temPerc ? v.percentualReidi : null, v.base);
    const valorNovo = linhas.reduce((t, l) => t + l.qtd * l.novoCom, 0);
    const pendentes = linhas.filter((l) => l.aviso).length;
    previa.replaceChildren(h('div', { class: 'ctc-stack' },
      criarAlerta({
        tipo: pendentes ? 'warning' : 'info', titulo: `Valor do pedido: ${formatarMoeda(ped.valor)} → ${formatarMoeda(valorNovo)}`,
        mensagem: pendentes ? `${pendentes} produto(s) ficarão com SEM = COM: complete o valor COM REIDI deles em Editar produto.` : 'Confira a prévia abaixo antes de aplicar.',
      }),
      criarTabela({
        dados: linhas.map((l) => ({
          produto: l.pr.descricao, qtd: l.qtd, sem: l.sem, com: l.com, novoSem: l.novoSem, novoCom: l.novoCom,
          perc: l.novoSem ? ((l.novoSem - l.novoCom) / l.novoSem) * 100 : 0, aviso: l.aviso,
        })),
        compacta: true, altura: 'auto',
        linhaVariante: (l) => (l.aviso ? 'warning' : null),
        colunas: [
          { campo: 'produto', titulo: 'Produto' }, { campo: 'qtd', titulo: 'Qtd', tipo: 'numero' },
          { campo: 'sem', titulo: 'SEM hoje', tipo: 'moeda' }, { campo: 'com', titulo: 'COM hoje', tipo: 'moeda' },
          { campo: 'novoSem', titulo: 'SEM novo', tipo: 'moeda' }, { campo: 'novoCom', titulo: 'COM novo', tipo: 'moeda' },
          { campo: 'perc', titulo: '% REIDI novo', render: (x) => percExato(x) }, { campo: 'aviso', titulo: 'Atenção' },
        ],
      }).elemento));
  };
  formulario.elemento.addEventListener('change', desenhar);
  formulario.elemento.addEventListener('input', desenhar);
  desenhar();
  const modal = criarModal({
    titulo: `Alterar REIDI — pedido ${ped.numero}`, tamanho: 'xl', destruirAoFechar: true,
    conteudo: [
      criarAlerta({
        tipo: 'info', titulo: `Hoje: ${rotuloReidiPedido(ped)}. Como cada mudança age nos produtos`,
        mensagem: [
          'Sem REIDI: cada produto fica com um valor só (escolha qual valor atual manter).',
          'Por pedido com %: o % vale para todos; o valor escolhido fica fixo e o outro é recalculado (ajustes individuais são desfeitos).',
          'Por pedido sem % ou Por produto: os dois valores atuais de cada produto são mantidos; quem vier de "Sem REIDI" precisa receber o valor COM REIDI.',
          temNfs ? 'NFs já lançadas não são alteradas: valor, REIDI e DIFAL delas continuam como foram registrados.' : '',
        ].filter(Boolean).join(' '),
      }),
      formulario.elemento, previa,
    ],
    acoes: [{ texto: 'Cancelar', variante: 'outline' }, { texto: 'Aplicar', variante: 'primary', fechar: false, onClick: () => formulario.enviar() }],
  });
  modal.abrir();
}

/** Exclui o pedido com seus produtos, NFs e boletos (com confirmacao). */
async function excluirPedido(ped) {
  const prods = produtosDoPedido(ped.id);
  const nfs = notasDoPedido(ped.id);
  const idsNf = new Set(nfs.map((n) => n.id));
  const bols = boletos.filter((b) => idsNf.has(b.notaId));
  const ok = await confirmar({
    titulo: `Excluir o pedido ${ped.numero}?`,
    mensagem: [
      `${terceiroDoPedido(ped)?.nome || ''} · ${formatarMoeda(ped.valor)}.`,
      `Saem junto: ${prods.length} produto(s)${nfs.length ? `, ${nfs.length} NF(s) (${nfs.map((n) => n.numero).join(', ')})` : ''}${bols.length ? ` e ${bols.length} boleto(s)` : ''}.`,
      'Não dá para desfazer depois de salvar a base.',
    ].join(' '),
    textoConfirmar: 'Excluir pedido', perigo: true,
  });
  if (!ok) return;
  boletos = boletos.filter((b) => !idsNf.has(b.notaId));
  notas = notas.filter((n) => n.pedidoId !== ped.id);
  produtos = produtos.filter((p) => p.pedidoId !== ped.id);
  distratos = distratos.filter((x) => x.pedidoId !== ped.id);
  pedidos.splice(pedidos.indexOf(ped), 1);
  registrarAlteracao();
  toast.aviso('Pedido excluído', ped.numero);
}

/** Detalhe do pedido: resumo, produtos e notas, em abas. */
function abrirPedido(ped, abaInicial = 'resumo') {
  let abaAtual = abaInicial;
  const montar = () => {
    const r = resumoPedido(ped);
    const ter = terceiroDoPedido(ped);
    const ins = insumoDoPedido(ped);
    const resumo = () => h('div', { class: 'ctc-stack' },
      h('div', { class: 'ctc-grid ctc-grid--3' },
        criarKpi({
          rotulo: 'Valor do pedido', valor: formatarMoeda(ped.valor),
          sub: distratoDoPedido(ped.id) ? `produtos ${formatarMoeda(ped.valorOriginal)} − distrato ${formatarMoeda(distratoDoPedido(ped.id).valorSaldo)}` : 'soma dos produtos (qtd × unit. COM REIDI)',
        }).elemento,
        criarKpi({ rotulo: 'Produtos', valor: String(r.prods.length), sub: `${formatarNumero(r.prods.reduce((t, p) => t + vn(p.quantidade), 0))} unidade(s) contratada(s)` }).elemento,
        criarKpi({ rotulo: 'Produtos SEM REIDI', valor: formatarMoeda(r.totalSem) }).elemento,
        criarKpi({ rotulo: 'REIDI (desconto)', valor: formatarMoeda(r.reidi), sub: rotuloReidiPedido(ped, r), variante: ped.modoReidi === 'sem' ? null : 'success' }).elemento,
        criarKpi({ rotulo: 'Faturado (NFs)', valor: formatarMoeda(r.faturado), progresso: { percentual: r.perc, variante: r.excedido ? 'danger' : null }, sub: formatarPercentual(r.perc) }).elemento,
        criarKpi({ rotulo: 'Saldo do pedido', valor: formatarMoeda(r.saldo), destaque: r.saldo < 0 ? 'negative' : 'neutral' }).elemento),
      criarAlerta({
        tipo: 'info',
        mensagem: `${ter?.nome || '—'} · ${ins?.nome || '—'} · emissão ${formatarData(ped.dataEmissao)} · ${ped.ufOrigem || '?'} → ${ped.ufDestino || '?'} · DIFAL ${formatarPercentual(ped.difalPerc)}${ped.importado ? ' · importado (4%)' : ''}`,
      }),
      ped.observacoes ? criarAlerta({ tipo: 'warning', titulo: 'Observações', mensagem: ped.observacoes }) : null,
      alertaDistratoPedido(ped),
      r.prods.some((p) => !vn(p.quantidade)) ? criarAlerta({ tipo: 'warning', mensagem: 'Há produtos sem quantidade contratada: eles não somam no valor do pedido.' }) : null,
      r.excedido ? criarAlerta({ tipo: 'danger', mensagem: 'As NFs lançadas ultrapassam o valor do pedido.' }) : null);
    const abaProdutos = () => h('div', { class: 'ctc-stack' },
      temPercPedido(ped)
        ? criarAlerta({
          tipo: 'info', titulo: `REIDI por pedido: ${percExato(ped.percentualReidi)} para todos os produtos`,
          mensagem: 'COM REIDI = SEM REIDI × (1 − %). Produtos marcados com "ajuste" têm valor individual.',
          acoes: podeEditar() ? [{
            texto: 'Reaplicar % a todos',
            onClick: () => { produtosDoPedido(ped.id).forEach((p) => { p.ajusteManual = false; }); registrarAlteracao(); toast.sucesso('% do pedido reaplicado'); },
          }] : [],
        })
        : criarAlerta({
          tipo: 'info',
          mensagem: ped.modoReidi === 'sem' ? 'Pedido sem REIDI: cada produto tem um valor só.'
            : ped.modoReidi === 'pedido' ? `REIDI por pedido sem % informado: cada produto tem SEM e COM REIDI; o % do pedido é calculado (${percExato(resumoPedido(ped).percReidi)}).`
              : 'REIDI por produto: diferença e % calculados a partir dos dois valores unitários informados.',
        }),
      h('div', { class: 'ctc-toolbar' },
        botaoFD({ texto: 'Novo produto', icone: 'mais', variante: 'primary', tamanho: 'sm', apenasEdicao: true, onClick: () => abrirModalProduto(null, ped) }),
        botaoFD({ texto: 'Importar produtos', icone: 'upload', variante: 'ghost', tamanho: 'sm', apenasEdicao: true, titulo: 'Importar produtos deste pedido (Excel, CSV ou PDF)', onClick: () => abrirImportacaoProdutos(ped) }),
        h('span', { class: 'ctc-spacer' }),
        h('span', { class: 'ctc-text-sm ctc-text-muted' }, `Valor do pedido (soma dos produtos): ${formatarMoeda(ped.valor)}`)),
      tabelaProdutosPedido(ped).elemento);
    const abaNotas = () => h('div', { class: 'ctc-stack' },
      h('div', { class: 'ctc-toolbar' },
        botaoFD({ texto: 'Nova NF deste pedido', icone: 'mais', variante: 'primary', tamanho: 'sm', apenasEdicao: true, onClick: () => abrirModalNota(null, { pedidoId: ped.id }) })),
      tabelaNotasPedido(ped).elemento);
    return criarAbas({
      ativa: abaAtual,
      onMudar: (id) => { abaAtual = id; },
      abas: [
        { id: 'resumo', texto: 'Resumo', conteudo: resumo },
        { id: 'produtos', texto: `Produtos (${r.prods.length})`, conteudo: abaProdutos },
        { id: 'notas', texto: `Notas fiscais (${r.nfs.length})`, conteudo: abaNotas },
      ],
    }).elemento;
  };
  const modal = criarModal({
    titulo: `Pedido ${ped.numero} — ${terceiroDoPedido(ped)?.nome || ''}`, tamanho: 'xl', destruirAoFechar: true,
    conteudo: montar(),
    onFechar: () => { atualizarDetalheAberto = null; },
    acoes: [
      podeEditar() ? { texto: 'Excluir pedido', icone: 'lixeira', variante: 'danger', fechar: false, onClick: () => excluirPedido(ped) } : null,
      podeEditar() && !distratoAtivoDoPedido(ped.id) && resumoPedido(ped).saldo > 0.005
        ? { texto: 'Distrato de saldo', icone: 'documento', variante: 'outline', fechar: false, onClick: () => abrirDistrato(ped) } : null,
      podeEditar() ? { texto: 'Alterar REIDI', variante: 'outline', fechar: false, onClick: () => abrirAlterarReidi(ped) } : null,
      podeEditar() ? { texto: 'Editar dados do pedido', variante: 'outline', fechar: false, onClick: () => abrirModalPedido(ped) } : null,
      { texto: 'Fechar', variante: 'primary' },
    ].filter(Boolean),
  });
  atualizarDetalheAberto = () => {
    if (!pedidos.includes(ped)) { modal.fechar(); return; }
    modal.definirConteudo(montar());
  };
  modal.abrir();
}


/* =============================================================================
   07c. DISTRATO DE SALDO DO PEDIDO
   O saldo restante do pedido (valor - NFs) e distratado: sai do comprometido do pedido e
   volta ao saldo do insumo. Fica registrado com o retrato dos produtos na data.
   ========================================================================== */

const MOTIVOS_DISTRATO = [
  'Quantidade necessária atendida', 'Alteração de escopo ou de projeto', 'Substituição por novo pedido',
  'Readequação de quantitativos', 'Encerramento do fornecimento', 'Outro',
];

function proximoNumeroDistrato(data = hojeIso()) {
  const ano = String(data).slice(0, 4);
  const usados = distratos.map((x) => String(x.numero || '').match(new RegExp(`^DIST-${ano}-(\\d+)$`))).filter(Boolean).map((m) => Number(m[1]));
  return `DIST-${ano}-${String((usados.length ? Math.max(...usados) : 0) + 1).padStart(3, '0')}`;
}

/** Retrato do pedido para o distrato: valores e saldo de cada produto (qtd e R$ COM/SEM REIDI). */
function retratoDistrato(ped) {
  const valorOriginal = valorDosProdutos(ped.id);
  const nfs = notasDoPedido(ped.id);
  const faturado = somar(nfs, 'valor');
  const itens = produtosDoPedido(ped.id).map((pr) => {
    const a = analisarProduto(pr);
    const saldoQtd = vn(pr.quantidade) - a.qtdFaturada;
    const com = unitComEfetivo(pr);
    return {
      produtoId: pr.id, descricao: pr.descricao, detalhe: pr.detalhe || '', unidade: pr.unidade || '',
      qtdContratada: vn(pr.quantidade), qtdFaturada: a.qtdFaturada, saldoQtd,
      unitCom: com, unitSem: vn(pr.unitSem), saldoCom: saldoQtd * com, saldoSem: saldoQtd * vn(pr.unitSem),
    };
  });
  return { valorOriginal, faturado, valorSaldo: valorOriginal - faturado, qtdNotas: nfs.length, reidiNotas: somar(nfs, 'reidi'), itens };
}

/** Novos pedidos do mesmo terceiro e atividade emitidos depois deste (citados na descricao). */
function pedidosPosteriores(ped) {
  const ins = insumoDoPedido(ped);
  return pedidos.filter((p) => p.id !== ped.id && p.terceiroId === ped.terceiroId && insumoDoPedido(p)?.id === ins?.id
    && String(p.dataEmissao || '') >= String(ped.dataEmissao || ''));
}

function descricaoAutomaticaDistrato(ped, motivo, ret = retratoDistrato(ped)) {
  const ter = terceiroDoPedido(ped);
  const ins = insumoDoPedido(ped);
  const perc = ret.valorOriginal > 0 ? (ret.faturado / ret.valorOriginal) * 100 : 0;
  const novos = pedidosPosteriores(ped);
  const razao = {
    'Quantidade necessária atendida': 'a quantidade necessária para o atendimento da demanda já foi fornecida',
    'Alteração de escopo ou de projeto': 'houve alteração de escopo/projeto que torna desnecessário o saldo restante',
    'Substituição por novo pedido': 'o fornecimento remanescente passou a ser atendido por novo pedido de compra',
    'Readequação de quantitativos': 'os quantitativos do fornecimento foram readequados',
    'Encerramento do fornecimento': 'o fornecimento foi encerrado',
  }[motivo] || 'o saldo restante não se mostra mais necessário';
  const partes = [
    `Solicita-se o distrato do saldo remanescente de ${moedaRel(ret.valorSaldo)} do Pedido de Compra nº ${ped.numero}${ped.dataEmissao ? `, emitido em ${dataRel(ped.dataEmissao)}` : ''}, junto ao fornecedor ${ter?.nome || '—'}, referente à atividade ${ins?.nome || '—'}, uma vez que ${razao}.`,
    `Até a presente data foram faturados ${moedaRel(ret.faturado)} (${percRel(perc, 2)} do valor do pedido) em ${ret.qtdNotas} nota(s) fiscal(is), restando ${moedaRel(ret.valorSaldo)} (${percRel(100 - perc, 2)}), que deixam de ser necessários para o atendimento da demanda.`,
  ];
  if (novos.length) partes.push(`Ressalta-se que ${novos.length === 1 ? 'novo pedido já foi emitido' : 'novos pedidos já foram emitidos'} (${novos.map((p) => `nº ${p.numero}`).join(', ')}) a fim de garantir o suprimento das demandas futuras.`);
  partes.push('Com o distrato, o valor correspondente deixa de estar comprometido com este pedido e retorna ao saldo disponível da atividade contratual.');
  return partes.join(' ');
}

/**
 * Melhora o texto escrito pelo usuario (sem servico externo): corrige espacos e pontuacao,
 * troca abreviacoes e termos informais pela forma escrita, padroniza "distrato", poe maiuscula
 * no inicio das frases e garante a referencia ao pedido e ao valor quando faltarem.
 */
function melhorarTextoDistrato(texto, ped, ret = retratoDistrato(ped)) {
  let t = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!t) return descricaoAutomaticaDistrato(ped, '', ret);
  const trocas = [
    [/\bdestrato(s?)\b/gi, 'distrato$1'], [/\bvc(s?)\b/gi, 'você$1'], [/\bpq\b/gi, 'porque'], [/\bq\b/gi, 'que'],
    [/\bp\/\s*/gi, 'para '], [/\bpra\b/gi, 'para'], [/\bpro\b/gi, 'para o'], [/\btá\b/gi, 'está'], [/\bta\b/gi, 'está'],
    [/\btb\b|\btbm\b/gi, 'também'], [/\bn\b/gi, 'não'], [/\bobs\b\.?/gi, 'Observação:'], [/\bqtd\b|\bqtde\b/gi, 'quantidade'],
    [/\bnf(s?)\b/gi, 'nota$1 fiscal'], [/\bpc\b/gi, 'pedido de compra'],
    [/\bja\b/gi, 'já'], [/\bnao\b/gi, 'não'], [/\bentao\b/gi, 'então'], [/\btambem\b/gi, 'também'], [/\bservico(s?)\b/gi, 'serviço$1'],
    [/\bnecessario(s?)\b/gi, 'necessário$1'], [/\bnecessaria(s?)\b/gi, 'necessária$1'], [/\bsolicitacao\b/gi, 'solicitação'], [/\balteracao\b/gi, 'alteração'],
    [/\bmaterial\b/gi, 'material'], [/\bquantidade necessaria\b/gi, 'quantidade necessária'], [/\bvalido\b/gi, 'válido'], [/\bunico\b/gi, 'único'],
    [/\s+([,.;:!?])/g, '$1'], [/([,.;:!?])(?=[^\s\d])/g, '$1 '], [/\.{2,}/g, '.'],
  ];
  trocas.forEach(([re, sub]) => { t = t.replace(re, sub); });
  t = t.replace(/notas fiscal/g, 'notas fiscais');
  /* maiuscula no inicio de cada frase */
  t = t.replace(/(^|[.!?]\s+)([a-zà-ú])/g, (m, a, b) => a + b.toUpperCase());
  if (!/[.!?]$/.test(t)) t += '.';
  if (!t.includes(ped.numero)) t = `Referente ao Pedido de Compra nº ${ped.numero} (saldo de ${moedaRel(ret.valorSaldo)}): ${t.charAt(0).toLowerCase()}${t.slice(1)}`;
  return t;
}

/** Distratos do pedido no resumo: o ativo com as acoes do seu status e o historico de reprovados. */
function alertaDistratoPedido(ped) {
  const lista = distratos.filter((x) => x.pedidoId === ped.id);
  if (!lista.length) return null;
  const ativo = distratoAtivoDoPedido(ped.id);
  const reprovados = lista.filter((x) => statusDistrato(x) === 'Reprovado');
  const blocos = [];
  if (ativo) {
    const st = statusDistrato(ativo);
    const ed = podeEditar();
    blocos.push(criarAlerta({
      tipo: st === 'Aprovado' ? 'success' : 'warning',
      titulo: st === 'Aprovado'
        ? `Distrato APROVADO — ${ativo.numero} (aprovado em ${formatarData(ativo.aprovadoEm || ativo.data)})`
        : `Distrato SOLICITADO — ${ativo.numero} em ${formatarData(ativo.data)} · aguardando aprovação`,
      mensagem: st === 'Aprovado'
        ? `O saldo de ${formatarMoeda(ativo.valorSaldo)} saiu do saldo a faturar do pedido e voltou para a atividade ${insumoDoPedido(ped)?.nome || ''}. Motivo: ${ativo.motivo || '—'}.`
        : `Saldo solicitado: ${formatarMoeda(ativo.valorSaldo)}. Enquanto não for aprovado, o saldo continua no pedido. Motivo: ${ativo.motivo || '—'}.`,
      acoes: [
        { texto: 'PDF do distrato', onClick: () => gerarPdfDistrato(ativo) },
        ed && st === 'Solicitado' ? { texto: 'Aprovar', onClick: () => aprovarDistrato(ativo) } : null,
        ed && st === 'Solicitado' ? { texto: 'Reprovar', onClick: () => reprovarDistrato(ativo) } : null,
        ed ? { texto: 'Editar descrição', onClick: () => abrirDistrato(ped, ativo) } : null,
        ed && st === 'Aprovado' ? { texto: 'Voltar para solicitado', onClick: () => voltarDistratoSolicitado(ativo) } : null,
        ed && st === 'Solicitado' ? { texto: 'Excluir solicitação', onClick: () => desfazerDistrato(ativo) } : null,
      ].filter(Boolean),
    }));
  }
  if (reprovados.length) {
    blocos.push(criarAlerta({
      tipo: 'info', titulo: `${reprovados.length} distrato(s) reprovado(s)`,
      mensagem: reprovados.map((x) => `${x.numero} (${formatarMoeda(x.valorSaldo)}, reprovado em ${formatarData(x.reprovadoEm || x.data)})`).join(' · '),
      acoes: reprovados.slice(-1).map((x) => ({ texto: `PDF ${x.numero}`, onClick: () => gerarPdfDistrato(x) })),
    }));
  }
  return h('div', { class: 'ctc-stack' }, ...blocos);
}

/** Aprovar: o saldo atual do pedido (recalculado na aprovacao) sai do pedido e volta ao insumo. */
async function aprovarDistrato(dist) {
  const ped = pedidoPorId(dist.pedidoId);
  const atual = retratoDistrato(ped);
  const mudou = Math.abs(atual.valorSaldo - vn(dist.valorSaldo)) > 0.005;
  const ok = await confirmar({
    titulo: `Aprovar o distrato ${dist.numero}?`,
    mensagem: `${mudou ? `O saldo do pedido mudou desde a solicitação (${formatarMoeda(dist.valorSaldo)} → ${formatarMoeda(atual.valorSaldo)}); será distratado o saldo atual. ` : ''}${formatarMoeda(atual.valorSaldo)} saem do saldo a faturar do pedido ${ped?.numero || ''} e voltam para a atividade ${insumoDoPedido(ped)?.nome || ''}.`,
    textoConfirmar: 'Aprovar distrato',
  });
  if (!ok) return;
  Object.assign(dist, retratoDistrato(ped), { status: 'Aprovado', aprovadoEm: hojeIso() });
  registrarAlteracao();
  toast.sucesso('Distrato aprovado', `${dist.numero} · ${formatarMoeda(dist.valorSaldo)} devolvidos à atividade`);
}
async function reprovarDistrato(dist) {
  const ok = await confirmar({
    titulo: `Reprovar o distrato ${dist.numero}?`,
    mensagem: 'O saldo continua no pedido. O registro fica no histórico como reprovado e um novo distrato pode ser solicitado.',
    textoConfirmar: 'Reprovar', perigo: true,
  });
  if (!ok) return;
  Object.assign(dist, { status: 'Reprovado', reprovadoEm: hojeIso() });
  registrarAlteracao();
  toast.aviso('Distrato reprovado', dist.numero);
}
async function voltarDistratoSolicitado(dist) {
  const ok = await confirmar({
    titulo: `Voltar o distrato ${dist.numero} para "Solicitado"?`,
    mensagem: `A aprovação é desfeita: ${formatarMoeda(dist.valorSaldo)} voltam a ficar comprometidos com o pedido até nova aprovação.`,
    textoConfirmar: 'Voltar para solicitado', perigo: true,
  });
  if (!ok) return;
  dist.status = 'Solicitado';
  delete dist.aprovadoEm;
  registrarAlteracao();
  toast.aviso('Aprovação desfeita', dist.numero);
}
async function desfazerDistrato(dist) {
  const ped = pedidoPorId(dist.pedidoId);
  const ok = await confirmar({
    titulo: `Excluir a solicitação ${dist.numero}?`,
    mensagem: `A solicitação de distrato do pedido ${ped?.numero || ''} é apagada. O saldo do pedido não muda.`,
    textoConfirmar: 'Excluir', perigo: true,
  });
  if (!ok) return;
  distratos = distratos.filter((x) => x.id !== dist.id);
  registrarAlteracao();
  toast.aviso('Solicitação excluída', dist.numero);
}

/** Registrar (ou editar a descricao de) um distrato de saldo. */
function abrirDistrato(ped, existente = null) {
  const editando = Boolean(existente);
  if (!editando && distratoAtivoDoPedido(ped.id)) { toast.aviso('Este pedido já tem distrato em andamento ou aprovado', distratoAtivoDoPedido(ped.id).numero); return; }
  const ret = editando ? existente : retratoDistrato(ped);
  const motivoInicial = existente?.motivo || MOTIVOS_DISTRATO[0];
  const formulario = criarFormulario({
    colunas: 3, semBotoes: true,
    valores: {
      numero: existente?.numero || proximoNumeroDistrato(), data: existente?.data || hojeIso(), motivo: motivoInicial,
      motivoOutro: existente?.motivoOutro || '', descricao: existente?.descricao || descricaoAutomaticaDistrato(ped, motivoInicial, ret),
    },
    campos: [
      { nome: 'numero', rotulo: 'Nº do distrato', obrigatorio: true },
      { nome: 'data', rotulo: 'Data', tipo: 'data', obrigatorio: true },
      { nome: 'motivo', rotulo: 'Motivo', tipo: 'select', opcoes: MOTIVOS_DISTRATO, obrigatorio: true },
      { nome: 'motivoOutro', rotulo: 'Motivo (outro)', larguraTotal: true, dica: 'Preencha quando o motivo for "Outro".' },
      { nome: 'descricao', rotulo: 'Descrição da solicitação', tipo: 'textarea', larguraTotal: true, obrigatorio: true, dica: 'Vai no item 1 do anexo. Escreva livremente ou use os botões abaixo.' },
    ],
    onEnviar: async (v) => {
      if (distratos.some((x) => x.numero === v.numero && x.id !== existente?.id)) { toast.erro('Nº já usado', v.numero); return; }
      const motivo = v.motivo === 'Outro' ? (v.motivoOutro || 'Outro') : v.motivo;
      if (editando) {
        Object.assign(existente, { numero: v.numero, data: v.data, motivo, motivoOutro: v.motivoOutro || '', descricao: v.descricao });
        modal.fechar();
        registrarAlteracao();
        toast.sucesso('Distrato atualizado', v.numero);
        return;
      }
      const ok = await confirmar({
        titulo: `Solicitar o distrato de ${formatarMoeda(ret.valorSaldo)} do pedido ${ped.numero}?`,
        mensagem: 'A solicitação fica registrada com status SOLICITADO. O saldo só sai do pedido (e volta para a atividade) quando o distrato for APROVADO.',
        textoConfirmar: 'Registrar solicitação',
      });
      if (!ok) return;
      const dist = {
        id: novoIdFD('dist'), pedidoId: ped.id, numero: v.numero, data: v.data, motivo, motivoOutro: v.motivoOutro || '',
        descricao: v.descricao, status: 'Solicitado', registradoEm: new Date().toISOString(), ...retratoDistrato(ped),
      };
      distratos.push(dist);
      modal.fechar();
      registrarAlteracao();
      toast.sucesso('Distrato solicitado', `${dist.numero} · aguardando aprovação`);
      if (await confirmar({ titulo: 'Gerar o PDF do distrato agora?', mensagem: `Anexo de solicitação ${dist.numero}.`, textoConfirmar: 'Gerar PDF' })) gerarPdfDistrato(dist);
    },
  });
  const campoDesc = () => formulario.campo('descricao');
  const ferramentas = h('div', { class: 'ctc-toolbar' },
    criarBotao({
      texto: 'Gerar descrição automática', icone: 'documento', variante: 'outline', tamanho: 'sm',
      onClick: () => {
        const v = formulario.obterValores();
        campoDesc().value = descricaoAutomaticaDistrato(ped, v.motivo === 'Outro' ? v.motivoOutro : v.motivo, ret);
      },
    }),
    criarBotao({
      texto: 'Melhorar meu texto', icone: 'editar', variante: 'outline', tamanho: 'sm',
      titulo: 'Corrige pontuação e abreviações, padroniza termos e garante a referência ao pedido e ao valor',
      onClick: () => { campoDesc().value = melhorarTextoDistrato(campoDesc().value, ped, ret); toast.info('Texto revisado', 'Confira antes de salvar.'); },
    }),
    criarBotao({ texto: 'Limpar', variante: 'ghost', tamanho: 'sm', onClick: () => { campoDesc().value = ''; campoDesc().focus(); } }));
  const perc = ret.valorOriginal > 0 ? (ret.faturado / ret.valorOriginal) * 100 : 0;
  const resumo = h('div', { class: 'ctc-grid ctc-grid--4' },
    criarKpi({ rotulo: 'Valor do pedido', valor: formatarMoeda(ret.valorOriginal) }).elemento,
    criarKpi({ rotulo: 'Faturado (NFs)', valor: formatarMoeda(ret.faturado), sub: `${formatarPercentual(perc, { casas: 2 })} · ${ret.qtdNotas} NF(s)` }).elemento,
    criarKpi({ rotulo: 'Saldo a distratar', valor: formatarMoeda(ret.valorSaldo), variante: 'warning', sub: `${formatarPercentual(100 - perc, { casas: 2 })} do pedido` }).elemento,
    criarKpi({ rotulo: 'Volta para a atividade', valor: insumoDoPedido(ped)?.nome || '—', sub: 'após a aprovação do distrato' }).elemento);
  const itens = criarTabela({
    dados: ret.itens.map((x) => ({ ...x })), compacta: true, altura: 'auto',
    colunas: [
      { campo: 'descricao', titulo: 'Produto' }, { campo: 'unidade', titulo: 'Un' },
      { campo: 'qtdContratada', titulo: 'Contratado', render: (v) => numExato(v) }, { campo: 'qtdFaturada', titulo: 'Faturado', render: (v) => numExato(v) },
      { campo: 'saldoQtd', titulo: 'Saldo (qtd)', render: (v) => numExato(v) },
      { campo: 'saldoCom', titulo: 'Saldo', tipo: 'moeda', total: 'soma' },
    ],
  });
  const modal = criarModal({
    titulo: editando ? `Distrato ${existente.numero} — pedido ${ped.numero}` : `Distrato de saldo — pedido ${ped.numero}`, tamanho: 'xl', destruirAoFechar: true,
    conteudo: [
      editando ? criarAlerta({ tipo: 'info', mensagem: 'Os valores ficaram registrados na data do distrato; aqui você ajusta número, data, motivo e descrição.' }) : null,
      resumo,
      formulario.elemento, ferramentas,
      h('div', { class: 'ctc-text-sm ctc-text-muted' }, 'Saldo por produto (vai no anexo):'),
      itens.elemento,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      editando ? { texto: 'PDF do distrato', variante: 'outline', fechar: false, onClick: () => gerarPdfDistrato(existente) } : null,
      { texto: editando ? 'Salvar' : 'Registrar solicitação', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
    ].filter(Boolean),
  });
  modal.abrir();
}

/* ---- Aba "Pedidos e produtos": pedido com seus produtos, unidades e abatimento pelas NFs ---- */

const pedidosAbertosLista = new Set();   // pedidos com produtos visiveis na aba

/**
 * Cada pedido em uma linha (pelo numero real) e, logo abaixo, os seus produtos:
 * unidades contratadas, abatidas pelas NFs, saldo de unidades, valores SEM/COM REIDI
 * e as NFs que abateram cada produto. Recebe a busca e os filtros comuns da base.
 */
function secaoPedidosProdutos() {
  const COLS = ['Pedido / produto', 'Emissão', 'Un', 'Qtd contratada', 'Qtd abatida (NFs)', 'Saldo (un)', 'Unit. SEM REIDI', 'Unit. COM REIDI', '% REIDI',
    'Valor (COM REIDI)', 'Faturado', 'Saldo R$', '% faturado', 'Situação / NFs', 'Ações'];
  const n = COLS.length;
  const NUM = [3, 4, 5, 6, 7, 8, 9, 10, 11];
  const corpo = h('tbody', {});
  const rodape = h('tfoot', {});
  const codigos = codigosHierarquia();
  const vazio = () => h('td', {});
  const num = (v, classe = '') => h('td', { class: `ctc-col--num ctc-num ${classe}`.trim() }, v == null ? '' : formatarMoeda(v));
  const qtd = (v, classe = '') => h('td', { class: `ctc-col--num ctc-num ${classe}`.trim() }, v == null ? '' : formatarNumero(v));
  const plural = (q, s1, sN) => `${q} ${q === 1 ? s1 : sN}`;
  const barra = (perc) => h('td', {}, h('div', { class: 'ctc-stack' },
    criarProgresso({ percentual: perc, tamanho: 'sm', variante: perc > 100.005 ? 'danger' : perc >= 99.995 ? 'success' : null, rotulo: '% faturado' }),
    h('span', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(perc, { casas: 2 }))));
  const icone = (cfg) => botaoFD({ variante: 'ghost', tamanho: 'sm', apenasEdicao: true, ...cfg, onClick: (e) => { if (e) e.stopPropagation(); cfg.onClick(); } });
  let filtrados = [];

  function desenhar(estado = {}) {
    const f = estado.filtros || {};
    const termo = normalizarTexto(estado.busca || '');
    const linhas = [];
    let totVal = 0; let totFat = 0; let qtdProd = 0;
    filtrados = [];
    /* terceiros na ordem geral (insumo > terceiro); dentro de cada um, pedidos por emissao */
    const listaTer = terceiros.map((t) => ({ t, cod: codigos.get(t.id) || { ordem: '' } }))
      .sort((a, b) => String(a.cod.ordem).localeCompare(String(b.cod.ordem)));
    listaTer.forEach(({ t: ter }) => {
      const ins = insumoPorId(ter.insumoId);
      if (f.insumo && ins?.nome !== f.insumo) return;
      if (f.terceiro && ter.nome !== f.terceiro) return;
      const peds = pedidos.filter((p) => p.terceiroId === ter.id)
        .sort((x, y) => String(x.dataEmissao || '').localeCompare(String(y.dataEmissao || '')) || String(x.numero).localeCompare(String(y.numero)));
      const bloco = [];
      let valTer = 0; let fatTer = 0; let qtdPed = 0;
      peds.forEach((ped) => {
        const r = resumoPedido(ped);
        const distAtivo = distratoAtivoDoPedido(ped.id);
        const situacao = distAtivo ? (statusDistrato(distAtivo) === 'Aprovado' ? 'Distratado' : 'Distrato solicitado') : r.excedido ? 'Excedido' : r.prods.length ? (r.perc >= 99.995 ? 'Sem saldo' : 'OK') : 'Sem produtos';
        if (f.situacao && f.situacao !== situacao) return;
        const prods = r.prods;
        if (termo) {
          const texto = normalizarTexto([ped.numero, ter.nome, ter.cnpj, ins?.nome, ped.observacoes,
            ...prods.flatMap((p) => [p.descricao, p.detalhe, p.descricaoNF]), ...r.nfs.map((x) => x.numero)].filter(Boolean).join(' '));
          if (!texto.includes(termo)) return;
        }
        filtrados.push(ped);
        qtdPed += 1; valTer += vn(ped.valor); fatTer += r.faturado;
        totVal += vn(ped.valor); totFat += r.faturado; qtdProd += prods.length;
        const esgotado = situacao === 'Sem saldo';
        const aberto = pedidosAbertosLista.has(ped.id) || Boolean(termo);
        const filhos = [];
        const seta = h('button', {
          type: 'button', class: 'ctc-btn ctc-btn--ghost ctc-btn--sm', title: aberto ? 'Ocultar produtos' : 'Mostrar produtos', 'aria-expanded': String(aberto),
          onClick: (e) => {
            e.stopPropagation();
            const abrir = Boolean(filhos.length && filhos[0].hidden);
            if (abrir) pedidosAbertosLista.add(ped.id); else pedidosAbertosLista.delete(ped.id);
            filhos.forEach((tr) => { tr.hidden = !abrir; });
            seta.replaceChildren(criarIcone(abrir ? 'chevron-baixo' : 'chevron-direita'));
            seta.setAttribute('aria-expanded', String(abrir));
            seta.title = abrir ? 'Ocultar produtos' : 'Mostrar produtos';
          },
        }, criarIcone(aberto ? 'chevron-baixo' : 'chevron-direita'));
        const totalQtd = prods.reduce((t, p) => t + vn(p.quantidade), 0);
        const totalAbatida = prods.reduce((t, p) => t + analisarProduto(p).qtdFaturada, 0);
        const fraco = esgotado ? 'ctc-text-muted' : '';
        bloco.push(h('tr', { class: esgotado ? null : 'ctc-row--subtotal ctc-row--info', onClick: () => abrirPedido(ped), title: 'Abrir pedido' },
          h('td', {}, h('div', {},
            h('div', { class: 'ctc-cluster' }, seta, h('span', { class: esgotado ? 'ctc-text-muted' : 'ctc-text-strong' }, `Pedido ${ped.numero}`)),
            h('div', { class: 'ctc-text-xs ctc-text-muted' }, [`REIDI: ${rotuloReidiPedido(ped, r)}`, `${ped.ufOrigem || '?'}→${ped.ufDestino || '?'} DIFAL ${formatarPercentual(ped.difalPerc, { casas: 2 })}`, plural(prods.length, 'produto', 'produtos'), plural(r.nfs.length, 'NF', 'NFs')].join(' · ')))),
          h('td', { class: fraco }, formatarData(ped.dataEmissao)),
          vazio(),
          qtd(prods.length ? totalQtd : null, fraco || 'ctc-text-strong'),
          qtd(prods.length ? totalAbatida : null, fraco || 'ctc-text-strong'),
          qtd(prods.length ? totalQtd - totalAbatida : null, fraco || 'ctc-text-strong'),
          vazio(), vazio(),
          h('td', { class: 'ctc-col--num ctc-num ctc-text-xs' }, ped.modoReidi === 'sem' ? '—' : temPercPedido(ped) ? percExato(ped.percentualReidi) : ped.modoReidi === 'pedido' ? percExato(r.percReidi) : 'por produto'),
          num(vn(ped.valor), fraco || 'ctc-text-strong'),
          num(r.faturado, fraco || 'ctc-text-strong'),
          num(r.saldo, r.saldo < 0 ? 'ctc-text-danger ctc-text-strong' : fraco || 'ctc-text-strong'),
          barra(r.perc),
          h('td', {}, criarBadge({ texto: distAtivo ? `${situacao} · ${distAtivo.numero}` : situacao, variante: { OK: 'success', 'Sem saldo': 'neutral', Distratado: 'info', 'Distrato solicitado': 'warning', Excedido: 'danger', 'Sem produtos': 'warning' }[situacao] })),
          h('td', {}, h('div', { class: 'ctc-btn-group' },
            icone({ icone: 'mais', titulo: `Novo produto no pedido ${ped.numero}`, onClick: () => abrirModalProduto(null, ped) }),
            icone({ icone: 'documento', titulo: `Lançar NF do pedido ${ped.numero}`, onClick: () => abrirModalNota(null, { pedidoId: ped.id }) }),
            icone({ icone: 'lixeira', titulo: `Excluir pedido ${ped.numero}`, onClick: () => excluirPedido(ped) })))));
        if (!prods.length) {
          filhos.push(h('tr', {}, h('td', { colspan: n, class: 'ctc-text-xs ctc-text-subtle' }, '\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0└ nenhum produto lançado: use o "+" do pedido')));
        }
        prods.forEach((pr, i) => {
          const an = analisarProduto(pr);
          const q = vn(pr.quantidade);
          const percQtd = q ? (an.qtdFaturada / q) * 100 : 0;
          const nfs = nfsDoProduto(pr);
          const valorFat = nfs.reduce((t, x) => t + x.qtd * vn((x.nf.itens || []).find((it) => it.produtoId === pr.id)?.valorUnit), 0);
          filhos.push(h('tr', { onClick: () => abrirModalProduto(pr, ped), title: 'Editar produto' },
            h('td', {}, h('div', {},
              h('div', { class: 'ctc-text-sm' }, `\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0└ ${i + 1}. ${pr.descricao}`),
              pr.detalhe ? h('div', { class: 'ctc-text-xs ctc-text-muted' }, `\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0${pr.detalhe}`) : null)),
            vazio(),
            h('td', { class: 'ctc-text-xs' }, pr.unidade || ''),
            qtd(q, q ? '' : 'ctc-text-danger'),
            qtd(an.qtdFaturada),
            qtd(an.saldoQtd, an.saldoQtd < -0.0001 ? 'ctc-text-danger' : an.saldoQtd <= 0.0001 && q ? 'ctc-text-success' : ''),
            num(an.unitSem, 'ctc-text-muted'),
            num(an.unitCom),
            h('td', { class: 'ctc-col--num ctc-num ctc-text-xs' }, ped.modoReidi === 'sem' ? '—' : percExato(an.percReidi)),
            num(an.totalCom),
            num(valorFat),
            num(an.totalCom - valorFat),
            barra(percQtd),
            h('td', {}, nfs.length
              ? h('div', { class: 'ctc-cluster' }, nfs.map((x) => criarBadge({ texto: `NF ${x.nf.numero} · ${formatarNumero(x.qtd)} ${pr.unidade || ''}`.trim(), variante: 'info' })))
              : h('span', { class: 'ctc-text-xs ctc-text-subtle' }, q ? 'nenhuma NF ainda' : 'sem quantidade')),
            h('td', {}, icone({ icone: 'lixeira', titulo: `Excluir produto ${pr.descricao}`, onClick: () => excluirProduto(pr) }))));
        });
        filhos.forEach((tr) => { tr.hidden = !aberto; });
        bloco.push(...filhos);
      });
      if (!bloco.length && (termo || f.situacao)) return;
      /* faixa do terceiro: agrupa os pedidos dele */
      linhas.push(h('tr', { class: 'ctc-row--level-1' }, h('td', { colspan: n },
        h('div', { class: 'ctc-toolbar' },
          h('span', {}, ter.nome),
          criarBadge({ texto: ter.uf || 'UF?', variante: 'neutral' }),
          ins ? criarBadge({ texto: ins.nome, variante: 'neutral' }) : null,
          h('span', { class: 'ctc-text-xs' },
            `${plural(peds.length, 'pedido', 'pedidos')} · total ${formatarMoeda(valTer)} · faturado ${formatarMoeda(fatTer)} · saldo ${formatarMoeda(valTer - fatTer)}`),
          botaoFD({ texto: 'Pedido', icone: 'mais', variante: 'outline', tamanho: 'sm', apenasEdicao: true, titulo: `Novo pedido de ${ter.nome}`, onClick: () => abrirModalPedido(null, ter.id) })))));
      if (!peds.length) linhas.push(h('tr', {}, h('td', { colspan: n, class: 'ctc-text-xs ctc-text-subtle' }, '\u00a0\u00a0└ nenhum pedido lançado para este terceiro')));
      linhas.push(...bloco);
    });
    corpo.replaceChildren(...(linhas.length ? linhas : [h('tr', {}, h('td', { colspan: n, class: 'ctc-text-subtle' }, terceiros.length ? 'Nenhum pedido com estes filtros.' : 'Nenhum terceiro cadastrado.'))]));
    rodape.replaceChildren(h('tr', {},
      h('td', {}, `Total — ${plural(filtrados.length, 'pedido', 'pedidos')} · ${plural(qtdProd, 'produto', 'produtos')}`),
      ...Array.from({ length: 8 }, () => vazio()),
      num(totVal), num(totFat), num(totVal - totFat),
      h('td', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(totVal ? (totFat / totVal) * 100 : 0, { casas: 2 })),
      vazio(), vazio()));
    definirMetaBase(`${plural(filtrados.length, 'pedido', 'pedidos')} · ${plural(qtdProd, 'produto', 'produtos')}`);
  }

  const elemento = h('div', { class: 'ctc-table-wrap ctc-table-wrap--auto' },
    h('table', { class: 'ctc-table ctc-table--compact' },
      h('thead', {}, h('tr', {}, COLS.map((c, i) => h('th', { class: NUM.includes(i) ? 'ctc-col--num' : null }, c)))),
      corpo, rodape));
  desenhar({ filtros: filtroBase });
  return {
    tabela: { elemento, atualizarConsulta: desenhar, obterFiltrados: () => filtrados.map((ped) => ({ ped })) },
    titulo: 'Pedidos e produtos — por terceiro', icone: 'documento',
    selects: [{ campo: 'situacao', rotulo: 'Situação', opcoes: ['OK', 'Sem saldo', 'Distrato solicitado', 'Distratado', 'Excedido', 'Sem produtos'] }],
    acoes: [
      { texto: 'Mostrar produtos', variante: 'ghost', tamanho: 'sm', onClick: () => { pedidos.forEach((x) => pedidosAbertosLista.add(x.id)); recarregar(); } },
      { texto: 'Só pedidos', variante: 'ghost', tamanho: 'sm', titulo: 'Recolher os produtos de todos os pedidos', onClick: () => { pedidosAbertosLista.clear(); recarregar(); } },
      { texto: 'Importar', icone: 'upload', variante: 'ghost', tamanho: 'sm', apenasEdicao: true, titulo: 'Importar pedidos com produtos (Excel, CSV ou PDF)', onClick: abrirImportacaoPedidos },
      { texto: 'Exportar', icone: 'download', variante: 'ghost', tamanho: 'sm', titulo: 'Exportar pedidos e produtos filtrados (Excel)', onClick: () => exportarPedidos(filtrados) },
      { texto: 'Novo pedido', icone: 'mais', variante: 'primary', tamanho: 'sm', apenasEdicao: true, onClick: () => abrirModalPedido() },
    ],
    rodape: 'Faixa escura: terceiro (com o total dos pedidos dele). Faixa cinza com barra azul: pedido (pedidos sem saldo ficam brancos e apagados). Abaixo, os produtos (seta do pedido). Ações do pedido: + produto, lançar NF, excluir.',
  };
}

/* ---- Produtos: apoio ---- */

/** NFs em que um produto foi faturado, com a quantidade de cada uma. */
function nfsDoProduto(prod) {
  return notas.map((n) => ({ nf: n, qtd: (n.itens || []).filter((i) => i.produtoId === prod.id).reduce((t, i) => t + vn(i.quantidade), 0) }))
    .filter((x) => x.qtd > 0)
    .sort((a, b) => String(a.nf.data).localeCompare(String(b.nf.data)));
}

const opcoesPedidos = () => ordenar(pedidos.map((p) => ({
  valor: p.id, texto: `${p.numero} · ${terceiroDoPedido(p)?.nome || '—'} · ${insumoDoPedido(p)?.nome || '—'}`,
})), 'texto');

/** Celula numerica editavel de tabela montada dentro do modal. */
function entradaNumero(valor, aoMudar, { moeda = false } = {}) {
  const el = h('input', {
    type: 'text', inputmode: 'decimal', class: 'ctc-input ctc-input--sm ctc-input--num',
    value: valor == null || valor === '' ? '' : (moeda ? formatarMoeda(valor, { simbolo: false }) : formatarNumero(valor)),
    onInput: () => aoMudar(paraNumero(el.value)),
    onBlur: () => { const n = paraNumero(el.value); if (moeda && n != null) el.value = formatarMoeda(n, { simbolo: false }); },
  });
  if (!podeEditar()) el.readOnly = true;
  return el;
}

function tabelaSimples(cabecalhos, linhas, rodape) {
  return h('div', { class: 'ctc-table-wrap ctc-table-wrap--auto' },
    h('table', { class: 'ctc-table ctc-table--compact' },
      h('thead', {}, h('tr', {}, cabecalhos.map((c) => h('th', { class: c.num ? 'ctc-col--num' : null }, c.texto)))),
      h('tbody', {}, linhas),
      rodape ? h('tfoot', {}, rodape) : null));
}

/**
 * Cadastro / conferencia de NF.
 * opcoes: { pedidoId, rascunho } — rascunho vem da importacao (XML/PDF).
 */
function abrirModalNota(nf = null, { pedidoId = '', rascunho = null } = {}) {
  const editando = Boolean(nf);
  const origem = editando ? nf : (rascunho || {});
  const pedInicial = pedidoPorId(origem.pedidoId || pedidoId);
  const iniciais = {
    data: hojeIso(), ...origem,
    pedidoId: pedInicial?.id || '',
    ufOrigem: origem.ufOrigem || pedInicial?.ufOrigem || '',
    ufDestino: origem.ufDestino || pedInicial?.ufDestino || obra.ufObra || '',
    importado: origem.importado ?? pedInicial?.importado ?? false,
    grdsTexto: textoGrds(origem.grds),
  };
  if (iniciais.difalPerc == null) iniciais.difalPerc = pedInicial ? vn(pedInicial.difalPerc) : calcularDifal(iniciais.ufOrigem, iniciais.ufDestino, iniciais.importado).perc;

  const itensMapa = new Map((origem.itens || []).map((i) => [i.produtoId, { quantidade: vn(i.quantidade), valorUnit: vn(i.valorUnit) }]));
  let semVinculo = (origem.itensSemVinculo || []).map((i) => ({ ...i }));
  let difalManual = editando && Math.abs(vn(nf.difalValor) - (vn(nf.valor) * vn(nf.difalPerc)) / 100) > 0.05;
  /* REIDI segue os itens da NF ate o usuario digitar outro valor */
  let reidiManual = editando ? Boolean(nf.reidiManual) : false;

  const areaItens = h('div', {});
  const areaSemVinculo = h('div', {});
  const areaResumo = h('div', {});
  const areaBoletos = h('div', {});

  const formulario = criarFormulario({
    colunas: 3, semBotoes: true, valores: iniciais,
    campos: [
      { nome: 'pedidoId', rotulo: 'Pedido de compra', tipo: 'select', placeholder: 'Selecione', obrigatorio: true, opcoes: opcoesPedidos(), larguraTotal: true },
      { nome: 'numero', rotulo: 'Nº NF', obrigatorio: true },
      { nome: 'data', rotulo: 'Data NF', tipo: 'data', obrigatorio: true },
      { nome: 'bm', rotulo: 'Boletim de medição', tipo: 'select', placeholder: 'Selecione', opcoes: opcoesBM(), obrigatorio: true },
      { nome: 'valor', rotulo: 'Valor NF (R$)', tipo: 'moeda', obrigatorio: true, regras: { minimo: 0 } },
      { nome: 'reidi', rotulo: 'REIDI da NF (R$)', tipo: 'moeda', dica: 'Calculado pelos produtos: qtd × (unit. SEM do pedido − unit. na NF). Pode ajustar.' },
      { nome: 'ufOrigem', rotulo: 'UF origem', tipo: 'select', opcoes: UFS, placeholder: 'Selecione', obrigatorio: true },
      { nome: 'ufDestino', rotulo: 'UF destino', tipo: 'select', opcoes: UFS, placeholder: 'Selecione', obrigatorio: true },
      { nome: 'importado', rotulo: 'Importado (4%)', tipo: 'checkbox' },
      { nome: 'difalPerc', rotulo: 'DIFAL (%)', tipo: 'percentual' },
      { nome: 'difalValor', rotulo: 'Valor DIFAL (R$)', tipo: 'moeda', dica: 'Valor NF × DIFAL %; pode ajustar.' },
      { nome: 'grdsTexto', rotulo: 'Nº GRD (lançamento no e-clic)', dica: 'É o nº do lançamento no e-clic. Várias: separe por ;' },
      { nome: 'eclic', rotulo: 'NF lançada no e-clic (via assinada)', tipo: 'checkbox', dica: 'Marca sozinho ao informar a GRD.' },
      { nome: 'eclicData', rotulo: 'Lançada no e-clic em', tipo: 'data' },
      { nome: 'observacoes', rotulo: 'Observações', tipo: 'textarea', larguraTotal: true },
    ],
    onEnviar: async (v) => {
      const repetida = notas.find((x) => x !== nf && x.pedidoId === v.pedidoId && normalizarTexto(x.numero) === normalizarTexto(v.numero));
      if (repetida) { formulario.definirErro('numero', 'Esta NF já foi lançada neste pedido.'); return; }
      const itens = [...itensMapa.entries()]
        .filter(([id, i]) => vn(i.quantidade) > 0 && produtoPorId(id)?.pedidoId === v.pedidoId)
        .map(([produtoId, i]) => ({ produtoId, quantidade: vn(i.quantidade), valorUnit: vn(i.valorUnit) }));
      const reidiCalc = reidiDosItens({ itens });
      const usarManual = reidiManual || !itens.length;
      const registro = {
        pedidoId: v.pedidoId, numero: v.numero, data: v.data, bm: v.bm, valor: vn(v.valor),
        reidi: usarManual ? vn(v.reidi) : reidiCalc, reidiManual: Boolean(reidiManual && itens.length),
        ufOrigem: v.ufOrigem, ufDestino: v.ufDestino, importado: Boolean(v.importado), difalPerc: vn(v.difalPerc), difalValor: vn(v.difalValor),
        itens, itensSemVinculo: semVinculo.filter((i) => i.descricao), grds: lerGrds(v.grdsTexto), observacoes: v.observacoes,
        /* GRD informada = NF lancada no e-clic */
        eclic: Boolean(v.eclic) || lerGrds(v.grdsTexto).length > 0,
        eclicData: (Boolean(v.eclic) || lerGrds(v.grdsTexto).length > 0) ? (v.eclicData || hojeIso()) : (v.eclicData || ''),
      };
      const analise = analisarNota({ ...registro, id: nf?.id || '_nova' });
      if (analise.situacao !== 'Conferida') {
        const ok = await confirmar({
          titulo: `Salvar NF com pendência: ${analise.situacao}?`,
          mensagem: 'A NF ficará sinalizada no painel até a conferência ser ajustada.',
          textoConfirmar: 'Salvar mesmo assim',
        });
        if (!ok) return;
      }
      if (editando) Object.assign(nf, registro);
      else notas.push({ id: novoIdFD('nf'), ...registro });
      modal.fechar();
      registrarAlteracao();
      toast.sucesso(editando ? 'NF atualizada' : 'NF lançada', `${v.numero} · ${formatarMoeda(registro.valor)}`);
    },
  });

  const valoresAtuais = () => formulario.obterValores();

  function atualizarResumo() {
    const v = valoresAtuais();
    const temp = {
      id: nf?.id || '_nova', valor: vn(v.valor), itensSemVinculo: semVinculo,
      itens: [...itensMapa.entries()]
        .filter(([id, i]) => vn(i.quantidade) > 0 && produtoPorId(id)?.pedidoId === v.pedidoId)
        .map(([produtoId, i]) => ({ produtoId, ...i })),
    };
    const a = analisarNota(temp);
    if (!difalManual) formulario.campo('difalValor').value = formatarMoeda((vn(v.valor) * vn(v.difalPerc)) / 100, { simbolo: false });
    if (!reidiManual && temp.itens.length) formulario.campo('reidi').value = formatarMoeda(a.reidiItens, { simbolo: false });
    areaResumo.replaceChildren(criarAlerta({
      tipo: { Conferida: 'success', 'Sem itens': 'info', Divergente: 'warning' }[a.situacao] || 'danger',
      titulo: `Conferência: ${a.situacao}`,
      mensagem: `Soma dos itens (COM REIDI): ${formatarMoeda(a.valorItens)} · Valor NF: ${formatarMoeda(v.valor)} · Diferença: ${formatarMoeda(a.diferenca)} · REIDI dos itens: ${formatarMoeda(a.reidiItens)}${reidiManual ? ' (REIDI da NF ajustado à mão)' : ''}`,
      acoes: podeEditar() ? [
        { texto: 'Usar soma dos itens no valor NF', onClick: () => { formulario.campo('valor').value = formatarMoeda(a.valorItens, { simbolo: false }); atualizarResumo(); } },
        reidiManual ? { texto: 'Voltar ao REIDI dos itens', onClick: () => { reidiManual = false; atualizarResumo(); } } : null,
      ].filter(Boolean) : [],
    }));
  }

  function desenharItens() {
    const ped = pedidoPorId(valoresAtuais().pedidoId);
    if (!ped) { areaItens.replaceChildren(criarAlerta({ tipo: 'info', mensagem: 'Escolha o pedido para listar os produtos.' })); return; }
    const prods = produtosDoPedido(ped.id);
    if (!prods.length) { areaItens.replaceChildren(criarAlerta({ tipo: 'warning', mensagem: 'Este pedido ainda não tem produtos cadastrados. Itens da NF podem entrar como "sem pedido" abaixo.' })); return; }
    const linhas = prods.map((p) => {
      const an = analisarProduto(p);
      const textoBusca = normalizarTexto([p.descricao, p.detalhe, p.descricaoNF].filter(Boolean).join(' '));
      const desta = editando ? (nf.itens || []).filter((i) => i.produtoId === p.id).reduce((t, i) => t + vn(i.quantidade), 0) : 0;
      const outras = an.qtdFaturada - desta;
      const atual = itensMapa.get(p.id) || { quantidade: 0, valorUnit: an.unitCom };
      if (!itensMapa.has(p.id)) itensMapa.set(p.id, atual);
      const total = h('td', { class: 'ctc-col--num ctc-num' }, formatarMoeda(vn(atual.quantidade) * vn(atual.valorUnit)));
      const saldo = h('td', { class: 'ctc-col--num ctc-num' });
      const reidiItem = h('td', { class: 'ctc-col--num ctc-num' });
      const pintarSaldo = () => {
        const s = vn(p.quantidade) - outras - vn(atual.quantidade);
        saldo.textContent = numExato(s);
        saldo.className = `ctc-col--num ctc-num${ehNegativoExato(s) ? ' ctc-text-danger' : ''}`;
        total.textContent = formatarMoeda(vn(atual.quantidade) * vn(atual.valorUnit));
        /* REIDI do item: diferenca entre o SEM REIDI do pedido e o preco cobrado na NF */
        const difUnit = Math.max(0, vn(p.unitSem) - vn(atual.valorUnit));
        const perc = vn(p.unitSem) > 0 ? (difUnit / vn(p.unitSem)) * 100 : 0;
        reidiItem.replaceChildren(
          h('div', { class: vn(atual.quantidade) ? 'ctc-text-strong' : 'ctc-text-muted' }, formatarMoeda(vn(atual.quantidade) * difUnit)),
          h('div', { class: 'ctc-text-xs ctc-text-muted' }, `${percExato(perc)} · ${formatarMoeda(difUnit)}/${p.unidade || 'un'}`),
        );
      };
      pintarSaldo();
      const tr = h('tr', {},
        h('td', {}, h('div', {}, h('div', { class: 'ctc-text-strong' }, p.descricao), p.detalhe ? h('div', { class: 'ctc-text-xs ctc-text-muted' }, p.detalhe) : null)),
        h('td', {}, p.unidade || ''),
        h('td', { class: 'ctc-col--num ctc-num' }, numExato(p.quantidade)),
        h('td', { class: 'ctc-col--num ctc-num' }, numExato(outras)),
        h('td', {}, entradaNumero(atual.quantidade || '', (n) => { atual.quantidade = n ?? 0; pintarSaldo(); atualizarResumo(); })),
        h('td', { class: 'ctc-col--num ctc-num ctc-text-muted' }, formatarMoeda(p.unitSem)),
        h('td', {}, entradaNumero(atual.valorUnit, (n) => { atual.valorUnit = n ?? 0; pintarSaldo(); atualizarResumo(); }, { moeda: true })),
        total, reidiItem, saldo);
      tr.dataset.busca = textoBusca;
      tr.dataset.saldo = String(vn(p.quantidade) - outras);
      tr.dataset.nesta = String(vn(atual.quantidade));
      return tr;
    });
    /* filtro dentro dos produtos do pedido de referencia */
    const filtroTexto = h('input', { type: 'search', class: 'ctc-input ctc-input--sm', placeholder: 'Filtrar produtos do pedido (nome, descrição...)', 'aria-label': 'Filtrar produtos do pedido' });
    const soComSaldo = h('input', { type: 'checkbox' });
    const contador = h('span', { class: 'ctc-text-xs ctc-text-muted' });
    const aplicarFiltro = () => {
      const termo = normalizarTexto(filtroTexto.value || '');
      let visiveis = 0;
      linhas.forEach((tr) => {
        const mostra = (!termo || tr.dataset.busca.includes(termo))
          && (!soComSaldo.checked || Number(tr.dataset.saldo) > 0.0001 || Number(tr.dataset.nesta) > 0);
        tr.hidden = !mostra;
        if (mostra) visiveis += 1;
      });
      contador.textContent = `${visiveis} de ${linhas.length} produto(s)`;
    };
    filtroTexto.addEventListener('input', aplicarFiltro);
    soComSaldo.addEventListener('change', aplicarFiltro);
    areaItens.replaceChildren(h('div', { class: 'ctc-stack' },
      h('div', { class: 'ctc-toolbar' }, filtroTexto,
        h('label', { class: 'ctc-cluster ctc-text-sm' }, soComSaldo, 'só com saldo'),
        h('span', { class: 'ctc-spacer' }), contador),
      tabelaSimples([
        { texto: 'Produto do pedido' }, { texto: 'Un' }, { texto: 'Qtd pedido', num: true }, { texto: 'Em outras NFs', num: true },
        { texto: 'Qtd nesta NF', num: true }, { texto: 'Unit. SEM REIDI (pedido)', num: true }, { texto: 'Unit. na NF (COM REIDI)', num: true },
        { texto: 'Total na NF', num: true }, { texto: 'REIDI do item', num: true }, { texto: 'Saldo após NF', num: true },
      ], linhas)));
    aplicarFiltro();
  }

  function desenharSemVinculo() {
    const novo = { descricao: '', quantidade: 1, valorTotal: null };
    const ped = pedidoPorId(valoresAtuais().pedidoId);
    const prodsPed = ped ? produtosDoPedido(ped.id) : [];
    const idLista = `prod-pedido-${Math.random().toString(36).slice(2, 8)}`;
    const listaProdutos = h('datalist', { id: idLista }, prodsPed.map((p) => h('option', { value: p.descricao }, p.detalhe || '')));
    const campoDescricao = h('input', {
      type: 'text', class: 'ctc-input ctc-input--sm', list: idLista,
      placeholder: !ped ? 'Escolha o pedido acima para buscar nos produtos dele' : prodsPed.length ? 'Digite para buscar nos produtos do pedido ou descreva o item' : 'Descrição do item na NF (pedido sem produtos)',
      onInput: (e) => { novo.descricao = e.target.value; },
    });
    const linhas = semVinculo.map((item, i) => h('tr', { class: 'ctc-row--danger' },
      h('td', {}, item.descricao),
      h('td', { class: 'ctc-col--num ctc-num' }, formatarNumero(item.quantidade)),
      h('td', { class: 'ctc-col--num ctc-num' }, formatarMoeda(item.valorTotal)),
      h('td', { class: 'ctc-col--actions' }, botaoFD({
        icone: 'lixeira', variante: 'ghost', tamanho: 'sm', titulo: 'Remover item', apenasEdicao: true,
        onClick: () => { semVinculo.splice(i, 1); desenharSemVinculo(); atualizarResumo(); },
      }))));
    if (podeEditar()) {
      linhas.push(h('tr', {},
        h('td', {}, campoDescricao),
        h('td', {}, entradaNumero(1, (n) => { novo.quantidade = n ?? 0; })),
        h('td', {}, entradaNumero('', (n) => { novo.valorTotal = n; }, { moeda: true })),
        h('td', { class: 'ctc-col--actions' }, botaoFD({
          icone: 'mais', variante: 'outline', tamanho: 'sm', titulo: 'Adicionar item sem pedido',
          onClick: () => {
            if (!novo.descricao.trim()) { toast.aviso('Informe o item'); return; }
            /* escolheu um produto do pedido na busca: lanca a quantidade nele (abate do pedido) */
            const prod = prodsPed.find((p) => normalizarTexto(p.descricao) === normalizarTexto(novo.descricao));
            if (prod) {
              const atual = itensMapa.get(prod.id) || { quantidade: 0, valorUnit: unitComEfetivo(prod) };
              atual.quantidade = vn(atual.quantidade) + vn(novo.quantidade);
              if (novo.valorTotal != null && vn(novo.quantidade)) atual.valorUnit = vn(novo.valorTotal) / vn(novo.quantidade);
              itensMapa.set(prod.id, atual);
              desenharItens();
              desenharSemVinculo();
              atualizarResumo();
              toast.sucesso('Produto do pedido lançado na NF', `${prod.descricao} · ${formatarNumero(atual.quantidade)}`);
              return;
            }
            if (novo.valorTotal == null) { toast.aviso('Informe o valor do item sem pedido'); return; }
            semVinculo.push({ descricao: novo.descricao.trim(), quantidade: novo.quantidade, valorTotal: novo.valorTotal });
            desenharSemVinculo();
            atualizarResumo();
          },
        }))));
    }
    areaSemVinculo.replaceChildren(
      listaProdutos,
      semVinculo.length ? criarAlerta({ tipo: 'danger', mensagem: `${semVinculo.length} item(ns) desta NF não correspondem a nenhum produto do pedido.` }) : '',
      tabelaSimples([{ texto: 'Item da NF sem produto no pedido' }, { texto: 'Qtd', num: true }, { texto: 'Valor total', num: true }, { texto: '' }], linhas));
  }

  function desenharBoletos() {
    if (!editando) { areaBoletos.replaceChildren(criarAlerta({ tipo: 'info', mensagem: 'Salve a NF para lançar os boletos.' })); return; }
    const lista = boletosDaNota(nf.id);
    areaBoletos.replaceChildren(h('div', { class: 'ctc-stack' },
      criarTabela({
        dados: lista.map((b) => ({ b, numero: b.numero, valor: b.valor, vencimento: b.vencimento, pagamento: b.pagamento, status: statusBoleto(b) })),
        compacta: true, altura: 'auto', vazio: { titulo: 'Nenhum boleto nesta NF' },
        onLinhaClick: (l) => abrirModalBoleto(l.b),
        colunas: [
          { campo: 'numero', titulo: 'Nº doc.' }, { campo: 'valor', titulo: 'Valor', tipo: 'moeda' },
          { campo: 'vencimento', titulo: 'Vencimento', tipo: 'data' }, { campo: 'pagamento', titulo: 'Pagamento', tipo: 'data' },
          { campo: 'status', titulo: 'Status', render: (v) => criarBadge({ texto: v, variante: VARIANTE_BOLETO[v] }) },
        ],
      }).elemento,
      h('div', {}, botaoFD({ texto: 'Novo boleto', icone: 'mais', variante: 'outline', tamanho: 'sm', apenasEdicao: true, onClick: () => abrirModalBoleto(null, nf.id) }))));
  }

  formulario.elemento.addEventListener('change', (e) => {
    const nome = e.target.name;
    if (nome === 'pedidoId') {
      const ped = pedidoPorId(e.target.value);
      if (ped) {
        if (ped.ufOrigem) formulario.campo('ufOrigem').value = ped.ufOrigem;
        if (ped.ufDestino) formulario.campo('ufDestino').value = ped.ufDestino;
        formulario.campo('importado').checked = Boolean(ped.importado);
        formulario.campo('difalPerc').value = formatarNumero(vn(ped.difalPerc));
      }
      desenharItens();
      desenharSemVinculo();
    }
    if (['ufOrigem', 'ufDestino', 'importado'].includes(nome)) {
      const v = valoresAtuais();
      formulario.campo('difalPerc').value = formatarNumero(calcularDifal(v.ufOrigem, v.ufDestino, v.importado).perc);
    }
    atualizarResumo();
  });
  formulario.elemento.addEventListener('change', (e) => {
    if (e.target.name === 'eclic' && e.target.checked && !formulario.campo('eclicData').value) formulario.campo('eclicData').value = hojeIso();
    if (e.target.name === 'grdsTexto' && lerGrds(e.target.value).length) {
      formulario.campo('eclic').checked = true;
      if (!formulario.campo('eclicData').value) formulario.campo('eclicData').value = hojeIso();
    }
  });
  formulario.elemento.addEventListener('input', (e) => {
    if (e.target.name === 'difalValor') difalManual = true;
    if (e.target.name === 'reidi') { reidiManual = true; atualizarResumo(); }
    if (['valor', 'difalPerc'].includes(e.target.name)) atualizarResumo();
  });

  /* Lista de pedidos da NF: por data de emissao; os sem saldo ficam no fim, apagados, num grupo proprio */
  function ordenarPedidosNaNF() {
    const select = formulario.campo('pedidoId');
    if (!select) return;
    const atual = select.value;
    const lista = pedidos.map((p) => ({ p, r: resumoPedido(p) }))
      .sort((a, b) => String(a.p.dataEmissao || '').localeCompare(String(b.p.dataEmissao || '')) || String(a.p.numero).localeCompare(String(b.p.numero)));
    const opcao = ({ p, r }, semSaldo) => h('option', { value: p.id, disabled: semSaldo && p.id !== atual ? true : null, selected: p.id === atual ? true : null },
      `${p.numero} · ${terceiroDoPedido(p)?.nome || '—'} · ${insumoDoPedido(p)?.nome || '—'} · emissão ${p.dataEmissao ? formatarData(p.dataEmissao) : '—'} · ${semSaldo ? 'sem saldo' : `saldo ${formatarMoeda(r.saldo)}`}`);
    const comSaldo = lista.filter((x) => x.r.saldo > 0.005 || !x.r.prods.length);
    const semSaldo = lista.filter((x) => !(x.r.saldo > 0.005 || !x.r.prods.length));
    select.replaceChildren(
      h('option', { value: '' }, 'Selecione'),
      h('optgroup', { label: 'Pedidos com saldo (por data de emissão)' }, comSaldo.map((x) => opcao(x, false))),
      semSaldo.length ? h('optgroup', { label: '──────── Pedidos sem saldo ────────' }, semSaldo.map((x) => opcao(x, true))) : null,
    );
    select.value = atual;
  }

  ordenarPedidosNaNF();
  desenharItens();
  desenharSemVinculo();
  desenharBoletos();
  atualizarResumo();

  const modal = criarModal({
    titulo: editando ? `NF ${nf.numero}` : (rascunho ? 'NF importada — conferir e salvar' : 'Nova nota fiscal'), tamanho: 'xl', destruirAoFechar: true,
    conteudo: pedidos.length ? [
      editando ? h('div', { class: 'ctc-toolbar' }, h('span', { class: 'ctc-spacer' }),
        criarBotao({ texto: 'PDF da NF', icone: 'download', variante: 'ghost', tamanho: 'sm', titulo: 'Exportar a ficha completa desta nota em PDF', onClick: () => gerarPdfNota(nf) })) : null,
      editando ? null : botaoPreencherArquivo({
        texto: 'Preencher de arquivo (XML, PDF ou Excel)', accept: '.xml,.pdf,.xlsx,.xls,.csv',
        aoEscolher: async (arquivo) => {
          const r = await rascunhoNFDeArquivo(arquivo);
          modal.fechar();
          abrirModalNota(null, { rascunho: r });
        },
      }),
      rascunho?.avisoImportacao ? criarAlerta({ tipo: 'warning', titulo: 'Dados lidos do arquivo', mensagem: rascunho.avisoImportacao }) : null,
      formulario.elemento,
      criarPainel({ titulo: 'Produtos do pedido faturados nesta NF', icone: 'tabela', conteudo: areaItens }).elemento,
      criarPainel({ titulo: 'Itens da NF sem pedido correspondente', icone: 'alerta', conteudo: areaSemVinculo }).elemento,
      areaResumo,
      criarPainel({ titulo: 'Boletos da NF', icone: 'moeda', conteudo: areaBoletos }).elemento,
    ] : criarAlerta({ tipo: 'warning', mensagem: 'Cadastre um pedido antes de lançar NFs.' }),
    acoes: pedidos.length ? acoesCadastro(formulario, editando ? 'Salvar NF' : 'Lançar NF', editando ? async () => { if (await excluirNota(nf)) modal.fechar(); } : null) : [{ texto: 'Fechar', variante: 'primary' }],
  });
  modal.abrir();
}

const opcoesNotas = () => ordenar(notas.map((n) => {
  const ped = pedidoPorId(n.pedidoId);
  return { valor: n.id, texto: `NF ${n.numero} · ${terceiroDoPedido(ped)?.nome || '—'} · ${formatarMoeda(n.valor)}` };
}), 'texto');

function abrirModalBoleto(bol = null, notaId = '', { arquivoInicial = null } = {}) {
  const editando = Boolean(bol);
  const avisoArquivo = h('div', {});
  const nfPadrao = notaPorId(notaId);
  const iniciais = editando
    ? { ...bol, grdsTexto: textoGrds(bol.grds) }
    : { notaId, status: 'Em aberto', valor: nfPadrao && !boletosDaNota(nfPadrao.id).length ? vn(nfPadrao.valor) : null };
  const formulario = criarFormulario({
    colunas: 3, semBotoes: true, valores: iniciais,
    campos: [
      { nome: 'notaId', rotulo: 'Nota fiscal', tipo: 'select', placeholder: 'Selecione', obrigatorio: true, opcoes: opcoesNotas(), larguraTotal: true },
      { nome: 'numero', rotulo: 'Nº doc. boleto', obrigatorio: true },
      { nome: 'valor', rotulo: 'Valor do boleto (R$)', tipo: 'moeda', dica: 'Opcional; usado nos totais em aberto.' },
      { nome: 'vencimento', rotulo: 'Vencimento', tipo: 'data', obrigatorio: true },
      { nome: 'pagamento', rotulo: 'Pagamento', tipo: 'data', dica: 'Com data de pagamento, o status passa a Pago.' },
      { nome: 'status', rotulo: 'Status', tipo: 'select', opcoes: STATUS_BOLETO, obrigatorio: true, dica: '"Vencido" é automático: em aberto e vencimento passado.' },
      { nome: 'grdsTexto', rotulo: 'Nº GRD', dica: 'Várias: separe por ;' },
      { nome: 'observacoes', rotulo: 'Observações', tipo: 'textarea', larguraTotal: true },
    ],
    onEnviar: (v) => {
      const registro = {
        notaId: v.notaId, numero: v.numero, valor: v.valor ?? null, vencimento: v.vencimento, pagamento: v.pagamento || '',
        status: v.pagamento && v.status === 'Em aberto' ? 'Pago' : v.status, grds: lerGrds(v.grdsTexto),
        observacoes: v.observacoes,
      };
      if (editando) Object.assign(bol, registro);
      else boletos.push({ id: novoIdFD('bol'), ...registro });
      modal.fechar();
      registrarAlteracao();
      toast.sucesso(editando ? 'Boleto atualizado' : 'Boleto lançado', v.numero);
    },
  });
  formulario.elemento.addEventListener('change', (e) => {
    if (e.target.name === 'pagamento' && e.target.value && formulario.campo('status').value === 'Em aberto') formulario.campo('status').value = 'Pago';
  });
  async function preencherDeArquivo(arquivo) {
      const lido = await lerBoletoDeArquivo(arquivo);
      const definir = (campo, valor, tipo) => {
        if (valor == null || valor === '') return;
        const el = formulario.campo(campo);
        if (!el) return;
        el.value = tipo === 'moeda' ? formatarMoeda(valor, { simbolo: false }) : valor;
        el.dispatchEvent(new Event('change', { bubbles: true }));
      };
      definir('numero', lido.numero);
      definir('valor', lido.valor, 'moeda');
      definir('vencimento', lido.vencimento);
      definir('pagamento', lido.pagamento);
      if (lido.notaId) definir('notaId', lido.notaId);
      if (lido.observacoes) definir('observacoes', [formulario.obterValores().observacoes, lido.observacoes].filter(Boolean).join('\n'));
      avisoArquivo.replaceChildren(criarAlerta({ tipo: 'warning', titulo: 'Dados lidos do arquivo', mensagem: lido.aviso }));
  }
  const modal = criarModal({
    titulo: editando ? `Boleto ${bol.numero}` : 'Novo boleto', tamanho: 'lg', destruirAoFechar: true,
    conteudo: notas.length ? [
      botaoPreencherArquivo({
        texto: 'Preencher de arquivo (PDF ou Excel)', accept: '.pdf,.xlsx,.xls,.csv',
        aoEscolher: preencherDeArquivo,
      }),
      avisoArquivo,
      formulario.elemento,
    ] : criarAlerta({ tipo: 'warning', mensagem: 'Lance uma NF antes do boleto.' }),
    acoes: notas.length ? acoesCadastro(formulario, editando ? 'Salvar boleto' : 'Lançar boleto', editando ? async () => { if (await excluirBoleto(bol)) modal.fechar(); } : null) : [{ texto: 'Fechar', variante: 'primary' }],
  });
  modal.abrir();
  if (arquivoInicial && notas.length) preencherDeArquivo(arquivoInicial).catch((erro) => notificar({ tipo: 'danger', titulo: 'Não foi possível ler o arquivo', mensagem: erro.message }));
}
