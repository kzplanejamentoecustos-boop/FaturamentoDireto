let filtroPainel = [];   // ids de insumos; vazio = todos

function insumosFiltrados() {
  return filtroPainel.length ? insumos.filter((i) => filtroPainel.includes(i.id)) : insumos.slice();
}

function conteudoPainel() {
  const lista = insumosFiltrados();
  const resumos = lista.map((ins) => ({ ins, r: resumoInsumo(ins) }));
  const soma = (campo) => resumos.reduce((t, x) => t + x.r[campo], 0);
  const vigente = soma('vigente');
  const comprometido = soma('comprometido');
  const faturado = soma('faturado');
  const reidi = soma('reidi');
  const difal = soma('difal');
  const idsNf = new Set(resumos.flatMap((x) => x.r.nfs.map((n) => n.id)));
  const nfsFiltro = notas.filter((n) => idsNf.has(n.id));
  const bols = boletos.filter((b) => idsNf.has(b.notaId));
  const abertos = bols.filter((b) => ['Em aberto', 'Vencido', 'Em contestação'].includes(statusBoleto(b)));
  const vencidos = bols.filter((b) => statusBoleto(b) === 'Vencido');
  const nfsSemBoleto = nfsFiltro.filter((n) => !boletosDaNota(n.id).length);
  const pedsDivergentes = resumos.flatMap((x) => x.r.peds).filter((p) => resumoPedido(p).divergente);
  const nfsSemEclic = nfsFiltro.filter((n) => !n.eclic);
  const serie = serieTendencia(lista);

  const pedsFiltro = resumos.flatMap((x) => x.r.peds);
  const qtdTerceiros = resumos.reduce((t, x) => t + x.r.ters.length, 0);
  const nfsSemBM = nfsFiltro.filter((n) => !n.bm);
  const saldoPedidos = comprometido - faturado;
  const aderencia = vigente ? (comprometido / vigente) * 100 : 0;

  /* Indicadores no modelo previsto x comprometido x NFs x saldo x aderencia */
  const indicadores = h('div', { class: 'ctc-grid ctc-grid--6' },
    criarKpi({ rotulo: temAditivoValor() ? 'Previsto (valor vigente)' : 'Previsto (valor total)', valor: formatarMoeda(vigente), sub: `${lista.length} insumo(s)`, variante: 'accent', tema: 1 }).elemento,
    criarKpi({ rotulo: 'Comprometido (pedidos)', valor: formatarMoeda(comprometido), sub: `${qtdTerceiros} terceiro(s) · ${pedsFiltro.length} pedido(s)`, variante: 'warning' }).elemento,
    criarKpi({ rotulo: 'NFs lançadas', valor: formatarMoeda(faturado), sub: `${nfsFiltro.length} nota(s) fiscal(is)`, variante: 'accent', tema: 3 }).elemento,
    criarKpi({ rotulo: 'Saldo (pedidos − NFs)', valor: formatarMoeda(saldoPedidos), sub: 'comprometido − NFs lançadas', variante: saldoPedidos < 0 ? 'danger' : 'success' }).elemento,
    criarKpi({
      rotulo: 'Aderência ao previsto', valor: formatarPercentual(aderencia, { casas: 2 }), variante: aderencia > 100 ? 'danger' : null,
      sub: `faturado: ${formatarPercentual(vigente ? (faturado / vigente) * 100 : 0, { casas: 2 })} do previsto`, progresso: { percentual: aderencia, variante: aderencia > 100 ? 'danger' : null },
    }).elemento,
    criarKpi({ rotulo: 'REIDI nas NFs', valor: formatarMoeda(reidi), sub: `DIFAL ${formatarMoeda(difal)} · ${abertos.length} boleto(s) em aberto` }).elemento);

  const pendencias = [
    nfsSemBM.length ? criarAlerta({
      tipo: 'warning', titulo: `${nfsSemBM.length} NF(s) a lançar em BM (${formatarMoeda(somar(nfsSemBM, 'valor'))})`,
      mensagem: nfsSemBM.map((n) => n.numero).join(', '),
      acoes: [{ texto: 'Ver notas', onClick: () => irParaBase('notas') }],
    }) : null,
    pedsDivergentes.length ? criarAlerta({
      tipo: 'warning', titulo: `${pedsDivergentes.length} pedido(s) com valor diferente da soma dos produtos`,
      mensagem: pedsDivergentes.map((p) => p.numero).join(', '),
      acoes: [{ texto: 'Ver pedidos', onClick: () => irParaBase('pedidos') }],
    }) : null,
  ].filter(Boolean);
  /* faixa compacta no topo: boletos vencidos e NFs sem lancamento no e-clic (so a quantidade) */
  const faixaAvisos = vencidos.length || nfsSemEclic.length ? h('div', { class: 'ctc-toolbar' },
    vencidos.length ? criarBadge({ texto: `${vencidos.length} boleto(s) vencido(s) · ${formatarMoeda(somar(vencidos, 'valor'))}`, variante: 'danger' }) : null,
    vencidos.length ? criarBotao({ texto: 'Ver boletos', variante: 'ghost', tamanho: 'sm', onClick: () => irParaBase('notas') }) : null,
    nfsSemEclic.length ? criarBadge({ texto: `${nfsSemEclic.length} NF(s) sem lançamento no e-clic`, variante: 'warning' }) : null,
  ) : null;

  const tabelaInsumos = criarTabela({
    dados: resumos.map(({ ins, r }) => ({
      ins, nome: ins.nome, vigente: r.vigente, comprometido: r.comprometido, faturado: r.faturado,
      perc: r.percFaturado, saldo: r.saldoFaturar, saldoContratar: r.saldoContratar, terceiros: r.ters.length, pedidos: r.peds.length, nfs: r.nfs.length,
    })),
    compacta: true, altura: 'auto', listrada: true,
    linhaVariante: (l) => (l.saldo < 0 || l.saldoContratar < 0 ? 'danger' : null),
    vazio: { titulo: 'Nenhum insumo cadastrado', mensagem: 'Cadastre os insumos em Base de dados > Insumos.' },
    /* titulo e valor centralizados na mesma coluna; a barra de % faturado fica dentro da tabela */
    colunas: [
      { campo: 'nome', titulo: 'Insumo', fixa: true },
      ...[
        { campo: 'terceiros', titulo: 'Terceiros', tipo: 'numero', total: 'soma' },
        { campo: 'pedidos', titulo: 'Pedidos', tipo: 'numero', total: 'soma' },
        { campo: 'nfs', titulo: 'NFs', tipo: 'numero', total: 'soma' },
        { campo: 'vigente', titulo: rotuloValorInsumo(), tipo: 'moeda', total: 'soma' },
        { campo: 'comprometido', titulo: 'Em pedidos', tipo: 'moeda', total: 'soma' },
        { campo: 'saldoContratar', titulo: 'Saldo a contratar', tipo: 'moeda', total: 'soma' },
        { campo: 'faturado', titulo: 'Faturado', tipo: 'moeda', total: 'soma' },
        {
          campo: 'perc', titulo: '% faturado',
          render: (v) => h('div', { class: 'ctc-stack' },
            criarProgresso({ percentual: v, tamanho: 'sm', variante: v > 100 ? 'danger' : null, rotulo: '% faturado do insumo' }),
            h('span', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(v, { casas: 2 }))),
        },
        { campo: 'saldo', titulo: 'Saldo a faturar', tipo: 'moeda', total: 'soma' },
      ].map((c) => ({ ...c, alinhamento: 'centro', ordenavel: false })),
    ],
  });

  return h('div', { class: 'ctc-stack' },
    faixaAvisos,
    indicadores,
    pendencias.length ? h('div', { class: 'ctc-stack' }, pendencias) : null,
    criarPainel({ titulo: 'Insumos', icone: 'tabela', semEspaco: true, conteudo: tabelaInsumos.elemento }).elemento,
    painelSaldoPedidos(pedsFiltro),
    blocoCurvas(serie, { mensal: false }));
}

/** Saldo por pedido de compra; pedidos 100% consumidos ficam num grupo no fim. */
function painelSaldoPedidos(lista) {
  const linhas = lista.map((p) => ({ p, r: resumoPedido(p) }));
  const ativos = linhas.filter((x) => x.r.perc < 99.995).sort((a, b) => b.r.perc - a.r.perc);
  const consumidos = linhas.filter((x) => x.r.perc >= 99.995);
  const linha = ({ p, r }, apagada) => {
    const cls = apagada ? 'ctc-text-muted' : null;
    return h('tr', { onClick: () => abrirPedido(p), title: 'Abrir pedido' },
      h('td', { class: cls },
        h('div', { class: apagada ? null : 'ctc-text-strong' }, p.numero),
        apagada ? h('div', { class: 'ctc-text-xs ctc-text-subtle' }, '✓ 100% consumido') : null),
      h('td', { class: apagada ? cls : 'ctc-text-strong' }, terceiroDoPedido(p)?.nome || '—'),
      h('td', { class: cls }, insumoDoPedido(p)?.nome || '—'),
      h('td', { class: cls }, formatarData(p.dataEmissao)),
      h('td', { class: `ctc-col--num ctc-num${apagada ? ' ctc-text-muted' : ''}` }, formatarMoeda(p.valor)),
      h('td', { class: `ctc-col--num ctc-num${apagada ? ' ctc-text-muted' : ''}` }, formatarMoeda(r.faturado)),
      h('td', { class: `ctc-col--num ctc-num ${apagada ? 'ctc-text-muted' : r.saldo < 0 ? 'ctc-text-danger' : 'ctc-text-success'}` }, formatarMoeda(r.saldo)),
      h('td', {},
        criarProgresso({ percentual: r.perc, tamanho: 'sm', variante: r.perc >= 80 ? 'danger' : 'success', rotulo: 'Utilização do pedido' }),
        h('div', { class: 'ctc-text-xs ctc-text-muted' }, `${formatarPercentual(r.perc, { casas: 1 })} utilizado`)));
  };
  const corpo = [
    ...ativos.map((x) => linha(x, false)),
    consumidos.length ? h('tr', {}, h('td', { colspan: 8, class: 'ctc-text-xs ctc-text-strong ctc-text-muted' }, `PEDIDOS 100% CONSUMIDOS (${consumidos.length})`)) : null,
    ...consumidos.map((x) => linha(x, true)),
  ].filter(Boolean);
  return criarPainel({
    titulo: 'Saldo por pedido de compra', icone: 'documento', semEspaco: true,
    tag: 'Pedidos 100% consumidos ficam no fim da lista',
    conteudo: h('div', { class: 'ctc-table-wrap ctc-table-wrap--auto' },
      h('table', { class: 'ctc-table ctc-table--compact' },
        h('thead', {}, h('tr', {}, ['Pedido de compra', 'Terceiro', 'Insumo', 'Emissão', 'Valor do pedido', 'Consumido (NF)', 'Saldo', 'Utilização']
          .map((t, i) => h('th', { class: [4, 5, 6].includes(i) ? 'ctc-col--num' : null }, t)))),
        h('tbody', {}, corpo.length ? corpo : h('tr', {}, h('td', { colspan: 8, class: 'ctc-text-subtle' }, 'Nenhum pedido lançado.'))))),
  }).elemento;
}

function paginaPainel() {
  const area = h('div', {});
  const atualizar = () => area.replaceChildren(conteudoPainel());
  const filtro = criarSelecaoMultipla({

    obra.nome ? `${obra.nome} · ${obra.cliente || 'cliente não informado'} · ${obra.inicio ? formatarData(obra.inicio) : '?'} a ${fimVigente() ? formatarData(fimVigente()) : '?'}` : 'Obra não cadastrada');
  return [

    alertaSemObra(),

      h('span', { class: 'ctc-text-strong ctc-text-sm' }, 'Filtrar insumos:'),
      filtro.elemento,
      botaoFD({ texto: 'Todos', variante: 'ghost', tamanho: 'sm', onClick: () => { filtroPainel = []; recarregar(); } }),
      h('span', { class: 'ctc-spacer' }),
      meta),
    area,
  ];
}

let insumoTendencia = '';   // '' = todos

function paginaTendencia() {
  if (insumoTendencia && !insumoPorId(insumoTendencia)) insumoTendencia = '';
  const area = h('div', {});
  const atualizar = () => {
    const lista = insumoTendencia ? [insumoPorId(insumoTendencia)] : insumos;
    const serie = serieTendencia(lista);
    const ins = insumoTendencia ? insumoPorId(insumoTendencia) : null;
    area.replaceChildren(h('div', { class: 'ctc-stack' },
      kpisSerie(serie),
      blocoCurvas(serie, { titulo: ins ? `Evolução mensal — ${ins.nome} | ${formatarData(obra.inicio)} → ${formatarData(fimVigente())}` : null }),
      criarPainel({
        titulo: ins ? `Tabela mensal — ${ins.nome}` : 'Tabela mensal — todos os insumos', icone: 'tabela', semEspaco: true,
        acoes: ins ? [{ texto: 'Editar projeção', icone: 'editar', variante: 'outline', tamanho: 'sm', onClick: () => irParaProjecao() }] : [],
        conteudo: tabelaSerie(serie).elemento,
      }).elemento));
  };
  const filtros = criarBarraFiltros({
    busca: false,
    selects: [{ campo: 'insumo', rotulo: 'Insumo', opcoes: insumos.map((i) => ({ valor: i.id, texto: i.nome })), valor: insumoTendencia }],
    onMudar: ({ filtros: f }) => { insumoTendencia = f.insumo || ''; atualizar(); },
  });
  atualizar();
  return [
    alertaFicticio(),
    alertaSemObra(),
    criarAlerta({
      tipo: 'info', titulo: 'Como a tendência é calculada',
      mensagem: 'Previsto = projeção por BM de cada insumo (nos BMs já fechados e redistribuídos, igual ao real). Real = NFs lançadas, no mês do BM. Tendência = real até o mês atual e, depois, o saldo do valor vigente na proporção do previsto dos meses restantes. Eixo em % do valor vigente; rótulos em mil/mi, como no relatório.',
      fechavel: true,
    }),
    filtros.elemento,
    area,
  ];
}

   06. PAGINAS DA BASE: OBRA E ADITIVOS, INSUMOS, TERCEIROS
   ========================================================================== */

/** Acoes padrao de um modal de cadastro (somente "Fechar" para o visualizador). */
/** Acoes do cadastro; com "excluir" (so na edicao), inclui o botao Excluir a esquerda. */
function acoesCadastro(formulario, textoSalvar = 'Salvar', excluir = null) {
  if (!podeEditar()) return [{ texto: 'Fechar', variante: 'primary' }];
  return [
    excluir ? { texto: 'Excluir', icone: 'lixeira', variante: 'danger', fechar: false, onClick: excluir } : null,
    { texto: 'Cancelar', variante: 'outline' },
    { texto: textoSalvar, variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
  ].filter(Boolean);
}

/** Confirma e exclui; devolve true se excluiu. */
async function excluirItem({ titulo, mensagem, bloqueio, executar }) {
  if (bloqueio) {
    notificar({ tipo: 'warning', titulo: 'Exclusão bloqueada', mensagem: bloqueio });
    return false;
  }
  const ok = await confirmar({ titulo, mensagem, textoConfirmar: 'Excluir', perigo: true });
  if (!ok) return false;
  executar();
  registrarAlteracao();
  toast.aviso('Registro excluído');
  return true;
}

/* ---- Exclusao de cada lancamento (mesmas regras em todas as telas) ---- */

function excluirNota(nf) {
  const bols = boletosDaNota(nf.id);
  return excluirItem({
    titulo: `Excluir a NF ${nf.numero}?`,
    mensagem: `${formatarMoeda(nf.valor)} · pedido ${pedidoPorId(nf.pedidoId)?.numero || '—'}. ${bols.length ? `O(s) ${bols.length} boleto(s) desta NF (${bols.map((b) => b.numero).join(', ')}) também serão excluídos. ` : ''}As unidades abatidas voltam ao saldo dos produtos do pedido.`,
    executar: () => { boletos = boletos.filter((b) => b.notaId !== nf.id); notas.splice(notas.indexOf(nf), 1); },
  });
}

function excluirBoleto(b) {
  return excluirItem({
    titulo: `Excluir o boleto ${b.numero}?`,
    mensagem: `NF ${notaPorId(b.notaId)?.numero || '—'}${b.valor != null ? ` · ${formatarMoeda(b.valor)}` : ''}. A NF continua lançada.`,
    executar: () => boletos.splice(boletos.indexOf(b), 1),
  });
}

function excluirProduto(prod) {
  const nfs = notas.filter((n) => (n.itens || []).some((i) => i.produtoId === prod.id));
  return excluirItem({
    titulo: `Excluir o produto ${prod.descricao}?`,
    mensagem: `Sai do pedido ${pedidoPorId(prod.pedidoId)?.numero || '—'} e o valor do pedido é recalculado.`,
    bloqueio: nfs.length ? `Este produto já foi abatido na(s) NF(s) ${nfs.map((n) => n.numero).join(', ')}. Retire-o dessas NFs (ou exclua as NFs) antes.` : null,
    executar: () => produtos.splice(produtos.indexOf(prod), 1),
  });
}

function excluirTerceiro(t) {
  const peds = pedidos.filter((p) => p.terceiroId === t.id);
  return excluirItem({
    titulo: `Excluir o terceiro ${t.nome}?`,
    mensagem: 'O terceiro será removido.',
    bloqueio: peds.length ? `Este terceiro tem ${peds.length} pedido(s) (${peds.map((p) => p.numero).join(', ')}). Exclua os pedidos antes.` : null,
    executar: () => terceiros.splice(terceiros.indexOf(t), 1),
  });
}

function excluirInsumo(ins) {
  const ters = terceiros.filter((t) => t.insumoId === ins.id);
  return excluirItem({
    titulo: `Excluir o insumo ${ins.nome}?`,
    mensagem: 'O insumo e a projeção dele serão removidos.',
    bloqueio: ters.length ? `Este insumo tem ${ters.length} terceiro(s). Exclua ou mova os terceiros antes.` : null,
    executar: () => insumos.splice(insumos.indexOf(ins), 1),
  });
}

function excluirAditivo(a) {
  return excluirItem({
    titulo: `Excluir o aditivo ${a.numero}?`,
    mensagem: 'O prazo e os valores vigentes serão recalculados.',
    executar: () => aditivos.splice(aditivos.indexOf(a), 1),
  });
}

/* ---- Projecao por BM (insumos x BMs) ---- */

let abaInsumos = 'lista';

function irParaProjecao() {
  abaInsumos = 'projecao';
  if (appAtual) appAtual.navegar('insumos');
}

/**
 * Projecao por BM: uma linha por insumo e uma coluna por BM (mes da obra).
 * - BM FECHADO (antes do mes atual): so o valor REAL (NFs). A diferenca entre o que estava
 *   previsto e o real vira \"a redistribuir\", com opcoes de como redistribuir.
 * - Mes atual e seguintes: previsto editavel (o mes atual mostra tambem o real ate agora).
 * - Painel do mes no topo (lista CARTOES_PROJECAO: facil de mudar a ordem ou os numeros).
 * - Edicao direta: clique no valor; Tab vai ao proximo mes; colar do Excel preenche em sequencia.
 */
let mesRefProjecao = '';          // '' = mes atual (hoje), limitado aos meses da obra (so o painel do mes)
let ultimaAcaoProjecao = null;    // { texto, foto: Map(insumoId -> projecao) } para desfazer
const opcoesRedistribuicao = { modo: 'proporcional', incluirAtual: true, mesUnico: '', escolhidos: [] };

/** Selo de situacao da distribuicao (usado na grade e na lista de insumos). */
function seloDistribuicao(falta) {
  if (Math.abs(falta) < 0.05) return criarBadge({ texto: 'Fecha', variante: 'success' });
  return criarBadge({ texto: `${falta > 0 ? 'A distribuir' : 'Excede'} ${formatarMoeda(Math.abs(falta))}`, variante: falta > 0 ? 'warning' : 'danger' });
}

/** Explica de onde vem a diferenca de um insumo (BMs fechados x valor nunca distribuido). */
function origemDiferenca(d) {
  const partes = [];
  if (Math.abs(d.difFechados) >= 0.05) partes.push(`BMs fechados ${d.difFechados > 0 ? 'abaixo' : 'acima'} do previsto em ${formatarMoeda(Math.abs(d.difFechados))}`);
  if (Math.abs(d.naoDistrib) >= 0.05) partes.push(`${d.naoDistrib > 0 ? 'valor ainda não distribuído' : 'grade acima do valor do insumo'}: ${formatarMoeda(Math.abs(d.naoDistrib))}`);
  return partes.join(' · ');
}

/** Aviso (Insumos e Dashboard) quando algum insumo tem diferenca a redistribuir. */
function alertaDistribuicao() {
  if (!mesesObra().length) return null;
  const lista = insumosSemFechar();
  if (!lista.length) return null;
  const falta = lista.reduce((t, i) => t + distribuicaoInsumo(i).falta, 0);
  return criarAlerta({
    tipo: 'warning', titulo: `${lista.length} insumo(s) com diferença a redistribuir nos BMs`,
    mensagem: `${lista.slice(0, 4).map((i) => i.nome).join(', ')}${lista.length > 4 ? '…' : ''} — saldo ${falta >= 0 ? 'a distribuir' : 'excedente'} de ${formatarMoeda(Math.abs(falta))}.`,
    acoes: [{ texto: 'Abrir projeção por BM', onClick: () => irParaProjecao() }],
  });
}

/** Contexto da tela: meses, fechamento, referencia do painel, real/previsto/vigente por insumo. */
function contextoProjecao() {
  const meses = mesesObra();
  const n = meses.length;
  const hoje = mesHoje();
  let ref = meses.includes(mesRefProjecao) ? mesRefProjecao : hoje;
  if (ref < meses[0]) ref = meses[0];
  if (ref > meses[n - 1]) ref = meses[n - 1];
  const idx = meses.indexOf(ref);
  const fech = indiceFechamento(meses);
  const realPorInsumo = new Map(insumos.map((i) => [i.id, realMensalInsumo(i, meses)]));
  const prevPorInsumo = new Map(insumos.map((i) => [i.id, previstoMensal(i)]));
  const distPorInsumo = new Map(insumos.map((i) => [i.id, distribuicaoInsumo(i, { meses, real: realPorInsumo.get(i.id) })]));
  const somaMes = (fn) => meses.map((_, k) => insumos.reduce((t, ins) => t + fn(ins)[k], 0));
  const real = somaMes((i) => realPorInsumo.get(i.id));
  const prev = somaMes((i) => prevPorInsumo.get(i.id));
  const vigente = somaMes((i) => distPorInsumo.get(i.id).vigente);
  const rotulo = (k) => (k >= 0 && k < n ? `BM${bmDoMes(meses[k])} · ${formatarData(meses[k], 'mes-ano')}` : '—');
  const soma = (arr, a, b) => arr.slice(Math.max(0, a), Math.max(0, b)).reduce((t, v) => t + v, 0);
  return { meses, n, idx, fech, real, prev, vigente, realPorInsumo, prevPorInsumo, distPorInsumo, rotulo, soma, ehAtual: ref === hoje };
}

/**
 * Cartoes do painel do mes. Para mudar o painel, mexa so nesta lista:
 * cada cartao tem rotulo, valor e sub (texto pequeno), todos a partir do contexto.
 */
const CARTOES_PROJECAO = [
  {
    rotulo: () => 'Consumido nos meses anteriores',
    valor: (c) => c.soma(c.real, 0, c.idx),
    sub: (c) => (c.idx > 0 ? `${c.rotulo(0).split(' · ')[0]} a ${c.rotulo(c.idx - 1)} · previsto era ${formatarMoeda(c.soma(c.prev, 0, c.idx))}` : 'nenhum BM anterior'),
  },
  {
    rotulo: (c) => `${c.ehAtual ? 'Mês atual' : 'Mês de referência'} · ${c.rotulo(c.idx)}`,
    valor: (c) => c.real[c.idx],
    sub: (c) => `consumido de ${formatarMoeda(c.prev[c.idx])} previsto (${formatarPercentual(c.prev[c.idx] > 0 ? (c.real[c.idx] / c.prev[c.idx]) * 100 : 0)})`,
    progresso: (c) => (c.prev[c.idx] > 0 ? Math.min(100, (c.real[c.idx] / c.prev[c.idx]) * 100) : 0),
  },
  {
    rotulo: (c) => `Previsão próximo BM · ${c.rotulo(c.idx + 1)}`,
    valor: (c) => (c.idx + 1 < c.n ? c.prev[c.idx + 1] : 0),
    sub: (c) => (c.idx + 1 < c.n ? 'previsto na projeção' : 'último BM da obra'),
  },
  {
    rotulo: () => 'Saldo dos próximos meses',
    valor: (c) => c.soma(c.prev, c.idx + 2, c.n),
    sub: (c) => (c.idx + 2 < c.n ? `${c.rotulo(c.idx + 2)} a ${c.rotulo(c.n - 1)}` : 'sem meses depois do próximo BM'),
  },
];

/* ---- redistribuicao ---- */

const centavos = (v) => Math.round(vn(v) * 100) / 100;

/**
 * Soma delta (positivo ou negativo) nos meses alvo:
 *   'igual'        partes iguais;
 *   'proporcional' proporcional ao que ja esta previsto (iguais se estiverem vazios).
 * Nunca deixa mes negativo: o que nao couber numa reducao passa para os outros alvos.
 * Fecha os centavos no ultimo alvo. Retorna { valores, sobra } (sobra = o que nao coube).
 */
function somarNosMeses(valores, alvos, delta, modo = 'proporcional') {
  const novo = valores.slice();
  if (!alvos.length) return { valores: novo, sobra: delta };
  let resto = delta;
  for (let volta = 0; volta < 4 && Math.abs(resto) >= 0.005; volta += 1) {
    const uteis = resto < 0 ? alvos.filter((i) => novo[i] > 0.004) : alvos;
    if (!uteis.length) break;
    const base = uteis.reduce((t, i) => t + Math.max(0, novo[i]), 0);
    const porIgual = modo === 'igual' || base <= 0;
    let aplicado = 0;
    uteis.forEach((i) => {
      const parte = porIgual ? resto / uteis.length : (resto * Math.max(0, novo[i])) / base;
      const v = Math.max(0, centavos(novo[i] + parte));
      aplicado += v - novo[i];
      novo[i] = v;
    });
    resto = centavos(resto - aplicado);
  }
  if (Math.abs(resto) >= 0.01 && Math.abs(resto) < 1) {
    const k = [...alvos].reverse().find((i) => novo[i] + resto >= 0);
    if (k != null) { novo[k] = centavos(novo[k] + resto); resto = 0; }
  }
  return { valores: novo, sobra: Math.abs(resto) < 0.01 ? 0 : resto };
}

/** Meses de destino conforme as opcoes (indices em mesesObra). */
function alvosRedistribuicao(c, op) {
  const inicio = op.incluirAtual ? c.fech : c.fech + 1;
  const abertos = c.meses.map((_, i) => i).filter((i) => i >= inicio);
  if (op.modo === 'um') return abertos.filter((i) => c.meses[i] === op.mesUnico);
  if (op.modo === 'escolhidos') return abertos.filter((i) => op.escolhidos.includes(c.meses[i]));
  return abertos;
}

/**
 * Plano de redistribuicao: nos BMs fechados o previsto passa a ser o real; a diferenca
 * (e o que nunca foi distribuido) vai para os meses de destino. Nada e gravado aqui.
 */
function planoRedistribuicao(lista, c, op) {
  const alvos = alvosRedistribuicao(c, op);
  return lista.map((ins) => {
    const d = c.distPorInsumo.get(ins.id);
    if (d.situacao === 'fecha' && Math.abs(d.difFechados) < 0.005) return null;
    const base = d.vigente.map(centavos);   /* fechados = real; abertos = previsto */
    const { valores, sobra } = somarNosMeses(base, alvos, d.falta, op.modo === 'proporcional' ? 'proporcional' : 'igual');
    return { ins, d, antes: c.prevPorInsumo.get(ins.id), depois: valores, sobra };
  }).filter(Boolean);
}

function aplicarPlanoProjecao(plano, texto, c) {
  ultimaAcaoProjecao = { texto, foto: new Map(plano.map((p) => [p.ins.id, { ...(p.ins.projecao || {}) }])) };
  plano.forEach((p) => {
    p.ins.modoProjecao = 'manual';
    p.ins.projecao = { ...(p.ins.projecao || {}), ...Object.fromEntries(c.meses.map((m, i) => [m, p.depois[i]])) };
  });
  registrarAlteracao();
  toast.sucesso(texto, `${plano.length} insumo(s) ajustado(s). Dá para desfazer no topo da aba.`);
}

function desfazerProjecao() {
  if (!ultimaAcaoProjecao) return;
  ultimaAcaoProjecao.foto.forEach((proj, id) => { const ins = insumoPorId(id); if (ins) ins.projecao = proj; });
  const texto = ultimaAcaoProjecao.texto;
  ultimaAcaoProjecao = null;
  registrarAlteracao();
  toast.info('Desfeito', texto);
}

/** Janela de redistribuicao: opcoes + previa ao vivo; so grava em \"Aplicar\". */
function abrirRedistribuicao(lista) {
  const c = contextoProjecao();
  const op = opcoesRedistribuicao;
  const abertosTodos = c.meses.map((_, i) => i).filter((i) => i >= c.fech);
  if (!abertosTodos.length) { toast.aviso('Não há BMs abertos', 'Todos os BMs da obra já fecharam: ajuste o prazo ou o valor do insumo.'); return; }
  if (!c.meses.includes(op.mesUnico) || c.meses.indexOf(op.mesUnico) < c.fech) op.mesUnico = c.meses[Math.min(c.fech + 1, c.n - 1)];
  op.escolhidos = op.escolhidos.filter((m) => c.meses.indexOf(m) >= c.fech);
  const rot = (i) => c.rotulo(i);
  const previa = h('div', { class: 'ctc-stack' });
  const extras = h('div', {});
  const radio = (valor, texto, dica) => h('div', {}, h('label', { class: 'ctc-check' },
    h('input', { type: 'radio', name: 'modo-redistribuicao', value: valor, checked: op.modo === valor, onChange: () => { op.modo = valor; desenharExtras(); atualizar(); } }),
    h('span', {}, h('span', { class: 'ctc-text-strong' }, texto), dica ? h('span', { class: 'ctc-text-xs ctc-text-muted' }, ` — ${dica}`) : null)));
  function desenharExtras() {
    if (op.modo === 'um') {
      extras.replaceChildren(h('div', { class: 'ctc-cluster' }, h('span', { class: 'ctc-text-sm' }, 'Mês:'),
        h('select', { class: 'ctc-select ctc-select--sm', onChange: (e) => { op.mesUnico = e.target.value; atualizar(); } },
          abertosTodos.map((i) => h('option', { value: c.meses[i], selected: c.meses[i] === op.mesUnico }, rot(i))))));
    } else if (op.modo === 'escolhidos') {
      extras.replaceChildren(h('div', { class: 'ctc-cluster' }, abertosTodos.map((i) => h('label', { class: 'ctc-check' },
        h('input', {
          type: 'checkbox', checked: op.escolhidos.includes(c.meses[i]),
          onChange: (e) => { op.escolhidos = e.target.checked ? [...op.escolhidos, c.meses[i]] : op.escolhidos.filter((m) => m !== c.meses[i]); atualizar(); },
        }), rot(i)))));
    } else {
      extras.replaceChildren(h('label', { class: 'ctc-check' },
        h('input', { type: 'checkbox', checked: op.incluirAtual, onChange: (e) => { op.incluirAtual = e.target.checked; atualizar(); } }),
        `Incluir o mês atual (${rot(c.fech)}); desmarcado, começa no ${rot(c.fech + 1)}`));
    }
  }
  let plano = [];
  function atualizar() {
    const alvos = alvosRedistribuicao(c, op);
    plano = planoRedistribuicao(lista, c, op);
    const sobras = plano.filter((p) => p.sobra);
    const porMes = alvos.map((i) => ({ mes: rot(i), soma: plano.reduce((t, p) => t + p.depois[i] - p.d.vigente[i], 0) })).filter((x) => Math.abs(x.soma) >= 0.01);
    previa.replaceChildren(...[
      !alvos.length ? criarAlerta({ tipo: 'warning', mensagem: 'Escolha ao menos um mês de destino.' }) : null,
      plano.length ? criarTabela({
        compacta: true, altura: 'auto',
        dados: plano.map((p) => ({ insumo: p.ins.nome, fechados: p.d.difFechados, nao: p.d.naoDistrib, total: p.d.falta, depois: valorVigente(p.ins) - p.depois.reduce((t, v) => t + v, 0) })),
        colunas: [
          { campo: 'insumo', titulo: 'Insumo' },
          { campo: 'fechados', titulo: 'Diferença dos BMs fechados', tipo: 'moeda', total: 'soma' },
          { campo: 'nao', titulo: 'Não distribuído', tipo: 'moeda', total: 'soma' },
          { campo: 'total', titulo: 'A redistribuir', tipo: 'moeda', total: 'soma' },
          { campo: 'depois', titulo: 'Situação depois', ordenavel: false, render: (v) => seloDistribuicao(v) },
        ],
      }).elemento : criarAlerta({ tipo: 'success', mensagem: 'Nada a redistribuir.' }),
      porMes.length ? h('p', { class: 'ctc-text-xs ctc-text-muted' }, `Destino: ${porMes.map((x) => `${x.mes} ${x.soma >= 0 ? '+' : '−'}${formatarMoeda(Math.abs(x.soma))}`).join(' · ')}`) : null,
      sobras.length ? criarAlerta({ tipo: 'warning', mensagem: `Não coube nos meses escolhidos (a redução deixaria mês negativo): ${sobras.map((p) => `${p.ins.nome} ${formatarMoeda(p.sobra)}`).join(' · ')}. Escolha mais meses.` }) : null,
    ].filter(Boolean));
  }
  desenharExtras();
  atualizar();
  const modal = criarModal({
    titulo: lista.length === 1 ? `Redistribuir — ${lista[0].nome}` : 'Redistribuir diferenças', tamanho: 'lg', destruirAoFechar: true,
    conteudo: [
      criarAlerta({ tipo: 'info', mensagem: `Nos BMs fechados (até ${c.fech ? rot(c.fech - 1) : '—'}) fica valendo o real (NFs). A diferença para o previsto, somada ao que ainda não foi distribuído, vai para os meses que você escolher. Nada é gravado antes de "Aplicar".` }),
      h('div', { class: 'ctc-stack' },
        h('div', { class: 'ctc-text-sm ctc-text-strong' }, 'Como redistribuir'),
        radio('proporcional', 'Proporcional ao previsto', 'mantém o formato da curva planejada'),
        radio('igual', 'Linear', 'partes iguais nos meses restantes'),
        radio('um', 'Tudo em um mês', 'escolha o BM'),
        radio('escolhidos', 'Em meses escolhidos', 'partes iguais entre os BMs marcados'),
        extras),
      previa,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      {
        texto: 'Aplicar', variante: 'primary', fechar: false,
        onClick: () => {
          if (!plano.length) { modal.fechar(); return; }
          if (!alvosRedistribuicao(c, op).length) { toast.aviso('Escolha ao menos um mês'); return; }
          modal.fechar();
          aplicarPlanoProjecao(plano, 'Redistribuição da diferença', c);
        },
      },
    ],
  });
  modal.abrir();
}

/* ---- exportar / importar a grade ---- */

const CAB_PROJECAO_FIXO = ['Insumo', 'Valor do Insumo'];
const tituloColunaBM = (mes) => `BM${bmDoMes(mes)} (${formatarData(mes, 'mes-ano')})`;

/** Grade exportada: BMs fechados com o real; abertos com o previsto. */
function abaPlanilhaProjecao() {
  const meses = mesesObra();
  return {
    nome: 'Projeção por BM',
    cabecalho: [...CAB_PROJECAO_FIXO, ...meses.map(tituloColunaBM), 'Total (real + previsto)', 'A Redistribuir'],
    linhas: insumos.map((ins) => {
      const d = distribuicaoInsumo(ins, { meses });
      return [ins.nome, valorVigente(ins), ...d.vigente, d.distribuido, d.falta];
    }),
  };
}

function exportarProjecao() {
  if (!mesesObra().length) { toast.aviso('Defina início e fim da obra'); return; }
  exportarPlanilha(`${FORMATO_BASE}-projecao-bm-${carimboArquivo()}`, [abaPlanilhaProjecao()]);
}

/** Le a grade da planilha: colunas \"BMn (...)\" ou meses (\"out/2026\", \"2026-10\"). Atualiza so os meses que vierem. */
function planejarImportacaoProjecao(brutas) {
  const meses = mesesObra();
  const MESES_TXT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const mesDaColuna = (nome) => {
    const t = normalizarTexto(String(nome));
    const bm = t.match(/^bm\s*(\d+)/);
    if (bm) return mesDoBM(Number(bm[1]));
    const iso = t.match(/(\d{4})-(\d{2})/);
    if (iso) return `${iso[1]}-${iso[2]}`;
    const txt = t.match(/^([a-z]{3})[a-z]*\s*[/ -]\s*(\d{2,4})/);
    if (txt && MESES_TXT.includes(txt[1])) return `${txt[2].length === 2 ? `20${txt[2]}` : txt[2]}-${String(MESES_TXT.indexOf(txt[1]) + 1).padStart(2, '0')}`;
    return null;
  };
  const avisos = [];
  const ops = [];
  brutas.forEach((b, i) => {
    const chaveInsumo = Object.keys(b).find((k) => chaveColuna(k) === 'insumo' || chaveColuna(k) === 'atividade');
    const nome = chaveInsumo ? String(b[chaveInsumo] || '').trim() : '';
    if (!nome) return;
    const ins = insumos.find((x) => normalizarTexto(x.nome) === normalizarTexto(nome));
    if (!ins) { avisos.push(`Linha ${i + 2}: insumo \"${nome}\" não cadastrado.`); return; }
    const valores = {};
    Object.entries(b).forEach(([k, v]) => {
      const m = mesDaColuna(k);
      if (m && meses.includes(m) && v !== '' && v != null) valores[m] = numPlanilha(v) ?? 0;
    });
    if (Object.keys(valores).length) ops.push({ ins, valores });
  });
  return {
    quantidade: ops.length,
    avisos: [avisos.length ? criarAlerta({ tipo: 'warning', titulo: 'Linhas ignoradas', mensagem: avisos.slice(0, 8).join(' ') }) : null],
    tabela: {
      dados: ops.map((o) => ({ insumo: o.ins.nome, meses: Object.keys(o.valores).length, soma: Object.values(o.valores).reduce((t, v) => t + v, 0) })),
      colunas: [{ campo: 'insumo', titulo: 'Insumo' }, { campo: 'meses', titulo: 'Meses lidos', tipo: 'numero' }, { campo: 'soma', titulo: 'Soma dos meses lidos', tipo: 'moeda' }],
    },
    aplicar: () => {
      ops.forEach((o) => { o.ins.modoProjecao = 'manual'; o.ins.projecao = { ...(o.ins.projecao || {}), ...o.valores }; });
      return `${ops.length} insumo(s) com projeção atualizada`;
    },
  };
}

function importarProjecao() {
  if (!mesesObra().length) { toast.aviso('Defina início e fim da obra'); return; }
  abrirImportacaoPlanilha({
    titulo: 'Importar projeção por BM', nomeModelo: 'modelo-projecao-bm.csv',
    cabecalhoModelo: abaPlanilhaProjecao().cabecalho.slice(0, -2),
    explicacao: 'Uma linha por insumo (nome exato) e uma coluna por BM, como na exportação. Só os meses que vierem preenchidos são alterados. Nos BMs fechados continua valendo o real (NFs).',
    planejar: planejarImportacaoProjecao,
  });
}

/* ---- tela ---- */

function painelProjecaoBM() {
  const meses = mesesObra();
  if (!meses.length) return criarAlerta({ tipo: 'warning', mensagem: 'Defina início e fim da obra para montar a projeção por BM.' });
  if (!insumos.length) return criarAlerta({ tipo: 'info', mensagem: 'Cadastre os insumos para projetar os BMs.' });
  const area = h('div', { class: 'ctc-stack' });
  const editavel = podeEditar();

  function desenhar(foco = null) {
    const c = contextoProjecao();
    /* painel do mes (pequeno) */
    const cartoes = h('div', { class: 'ctc-grid ctc-grid--4' }, CARTOES_PROJECAO.map((k) => criarKpi({
      rotulo: k.rotulo(c), valor: formatarMoeda(k.valor(c)), sub: k.sub(c),
      progresso: k.progresso ? { percentual: k.progresso(c) } : undefined,
    }).elemento));
    const seletorMes = h('select', {
      class: 'ctc-select ctc-select--sm', 'aria-label': 'Mês de referência do painel',
      onChange: (e) => { mesRefProjecao = e.target.value; desenhar(); },
    }, h('option', { value: '' }, `Mês atual (${formatarData(mesHoje(), 'mes-ano')})`),
    meses.map((m) => h('option', { value: m, selected: m === mesRefProjecao }, `BM${bmDoMes(m)} · ${formatarData(m, 'mes-ano')}`)));

    /* avisos */
    const pendentes = insumos.filter((i) => c.distPorInsumo.get(i.id).situacao !== 'fecha');
    const avisos = [];
    if (ultimaAcaoProjecao && editavel) {
      avisos.push(criarAlerta({ tipo: 'info', mensagem: `Última ação: ${ultimaAcaoProjecao.texto}.`, acoes: [{ texto: 'Desfazer', onClick: desfazerProjecao }] }));
    }
    if (pendentes.length) {
      const total = pendentes.reduce((t, i) => t + c.distPorInsumo.get(i.id).falta, 0);
      avisos.push(criarAlerta({
        tipo: 'warning', titulo: `Diferença a redistribuir em ${pendentes.length} insumo(s) — ${total >= 0 ? 'saldo' : 'excesso'} de ${formatarMoeda(Math.abs(total))}`,
        mensagem: pendentes.slice(0, 5).map((i) => `${i.nome}: ${origemDiferenca(c.distPorInsumo.get(i.id))}`).join(' | ') + (pendentes.length > 5 ? ' …' : ''),
        acoes: editavel ? [{ texto: 'Redistribuir…', onClick: () => abrirRedistribuicao(pendentes) }] : [],
      }));
    }

    /* grade */
    const celulaValor = (ins, i) => {
      const fechado = i < c.fech;
      const atual = i === c.fech;
      const real = c.realPorInsumo.get(ins.id)[i];
      const prev = c.prevPorInsumo.get(ins.id)[i];
      if (fechado) {
        /* BM fechado: so o real (o previsto fica na dica) */
        return h('td', {
          class: 'ctc-col--num ctc-num', style: { background: 'var(--ctc-neutral-100)' },
          title: `BM fechado — real (NFs). Previsto era ${formatarMoeda(prev)}${Math.abs(prev - real) >= 0.01 ? ` (diferença ${formatarMoeda(prev - real)})` : ''}.`,
        }, h('div', { class: real ? 'ctc-text-strong' : 'ctc-text-subtle' }, real ? formatarMoeda(real, { simbolo: false }) : '—'));
      }
      const td = h('td', {
        class: 'ctc-col--num ctc-num', style: atual ? { background: 'var(--ctc-brand-50)' } : null,
        dataset: { ins: ins.id, i: String(i) }, title: editavel ? 'Clique para editar o previsto' : null,
      },
      h('div', { class: prev ? '' : 'ctc-text-subtle' }, prev ? formatarMoeda(prev, { simbolo: false }) : '—'),
      atual || real ? h('div', { class: 'ctc-text-xs ctc-text-muted' }, `real até agora ${real ? formatarMoeda(real, { simbolo: false }) : '0'}`) : null);
      if (editavel) td.addEventListener('click', () => editarCelula(td, ins, i));
      return td;
    };
    const linhas = insumos.map((ins) => {
      const d = c.distPorInsumo.get(ins.id);
      return h('tr', {},
        h('td', { class: 'ctc-col--sticky' }, h('div', { class: 'ctc-text-strong' }, ins.nome)),

        h('td', { class: 'ctc-col--num ctc-num', title: 'Real nos BMs fechados + previsto nos abertos' }, formatarMoeda(d.distribuido)),
        h('td', { style: { whiteSpace: 'nowrap' }, title: origemDiferenca(d) || 'Real + previsto fecham com o valor do insumo' },
          h('div', { class: 'ctc-cluster', style: { flexWrap: 'nowrap' } }, seloDistribuicao(d.falta),
            editavel && d.situacao !== 'fecha' ? botaoFD({

    area.replaceChildren(
      criarPainel({ titulo: 'Painel do mês', icone: 'calendario', acoes: [seletorMes], conteudo: cartoes }).elemento,
      ...avisos,
      criarPainel({
        titulo: 'Projeção por BM', icone: 'tabela', semEspaco: true, acoes,
        tag: `${meses.length} BMs · BM${bmDoMes(meses[0])} (${formatarData(meses[0], 'mes-ano')}) a BM${bmDoMes(meses[meses.length - 1])} (${formatarData(meses[meses.length - 1], 'mes-ano')})`,
        conteudo: h('div', { class: 'ctc-table-wrap ctc-table-wrap--auto' }, tabela),
        rodape: `BMs fechados (fundo cinza${c.fech ? `, até ${c.rotulo(c.fech - 1)}` : ''}): vale só o real (NFs); o previsto antigo fica na dica do valor. Mês atual em azul, com o real até agora.${editavel ? ' Clique num valor para editar; Enter ou Tab confirma (Tab vai ao próximo mês, Esc cancela). Colar uma linha do Excel preenche os meses seguintes.' : ''}`,
      }).elemento);

    if (foco) {
      const td = area.querySelector(`td[data-ins="${foco.ins}"][data-i="${foco.i}"]`);
      const ins = insumoPorId(foco.ins);
      if (td && ins) editarCelula(td, ins, foco.i);
    }
  }

  function gravar(ins, i, valor) {
    ins.modoProjecao = 'manual';
    ins.projecao = { ...(ins.projecao || {}), [meses[i]]: centavos(valor) };
  }

  function editarCelula(td, ins, i) {
    if (td.querySelector('input')) return;
    const atual = vn((ins.projecao || {})[meses[i]]);
    const entrada = h('input', {
      type: 'text', inputmode: 'decimal', class: 'ctc-input ctc-input--sm ctc-input--num',
      value: atual ? formatarMoeda(atual, { simbolo: false }) : '', 'aria-label': `${ins.nome} — ${tituloColunaBM(meses[i])}`,
    });
    let encerrado = false;
    const concluir = (salvar, proximo = null) => {
      if (encerrado) return;
      encerrado = true;
      if (salvar) {
        const n = entrada.value.trim() === '' ? 0 : paraNumero(entrada.value);
        if (n != null && Math.abs(n - atual) >= 0.005) { gravar(ins, i, n); sessao.marcarAlteracao(); }
      }
      desenhar(proximo);
    };
    entrada.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); concluir(true); }
      else if (e.key === 'Escape') { e.preventDefault(); concluir(false); }
      else if (e.key === 'Tab') {
        e.preventDefault();
        const j = i + (e.shiftKey ? -1 : 1);
        concluir(true, j >= indiceFechamento(meses) && j < meses.length ? { ins: ins.id, i: j } : null);
      }
    });
    entrada.addEventListener('blur', () => concluir(true));
    entrada.addEventListener('paste', (e) => {
      const texto = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      const partes = texto.split(/\t|\r?\n/).map((t) => t.trim()).filter((t) => t !== '');
      if (partes.length < 2) return;   /* um valor so: colagem normal */
      e.preventDefault();
      let k = i;
      partes.forEach((t) => {
        if (k >= meses.length) return;
        const n = paraNumero(t.replace(/^R\$\s*/i, ''));
        if (n != null) gravar(ins, k, n);
        k += 1;
      });
      sessao.marcarAlteracao();
      encerrado = true;
      toast.sucesso('Valores colados', `${Math.min(partes.length, meses.length - i)} mês(es) de ${ins.nome}`);
      desenhar();
    });
    td.replaceChildren(entrada);
    entrada.focus();
    entrada.select();
  }

  desenhar();
  return area;
}

/* ---- Terceiros ---- */

function abrirModalTerceiro(ter = null, insumoPadrao = '', { arquivoInicial = null } = {}) {
  const editando = Boolean(ter);
  const avisoArquivo = h('div', {});
  const infoCnpj = h('div', {});
  const formulario = criarFormulario({
    colunas: 2, semBotoes: true, valores: editando ? ter : { insumoId: insumoPadrao },
    campos: [
      { nome: 'insumoId', rotulo: 'Insumo', tipo: 'select', placeholder: 'Selecione', obrigatorio: true, opcoes: insumos.map((i) => ({ valor: i.id, texto: i.nome })) },
      { nome: 'nome', rotulo: 'Terceiro (fornecedor)', obrigatorio: true },
      { nome: 'cnpj', rotulo: 'CNPJ', dica: 'Ao informar, a UF do emissor é consultada na Receita. Também reconhece o emitente ao importar NF.' },
      { nome: 'uf', rotulo: 'UF do emissor (origem)', tipo: 'select', opcoes: UFS, placeholder: 'Selecione', obrigatorio: true },
    ],
    onEnviar: (v) => {
      if (editando) Object.assign(ter, v);
      else terceiros.push({ id: novoIdFD('ter'), ...v });
      modal.fechar();
      registrarAlteracao();
      toast.sucesso(editando ? 'Terceiro atualizado' : 'Terceiro cadastrado', v.nome);
    },
  });
  const modal = criarModal({
    titulo: editando ? `Terceiro — ${ter.nome}` : 'Novo terceiro', tamanho: 'md', destruirAoFechar: true,
    conteudo: insumos.length ? [
      botaoPreencherArquivo({ texto: 'Preencher de arquivo (PDF ou Excel)', accept: '.pdf,.xlsx,.xls,.csv', aoEscolher: preencherDeArquivo }),
      avisoArquivo,
      formulario.elemento,
      infoCnpj,
    ] : criarAlerta({ tipo: 'warning', mensagem: 'Cadastre um insumo antes do terceiro.' }),
    acoes: insumos.length ? acoesCadastro(formulario, 'Salvar', editando ? async () => { if (await excluirTerceiro(ter)) modal.fechar(); } : null) : [{ texto: 'Fechar', variante: 'primary' }],
  });
  async function buscarPeloCnpj() {
    const cnpj = formulario.campo('cnpj')?.value;
    if (String(cnpj || '').replace(/\D/g, '').length !== 14) return;
    infoCnpj.replaceChildren(criarAlerta({ tipo: 'info', mensagem: 'Consultando o CNPJ na Receita...' }));
    try {
      const r = await consultarCnpj(cnpj);
      if (UFS.includes(r.uf)) { formulario.campo('uf').value = r.uf; formulario.campo('uf').dispatchEvent(new Event('change', { bubbles: true })); }
      if (!formulario.campo('nome').value && r.nome) formulario.campo('nome').value = r.nome;
      infoCnpj.replaceChildren(criarAlerta({ tipo: 'success', titulo: 'Emissor pelo CNPJ', mensagem: `${r.nome}${r.fantasia ? ` (${r.fantasia})` : ''} · ${r.municipio}/${r.uf}. UF de origem preenchida.` }));
    } catch (erro) {
      infoCnpj.replaceChildren(criarAlerta({ tipo: 'warning', mensagem: erro.message }));
    }
  }
  /* adiado: o "change" do CNPJ acontece ao clicar em Salvar; mexer na tela na mesma hora faria o clique se perder */
  formulario.elemento.addEventListener('change', (e) => { if (e.target.name === 'cnpj') setTimeout(buscarPeloCnpj, 300); });
  async function preencherDeArquivo(arquivo) {
    const lido = await lerTerceiroDeArquivo(arquivo);
    const definir = (campo, valor) => {
      if (valor == null || valor === '') return;
      const el = formulario.campo(campo);
      if (el) { el.value = valor; el.dispatchEvent(new Event('change', { bubbles: true })); }
    };
    definir('nome', lido.nome);
    definir('cnpj', lido.cnpj);
    definir('uf', lido.uf);
    if (!lido.uf && lido.cnpj) buscarPeloCnpj();
    if (lido.insumoNome) {
      const ins = insumos.find((i) => normalizarTexto(i.nome) === normalizarTexto(lido.insumoNome));
      if (ins) definir('insumoId', ins.id);
    }
    avisoArquivo.replaceChildren(criarAlerta({ tipo: 'warning', titulo: 'Dados lidos do arquivo', mensagem: lido.aviso }));
  }
  modal.abrir();
  if (arquivoInicial && insumos.length) preencherDeArquivo(arquivoInicial).catch((erro) => notificar({ tipo: 'danger', titulo: 'Não foi possível ler o arquivo', mensagem: erro.message }));
}

function secaoTerceiros() {
  const codigos = codigosHierarquia();
  const linhas = terceiros.map((t) => {
    const peds = pedidos.filter((p) => p.terceiroId === t.id);
    const resumos = peds.map((p) => resumoPedido(p));
    const valor = somar(peds, 'valor');
    const faturado = resumos.reduce((s2, r) => s2 + r.faturado, 0);
    const esgotados = resumos.filter((r) => situacaoPedido(r) === 'Esgotado').length;
    const ultimo = peds.map((p) => p.dataEmissao).filter(Boolean).sort().pop() || '';
    return {
      ter: t, ...(codigos.get(t.id) || {}), nome: t.nome, terceiro: t.nome, insumo: insumoPorId(t.insumoId)?.nome || '—', uf: t.uf, cnpj: t.cnpj,
      pedidos: peds.length, ativos: peds.length - esgotados, esgotados, valor, faturado, saldo: valor - faturado,
      utilizacao: valor ? (faturado / valor) * 100 : 0, ultimo,
    };
  });
  const tabela = criarTabela({
    dados: linhas, listrada: true, altura: 'auto',
    ordenacao: { campo: 'ordem', direcao: 'asc' },
    vazio: { titulo: 'Nenhum terceiro', mensagem: 'Cadastre os fornecedores de cada insumo.' },
    onAtualizar: ({ total, filtrados }) => definirMetaBase(`${filtrados} de ${total} terceiros`),
    onLinhaClick: (l) => { filtroBase = { ...filtroBase, terceiro: l.nome }; irParaBase('pedidos'); },
    colunas: [
      COLUNA_CODIGO,
      { campo: 'insumo', titulo: 'Insumo' },
      { campo: 'nome', titulo: 'Terceiro' },
      { campo: 'cnpj', titulo: 'CNPJ' },
      { campo: 'uf', titulo: 'UF' },
      { campo: 'pedidos', titulo: 'Pedidos', tipo: 'numero', total: 'soma' },
      {
        campo: 'ativos', titulo: 'Ativos / esgotados', ordenavel: false,
        render: (_, l) => (l.pedidos ? h('div', { class: 'ctc-cluster' },
          criarBadge({ texto: `${l.ativos} ativo(s)`, variante: l.ativos ? 'info' : 'neutral' }),
          l.esgotados ? criarBadge({ texto: `${l.esgotados} esgotado(s)`, variante: 'neutral' }) : null) : criarBadge({ texto: 'sem pedido', variante: 'warning' })),
      },
      { campo: 'ultimo', titulo: 'Último pedido', tipo: 'data' },
      { campo: 'valor', titulo: 'Valor em pedidos', tipo: 'moeda', total: 'soma' },
      { campo: 'faturado', titulo: 'Faturado', tipo: 'moeda', total: 'soma' },
      { campo: 'saldo', titulo: 'Saldo', tipo: 'moeda', total: 'soma' },
      {
        campo: 'utilizacao', titulo: 'Utilização',
        render: (v) => h('div', { class: 'ctc-stack' },
          criarProgresso({ percentual: v, tamanho: 'sm', variante: v >= 80 ? 'danger' : 'success', rotulo: 'Utilização' }),
          h('span', { class: 'ctc-text-xs ctc-num' }, formatarPercentual(v, { casas: 2 }))),
      },
      {
        campo: 'novoPedido', titulo: '', ordenavel: false,
        render: (_, l) => botaoFD({
          texto: 'Pedido', icone: 'mais', variante: 'ghost', tamanho: 'sm', apenasEdicao: true, titulo: `Novo pedido de ${l.nome}`,
          onClick: (e) => { if (e) e.stopPropagation(); abrirModalPedido(null, l.ter.id); },
        }),
      },
      {
        campo: 'acoes', titulo: '', ordenavel: false, classe: 'ctc-col--actions',
        render: (_, l) => botoesLinha([
          { icone: 'editar', titulo: 'Editar terceiro', apenasEdicao: true, onClick: () => abrirModalTerceiro(l.ter) },
          {
            icone: 'lixeira', titulo: 'Excluir terceiro', apenasEdicao: true,
            onClick: () => excluirItem({
              titulo: `Excluir ${l.nome}?`, mensagem: 'O terceiro será removido.',
              bloqueio: l.pedidos ? 'Este terceiro tem pedidos. Exclua os pedidos antes.' : null,
              executar: () => terceiros.splice(terceiros.indexOf(l.ter), 1),
            }),
          },
        ]),
      },
    ],
  });
  return {
    tabela, titulo: 'Terceiros por insumo', icone: 'usuario', selects: [],
    acoes: [
      { texto: 'Importar', icone: 'upload', variante: 'ghost', tamanho: 'sm', apenasEdicao: true, titulo: 'Importar terceiros (Excel/CSV)', onClick: importarTerceiros },
      { texto: 'Exportar', icone: 'download', variante: 'ghost', tamanho: 'sm', titulo: 'Exportar terceiros filtrados (Excel)', onClick: () => exportarTerceiros(tabela.obterFiltrados().map((l) => l.ter)) },
      { texto: 'Novo terceiro', icone: 'mais', variante: 'primary', tamanho: 'sm', apenasEdicao: true, onClick: () => abrirModalTerceiro() },
    ],
    rodape: 'Clique num terceiro para ver só os pedidos dele.',
  };
}

const opcoesTerceiros = () => ordenar(terceiros.map((t) => ({ valor: t.id, texto: `${t.nome} · ${insumoPorId(t.insumoId)?.nome || 'sem insumo'}` })), 'texto');

function abrirModalPedido(ped = null, terceiroPadrao = '', { arquivoInicial = null } = {}) {
  const editando = Boolean(ped);
  const terPadrao = terceiroPorId(terceiroPadrao);
  const iniciais = editando ? ped : {
    terceiroId: terceiroPadrao, dataEmissao: hojeIso(), modoReidi: 'produto',
    ufOrigem: terPadrao?.uf || '', ufDestino: obra.ufObra || '', importado: false,
  };
  if (!editando) iniciais.difalPerc = calcularDifal(iniciais.ufOrigem, iniciais.ufDestino, false).perc;
  const infoDifal = h('div', {});
  const areaArquivo = h('div', {});
  /* Produtos lidos de arquivo (PDF/planilha): entram ao salvar; o lancamento manual fica na 2a etapa (aba Produtos) */
  let produtosPendentes = [];
  const formulario = criarFormulario({
    colunas: 3, semBotoes: true, valores: iniciais,
    campos: [
      { nome: 'terceiroId', rotulo: 'Terceiro · insumo', tipo: 'select', placeholder: 'Selecione', obrigatorio: true, opcoes: opcoesTerceiros(), larguraTotal: true },
      { nome: 'numero', rotulo: 'Nº do pedido de compra', obrigatorio: true },
      { nome: 'dataEmissao', rotulo: 'Data de emissão do pedido', tipo: 'data', obrigatorio: true },
      {
        nome: 'modoReidi', rotulo: 'REIDI do pedido', tipo: 'radio', obrigatorio: true, larguraTotal: true,
        opcoes: [
          { valor: 'sem', texto: 'Sem REIDI (um valor por produto)' },
          { valor: 'pedido', texto: 'Por pedido (% geral, opcional)' },
          { valor: 'produto', texto: 'Por produto (dois valores por produto)' },
        ],
      },
      {
        nome: 'percentualReidi', rotulo: '% REIDI do pedido (opcional)', tipo: 'percentual', regras: { minimo: 0, maximo: 99.99 },
        dica: 'Com %: basta um valor por produto e o outro é calculado. Sem %: cada produto informa SEM e COM REIDI.',
      },
      { nome: 'ufOrigem', rotulo: 'UF emissor (origem)', tipo: 'select', opcoes: UFS, placeholder: 'Selecione', obrigatorio: true },
      { nome: 'ufDestino', rotulo: 'UF receptor (destino)', tipo: 'select', opcoes: UFS, placeholder: 'Selecione', obrigatorio: true },
      { nome: 'importado', rotulo: 'Mercadoria importada (interestadual 4%)', tipo: 'checkbox' },
      { nome: 'difalPerc', rotulo: 'DIFAL (%)', tipo: 'percentual', dica: 'Calculado pelas UFs; pode ajustar.' },
      { nome: 'observacoes', rotulo: 'Observações', tipo: 'textarea', larguraTotal: true },
    ],
    onEnviar: (v) => {
      const repetido = pedidos.find((p) => p !== ped && p.terceiroId === v.terceiroId && normalizarTexto(p.numero) === normalizarTexto(v.numero));
      if (repetido) { formulario.definirErro('numero', 'Já existe um pedido com este número para o terceiro.'); return; }
      const temPerc = v.modoReidi === 'pedido' && v.percentualReidi != null && v.percentualReidi !== '';
      const registro = { ...v, percentualReidi: temPerc ? vn(v.percentualReidi) : null, difalPerc: vn(v.difalPerc), valor: editando ? ped.valor : 0 };
      const validos = produtosValidos(v);
      let alvo = ped;
      if (editando) Object.assign(ped, registro);
      else { alvo = { id: novoIdFD('ped'), ...registro }; pedidos.push(alvo); }
      validos.forEach((pr) => produtos.push({ id: novoIdFD('pro'), pedidoId: alvo.id, ...pr }));
      modal.fechar();
      registrarAlteracao();
      toast.sucesso(editando ? 'Pedido atualizado' : 'Pedido cadastrado', `${v.numero}${validos.length ? ` · ${validos.length} produto(s)` : ''}`);
      if (!editando) abrirPedido(alvo, 'produtos');
    },
  });
  const atualizarDifal = (recalcular) => {
    const v = formulario.obterValores();
    const calc = calcularDifal(v.ufOrigem, v.ufDestino, v.importado);
    if (recalcular) formulario.campo('difalPerc').value = formatarNumero(calc.perc);
    infoDifal.replaceChildren(criarAlerta({ tipo: 'info', titulo: 'DIFAL pela tabela ICMS', mensagem: calc.texto }));
  };
  formulario.elemento.addEventListener('change', (e) => {
    if (e.target.name === 'terceiroId') {
      const t = terceiroPorId(e.target.value);
      if (t?.uf) formulario.campo('ufOrigem').value = t.uf;
      else if (t?.cnpj) {
        /* terceiro sem UF: consulta pelo CNPJ e grava no cadastro do terceiro */
        consultarCnpj(t.cnpj).then((r) => {
          if (!UFS.includes(r.uf)) return;
          t.uf = r.uf;
          sessao.marcarAlteracao();
          formulario.campo('ufOrigem').value = r.uf;
          atualizarDifal(true);
          toast.info('UF do emissor pelo CNPJ', `${t.nome}: ${r.uf}`);
        }).catch((erro) => toast.aviso('UF do emissor', erro.message));
      }
      atualizarDifal(true);
    }
    if (['ufOrigem', 'ufDestino', 'importado'].includes(e.target.name)) atualizarDifal(true);
  });
  atualizarDifal(false);

  /* % do pedido so aparece no modo "Por pedido" */
  const campoPerc = formulario.campo('percentualReidi');
  const caixaPerc = campoPerc ? (campoPerc.closest('.ctc-field') || campoPerc.parentElement.parentElement) : null;
  const ajustarCampoPerc = () => {
    const modo = formulario.obterValores().modoReidi;
    if (caixaPerc) caixaPerc.classList.toggle('ctc-hidden', editando || modo !== 'pedido');
    if (modo !== 'pedido' && campoPerc) campoPerc.value = '';
  };
  /* na edicao, o REIDI muda pelo "Alterar REIDI" (recalcula os produtos com previa) */
  if (editando) {
    const radio = formulario.elemento.querySelector('input[name="modoReidi"]');
    const caixaModo = radio ? radio.closest('.ctc-field') : null;
    if (caixaModo) caixaModo.classList.add('ctc-hidden');
  }
  formulario.elemento.addEventListener('change', (e) => { if (e.target.name === 'modoReidi') ajustarCampoPerc(); });
  ajustarCampoPerc();

  /* Produtos lidos do arquivo: completa o COM REIDI pelo % unico quando faltar */
  function produtosValidos(v = formulario.obterValores()) {
    return produtosPendentes.filter((p) => String(p.descricao || '').trim()).map((p) => {
      const perc = v.modoReidi === 'pedido' && v.percentualReidi != null && v.percentualReidi !== '' ? v.percentualReidi : null;
      const vals = completarValoresReidi(v.modoReidi, perc, p.unitSem == null || p.unitSem === '' ? null : p.unitSem, p.unitCom == null || p.unitCom === '' ? null : p.unitCom);
      return {
        descricao: String(p.descricao).trim(), detalhe: String(p.detalhe || '').trim(), descricaoNF: String(p.descricaoNF || '').trim(), unidade: String(p.unidade || '').trim(),
        quantidade: vn(p.quantidade), unitSem: vals.unitSem, unitCom: vals.unitCom, ajusteManual: vals.ajusteManual,
      };
    });
  }
  async function preencherDeArquivo(arquivo) {
      const lido = await lerPedidoDeArquivo(arquivo);
      const definir = (campo, valor, tipo) => {
        if (valor == null || valor === '') return;
        const el = formulario.campo(campo);
        if (!el) return;
        el.value = tipo === 'moeda' ? formatarMoeda(valor, { simbolo: false }) : tipo === 'num' ? formatarNumero(valor) : valor;
        el.dispatchEvent(new Event('change', { bubbles: true }));
      };
      const ter = acharTerceiroLido(lido);
      if (ter) definir('terceiroId', ter.id);
      definir('numero', lido.numero);
      definir('dataEmissao', lido.dataEmissao);
      if (lido.modoReidi) {
        const radio = formulario.elemento.querySelector(`input[name="modoReidi"][value="${lido.modoReidi}"]`);
        if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change', { bubbles: true })); }
      }
      definir('percentualReidi', lido.percentualReidi, 'num');
      produtosPendentes = lido.produtos || [];
      areaArquivo.replaceChildren(h('div', { class: 'ctc-stack' },
        criarAlerta({
          tipo: ter ? 'warning' : 'danger', titulo: 'Dados lidos do arquivo',
          mensagem: [
            ter ? `Terceiro: ${ter.nome}.` : `Terceiro ${lido.terceiroNome || lido.cnpj || (lido.cnpjs || []).join(', ') || ''} não encontrado no cadastro: escolha ou cadastre o terceiro.`,
            lido.aviso,
            produtosPendentes.length ? `Valor do pedido (soma dos produtos): ${formatarMoeda(produtosValidos().reduce((t, x) => t + x.quantidade * x.unitCom, 0))}.` : '',
            'Confira antes de salvar; os produtos aparecem na próxima tela (aba Produtos).',
          ].filter(Boolean).join(' '),
        }),
        null));
  }
  const modal = criarModal({
    titulo: editando ? `Pedido ${ped.numero}` : 'Novo pedido de compra', tamanho: 'lg', destruirAoFechar: true,
    conteudo: terceiros.length ? [
      editando ? criarAlerta({
        tipo: 'info', titulo: `REIDI: ${rotuloReidiPedido(ped)}`,
        mensagem: 'Para mudar o modo ou o % de REIDI, use "Alterar REIDI": ele mostra antes como ficam os produtos.',
        acoes: [{ texto: 'Alterar REIDI', onClick: () => { modal.fechar(); abrirAlterarReidi(ped); } }],
      }) : null,
      editando ? null : botaoPreencherArquivo({
        texto: 'Preencher de arquivo (PDF ou Excel)', accept: '.pdf,.xlsx,.xls,.csv',
        aoEscolher: preencherDeArquivo,
      }),
      areaArquivo,
      formulario.elemento, infoDifal,
    ] : criarAlerta({ tipo: 'warning', mensagem: 'Cadastre ao menos um terceiro antes do pedido.' }),
    acoes: terceiros.length ? acoesCadastro(formulario, editando ? 'Salvar pedido' : 'Cadastrar e lançar produtos', editando ? async () => { modal.fechar(); excluirPedido(ped); } : null) : [{ texto: 'Fechar', variante: 'primary' }],
  });
  modal.abrir();
  if (arquivoInicial && terceiros.length) preencherDeArquivo(arquivoInicial).catch((erro) => notificar({ tipo: 'danger', titulo: 'Não foi possível ler o arquivo', mensagem: erro.message }));
}

function abrirModalProduto(prod, ped) {
  const editando = Boolean(prod);
  const modo = ped.modoReidi === 'sem' ? 'sem' : temPercPedido(ped) ? 'percentual' : 'dois';
  const perc = vn(ped.percentualReidi);
  const previa = h('div', {});
  const regraMaiorQueSem = (v, todos) => (v != null && todos.unitSem != null && vn(v) > vn(todos.unitSem) ? 'COM REIDI não pode ser maior que SEM REIDI.' : true);
  const camposValor = modo === 'sem'
    ? [{ nome: 'valorUnit', rotulo: 'Valor unitário', tipo: 'moeda', obrigatorio: true, regras: { minimo: 0 }, dica: 'Pedido sem REIDI: um valor só.' }]
    : modo === 'percentual'
      ? [
        {
          nome: 'unitSem', rotulo: 'Valor unitário SEM REIDI', tipo: 'moeda', regras: {
            minimo: 0, validar: (v, todos) => (v == null && todos.unitCom == null ? 'Informe um dos dois valores.' : true),
          },
          dica: `Informe um dos dois: o outro é calculado pelo % do pedido (${percExato(perc)}).`,
        },
        { nome: 'unitCom', rotulo: 'Valor unitário COM REIDI', tipo: 'moeda', regras: { minimo: 0, validar: regraMaiorQueSem } },
      ]
      : [
        { nome: 'unitSem', rotulo: 'Valor unitário SEM REIDI', tipo: 'moeda', obrigatorio: true, regras: { minimo: 0 } },
        { nome: 'unitCom', rotulo: 'Valor unitário COM REIDI', tipo: 'moeda', obrigatorio: true, regras: { minimo: 0, validar: regraMaiorQueSem } },
      ];
  const formulario = criarFormulario({
    colunas: 3, semBotoes: true,
    valores: editando
      ? { ...prod, unitCom: unitComEfetivo(prod), valorUnit: vn(prod.unitSem ?? prod.unitCom) }
      : {},
    campos: [
      { nome: 'descricao', rotulo: 'Produto (nome)', obrigatorio: true, larguraTotal: true, dica: 'Nome do produto (coluna Produto do pedido), ex.: VERG CA50 12,5mm RT 12m 1t NV.' },
      { nome: 'detalhe', rotulo: 'Descrição detalhada', tipo: 'textarea', larguraTotal: true },
      { nome: 'descricaoNF', rotulo: 'Como vem na NF (se diferente do nome)', larguraTotal: true, dica: 'Como o produto vem escrito na nota do fornecedor; usado para reconhecer o item ao importar a NF.' },
      { nome: 'unidade', rotulo: 'Unidade', placeholder: 'un, t, m³, m...' },
      { nome: 'quantidade', rotulo: 'Quantidade contratada', tipo: 'numero', obrigatorio: true, regras: { minimo: 0 }, dica: 'As NFs abatem desta quantidade.' },
      ...camposValor,
    ],
    onEnviar: (v) => {
      if (editando) {
        /* sem arredondar: o que nao foi alterado mantem o valor exato (ex.: vindo de importacao) */
        v.quantidade = valorExato(prod.quantidade, v.quantidade, fmtNumeroCampo);
        v.unitSem = valorExato(prod.unitSem, v.unitSem, fmtMoedaCampo);
        v.unitCom = valorExato(unitComEfetivo(prod), v.unitCom, fmtMoedaCampo);
        v.valorUnit = valorExato(prod.unitSem, v.valorUnit, fmtMoedaCampo);
      }
      const vals = modo === 'sem'
        ? completarValoresReidi('sem', null, v.valorUnit, null)
        : completarValoresReidi(ped.modoReidi, modo === 'percentual' ? perc : null, v.unitSem, v.unitCom);
      const registro = {
        descricao: v.descricao, detalhe: v.detalhe || '', descricaoNF: v.descricaoNF || '', unidade: v.unidade, quantidade: vn(v.quantidade),
        unitSem: vals.unitSem, unitCom: vals.unitCom, ajusteManual: vals.ajusteManual,
      };
      if (editando) Object.assign(prod, registro);
      else produtos.push({ id: novoIdFD('pro'), pedidoId: ped.id, ...registro });
      modal.fechar();
      registrarAlteracao();
      toast.sucesso(editando ? 'Produto atualizado' : 'Produto incluído', v.descricao);
    },
  });
  /* modo % do pedido: ao digitar um valor, o outro e calculado (sem arredondar o calculo) */
  let ultimoDigitado = null;
  const atualizarPrevia = () => {
    const v = formulario.obterValores();
    let sem = 0; let com = 0;
    if (modo === 'sem') { sem = vn(v.valorUnit); com = sem; } else {
      if (modo === 'percentual' && ultimoDigitado === 'unitSem' && v.unitSem != null) formulario.campo('unitCom').value = formatarMoeda(vn(v.unitSem) * (1 - perc / 100), { simbolo: false });
      if (modo === 'percentual' && ultimoDigitado === 'unitCom' && v.unitCom != null && perc < 100) formulario.campo('unitSem').value = formatarMoeda(vn(v.unitCom) / (1 - perc / 100), { simbolo: false });
      const atual = formulario.obterValores();
      const vals = completarValoresReidi(ped.modoReidi, modo === 'percentual' ? perc : null, ultimoDigitado === 'unitCom' ? null : atual.unitSem, ultimoDigitado === 'unitSem' ? null : atual.unitCom);
      sem = vals.unitSem; com = vals.unitCom;
    }
    const dif = sem - com;
    previa.replaceChildren(criarAlerta({
      tipo: 'info', titulo: modo === 'sem' ? 'Pedido sem REIDI' : 'Diferença e % de REIDI',
      mensagem: modo === 'sem'
        ? `Total: ${formatarMoeda(vn(v.quantidade) * sem)}`
        : `Diferença unitária: ${formatarMoeda(dif)} · % REIDI: ${percExato(sem > 0 ? (dif / sem) * 100 : 0)} · Total COM REIDI: ${formatarMoeda(vn(v.quantidade) * com)}`,
    }));
  };
  formulario.elemento.addEventListener('input', (e) => {
    if (['unitSem', 'unitCom'].includes(e.target.name)) ultimoDigitado = e.target.name;
    atualizarPrevia();
  });
  formulario.elemento.addEventListener('change', atualizarPrevia);
  atualizarPrevia();
  const modal = criarModal({
    titulo: editando ? `Produto — ${prod.descricao}` : `Novo produto — pedido ${ped.numero}`, tamanho: 'lg', destruirAoFechar: true,
    conteudo: [
      criarAlerta({
        tipo: 'info', titulo: `REIDI do pedido: ${rotuloReidiPedido(ped)}`,
        mensagem: modo === 'sem' ? 'Informe só o valor unitário.'
          : modo === 'percentual' ? `Informe o valor SEM ou o COM REIDI; o outro é calculado por ${percExato(perc)}.`
            : 'Informe os dois valores; o % de REIDI é calculado pela diferença.',
      }),
      formulario.elemento, previa,
    ],
    acoes: acoesCadastro(formulario, editando ? 'Salvar produto' : 'Incluir produto', editando ? async () => { if (await excluirProduto(prod)) modal.fechar(); } : null),
  });
  modal.abrir();
}
